name: TV Briefing Cron

# Hourly cron — one of THREE trigger sources for the TV briefing agent:
#   1. This cron (GitHub Actions schedule) — backup, can be unreliable
#   2. TV app polling GET /api/tv/briefing — auto-triggers when briefing is stale (most reliable)
#   3. Manual POST /api/tv/briefing/trigger — on-demand
#
# Calls /api/tv/briefing/cron which checks staleness + rate limits before dispatching.
# Cost: ~1 curl call per hour = ~24/day. Exits immediately if briefing is fresh.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger TV briefing agent
    runs-on: ubuntu-latest
    steps:
      - name: Call thinx.fun cron endpoint
        env:
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
        run: |
          TOKEN="${DEBUG_TOKEN:-thinx-debug-2026}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://www.thinx.fun/api/tv/briefing/cron?token=${TOKEN}" \
            -H "Content-Type: application/json" \
            --max-time 30)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          TRIGGERED=$(echo "$BODY" | jq -r '.triggered // false' 2>/dev/null)
          REASON=$(echo "$BODY" | jq -r '.reason // "unknown"' 2>/dev/null)

          if [ "$TRIGGERED" = "true" ]; then
            echo "### TV Briefing Agent Dispatched" >> $GITHUB_STEP_SUMMARY
            echo "Reason: ${REASON}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### TV Briefing — No action" >> $GITHUB_STEP_SUMMARY
            echo "Reason: ${REASON}" >> $GITHUB_STEP_SUMMARY
          fi
