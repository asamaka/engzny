name: TV Briefing Cron

# DISABLED — TV briefing agent turned off by user request.
#
# Previously: Hourly backup cron for the TV briefing agent.
# Primary: improvement-healthcheck.yml (every 15 min, more frequent).
# This is a secondary backup — calls POST /api/tv/briefing/cron which
# checks staleness + rate limits before dispatching. Only fires if
# the briefing is >70 min stale AND 30 min since last trigger.

on:
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger TV briefing agent
    runs-on: ubuntu-latest
    steps:
      - name: Call thinx.fun cron endpoint
        env:
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
        run: |
          TOKEN="${DEBUG_TOKEN:-thinx-debug-2026}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://www.thinx.fun/api/tv/briefing/cron?token=${TOKEN}" \
            -H "Content-Type: application/json" \
            --max-time 30)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          TRIGGERED=$(echo "$BODY" | jq -r '.triggered // false' 2>/dev/null)
          REASON=$(echo "$BODY" | jq -r '.reason // "unknown"' 2>/dev/null)

          if [ "$TRIGGERED" = "true" ]; then
            echo "### TV Briefing Agent Dispatched" >> $GITHUB_STEP_SUMMARY
            echo "Reason: ${REASON}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### TV Briefing — No action" >> $GITHUB_STEP_SUMMARY
            echo "Reason: ${REASON}" >> $GITHUB_STEP_SUMMARY
          fi
