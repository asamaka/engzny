name: 🚀 Deploy to Vercel

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: ✅ Tests passed
        run: echo "All tests passed!"

  verify-production:
    name: Verify Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: ⏳ Wait for Vercel deployment
        run: |
          echo "⏳ Waiting 60 seconds for Vercel Git integration to deploy..."
          sleep 60

      - name: ✅ Verify Production
        run: |
          echo "🔍 Verifying production at https://thinx.fun/..."

          # Test health endpoint
          HEALTH=$(curl -s -w "\n%{http_code}" "https://thinx.fun/api/health")
          HTTP_CODE=$(echo "$HEALTH" | tail -n 1)
          BODY=$(echo "$HEALTH" | head -n 1)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check passed! Response: $BODY"
          else
            echo "⚠️ Health check returned code: $HTTP_CODE (Vercel may still be deploying)"
          fi

          # Test hub page
          PAGE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://thinx.fun/")

          if [ "$PAGE_CODE" = "200" ]; then
            echo "✅ Hub page loaded!"
          else
            echo "⚠️ Hub page returned code: $PAGE_CODE"
          fi

          echo "✅ Verification complete!"
