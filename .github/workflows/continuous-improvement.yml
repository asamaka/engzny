name: Continuous Improvement Agent

# Triggered via workflow_dispatch from the Vercel runtime (on every pipeline report)
# or by the scheduled healthcheck (for rate-limited reports).
#
# Uses Actions:write permission (NOT Contents:write) so the dispatch token
# can only trigger workflows — it cannot push code or modify the repo.
# The Cursor API key (FIX_IT secret) stays here in GitHub Secrets — never in Vercel.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason (pipeline_error, slow_pipeline, periodic_review, report_review, healthcheck, manual)'
        required: true
        type: string
      detail:
        description: 'Detail about the trigger'
        required: true
        type: string
      report:
        description: 'JSON-encoded pipeline report summary (single or array for healthcheck)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  spawn-agent:
    name: Spawn Cursor Cloud Agent
    runs-on: ubuntu-latest

    steps:
      - name: Parse trigger payload
        id: payload
        run: |
          echo "Trigger reason: ${{ inputs.reason }}"
          echo "Detail: ${{ inputs.detail }}"
          if [ -n '${{ inputs.report }}' ]; then
            echo "Report: $(echo '${{ inputs.report }}' | jq -r 'if type == "array" then length | tostring + " reports" else .requestId // "none" end' 2>/dev/null || echo 'none')"
          fi

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.FIX_IT }}" ]; then
            echo "::error::FIX_IT secret (Cursor API key) not configured"
            exit 1
          fi

      - name: Build agent prompt
        env:
          REASON: ${{ inputs.reason }}
          DETAIL: ${{ inputs.detail }}
          REPORT: ${{ inputs.report }}
        run: |
          cat > /tmp/agent-prompt.txt << 'PROMPT_END'
          You are a Continuous Improvement Agent for thinx.fun — a mobile-first screenshot intelligence app.

          ## Prime Directive

          **You MUST ship at least one code change this session.** Analysis without implementation is a failure. You are not a research agent — you are an improvement agent that makes the product better for users every time you run.

          ## FIRST — Review Previous Work & Backlog

          Before doing ANYTHING else, read these two things:

          1. **Backlog file:** `.cursor/improvement-backlog.md`
             - This is your persistent memory across runs
             - Check for incomplete work items from previous agents
             - If there's a high-priority incomplete item, continue that work FIRST
             - You MUST update this file before you finish (add/complete items, update "Last Run")

          2. **Recent agent changes:** Run `git log --oneline -20` to see recent commits
             - Look for `cursor/improvement-*` branch merges
             - Understand what the last agent(s) changed so you don't duplicate or conflict
             - If a recent change looks incomplete or broken, fixing it is your top priority
             - **Classify the last 5-10 agent commits by area** (pipeline, ui, upload, error-handling, etc.)
             - **If 3+ of the last 5 commits are in the SAME area, you MUST fix something in a DIFFERENT area** — diminishing returns means each successive fix in the same area helps users less

          ## Your Instructions — Evaluate ALL Areas, Then Pick ONE Fix

          **The trigger reason below is CONTEXT, not a directive.** You must evaluate ALL areas before choosing what to fix. Do NOT just fix what the trigger says — it's one data point among many.

          Follow this exact sequence. Spend at most 20% of your time on steps 1-4. The rest goes to implementation.

          1. **Read backlog** — `.cursor/improvement-backlog.md` — check for incomplete work from previous runs.
          2. **Review recent changes** — `git log --oneline -20` — classify recent commits by area. If recent agents over-indexed on one area (e.g., 3+ pipeline fixes in a row), actively look for improvements in OTHER areas.
          3. **Quick context** — Read `CLAUDE.md` for architecture. Read `.claude/agents/continuous-improvement.md` for your full operating spec.
          4. **Check production** — `curl 'https://www.thinx.fun/api/debug/dashboard?token=thinx-debug-2026'`
          5. **Evaluate ALL of these areas** (not just the trigger). Write down one candidate fix per area, then pick the highest customer-value one:
             - **Errors** — Check dashboard for pipeline errors, client errors (HTTP 413, SSE stalls), failed pipelines
             - **Card coverage** — Are all cards being populated? Dashboard shows X/Y cards per pipeline — any misses are P1
             - **UI quality** — Review `public/hub-v2.html` card rendering CSS and JS. Check margins, padding, gap, responsive breakpoints, card content rendering, mobile layout. Look at render capture thumbnails in reports.
             - **Output quality** — Is the LLM producing good card content? Are verification cards properly resolved? Are images/URLs being populated?
             - **Performance** — Only if there isn't a higher-priority fix in another area. Check if recent agents already addressed this.
             - **Backlog items** — Continue incomplete work from previous runs
          6. **Pick the highest-value fix using this priority:**
             - P0 (broken): errors, crashes, failed pipelines, completely broken UI → fix first
             - P1 (degraded): partial card coverage, bad results, UI rendering glitches → fix second
             - P2 (polish): UX friction, visual refinements, missing features → fix third
             - P3 (resilience): logging, edge cases, retry logic, marginal performance → fix last
             - **Tiebreaker:** prefer fixing an area that recent agents HAVEN'T touched
          7. **Implement the fix** — Go directly to the relevant code, make the change. Keep it minimal. Key files:
             - `api/agents/orchestrator-v2.js` — Pipeline coordinator
             - `api/agents/layout-designer.js` — Vision LLM (layout)
             - `api/agents/card-researcher.js` — Card population LLM
             - `public/hub-v2.html` — Frontend (card rendering, SSE)
             - `api/index.js` — Express server, endpoints
          8. **Test** — `npm test` (must pass)
          9. **Update backlog** — Edit `.cursor/improvement-backlog.md`:
             - Update "Last Run" with date, trigger reason, and what you changed
             - Mark completed items with [x]
             - Add any new observations or work items you discovered
             - Remove stale items that are no longer relevant
          10. **Commit and push** — Use format: `fix(<area>): <what>` with customer impact in the body. Make sure the backlog update is included in the commit.

          ## Hard Rules

          - You MUST commit and push code. An invocation without a code change is a wasted invocation.
          - You MUST read and update `.cursor/improvement-backlog.md` every run.
          - The trigger reason is CONTEXT — you must evaluate all areas before deciding what to fix.
          - If the last 3+ agent commits were all in the same area (e.g., pipeline performance), you MUST choose a different area unless there's a P0 issue.
          - Never change test expectations to make tests pass — fix the actual code.
          - Never modify environment variables, secrets, or deployment workflows.
          - Never remove existing features or endpoints.
          - Always preserve backward compatibility.
          - Do NOT spend your time writing up findings. Spend it writing code.
          PROMPT_END

          if [ "$REASON" = "manual" ]; then
            cat >> /tmp/agent-prompt.txt << 'PROMPT_END'

          ## Trigger Context

          You have been manually triggered. The focus area below is a suggestion — still evaluate all areas before deciding.

          **Focus suggestion:**

          PROMPT_END
            echo "$DETAIL" >> /tmp/agent-prompt.txt
          elif [ "$REASON" = "healthcheck" ]; then
            cat >> /tmp/agent-prompt.txt << PROMPT_END

          ## Trigger Context

          You were triggered by a **scheduled healthcheck**. One or more pipeline reports were skipped due to rate limiting. This is context for your evaluation — not a directive to only fix what the reports show.

          **Detail:** ${DETAIL}

          **Skipped reports (context only):**

          \`\`\`json
          ${REPORT}
          \`\`\`

          Scan the reports for patterns, but also check the dashboard, UI, and backlog for potentially higher-value fixes.
          PROMPT_END
          else
            cat >> /tmp/agent-prompt.txt << PROMPT_END

          ## Trigger Context

          **This is context, not a directive.** Evaluate all areas before deciding what to fix.

          **Trigger reason:** ${REASON}
          **Detail:** ${DETAIL}

          **Pipeline report (context only):**

          \`\`\`json
          ${REPORT}
          \`\`\`
          PROMPT_END
          fi

      - name: Launch Cursor Cloud Agent
        id: launch
        run: |
          PROMPT=$(cat /tmp/agent-prompt.txt)
          PROMPT_JSON=$(echo "$PROMPT" | jq -Rs .)

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.cursor.com/v0/agents" \
            -H "Authorization: Bearer ${{ secrets.FIX_IT }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"prompt\": { \"text\": $PROMPT_JSON },
              \"source\": {
                \"repository\": \"https://github.com/${{ github.repository }}\"
              },
              \"target\": {
                \"autoCreatePr\": false,
                \"autoBranch\": true
              }
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            AGENT_ID=$(echo "$BODY" | jq -r '.id // "unknown"')
            AGENT_URL=$(echo "$BODY" | jq -r '.target.url // "unknown"')
            AGENT_STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
            echo "Agent launched: $AGENT_ID ($AGENT_STATUS)"
            echo "URL: $AGENT_URL"
            echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
            echo "agent_url=$AGENT_URL" >> $GITHUB_OUTPUT
          else
            echo "::error::Cursor API returned $HTTP_CODE: $BODY"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Continuous Improvement Agent Launched" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Reason** | ${{ inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Detail** | ${{ inputs.detail }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent ID** | \`${{ steps.launch.outputs.agent_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent URL** | ${{ steps.launch.outputs.agent_url }} |" >> $GITHUB_STEP_SUMMARY
