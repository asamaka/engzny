name: Continuous Improvement Agent

# Triggered via workflow_dispatch from the Vercel runtime (on every pipeline report)
# or by the scheduled healthcheck (for rate-limited reports).
#
# Uses Actions:write permission (NOT Contents:write) so the dispatch token
# can only trigger workflows — it cannot push code or modify the repo.
# The Cursor API key (FIX_IT secret) stays here in GitHub Secrets — never in Vercel.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason (pipeline_error, slow_pipeline, periodic_review, report_review, healthcheck, manual)'
        required: true
        type: string
      detail:
        description: 'Detail about the trigger'
        required: true
        type: string
      report:
        description: 'JSON-encoded pipeline report summary (single or array for healthcheck)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  spawn-agent:
    name: Spawn Cursor Cloud Agent
    runs-on: ubuntu-latest

    steps:
      - name: Parse trigger payload
        id: payload
        run: |
          echo "Trigger reason: ${{ inputs.reason }}"
          echo "Detail: ${{ inputs.detail }}"
          if [ -n '${{ inputs.report }}' ]; then
            echo "Report: $(echo '${{ inputs.report }}' | jq -r 'if type == "array" then length | tostring + " reports" else .requestId // "none" end' 2>/dev/null || echo 'none')"
          fi

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.FIX_IT }}" ]; then
            echo "::error::FIX_IT secret (Cursor API key) not configured"
            exit 1
          fi

      - name: Build agent prompt
        env:
          REASON: ${{ inputs.reason }}
          DETAIL: ${{ inputs.detail }}
          REPORT: ${{ inputs.report }}
        run: |
          cat > /tmp/agent-prompt.txt << 'PROMPT_END'
          You are the Continuous Improvement Agent for thinx.fun — a mobile-first screenshot intelligence app. Users paste screenshots, the system analyzes them with Claude AI, and renders structured card-based results.

          ## Your Mindset: Product Judge, Not Bug Hunter

          Step back and judge the product as a whole. Don't nitpick individual field names or marginal edge cases. Think like a user:

          **Given this screenshot, what would I expect to see? Does the product deliver that?**

          Your job is to compare **what the user expected** (based on the input screenshot and content type) against **what was actually rendered** (the client screenshot in the report). This is a postmortem-style analysis:

          - **Expected:** "A breaking news screenshot about X → I'd expect an accurate summary, key facts, verified sources, maybe a timeline"
          - **Actual:** "The hero card summarized Y instead, verification shows 'checking' despite research completing, timeline events are out of order"
          - **Gap:** The gap between expected and actual is what matters. Fix the biggest gap.

          ## How to Investigate (spend <5 minutes)

          1. Read `.cursor/improvement-backlog.md` — check for open items and experiment observations.
          2. Run `git log --oneline -15` — know what was recently changed. Don't duplicate or conflict.
          3. Authenticate with the reports API: `curl -X POST 'https://www.thinx.fun/api/r/auth' -H 'Content-Type: application/json' -d '{"pin":"0427"}' -c /tmp/cookies.txt`
          4. Search recent reports: `curl -b /tmp/cookies.txt 'https://www.thinx.fun/api/r/search?limit=5'`
          5. For each recent report, fetch its data: `curl -b /tmp/cookies.txt 'https://www.thinx.fun/api/r/{requestId}/data'`
             - Look at the **client screenshot** (render capture) — this is what the user actually saw
             - Look at the **client state** for viewport, card dimensions, overflow issues
             - Compare the input screenshot (thumb) with the output cards — does the output match what a user would expect?
          6. Check the dashboard: `curl 'https://www.thinx.fun/api/debug/dashboard?token=thinx-debug-2026'`

          ## How to Decide What to Fix

          ### Immediately fix (this session):
          - **P0:** Broken — errors, crashes, failed pipelines, cards not rendering at all
          - **Obvious P1:** Something clearly wrong that any user would notice — wrong content, broken layout, missing critical information

          ### Log as experiment observation (don't fix yet):
          - **Pattern-based issues** — If you see something that MIGHT be a problem, log it in the backlog as an experiment observation with the requestId. Don't fix it until you (or a future agent) have seen the same pattern in 10-20 reports. One instance is anecdotal. Twenty instances is a pattern worth fixing.
          - **Marginal improvements** — Name map expansions, code cleanup, speculative resilience. Log and skip.

          ### The experiment-based approach:
          Instead of fixing every small issue immediately, the backlog should track **experiment observations**:
          ```
          ## Experiment: [description]
          - Hypothesis: [what you think is happening]
          - Evidence: [requestId1, requestId2, ...] (need 10-20)
          - Status: gathering | confirmed (ready to fix) | rejected
          ```
          When an experiment has enough evidence (10-20 similar reports), a future agent can confidently implement the fix knowing it's a real pattern, not a one-off.

          ### Product-level thinking:
          Before deciding what to fix, ask yourself:
          - "If I showed this app to 100 users, what would they complain about most?"
          - "Does the output actually help the user understand their screenshot?"
          - "Is the overall experience good, or am I fixating on one card field?"

          The trigger reason below is context, not a directive. Always evaluate the product holistically.

          ## Implementation

          Key files:
          - `api/agents/orchestrator-v2.js` — pipeline coordinator
          - `api/agents/layout-designer.js` — vision LLM prompts (layout design)
          - `api/agents/card-researcher.js` — card population LLM prompts
          - `api/contracts/card-types.js` — card type schemas
          - `public/hub-v2.html` — frontend (card rendering, SSE, CSS)
          - `api/index.js` — Express server, all endpoints

          Read `CLAUDE.md` for full architecture. Read `.claude/agents/continuous-improvement.md` for your operating spec.

          Keep changes minimal. Prefer fixing root causes (e.g., LLM prompt quality) over adding more normalization layers for symptoms. Never break backward compatibility.

          ## Before You Finish

          1. `npm test` — must pass
          2. Update `.cursor/improvement-backlog.md`:
             - Update "Last Run" with what you did and why
             - Add any new experiment observations with requestId evidence
             - Remove stale items. Keep under 80 lines.
          3. Commit: `fix(<area>): <what changed>` with customer impact in body
          4. Push to your branch

          ## Hard Rules

          - Never modify deployment workflows, env vars, secrets, or auth
          - Never remove existing features or endpoints
          - Never change test expectations — fix the actual code
          - Don't spend >30% of your time reading
          - One-off issues go in the backlog as experiment observations, not as immediate fixes
          - Always compare expected (what user would want to see) vs actual (what was rendered)
          PROMPT_END

          if [ "$REASON" = "manual" ]; then
            cat >> /tmp/agent-prompt.txt << PROMPT_END

          ## Trigger Context

          Manually triggered. Focus suggestion (still evaluate holistically):

          **Focus:** ${DETAIL}
          PROMPT_END
          elif [ "$REASON" = "healthcheck" ]; then
            cat >> /tmp/agent-prompt.txt << PROMPT_END

          ## Trigger Context

          Scheduled healthcheck with ${DETAIL}

          **Queued reports (review for patterns, not individual fixes):**
          \`\`\`json
          ${REPORT}
          \`\`\`
          PROMPT_END
          else
            cat >> /tmp/agent-prompt.txt << PROMPT_END

          ## Trigger Context

          **Reason:** ${REASON}
          **Detail:** ${DETAIL}

          **Report (one data point — look at the broader product):**
          \`\`\`json
          ${REPORT}
          \`\`\`
          PROMPT_END
          fi

      - name: Launch Cursor Cloud Agent
        id: launch
        run: |
          PROMPT=$(cat /tmp/agent-prompt.txt)
          PROMPT_JSON=$(echo "$PROMPT" | jq -Rs .)

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.cursor.com/v0/agents" \
            -H "Authorization: Bearer ${{ secrets.FIX_IT }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"prompt\": { \"text\": $PROMPT_JSON },
              \"source\": {
                \"repository\": \"https://github.com/${{ github.repository }}\"
              },
              \"target\": {
                \"autoCreatePr\": false,
                \"autoBranch\": true
              }
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            AGENT_ID=$(echo "$BODY" | jq -r '.id // "unknown"')
            AGENT_URL=$(echo "$BODY" | jq -r '.target.url // "unknown"')
            AGENT_STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
            echo "Agent launched: $AGENT_ID ($AGENT_STATUS)"
            echo "URL: $AGENT_URL"
            echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
            echo "agent_url=$AGENT_URL" >> $GITHUB_OUTPUT
          else
            echo "::error::Cursor API returned $HTTP_CODE: $BODY"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Continuous Improvement Agent Launched" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Reason** | ${{ inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Detail** | ${{ inputs.detail }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent ID** | \`${{ steps.launch.outputs.agent_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent URL** | ${{ steps.launch.outputs.agent_url }} |" >> $GITHUB_STEP_SUMMARY
