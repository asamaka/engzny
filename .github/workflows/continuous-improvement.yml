name: Continuous Improvement Agent

# Triggered via workflow_dispatch from the Vercel runtime.
# Uses Actions:write permission (NOT Contents:write) so the dispatch token
# can only trigger workflows — it cannot push code or modify the repo.
# The Cursor API key (FIX_IT secret) stays here in GitHub Secrets — never in Vercel.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason (pipeline_error, slow_pipeline, periodic_review, manual)'
        required: true
        type: string
      detail:
        description: 'Detail about the trigger'
        required: true
        type: string
      report:
        description: 'JSON-encoded pipeline report summary (or empty for manual)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  spawn-agent:
    name: Spawn Cursor Cloud Agent
    runs-on: ubuntu-latest

    steps:
      - name: Parse trigger payload
        id: payload
        run: |
          echo "Trigger reason: ${{ inputs.reason }}"
          echo "Detail: ${{ inputs.detail }}"
          if [ -n '${{ inputs.report }}' ]; then
            echo "Report: $(echo '${{ inputs.report }}' | jq -r '.requestId // "none"' 2>/dev/null || echo 'none')"
          fi

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.FIX_IT }}" ]; then
            echo "::error::FIX_IT secret (Cursor API key) not configured"
            exit 1
          fi

      - name: Build agent prompt
        env:
          REASON: ${{ inputs.reason }}
          DETAIL: ${{ inputs.detail }}
          REPORT: ${{ inputs.report }}
        run: |
          if [ "$REASON" = "manual" ]; then
            cat > /tmp/agent-prompt.txt << 'PROMPT_END'
          You are a Continuous Improvement Agent for thinx.fun — a mobile-first screenshot intelligence app.

          ## Prime Directive

          **You MUST ship at least one code change this session.** Analysis without implementation is a failure. You are not a research agent — you are an improvement agent that makes the product better for users every time you run.

          ## Context

          You have been manually triggered. Your focus area is below.

          ## Focus Area

          PROMPT_END
            echo "$DETAIL" >> /tmp/agent-prompt.txt
            cat >> /tmp/agent-prompt.txt << 'PROMPT_END'

          ## Your Instructions — Plan, Implement, Ship

          Follow this exact sequence. Spend at most 20% of your time on steps 1-3. The rest goes to implementation.

          1. **Quick context** — Read `CLAUDE.md` for architecture. Read `.claude/agents/continuous-improvement.md` for your full operating spec.
          2. **Check production** — `curl 'https://www.thinx.fun/api/debug/dashboard?token=thinx-debug-2026'`
          3. **Pick the highest customer-value improvement:**
             - P0 (broken): errors, crashes, failed pipelines → fix first
             - P1 (degraded): slow pipelines, bad results → fix second
             - P2 (polish): UX friction, confusing output → fix third
             - P3 (resilience): logging, edge cases, retry logic → fix last
             If the focus area is vague (e.g., "health check", "test"), treat it as a periodic review and find the most impactful thing to fix.
          4. **Implement the fix** — Go directly to the relevant code, make the change. Keep it minimal.
          5. **Test** — `npm test` (must pass)
          6. **Commit and push** — Use format: `fix(<area>): <what>` with customer impact in the body.

          ## Hard Rules

          - You MUST commit and push code. An invocation without a code change is a wasted invocation.
          - Never change test expectations to make tests pass — fix the actual code.
          - Never modify environment variables, secrets, or deployment workflows.
          - Never remove existing features or endpoints.
          - Always preserve backward compatibility.
          - Do NOT spend your time writing up findings. Spend it writing code.
          PROMPT_END
          else
            cat > /tmp/agent-prompt.txt << PROMPT_END
          You are a Continuous Improvement Agent for thinx.fun — a mobile-first screenshot intelligence app.

          ## Prime Directive

          **You MUST ship at least one code change this session.** Analysis without implementation is a failure. You are not a research agent — you are an improvement agent that makes the product better for users every time you run.

          ## Trigger

          **Reason:** ${REASON}
          **Detail:** ${DETAIL}

          ## Pipeline Report

          \`\`\`json
          ${REPORT}
          \`\`\`

          ## Your Instructions — Plan, Implement, Ship

          Follow this exact sequence. Spend at most 20% of your time on steps 1-3. The rest goes to implementation.

          1. **Quick context** — Read \`CLAUDE.md\` for architecture. Read \`.claude/agents/continuous-improvement.md\` for your full operating spec including the customer-value prioritization framework.
          2. **Analyze the report** — Understand what went wrong or what's slow. For \`pipeline_error\`: trace the error. For \`slow_pipeline\`: identify the slow phase. For \`periodic_review\`: check the dashboard for patterns.
          3. **Pick the fix with highest customer ROI:**
             - P0 (broken): errors, crashes, failed pipelines → fix first
             - P1 (degraded): slow pipelines, bad results → fix second
             - P2 (polish): UX friction, confusing output → fix third
             - P3 (resilience): logging, edge cases, retry logic → fix last
          4. **Implement the fix** — Go directly to the relevant code. Key files:
             - \`api/agents/orchestrator-v2.js\` — Pipeline coordinator
             - \`api/agents/layout-designer.js\` — Vision LLM (layout)
             - \`api/agents/card-researcher.js\` — Card population LLM
             - \`public/hub-v2.html\` — Frontend (card rendering, SSE)
             - \`api/index.js\` — Express server, endpoints
          5. **Test** — \`npm test\` (must pass)
          6. **Commit and push** — Use format: \`fix(<area>): <what>\` with customer impact in the body.

          ## Hard Rules

          - You MUST commit and push code. An invocation without a code change is a wasted invocation.
          - Never change test expectations to make tests pass — fix the actual code.
          - Never modify environment variables, secrets, or deployment workflows.
          - Never remove existing features or endpoints.
          - Always preserve backward compatibility.
          - Do NOT spend your time writing up findings. Spend it writing code.
          PROMPT_END
          fi

      - name: Launch Cursor Cloud Agent
        id: launch
        run: |
          PROMPT=$(cat /tmp/agent-prompt.txt)
          PROMPT_JSON=$(echo "$PROMPT" | jq -Rs .)

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.cursor.com/v0/agents" \
            -H "Authorization: Bearer ${{ secrets.FIX_IT }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"prompt\": { \"text\": $PROMPT_JSON },
              \"source\": {
                \"repository\": \"https://github.com/${{ github.repository }}\"
              },
              \"target\": {
                \"autoCreatePr\": false,
                \"autoBranch\": true
              }
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            AGENT_ID=$(echo "$BODY" | jq -r '.id // "unknown"')
            AGENT_URL=$(echo "$BODY" | jq -r '.target.url // "unknown"')
            AGENT_STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
            echo "Agent launched: $AGENT_ID ($AGENT_STATUS)"
            echo "URL: $AGENT_URL"
            echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
            echo "agent_url=$AGENT_URL" >> $GITHUB_OUTPUT
          else
            echo "::error::Cursor API returned $HTTP_CODE: $BODY"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Continuous Improvement Agent Launched" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Reason** | ${{ inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Detail** | ${{ inputs.detail }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent ID** | \`${{ steps.launch.outputs.agent_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent URL** | ${{ steps.launch.outputs.agent_url }} |" >> $GITHUB_STEP_SUMMARY
