name: Continuous Improvement Agent

# Triggered via workflow_dispatch from the Vercel runtime (on every pipeline report)
# or by the scheduled healthcheck (for rate-limited reports).
#
# Uses Actions:write permission (NOT Contents:write) so the dispatch token
# can only trigger workflows — it cannot push code or modify the repo.
# The Cursor API key (FIX_IT secret) stays here in GitHub Secrets — never in Vercel.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason (pipeline_error, slow_pipeline, periodic_review, report_review, healthcheck, manual)'
        required: true
        type: string
      detail:
        description: 'Detail about the trigger'
        required: true
        type: string
      report:
        description: 'JSON-encoded pipeline report summary (single or array for healthcheck)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  spawn-agent:
    name: Spawn Cursor Cloud Agent
    runs-on: ubuntu-latest

    steps:
      - name: Parse trigger payload
        id: payload
        run: |
          echo "Trigger reason: ${{ inputs.reason }}"
          echo "Detail: ${{ inputs.detail }}"
          if [ -n '${{ inputs.report }}' ]; then
            echo "Report: $(echo '${{ inputs.report }}' | jq -r 'if type == "array" then length | tostring + " reports" else .requestId // "none" end' 2>/dev/null || echo 'none')"
          fi

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.FIX_IT }}" ]; then
            echo "::error::FIX_IT secret (Cursor API key) not configured"
            exit 1
          fi

      - name: Build agent prompt
        env:
          REASON: ${{ inputs.reason }}
          DETAIL: ${{ inputs.detail }}
          REPORT: ${{ inputs.report }}
        run: |
          cat > /tmp/agent-prompt.txt << 'PROMPT_END'
          You are the Continuous Improvement Agent for thinx.fun (mobile-first screenshot intelligence app). You are spawned automatically from pipeline reports and healthchecks.

          ## Your Goal

          Find and fix the single highest-impact issue for users. Quality over quantity — one well-chosen fix beats three marginal ones. If no issue meets the impact threshold below, update the backlog and exit without code changes. A no-op run is better than a low-value commit.

          ## Impact Threshold

          Only ship a change if it fixes a real problem that affects users:
          - **P0 (broken):** errors, crashes, failed pipelines, broken rendering — ALWAYS fix
          - **P1 (degraded):** partial card population, wrong data displayed, bad mobile UX — fix unless trivial
          - **P2 (meaningful polish):** confusing UX, missing information users would want, significant visual issues — fix if the improvement is clearly noticeable
          - **Skip** everything else (marginal name-map expansions, speculative resilience, code cleanup, tiny visual tweaks). Log it in the backlog for a human to prioritize.

          ## Investigation (spend <5 minutes here)

          1. Read `.cursor/improvement-backlog.md` — check for open items from previous agents.
          2. Run `git log --oneline -15` — know what was recently changed. Don't duplicate work.
          3. Check production: `curl 'https://www.thinx.fun/api/debug/dashboard?token=thinx-debug-2026'`
          4. Check recent reports: `curl 'https://www.thinx.fun/api/r/search?limit=5&token=thinx-debug-2026'` (use cookie auth — POST to `/api/r/auth` with `{"pin":"0427"}` first).
          5. Skim the trigger context below — it's one signal, not a directive.

          ## Decision: What to Fix

          After investigation, pick ONE fix using this priority:
          1. **Open backlog P0/P1** — continue unfinished work from a previous agent
          2. **New P0** — anything broken in production right now
          3. **New P1** — degraded experience visible in recent reports or dashboard
          4. **New P2** — only if it's a clearly noticeable improvement for users
          5. **Nothing meets threshold** — update backlog with observations, commit backlog-only change, done

          The trigger reason is context, not a directive. A `slow_pipeline` trigger doesn't mean fix performance — check everything and pick the highest-impact issue.

          Avoid fixing the same narrow area as the last 3 agents unless it's P0. Check git log for patterns.

          ## Implementation

          Go directly to the code and make the change. Key files:
          - `api/agents/orchestrator-v2.js` — pipeline coordinator
          - `api/agents/layout-designer.js` — vision LLM (layout design)
          - `api/agents/card-researcher.js` — card population LLM
          - `api/contracts/card-types.js` — card type schemas
          - `public/hub-v2.html` — frontend (card rendering, SSE, CSS)
          - `api/index.js` — Express server, all endpoints

          Read `CLAUDE.md` for full architecture if needed. Read `.claude/agents/continuous-improvement.md` for your full operating spec.

          Keep changes minimal. Prefer additive changes over rewrites. Never break backward compatibility.

          ## Before You Finish

          1. Run `npm test` — must pass (fix your code if it doesn't, never change test expectations)
          2. Update `.cursor/improvement-backlog.md`:
             - Update "Last Run" section with date, what you did, and why
             - Mark completed items done, add new discoveries
             - Remove stale items. Keep the file under 80 lines total — trim completed items and old observations aggressively
          3. Commit with format: `fix(<area>): <what changed>` — include customer impact in the body
          4. Push to your branch

          ## Hard Rules

          - Never modify deployment workflows, env vars, secrets, or auth mechanisms
          - Never remove existing features or endpoints
          - Never change test expectations to make tests pass
          - Don't add explanatory comments to code — let the code speak
          - Don't spend >30% of your time reading. The rest is implementation.
          - If you discover issues but can't fix them in this session, add them to the backlog with clear reproduction info
          PROMPT_END

          if [ "$REASON" = "manual" ]; then
            cat >> /tmp/agent-prompt.txt << PROMPT_END

          ## Trigger Context

          Manually triggered. The focus area below is a suggestion — still evaluate all areas.

          **Focus:** ${DETAIL}
          PROMPT_END
          elif [ "$REASON" = "healthcheck" ]; then
            cat >> /tmp/agent-prompt.txt << PROMPT_END

          ## Trigger Context

          Scheduled healthcheck with ${DETAIL}

          **Queued reports (context only):**
          \`\`\`json
          ${REPORT}
          \`\`\`
          PROMPT_END
          else
            cat >> /tmp/agent-prompt.txt << PROMPT_END

          ## Trigger Context

          **Reason:** ${REASON}
          **Detail:** ${DETAIL}

          **Report:**
          \`\`\`json
          ${REPORT}
          \`\`\`
          PROMPT_END
          fi

      - name: Launch Cursor Cloud Agent
        id: launch
        run: |
          PROMPT=$(cat /tmp/agent-prompt.txt)
          PROMPT_JSON=$(echo "$PROMPT" | jq -Rs .)

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.cursor.com/v0/agents" \
            -H "Authorization: Bearer ${{ secrets.FIX_IT }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"prompt\": { \"text\": $PROMPT_JSON },
              \"source\": {
                \"repository\": \"https://github.com/${{ github.repository }}\"
              },
              \"target\": {
                \"autoCreatePr\": false,
                \"autoBranch\": true
              }
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            AGENT_ID=$(echo "$BODY" | jq -r '.id // "unknown"')
            AGENT_URL=$(echo "$BODY" | jq -r '.target.url // "unknown"')
            AGENT_STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
            echo "Agent launched: $AGENT_ID ($AGENT_STATUS)"
            echo "URL: $AGENT_URL"
            echo "agent_id=$AGENT_ID" >> $GITHUB_OUTPUT
            echo "agent_url=$AGENT_URL" >> $GITHUB_OUTPUT
          else
            echo "::error::Cursor API returned $HTTP_CODE: $BODY"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Continuous Improvement Agent Launched" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Reason** | ${{ inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Detail** | ${{ inputs.detail }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent ID** | \`${{ steps.launch.outputs.agent_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent URL** | ${{ steps.launch.outputs.agent_url }} |" >> $GITHUB_STEP_SUMMARY
