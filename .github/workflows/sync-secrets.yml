name: 🔐 Sync Secrets to Vercel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sync-secrets.yml'

jobs:
  sync-anthropic-key:
    name: Sync ANTHROPIC_API_KEY to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Add ANTHROPIC_API_KEY to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          echo "🔧 Adding ANTHROPIC_API_KEY to Vercel..."

          # Add to Production environment
          curl -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "ANTHROPIC_API_KEY",
              "value": "'"$ANTHROPIC_API_KEY"'",
              "type": "encrypted",
              "target": ["production", "preview", "development"]
            }' || echo "⚠️ Environment variable may already exist"

          echo "✅ ANTHROPIC_API_KEY synced to Vercel!"

      - name: 🔄 Trigger Redeployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "🚀 Triggering Vercel redeployment..."
          curl -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "engzny",
              "project": "'"$VERCEL_PROJECT_ID"'",
              "target": "production",
              "gitSource": {
                "type": "github",
                "ref": "main",
                "repoId": "asamaka/engzny"
              }
            }'
          echo "✅ Redeployment triggered!"
