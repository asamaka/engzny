name: Intel Accuracy Eval

# Grades the live "Iran Watch" intel bundle against an independently web-searched
# picture of reality (coverage/misses, freshness, staleness, market alignment),
# asks Opus to reflect on the gaps, and stores the report with history
# (tv:war:eval:*). Scheduled a few times a day so accuracy can be tracked as the
# curation/sourcing is tuned; also runnable on demand (workflow_dispatch) and via
# POST /api/tv/intel/eval.

on:
  schedule:
    - cron: '20 */3 * * *'   # every 3 hours, offset from the hourly intel build
  workflow_dispatch:
    inputs:
      reflect:
        description: 'Run the Opus reflection pass (true/false)'
        required: false
        default: 'true'

concurrency:
  group: intel-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    name: Evaluate intel accuracy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run accuracy evaluation
        env:
          # Repo uses CLAUDE_API_KEY for the Anthropic key (see intel-cron.yml)
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          INTEL_SONNET: ${{ vars.INTEL_SONNET }}
          INTEL_OPUS: ${{ vars.INTEL_OPUS }}
          INTEL_HAIKU: ${{ vars.INTEL_HAIKU }}
        run: node scripts/eval-intel.js ${{ github.event.inputs.reflect == 'false' && '--no-reflect' || '' }}

      - name: Summary
        if: always()
        run: echo "Intel accuracy eval finished at $(date -u)" >> "$GITHUB_STEP_SUMMARY"
