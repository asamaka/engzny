name: 🚀 Auto-Deploy to Production

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/auto-deploy-production.yml'
      - 'api/**'
      - 'public/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (leave empty for current branch)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  merge-and-deploy:
    name: Merge & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Determine source branch
        id: branch
        run: |
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            BRANCH="${{ github.event.inputs.branch }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Using branch: $BRANCH"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: 🔀 Merge feature branch to main
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          echo "🔀 Merging $BRANCH to main..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch the feature branch
          git fetch origin $BRANCH

          # Merge it
          git merge origin/$BRANCH -m "Auto-merge: Deploy $BRANCH to production

          Automated merge from $BRANCH

          Triggered by: ${{ github.actor }}
          Workflow: ${{ github.workflow }}"

          # Push to main (triggers Vercel's native Git integration deploy)
          git push origin main

          echo "✅ Merged and pushed to main!"

      - name: ⏳ Wait for Vercel deployment
        run: |
          echo "⏳ Waiting 60 seconds for Vercel to deploy from main..."
          sleep 60

      - name: ✅ Verify Deployment
        run: |
          echo "🔍 Verifying production deployment..."

          # Test health endpoint
          HEALTH=$(curl -s -w "\n%{http_code}" "https://thinx.fun/api/health")
          HTTP_CODE=$(echo "$HEALTH" | tail -n 1)
          BODY=$(echo "$HEALTH" | head -n 1)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check passed! Response: $BODY"
          else
            echo "❌ Health check failed with code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

          # Test that the hub page loads
          PAGE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://thinx.fun/")

          if [ "$PAGE_CODE" = "200" ]; then
            echo "✅ Hub page loaded!"
          else
            echo "❌ Hub page failed with code: $PAGE_CODE"
            exit 1
          fi

          echo "✅ All verification checks passed!"

      - name: 🎉 Deployment Success
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ Merged: ${{ steps.branch.outputs.branch }} → main"
          echo "✅ Deployed via Vercel Git integration"
          echo ""
          echo "🌐 Production: https://thinx.fun/"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
