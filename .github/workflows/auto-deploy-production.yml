name: 🚀 Auto-Deploy to Production

on:
  push:
    branches:
      - 'claude/**'
      - 'cursor/**'
    paths:
      - '.github/workflows/auto-deploy-production.yml'
      - 'api/**'
      - 'public/**'
      - '.claude/**'
      - 'vercel.json'
      - 'package.json'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (leave empty for current branch)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  merge-and-deploy:
    name: Merge & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Determine source branch
        id: branch
        run: |
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            BRANCH="${{ github.event.inputs.branch }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Using branch: $BRANCH"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: 🔀 Merge feature branch to main
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          echo "🔀 Merging $BRANCH to main..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch the feature branch
          git fetch origin $BRANCH

          # Merge it
          git merge origin/$BRANCH -m "Auto-merge: Deploy $BRANCH to production

          Automated merge from $BRANCH

          Triggered by: ${{ github.actor }}
          Workflow: ${{ github.workflow }}"

          # Push to main (triggers Vercel's native Git integration deploy)
          git push origin main

          echo "✅ Merged and pushed to main!"

      - name: ✅ Verify Deployment
        run: |
          echo "🔍 Verifying production deployment with retries..."

          # Retry health check up to 4 times with increasing wait
          for attempt in 1 2 3 4; do
            WAIT=$((attempt * 30))
            echo "⏳ Attempt $attempt: waiting ${WAIT}s for Vercel deploy..."
            sleep $WAIT

            HEALTH=$(curl -s -w "\n%{http_code}" --max-time 10 -L "https://www.thinx.fun/api/health")
            HTTP_CODE=$(echo "$HEALTH" | tail -n 1)
            BODY=$(echo "$HEALTH" | head -n 1)

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed on attempt $attempt! Response: $BODY"

              # Also verify hub page
              PAGE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -L "https://www.thinx.fun/")
              if [ "$PAGE_CODE" = "200" ]; then
                echo "✅ Hub page loaded!"
              else
                echo "⚠️ Hub page returned code: $PAGE_CODE"
              fi

              echo "✅ Deployment verified!"
              exit 0
            fi

            echo "⚠️ Attempt $attempt: health check returned $HTTP_CODE"
          done

          echo "⚠️ Verification timed out after 4 attempts (deploy may still be in progress)"
          echo "Merge to main succeeded - Vercel will deploy eventually"
          # Don't fail the workflow - the merge already happened
          exit 0

      - name: 🎉 Deployment Success
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ Merged: ${{ steps.branch.outputs.branch }} → main"
          echo "✅ Deployed via Vercel Git integration"
          echo ""
          echo "🌐 Production: https://thinx.fun/"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
