<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>thinx</title>
  <link href="/styles/output.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-100 p-4 grid place-items-center">
  <div class="card bg-base-200 border border-base-300 shadow-xl w-full max-w-sm">
    <div class="card-body p-3">
      <div id="error" class="alert alert-error hidden">
        <span>No image in URL</span>
      </div>
      <code id="example" class="hidden text-[11px] break-all p-2 rounded bg-base-300 text-base-content/60"></code>
      <div class="relative rounded-box overflow-hidden bg-base-300 aspect-[9/16]">
        <img id="image" class="hidden w-full h-full object-cover" alt="Screenshot">
        <div id="overlay" class="hidden absolute inset-0 bg-base-100/40 backdrop-blur-[1px] flex flex-col items-center justify-center gap-3">
          <span class="loading loading-ring loading-lg text-primary"></span>
          <div class="badge badge-primary badge-outline">ANALYZING</div>
          <progress class="progress progress-primary w-40" max="100"></progress>
        </div>
      </div>
    </div>
  </div>

  <script>
    const image = document.getElementById('image');
    const overlay = document.getElementById('overlay');
    const error = document.getElementById('error');
    const example = document.getElementById('example');

    function showError(msg) {
      error.classList.remove('hidden');
      error.querySelector('span').textContent = msg;
      example.classList.remove('hidden');
      example.textContent = window.location.origin + '/scan#img=' + encodeURIComponent('data:image/webp;base64,...');
    }

    function showImage(dataUrl) {
      image.onload = () => {
        image.classList.remove('hidden');
        overlay.classList.remove('hidden');
        error.classList.add('hidden');
        example.classList.add('hidden');
      };
      image.onerror = () => showError('Invalid image data');
      image.src = dataUrl;
    }

    function parseUrl() {
      const hash = window.location.hash;

      if (hash && hash.includes('img=')) {
        const match = hash.match(/img=([^&]+)/);
        if (match) {
          try {
            showImage(decodeURIComponent(match[1]));
            return;
          } catch (e) {
            showError('Failed to decode image: ' + e.message);
            return;
          }
        }
      }

      const params = new URLSearchParams(window.location.search);
      const imgParam = params.get('img');
      if (imgParam) {
        showImage(imgParam);
        return;
      }

      showError('No image in URL');
    }

    window.addEventListener('hashchange', parseUrl);
    parseUrl();
  </script>
</body>
</html>
