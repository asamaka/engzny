<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#06080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Iran Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#f4b03e; --accentGlow:rgba(244,176,62,.22); --accentSoft:rgba(244,176,62,.12);
    --red:#f0584e; --green:#4ade80; --amber:#f4b03e;
    --muted:#9a9da6; --faint:#777b86; --ink:#f4f5f7;
    --bg:#06080d; --bg2:#090c12; --panel:#13151c; --panel2:#171a21; --line:#222631; --line2:#2c313d;
    --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* The whole app lives in a FIXED, CLIPPED shell that never scrolls or drags. The
     page itself (html/body) is locked — this is what kills the "drag the canvas
     sideways / feels like an iframe" behaviour: no element can extend past the
     viewport, because the off-screen views are ABSOLUTE children of an
     overflow-hidden fixed shell (fixed elements escape clipping; absolute ones do not). */
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:'Inter','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;
    overscroll-behavior:none;text-rendering:optimizeLegibility;position:fixed;inset:0;width:100%}
  img{display:block}
  .hidden{display:none !important}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accentSoft)}

  #shell{position:fixed;inset:0;overflow:hidden;background:var(--bg);z-index:1}
  /* every screen is a full-viewport, independently-scrolling layer */
  .view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;background:var(--bg)}
  .view::-webkit-scrollbar{display:none}
  #home{z-index:1}
  .detail{z-index:3;transform:translateX(100%);pointer-events:none;
    transition:transform .32s cubic-bezier(.32,.72,0,1);will-change:transform;touch-action:pan-y;
    box-shadow:-18px 0 40px -20px rgba(0,0,0,.8)}
  .detail.on{transform:translateX(0);pointer-events:auto}
  .detail.drag{transition:none}          /* follow the finger during a back-swipe */
  .scrimback{position:absolute;inset:0;z-index:2;background:#000;opacity:0;pointer-events:none;
    transition:opacity .32s ease}        /* darkens home as a detail slides over it */
  .scrimback.on{opacity:.5}

  /* ===== splash ===== */
  #splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(120% 80% at 50% 30%,#0c1018,#04060a);
    display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
  #splash.gone{opacity:0;pointer-events:none}
  .radar{position:relative;width:92px;height:92px;margin:0 auto 24px}
  .radar::before{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(240,88,78,.18)}
  .radar::after{content:"";position:absolute;inset:18px;border-radius:50%;border:1px solid rgba(240,88,78,.14)}
  .sweep{position:absolute;inset:2px;border-radius:50%;border:2px solid transparent;border-top-color:#f0584e;animation:spin 1.05s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .splmark{font-size:25px;font-weight:300;letter-spacing:10px;color:#eef0f4;text-indent:10px;text-align:center}
  .splmark b{font-weight:900;color:#f0584e}
  .splsub{margin-top:11px;font-size:9.5px;letter-spacing:5px;color:#565d6b;text-align:center;text-indent:5px}

  /* ===== top bar ===== */
  .top{position:sticky;top:0;z-index:30;padding:calc(var(--safeT) + 13px) 18px 11px;
    background:linear-gradient(180deg,rgba(6,8,13,.97) 55%,rgba(6,8,13,.78) 85%,rgba(6,8,13,0));
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-size:15px;font-weight:300;letter-spacing:6px;color:#eef0f4;display:flex;align-items:center;gap:9px}
  .brand b{font-weight:900;color:var(--accent)}
  .brand .day{font-size:9px;letter-spacing:1px;font-weight:700;color:var(--faint);
    border:1px solid var(--line2);border-radius:5px;padding:2px 6px}
  .topright{display:flex;align-items:center;gap:12px}
  .clock{font-size:11.5px;color:#c5c8d1;font-weight:600;text-align:right;white-space:nowrap;line-height:1.35}
  .clock .wx{color:#eef0f4}
  .refbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;
    justify-content:center;color:#c5c8d1;flex:none;transition:transform .2s ease,border-color .2s}
  .refbtn:active{transform:scale(.9)}
  .refbtn svg{width:16px;height:16px}
  .refbtn.spin svg{animation:spin .8s linear infinite;color:var(--accent)}
  .statusrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:10.5px;letter-spacing:2px;font-weight:800;color:var(--accent)}
  .statusrow .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accentGlow);
    animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
  .statusrow .upd{margin-left:auto;color:var(--faint);letter-spacing:.5px;font-weight:600;text-transform:none}

  /* ===== breaking ===== */
  .breaking{margin:2px 16px 0;background:linear-gradient(180deg,#2a1110,#1c0c0c);border:1px solid rgba(240,88,78,.55);
    border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:11px;
    box-shadow:0 6px 22px -10px rgba(240,88,78,.5)}
  .breaking .bd{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;animation:pulse 1.3s infinite;
    box-shadow:0 0 10px rgba(240,88,78,.7)}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
  .breaking .bl{font-size:10px;letter-spacing:2px;font-weight:900;color:var(--red);flex:none}
  .breaking .bt{font-size:13px;color:#f6ddd9;font-weight:600;line-height:1.32}

  /* ===== generic chrome ===== */
  .wrap{padding:6px 16px 8px}
  .sech{display:flex;align-items:center;gap:9px;margin:26px 2px 13px;font-size:11px;letter-spacing:2.5px;font-weight:800;color:#c5c8d1}
  .sech .ic{color:var(--accent);font-size:13px}
  .sech .src{color:var(--faint);font-size:10.5px;letter-spacing:.5px;font-weight:600;margin-left:auto;text-transform:none}

  /* ===== badges / chips ===== */
  .age{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;letter-spacing:.3px;color:#0a0b0f;
    background:var(--accent);border-radius:5px;padding:2px 6px;line-height:1.4}
  .age.fresh{background:var(--green)} .age.recent{background:var(--accent)} .age.old{background:#4a4f5c;color:#dfe2e8}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;letter-spacing:.4px;
    border-radius:5px;padding:2px 7px;line-height:1.5}
  .chip.high{background:rgba(74,222,128,.14);color:#7ee2a4;border:1px solid rgba(74,222,128,.3)}
  .chip.mixed{background:rgba(244,176,62,.14);color:#f3c069;border:1px solid rgba(244,176,62,.32)}
  .chip.single{background:rgba(240,88,78,.14);color:#f08e86;border:1px solid rgba(240,88,78,.32)}

  /* ===== story feed ===== */
  .feed{display:flex;flex-direction:column;gap:15px}
  .scard{position:relative;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line);
    min-height:188px;display:flex;align-items:flex-end;isolation:isolate;
    transition:transform .14s ease,box-shadow .2s;box-shadow:0 10px 30px -18px #000}
  .scard:active{transform:scale(.982)}
  .scard.in{animation:cardin .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes cardin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .scard .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transform:scale(1.02)}
  .scard .scrim{position:absolute;inset:0;z-index:1;
    background:linear-gradient(177deg,rgba(6,8,13,.03) 0%,rgba(6,8,13,.32) 40%,rgba(6,8,13,.88) 100%)}
  .scard.nophoto{background:linear-gradient(135deg,#121a2c,#0a0e17)}
  .scard.nophoto::after{content:"";position:absolute;inset:0;z-index:1;opacity:.5;
    background:radial-gradient(120% 90% at 85% 0%,var(--accentSoft),transparent 60%)}
  .scard .body{position:relative;z-index:2;padding:17px 17px 16px;width:100%}
  .scard h2{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:23px;line-height:1.1;letter-spacing:-.3px;
    text-shadow:0 3px 20px rgba(0,0,0,.7);margin-bottom:8px}
  .scard .brief{font-size:13px;line-height:1.46;color:#bdc1ca;max-height:38px;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .scard .foot{margin-top:12px;display:flex;align-items:center;gap:7px;font-size:11px;color:#a9adb7;font-weight:600;flex-wrap:wrap}
  .foot .lab{color:#a9adb7}
  .foot .upd{opacity:.62;font-weight:500}
  .scard.lead{min-height:300px;border-radius:22px}
  .scard.lead h2{font-size:31px;font-weight:900;line-height:1.04;letter-spacing:-.6px}
  .scard.lead .brief{font-size:14px;max-height:60px;-webkit-line-clamp:3}
  .scard.lead .body{padding:20px 18px 19px}
  .leadkick{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:2px;font-weight:800;
    color:var(--accent);margin-bottom:10px}
  .leadkick::before{content:"";width:16px;height:1.5px;background:var(--accent)}

  /* ===== market rail ===== */
  .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px calc(var(--safeB) + 40px);
    -webkit-overflow-scrolling:touch}
  .rail::-webkit-scrollbar{display:none}
  .mcard{scroll-snap-align:start;flex:0 0 80%;max-width:300px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:17px;padding:15px 16px;transition:transform .14s ease}
  .mcard:active{transform:scale(.98)}
  .mcard .q{font-size:14px;line-height:1.3;color:#e7e9ee;font-weight:600;height:54px;overflow:hidden;margin-bottom:13px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .mcard .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .prob{font-size:33px;font-weight:900;line-height:.86;letter-spacing:-1.5px}
  .prob.g{color:var(--green)} .prob.r{color:var(--red)} .prob.a{color:var(--accent)}
  .delta{font-size:12.5px;font-weight:800;white-space:nowrap;margin-bottom:6px;text-align:right}
  .delta.g{color:var(--green)} .delta.r{color:var(--red)}
  .spark{display:block;width:84px;height:28px;margin-left:auto}
  .mcard .meta{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .quiet{color:var(--faint);font-size:13.5px;padding:14px 2px;line-height:1.5}

  /* ===== detail content ===== */
  .dhero{position:relative;min-height:330px;display:flex;align-items:flex-end}
  .dhero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .dhero .scrim{position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(6,8,13,.28),rgba(6,8,13,.5) 50%,var(--bg))}
  .dhero.nophoto{background:linear-gradient(140deg,#121a2c,#0a0e17)}
  .dhero .body{position:relative;z-index:2;padding:18px 19px 22px;width:100%}
  .dhero h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:31px;line-height:1.06;letter-spacing:-.5px;
    text-shadow:0 3px 20px rgba(0,0,0,.7)}
  .dhero .foot{margin-top:15px;display:flex;align-items:center;gap:8px;font-size:12px;color:#cfd2d9;font-weight:600;flex-wrap:wrap}

  .dbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:11px;
    padding:calc(var(--safeT) + 10px) 12px 10px;background:linear-gradient(180deg,rgba(6,8,13,0),rgba(6,8,13,0));
    transition:background .25s,backdrop-filter .25s}
  .dbar.solid{background:rgba(8,10,16,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .dback{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:2px;font-weight:800;color:#eef0f4;flex:none;
    padding:6px 10px 6px 6px;border-radius:20px}
  .dback:active{background:rgba(255,255,255,.07)}
  .dback .bi{width:19px;height:19px;color:var(--accent);flex:none}
  .dbar .ctitle{font-size:13px;font-weight:700;color:#dfe2e8;opacity:0;transition:opacity .25s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dbar.solid .ctitle{opacity:1}
  .detail .dbar{margin-bottom:-58px}

  .dbody{padding:6px 19px calc(var(--safeB) + 54px)}
  .block{margin-bottom:24px}
  .blabel{font-size:10.5px;letter-spacing:2.5px;font-weight:800;color:var(--accent);margin-bottom:11px;display:flex;align-items:center;gap:7px}
  .lead-p{font-size:16.5px;line-height:1.62;color:#dadde3;font-weight:400;letter-spacing:.1px}
  .aibox{border-left:3px solid var(--accent);padding-left:16px}
  .mktimpact{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(244,176,62,.4);border-radius:15px;padding:15px 16px}
  .mktimpact .miq{font-size:14px;color:#eef0f4;font-weight:600;margin-bottom:12px;line-height:1.32}
  .mktimpact .mirow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .mktimpact .miprob{font-size:32px;font-weight:900;color:var(--accent);letter-spacing:-1px;line-height:1}
  .mktimpact .midelta{font-size:15px;font-weight:800} .midelta.g{color:var(--green)} .midelta.r{color:var(--red)}
  .mktimpact .miby{font-size:12px;color:var(--faint);font-weight:600}
  .keyquote{font-family:'Playfair Display',Georgia,serif;font-size:21px;line-height:1.36;color:#f1f3f6;font-weight:700;
    border-left:3px solid var(--accent);padding-left:17px;font-style:italic}
  .keyquote .kqa{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;color:var(--faint);margin-top:10px;letter-spacing:.5px;font-style:normal}
  .stats{display:flex;flex-wrap:wrap;gap:10px}
  .statcard{flex:1 1 40%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
  .statcard .sv{font-size:26px;font-weight:900;color:var(--accent);line-height:1;letter-spacing:-1px}
  .statcard .sl{font-size:11.5px;color:var(--faint);font-weight:600;margin-top:8px;line-height:1.3}
  .srcrow{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:#cfd2d9;line-height:1.4;padding:11px 0;border-bottom:1px solid var(--line)}
  .srcrow:last-child{border-bottom:none}
  .srcrow:active{opacity:.6}
  .srcrow .o{color:var(--faint);font-weight:700;flex:none;font-size:12px}
  .srcrow .age{margin-top:1px;flex:none}
  .srcrow .ext{margin-left:auto;color:var(--faint);flex:none;font-size:13px}

  .vgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .vtile{background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .14s ease}
  .vtile:active{transform:scale(.97)}
  .vthumb{position:relative;width:100%;aspect-ratio:16/9;background:#1a1d24;overflow:hidden}
  .vthumb img{width:100%;height:100%;object-fit:cover}
  .vthumb .pl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;
    background:rgba(0,0,0,.55);border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;padding-left:3px}
  .vthumb .dur{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.8);color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}
  .vmeta{padding:10px 11px}
  .vmeta .vt{font-size:12px;color:#eef0f4;font-weight:600;line-height:1.28;max-height:46px;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .vmeta .vc{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:6px}

  .tl{position:relative;padding-left:23px}
  .tl::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;
    background:linear-gradient(180deg,#4a3c1c,var(--accent),var(--red))}
  .tlev{position:relative;padding:0 0 19px}
  .tlev:last-child{padding-bottom:0}
  .tlev::before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;
    background:#0a0b0f;border:3px solid var(--accent)}
  .tlev.now::before{border-color:var(--red);background:var(--red);box-shadow:0 0 9px rgba(240,88,78,.6)}
  .tlev .tt{font-size:12.5px;color:#e9eaee;font-weight:800;letter-spacing:.3px}
  .tlev.now .tt{color:var(--red)}
  .tlev .cap{font-size:13px;color:#a9adb7;line-height:1.4;margin-top:3px}

  .mbig{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .mbig .mp{font-size:56px;font-weight:900;letter-spacing:-2.5px;line-height:1}
  .mbig .mp.g{color:var(--green)} .mbig .mp.r{color:var(--red)} .mbig .mp.a{color:var(--accent)}
  .mbig .md{font-size:18px;font-weight:800} .mbig .md.g{color:var(--green)} .mbig .md.r{color:var(--red)}
  .mbig .mby{font-size:13px;color:var(--faint);font-weight:600;width:100%}
  .chartbox{background:#0c0e14;border:1px solid var(--line);border-radius:17px;padding:14px 12px 10px;margin-bottom:6px}
  .chartbox svg{width:100%;height:auto;display:block}
  .chartfb{text-align:center;color:var(--faint);font-size:13px;padding:26px 0}
  .mstats{display:flex;gap:8px;margin:2px 0 16px}
  .mstat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 11px;min-width:0}
  .mstat .mk{display:block;font-size:9px;letter-spacing:1px;font-weight:800;color:var(--faint);margin-bottom:5px}
  .mstat .mv{font-size:18px;font-weight:900;letter-spacing:-.5px;color:#eef0f4;white-space:nowrap}
  .mstat .mv.g{color:var(--green)} .mstat .mv.r{color:var(--red)} .mstat .mv.a{color:var(--accent)}
  .chartlegend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;color:var(--faint);font-weight:600}
  .chartlegend .lgd{width:11px;height:11px;border-radius:3px;flex:none}
  .chartlegend .rsv{margin-left:auto;color:#a9adb7}
  .relhead{font-size:14px;color:#dfe2e8;line-height:1.4;padding:11px 0;border-bottom:1px solid var(--line)}
  .relhead:last-child{border-bottom:none}
  .relhead .o{color:var(--faint);font-weight:700;font-size:12px;margin-right:7px}
  .relchip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;transition:transform .14s ease}
  .relchip:active{transform:scale(.98)}
  .relchip .rq{font-size:14px;color:#eef0f4;font-weight:600;line-height:1.32}
  .relchip .rr{font-size:12.5px;color:var(--faint);font-weight:700;margin-top:7px}
  .relchip .rr b{color:var(--accent)}

  /* update pill */
  .upill{position:fixed;left:50%;transform:translateX(-50%) translateY(-20px);z-index:60;
    bottom:calc(var(--safeB) + 18px);background:var(--accent);color:#0a0b0f;font-size:12.5px;font-weight:800;letter-spacing:.3px;
    border-radius:22px;padding:11px 18px;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;
    box-shadow:0 12px 30px -8px rgba(0,0,0,.7);transition:opacity .3s,transform .3s}
  .upill.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .upill svg{width:14px;height:14px}

  /* pull-to-refresh */
  .ptr{position:fixed;top:calc(var(--safeT) + 6px);left:50%;transform:translateX(-50%) scale(.6);z-index:25;
    width:34px;height:34px;border-radius:50%;background:rgba(15,18,25,.92);border:1px solid var(--line2);
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s}
  .ptr svg{width:17px;height:17px;color:var(--accent)}
  .ptr.spin svg{animation:spin .8s linear infinite}

  /* video overlay */
  #ov{position:fixed;inset:0;z-index:80;background:#000;display:none;flex-direction:column}
  #ov.on{display:flex}
  #ov .ovbar{display:flex;justify-content:flex-end;padding:calc(var(--safeT) + 10px) 16px 10px}
  #ov .ovclose{font-size:13px;font-weight:800;letter-spacing:1px;color:#cfd2d9;background:#1b1e26;border-radius:20px;padding:9px 18px}
  #ov .ovframe{flex:1;position:relative}
  #ov iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  .errbar{margin:10px 16px;background:#241010;border:1px solid var(--red);border-radius:12px;padding:11px 14px;
    font-size:12.5px;color:#f3dcd9;font-weight:600;display:none}
  .errbar.on{display:block}
</style>
</head>
<body>
<div id="splash">
  <div>
    <div class="radar"><div class="sweep"></div></div>
    <div class="splmark">IRAN <b>WATCH</b></div>
    <div class="splsub">LIVE CONFLICT INTELLIGENCE</div>
  </div>
</div>

<div class="ptr" id="ptr">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
</div>

<div id="shell">
  <!-- HOME -->
  <section class="view" id="home">
    <div class="top">
      <div class="toprow">
        <div class="brand">IRAN <b>WATCH</b><span class="day" id="dayLbl"></span></div>
        <div class="topright">
          <div class="clock"><span class="wx" id="wx"></span><br><span id="clock">--:--</span></div>
          <button class="refbtn" id="refBtn" aria-label="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </div>

    <div class="breaking hidden" id="breaking"><span class="bd"></span><span class="bl">BREAKING</span><span class="bt" id="ebtext"></span></div>
    <div class="errbar" id="errbar"></div>

    <div class="wrap">
      <div class="sech"><span class="ic">&#9678;</span><span>TOP STORIES</span><span class="src" id="storySrc"></span></div>
      <div class="feed" id="feed"></div>

  </section>

  <div class="scrimback" id="scrimback"></div>
  <!-- DETAIL PANELS (absolute siblings inside the clipped shell → no canvas drag) -->

  <section class="view detail" id="marketView"></section>
</div>

<button class="upill" id="upill">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  <span>New update — tap to refresh</span>
</button>

<div id="ov">
  <div class="ovbar"><button class="ovclose" id="ovClose">&#10005; CLOSE</button></div>
  <div class="ovframe"><iframe id="ovFrame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
</div>

<script>
(function(){
  "use strict";
  var SOURCE="/api/tv/intel/public";
  var POLL_MS=60000;
  var SEV={
    critical:{a:"#f0584e",glow:"rgba(240,88,78,.24)"},
    warning:{a:"#f4b03e",glow:"rgba(244,140,60,.22)"},
    calm:{a:"#4ade80",glow:"rgba(74,222,128,.2)"}
  };
  var BACK_SVG='<svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';

  // Golden rule: a background refresh NEVER mutates the article you're reading.
  var state={ data:null, openType:null, openId:null, firstPaint:true, openSig:null };

  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function stories(){return (state.data&&state.data.stories)||[];}
  function signals(){return (state.data&&state.data.signals)||[];}
  function storyById(id){var s=stories();for(var i=0;i<s.length;i++)if(String(s[i].id)===String(id))return s[i];return null;}
  function sigById(id){var s=signals();for(var i=0;i<s.length;i++)if(String(s[i].id)===String(id))return s[i];return null;}

  // ===== freshness (content-grounded) =====
  function parseTs(s){ if(!s)return null; var t=Date.parse(s); return isNaN(t)?null:t; }
  function genTime(){ return state.data?parseTs(state.data.generatedAt):null; }
  function relToMs(str){ if(!str||!/ago/i.test(str))return null;
    var m=/(\d+)\s*(mo|m|h|d|w|y)\b/i.exec(str); if(!m)return null;
    var n=parseInt(m[1],10), u=m[2].toLowerCase();
    var mult={m:60000,h:3600000,d:86400000,w:604800000,mo:2592000000,y:31536000000}[u];
    return mult?n*mult:null; }
  function ageMs(item){ if(!item)return null;
    var t=parseTs(item.publishedAt||item.published);
    if(t!=null) return Date.now()-t;
    if(typeof item.ageHours==='number') return item.ageHours*3600000;
    var rel=relToMs(item.meta);
    if(rel!=null){ var g=genTime(); return rel+(g!=null?Math.max(0,Date.now()-g):0); }
    return null; }
  function storyAgeMs(st){ if(!st)return null;
    var direct=ageMs(st); if(direct!=null)return direct;
    var best=null,dd=st.drilldown||{},i,a,srcs=dd.sources||[];
    for(i=0;i<srcs.length;i++){a=ageMs(srcs[i]);if(a!=null&&(best==null||a<best))best=a;}
    if(best!=null)return best;
    var vids=dd.videos||[]; for(i=0;i<vids.length;i++){a=ageMs(vids[i]);if(a!=null&&(best==null||a<best))best=a;}
    return best; }
  function storyFirstMs(st){ if(!st)return null;
    var best=null,dd=st.drilldown||{},i,a; a=ageMs(st); if(a!=null)best=a;
    var srcs=dd.sources||[]; for(i=0;i<srcs.length;i++){a=ageMs(srcs[i]);if(a!=null&&(best==null||a>best))best=a;}
    return best!=null?best:storyAgeMs(st); }
  function timeAgo(ms){ if(ms==null)return ''; if(ms<0)ms=0;
    var m=Math.floor(ms/60000); if(m<1)return 'just now';
    if(m<60)return m+'m ago';
    var h=Math.floor(m/60); if(h<24)return h+'h ago';
    var d=Math.floor(h/24); if(d<7)return d+'d ago';
    var w=Math.floor(d/7); if(d<30)return w+'w ago';
    var mo=Math.floor(d/30); if(d<365)return mo+'mo ago';
    return Math.floor(d/365)+'y ago'; }
  function ageClass(ms){ if(ms==null)return 'recent'; var h=ms/3600000; if(h<=24)return 'fresh'; if(h<=72)return 'recent'; return 'old'; }
  function ageBadgeMs(ms,extra){ if(ms==null)return ''; return '<span class="age '+ageClass(ms)+(extra?' '+extra:'')+'">'+esc(timeAgo(ms))+'</span>'; }
  function ageBadge(item){ return ageBadgeMs(ageMs(item)); }
  function corroChip(st){
    var c=st&&st.meta&&st.meta.corroboration; if(!c)return '';
    if(c==='high')return '<span class="chip high">&#10003; Corroborated</span>';
    if(c==='mixed')return '<span class="chip mixed">&#9680; Mixed sourcing</span>';
    if(c==='single-source')return '<span class="chip single">&#9888; Single source</span>';
    return '';
  }
  function freshFoot(st){
    var f=st.freshness||{};
    var first=f.at?(Date.now()-Date.parse(f.at)):storyFirstMs(st);
    if(first==null||isNaN(first))return '';
    var out=ageBadgeMs(first)+'<span class="lab">'+esc(f.label||'first reported')+'</span>';
    if(f.updatedAt){var u=Date.now()-Date.parse(f.updatedAt);if(!isNaN(u))out+='<span class="upd"> · updated '+timeAgo(u)+'</span>';}
    return out;
  }

  // ===== chrome =====
  function applyAccent(sev){ var s=SEV[sev]||SEV.warning, R=document.documentElement.style;
    R.setProperty('--accent',s.a); R.setProperty('--accentGlow',s.glow);
    var h=s.a.replace('#',''),r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
    R.setProperty('--accentSoft','rgba('+r+','+g+','+b+',.13)'); }
  function sparkPts(arr,w,h){var n=arr.length;if(n<2)return '0,'+(h/2)+' '+w+','+(h/2);
    return arr.map(function(y,i){return (i*(w/(n-1))).toFixed(1)+','+(h-(y*(h/22))).toFixed(1);}).join(' ');}
  function updatedLbl(){ var g=genTime();
    $('updLbl').textContent=(g!=null)?('updated '+timeAgo(Math.max(0,Date.now()-g))):''; }
  function clock(){ var d=new Date(),h=d.getHours(),m=d.getMinutes(),ap=h<12?'AM':'PM';h=h%12||12;
    var day=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
    $('clock').textContent=day+' · '+h+':'+(m<10?'0':'')+m+' '+ap;
    updatedLbl(); }
  function applyBreaking(intel){ var b=intel&&intel.breaking,show=false,txt='';
    if(b&&b.text){var at=Date.parse(b.at||'')||0,age=at?(Date.now()-at):Infinity;
      if(b.critical===true || (at && age>=0 && age<20*60000)){show=true;txt=(b.text||'').replace(/^\s*breaking\s*[:\-]?\s*/i,'');}}
    if(show){$('ebtext').textContent=txt;$('breaking').classList.remove('hidden');}else{$('breaking').classList.add('hidden');} }
  function renderChrome(intel){
    applyAccent((intel.status&&intel.status.severity)||'warning');
    $('statusLbl').textContent=(intel.status&&intel.status.label)||'';
    var st=intel.status||{};
    $('dayLbl').textContent=st.dayCounter?('DAY '+st.dayCounter):'';
    var w=intel.weather;
    $('wx').innerHTML=(w&&w.tempC!=null)?((w.icon||'')+' '+w.tempC+'°'):'';
    updatedLbl();
    $('storySrc').textContent=stories().length?(stories().length+' stories'):'';
    applyBreaking(intel);
  }

  // ===== HOME feed — keyed, in-place reconciliation =====
  function cardInner(st,lead){
    var hasPhoto=!!st.image;
    return (hasPhoto?'<img class="ph" loading="lazy" src="'+esc(st.image)+'" alt="" onerror="this.style.display=\'none\';this.parentNode.classList.add(\'nophoto\')">':'')
      +'<div class="scrim"></div><div class="body">'
      +(lead?'<div class="leadkick">LEAD STORY</div>':'')
      +'<h2>'+esc(st.headline||'')+'</h2>'
      +(st.brief?'<div class="brief">'+esc(st.brief)+'</div>':'')
      +'<div class="foot">'+freshFoot(st)+corroChip(st)+'</div>'
      +'</div>';
  }
  function buildCard(st,i){
    var el=document.createElement('article');
    el.className='scard'+(i===0?' lead':'')+(st.image?'':' nophoto')+(state.firstPaint?' in':'');
    el.setAttribute('data-story',st.id);
    if(state.firstPaint)el.style.animationDelay=(Math.min(i,6)*0.06)+'s';
    el.innerHTML=cardInner(st,i===0);
    return el;
  }
  function updateCard(el,st,i){
    el.classList.toggle('lead',i===0);
    el.classList.toggle('nophoto',!st.image);
    var img=el.querySelector('img.ph');
    var curSrc=img?img.getAttribute('src'):null;
    if((st.image && curSrc!==st.image) || (!st.image && img)){ el.innerHTML=cardInner(st,i===0); return; }
    var h2=el.querySelector('h2'); if(h2)h2.textContent=st.headline||'';
    var br=el.querySelector('.brief');
    if(st.brief){ if(br)br.textContent=st.brief; } else if(br){ br.parentNode.removeChild(br); }
    var foot=el.querySelector('.foot'); if(foot)foot.innerHTML=freshFoot(st)+corroChip(st);
    var kick=el.querySelector('.leadkick');
    if(i===0 && !kick){ var k=document.createElement('div');k.className='leadkick';k.textContent='LEAD STORY';
      el.querySelector('.body').insertBefore(k,h2); }
    if(i!==0 && kick){ kick.parentNode.removeChild(kick); }
  }
  function renderFeed(){
    var ss=stories(), feed=$('feed');
    if(!ss.length){ feed.innerHTML='<div class="quiet">No stories available yet.</div>'; return; }
    if(feed.firstChild && feed.firstChild.className==='quiet') feed.innerHTML='';
    var existing={};
    Array.prototype.forEach.call(feed.querySelectorAll('[data-story]'),function(el){existing[el.getAttribute('data-story')]=el;});
    for(var i=0;i<ss.length;i++){ var st=ss[i], id=String(st.id), el=existing[id];
      if(el){ updateCard(el,st,i); delete existing[id]; } else { el=buildCard(st,i); }
      feed.appendChild(el);
    }
    Object.keys(existing).forEach(function(id){ feed.removeChild(existing[id]); });
  }
  function renderRail(){
    var dc={green:'g',red:'r'},arr={green:'▲',red:'▼'},pc={amber:'a',green:'g',red:'r'};
    var sigs=signals(), rail=$('rail');
    if(!sigs.length){ rail.innerHTML='<div class="quiet" style="padding-left:16px">◉ Markets quiet — no major spikes right now.</div>'; return; }
    var html='';
    for(var c=0;c<sigs.length;c++){ var s=sigs[c];
      var sp=(s.spark&&s.spark.length)?s.spark:[12,12,12,12,12,12];
      var stroke=(s.deltaColor==='green'?'#4ade80':(s.deltaColor==='red'?'#f0584e':'#caa24a'));
      var foot=[]; if(s.byDate)foot.push(esc(s.byDate)); if(s.meta)foot.push(esc(s.meta));
      html+='<div class="mcard" data-market="'+esc(s.id)+'">'
        +'<div class="q">'+esc(s.question)+'</div>'
        +'<div class="row"><div class="prob '+(pc[s.probColor]||'a')+'">'+esc(s.prob)+'</div>'
        +'<div><div class="delta '+(dc[s.deltaColor]||'g')+'">'+(arr[s.deltaColor]||'•')+' '+esc(s.delta)+'</div>'
        +'<svg class="spark" viewBox="0 0 84 28" preserveAspectRatio="none"><polyline fill="none" stroke="'+stroke+'" stroke-width="2.5" points="'+sparkPts(sp,84,28)+'"/></svg></div></div>'
        +(foot.length?'<div class="meta">'+foot.join('  ·  ')+'</div>':'')
        +'</div>';
    }
    rail.innerHTML=html;
  }

  // ===== detail HTML =====
  function fmtDur(s){ s=Math.round(s); var m=Math.floor(s/60),ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
  function pctv(v){ return Math.round(v*100); }
  // A proper labelled probability chart: y-axis % gridlines, a 7-day time axis,
  // and current / high / low markers. History is 0..1 over the last week (60-min
  // fidelity), so x spans 7d→now. Aspect-preserving viewBox (no stretch).
  function marketChartSvg(hist,col){
    var n=hist.length, W=344,H=200,padL=34,padR=14,padT=12,padB=26;
    var pw=W-padL-padR, ph=H-padT-padB;
    var lo=Math.min.apply(null,hist), hi=Math.max.apply(null,hist), rng=(hi-lo)||0.02;
    var loP=lo-rng*0.14, hiP=hi+rng*0.14, rngP=(hiP-loP)||0.02;   // breathing room
    var X=function(i){ return padL + (n>1? i/(n-1)*pw : pw/2); };
    var Y=function(v){ return padT + (1-(v-loP)/rngP)*ph; };
    var pts=[]; for(var i=0;i<n;i++) pts.push(X(i).toFixed(1)+','+Y(hist[i]).toFixed(1));
    var base=(padT+ph).toFixed(1);
    var area=pts.join(' ')+' '+X(n-1).toFixed(1)+','+base+' '+X(0).toFixed(1)+','+base;
    // horizontal gridlines at real high / mid / low, labelled in %
    var grid=[hi,(hi+lo)/2,lo], gsvg='';
    for(var g=0;g<grid.length;g++){ var gv=grid[g],gy=Y(gv).toFixed(1);
      gsvg+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="#222631" stroke-width="1"/>'
        +'<text x="'+(padL-6)+'" y="'+(Y(gv)+3.5).toFixed(1)+'" text-anchor="end" fill="#777b86" font-size="10.5">'+pctv(gv)+'%</text>'; }
    var mid=(padL+(W-padR))/2;
    var xlab='<text x="'+padL+'" y="'+(H-8)+'" text-anchor="start" fill="#777b86" font-size="10.5">7d ago</text>'
      +'<text x="'+mid+'" y="'+(H-8)+'" text-anchor="middle" fill="#777b86" font-size="10.5">3d</text>'
      +'<text x="'+(W-padR)+'" y="'+(H-8)+'" text-anchor="end" fill="#777b86" font-size="10.5">now</text>';
    var hiI=hist.indexOf(hi), loI=hist.indexOf(lo), cx=X(n-1), cy=Y(hist[n-1]);
    var marks='<circle cx="'+X(hiI).toFixed(1)+'" cy="'+Y(hi).toFixed(1)+'" r="2.8" fill="#7ee2a4"/>'
      +'<circle cx="'+X(loI).toFixed(1)+'" cy="'+Y(lo).toFixed(1)+'" r="2.8" fill="#f08e86"/>';
    var dot='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="8" fill="none" stroke="'+col+'" stroke-opacity=".3" stroke-width="2"/>'
      +'<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.5" fill="'+col+'"/>';
    return '<svg viewBox="0 0 '+W+' '+H+'" style="font-family:Inter,system-ui,sans-serif">'
      +gsvg+'<polygon points="'+area+'" fill="'+col+'1f"/>'
      +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
      +marks+dot+xlab+'</svg>';
  }
  function moduleHtml(name,st,d){
    var L=d.layout||{};
    if(name==='summary') return '<div class="block aibox"><div class="blabel">&#10022; THE STORY</div><p class="lead-p">'+esc(d.aiSummary||st.brief||'')+'</p></div>';
    if(name==='marketImpact'&&d.marketImpact){var mi=d.marketImpact;
      return '<div class="block"><div class="blabel">&#9889; MARKET IMPACT</div><div class="mktimpact"><div class="miq">'+esc(mi.question)+'</div>'
        +'<div class="mirow"><span class="miprob">'+esc(mi.prob)+'</span><span class="midelta '+(mi.deltaColor==='red'?'r':'g')+'">'+esc(mi.delta)+'</span>'
        +(mi.byDate?'<span class="miby">'+esc(mi.byDate)+'</span>':'')+'</div></div></div>';}
    if(name==='keyQuote'&&L.keyQuote&&L.keyQuote.text)
      return '<div class="block"><div class="keyquote">“'+esc(L.keyQuote.text)+'”<div class="kqa">'+esc(L.keyQuote.attribution||'')+'</div></div></div>';
    if(name==='statCallouts'&&L.statCallouts&&L.statCallouts.length)
      return '<div class="block"><div class="stats">'+L.statCallouts.slice(0,4).map(function(s){return '<div class="statcard"><div class="sv">'+esc(s.value)+'</div><div class="sl">'+esc(s.label)+'</div></div>';}).join('')+'</div></div>';
    if(name==='sources'&&(d.sources||[]).length)
      return '<div class="block"><div class="blabel">SOURCES</div>'+d.sources.slice(0,6).map(function(s){
        var open=s.link?('<a class="srcrow" href="'+esc(s.link)+'" target="_blank" rel="noopener">'):'<div class="srcrow">';
        var close=s.link?'</a>':'</div>';
        return open+ageBadge(s)+'<span class="o">'+esc(s.outlet||'')+'</span><span>'+esc(s.title)+'</span>'+(s.link?'<span class="ext">&#8599;</span>':'')+close;
      }).join('')+'</div>';
    return '';
  }
  function storyDetailHtml(st){
    var d=st.drilldown||{}, L=d.layout||{modules:['summary']};
    var mods=(L.modules&&L.modules.length?L.modules:['summary']).slice();
    var hasPhoto=!!st.image, m=st.meta||{}, cov='';
    if(m.outletCount)cov='<span class="lab">'+esc(m.outletCount)+' outlet'+(m.outletCount>1?'s':'')+'</span>';
    var html='<div class="dbar"><button class="dback" data-back="1">'+BACK_SVG+'STORIES</button><span class="ctitle">'+esc(st.headline||'')+'</span></div>';
    html+='<div class="dhero'+(hasPhoto?'':' nophoto')+'">'
      +(hasPhoto?'<img class="ph" src="'+esc(st.image)+'" alt="" onerror="this.style.display=\'none\';this.parentNode.classList.add(\'nophoto\')">':'')
      +'<div class="scrim"></div><div class="body">'
      +'<h1>'+esc(st.headline||'')+'</h1>'
      +'<div class="foot">'+freshFoot(st)+corroChip(st)+cov+'</div>'
      +'</div></div>';
    html+='<div class="dbody">';
    var textMods=mods.filter(function(x){return x!=='videos'&&x!=='timeline';});
    if(textMods.indexOf('summary')<0)textMods.unshift('summary');
    html+=textMods.map(function(mm){return moduleHtml(mm,st,d);}).join('');
    var vids=(mods.indexOf('videos')>=0)?(d.videos||[]):[];
    if(vids.length){
      html+='<div class="block"><div class="blabel">&#9654; WATCH</div><div class="vgrid">';
      for(var i=0;i<vids.length;i++){var v=vids[i];
        var dur=(typeof v.durationSec==='number'&&v.durationSec>0)?fmtDur(v.durationSec):'';
        html+='<div class="vtile" data-video="'+esc(v.videoId||'')+'">'
          +'<div class="vthumb">'+(v.thumbnailUrl?'<img loading="lazy" src="'+esc(v.thumbnailUrl)+'" onerror="this.style.display=\'none\'">':'')
          +'<div class="pl">&#9654;</div>'+(dur?'<div class="dur">'+dur+'</div>':'')+'</div>'
          +'<div class="vmeta"><div class="vt">'+esc(v.title)+'</div><div class="vc">'+esc(v.channel||'')+(ageMs(v)!=null?' · '+timeAgo(ageMs(v)):'')+'</div></div></div>';
      }
      html+='</div></div>';
    }
    var tl=d.timeline||[], showTL=!!L.showTimeline&&tl.length>=2;
    if(showTL){
      html+='<div class="block"><div class="blabel">TIMELINE</div><div class="tl">';
      for(var t=0;t<tl.length;t++){var e=tl[t];
        html+='<div class="tlev'+(e.now?' now':'')+'"><div class="tt">'+esc(e.time)+'</div><div class="cap">'+esc(e.cap)+'</div></div>';}
      html+='</div></div>';
    }
    html+='</div>';
    return html;
  }
  function marketDetailHtml(s){
    var pc={amber:'a',green:'g',red:'r'};
    var html='<div class="dbar"><button class="dback" data-back="1">'+BACK_SVG+'MARKET</button><span class="ctitle">'+esc(s.question||'')+'</span></div>';
    html+='<div class="dbody" style="padding-top:calc(var(--safeT) + 8px)">';
    html+='<div class="block"><div class="blabel">&#9889; PREDICTION MARKET</div>'
      +'<h1 style="font-family:\'Playfair Display\',Georgia,serif;font-size:26px;line-height:1.14;font-weight:800;letter-spacing:-.3px;margin-bottom:18px">'+esc(s.question||'')+'</h1>'
      +'<div class="mbig"><span class="mp '+(pc[s.probColor]||'a')+'">'+esc(s.prob||'--')+'</span>'
      +'<span class="md '+(s.deltaColor==='red'?'r':'g')+'">'+(s.deltaColor==='red'?'▼ ':'▲ ')+esc(s.delta||'')+'</span>'
      +(s.byDate?'<span class="mby">'+esc(s.byDate)+'</span>':'')+'</div>';
    var hist=(s.history||[]).filter(function(x){return typeof x==='number';});
    var col=(s.deltaColor==='red'?'#f0584e':(s.deltaColor==='green'?'#4ade80':'#f4b03e'));
    if(hist.length>=2){
      var lo=Math.min.apply(null,hist),hi=Math.max.apply(null,hist),cur=hist[hist.length-1],first=hist[0];
      var d7=Math.round((cur-first)*100);
      html+='<div class="mstats">'
        +'<div class="mstat"><span class="mk">7D HIGH</span><span class="mv">'+pctv(hi)+'%</span></div>'
        +'<div class="mstat"><span class="mk">7D LOW</span><span class="mv">'+pctv(lo)+'%</span></div>'
        +'<div class="mstat"><span class="mk">7D CHANGE</span><span class="mv '+(d7>0?'g':(d7<0?'r':''))+'">'+(d7>0?'+':'')+d7+' pts</span></div>'
        +'</div>';
      html+='<div class="chartbox">'+marketChartSvg(hist,col)+'</div>';
      html+='<div class="chartlegend"><span class="lgd" style="background:'+col+'"></span>Yes probability · last 7 days'
        +(s.byDate?'<span class="rsv">Resolves '+esc((s.byDate||'').replace(/^\s*by\s+/i,''))+'</span>':'')+'</div>';
    } else {
      html+='<div class="chartbox"><div class="chartfb">Price history builds as the market moves.</div></div>';
    }
    html+='</div>';
    var rh=(s.relatedHeadlines||[]).slice(0,6);
    if(rh.length){ html+='<div class="block"><div class="blabel">RELATED HEADLINES</div>'
      +rh.map(function(h){return '<div class="relhead"><span class="o">'+esc(h.outlet||'')+'</span>'+esc(h.title)+'</div>';}).join('')+'</div>'; }
    var rel=(s.relatedMarketIds||[]).map(sigById).filter(Boolean);
    if(rel.length){ html+='<div class="block"><div class="blabel">OTHER SPIKING MARKETS</div>'
      +rel.map(function(r){return '<div class="relchip" data-market="'+esc(r.id)+'"><div class="rq">'+esc(r.question)+'</div><div class="rr"><b>'+esc(r.prob)+'</b> &middot; '+esc(r.delta)+(r.byDate?' &middot; '+esc(r.byDate):'')+'</div></div>';}).join('')+'</div>'; }
    html+='</div>';
    return html;
  }
  function storySig(st){ if(!st)return ''; var d=st.drilldown||{};
    return [st.headline,st.brief,d.aiSummary,(st.freshness||{}).updatedAt,(st.meta||{}).latestUpdateAt,
      (d.sources||[]).length,(d.videos||[]).length,(d.timeline||[]).length].join('|'); }

  // ===== routing — navigation only (open/close + scroll-to-top); driven by
  // hashchange, never by the poll. =====
  function activeDetailEl(){ return state.openType==='market'?$('marketView'):$('storyView'); }
  function bindDetailScroll(el){
    var bar=el.querySelector('.dbar'); if(!bar)return;
    el.onscroll=function(){ if(el.scrollTop>120)bar.classList.add('solid'); else bar.classList.remove('solid'); };
  }
  function openDetailPanel(el){ el.scrollTop=0; el.style.transform=''; el.classList.add('on'); $('scrimback').classList.add('on'); bindDetailScroll(el); }
  function closeDetailPanel(el){ el.classList.remove('on'); el.style.transform=''; el.onscroll=null; }
  function route(){
    var h=location.hash||'';
    var mS=/^#\/story\/(.+)$/.exec(h), mM=/^#\/market\/(.+)$/.exec(h);
    hideUpill();
    if(mS){ var id=decodeURIComponent(mS[1]); var st=storyById(id);
      if(!st){ goHome(); return; }
      state.openType='story'; state.openId=id; state.openSig=storySig(st);
      $('storyView').innerHTML=storyDetailHtml(st);
      closeDetailPanel($('marketView')); openDetailPanel($('storyView'));
    } else if(mM){ var mid=decodeURIComponent(mM[1]); var s=sigById(mid);
      if(!s){ goHome(); return; }
      state.openType='market'; state.openId=mid; state.openSig=null;
      $('marketView').innerHTML=marketDetailHtml(s);
      closeDetailPanel($('storyView')); openDetailPanel($('marketView'));
    } else {
      state.openType=null; state.openId=null; state.openSig=null;
      closeDetailPanel($('storyView')); closeDetailPanel($('marketView'));
      $('scrimback').classList.remove('on');
    }
  }
  function goHome(){ if(location.hash){ location.hash=''; } else { route(); } }
  function openStory(id){ location.hash='#/story/'+encodeURIComponent(id); }
  function openMarket(id){ location.hash='#/market/'+encodeURIComponent(id); }
  window.addEventListener('hashchange',route);

  // ===== update pill =====
  function showUpill(){ $('upill').classList.add('on'); }
  function hideUpill(){ $('upill').classList.remove('on'); }
  function applyOpenUpdate(){
    hideUpill();
    if(state.openType==='story'){ var el=$('storyView'),top=el.scrollTop,st=storyById(state.openId);
      if(st){ el.innerHTML=storyDetailHtml(st); el.scrollTop=top; bindDetailScroll(el); state.openSig=storySig(st); } }
    else if(state.openType==='market'){ var m=$('marketView'),t2=m.scrollTop,s=sigById(state.openId);
      if(s){ m.innerHTML=marketDetailHtml(s); m.scrollTop=t2; bindDetailScroll(m); } }
  }
  $('upill').addEventListener('click',applyOpenUpdate);

  // ===== video overlay =====
  function playVideo(vid){ if(!vid)return;
    $('ovFrame').src='https://www.youtube.com/embed/'+encodeURIComponent(vid)+'?autoplay=1&playsinline=1&rel=0';
    $('ov').classList.add('on'); }
  function closeOverlay(){ $('ov').classList.remove('on'); $('ovFrame').src=''; }
  $('ovClose').addEventListener('click',closeOverlay);

  // ===== delegated taps =====
  document.addEventListener('click',function(ev){
    var t=ev.target;
    var back=t.closest&&t.closest('[data-back]'); if(back){ ev.preventDefault(); goHome(); return; }
    var vt=t.closest&&t.closest('[data-video]'); if(vt){ ev.preventDefault(); playVideo(vt.getAttribute('data-video')); return; }
    var sc=t.closest&&t.closest('[data-story]'); if(sc){ openStory(sc.getAttribute('data-story')); return; }
    var mc=t.closest&&t.closest('[data-market]'); if(mc){ openMarket(mc.getAttribute('data-market')); return; }
  });

  // ===== swipe-to-go-back (native-feel: the panel follows your finger) =====
  (function(){
    var el=null,sx=0,sy=0,axis=null,dx=0,W=function(){return window.innerWidth||360;};
    function onStart(e){
      if(state.openType==null||e.touches.length!==1)return;
      el=activeDetailEl();
      if(el.scrollLeft>0){ el=null; return; }
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; axis=null; dx=0;
    }
    function onMove(e){
      if(!el)return;
      var x=e.touches[0].clientX,y=e.touches[0].clientY,ddx=x-sx,ddy=y-sy;
      if(axis==null){
        if(Math.abs(ddx)<7&&Math.abs(ddy)<7)return;
        axis=Math.abs(ddx)>Math.abs(ddy)?'x':'y';
        if(axis==='x'){ el.classList.add('drag'); $('scrimback').style.transition='none'; }
      }
      if(axis!=='x')return;
      if(ddx<0)ddx=0; dx=ddx;
      if(e.cancelable)e.preventDefault();
      el.style.transform='translateX('+dx+'px)';
      $('scrimback').style.opacity=String(0.5*Math.max(0,1-dx/W()));
    }
    function onEnd(){
      if(!el)return;
      var v=el,wasX=(axis==='x'),commit=dx>W()*0.32||dx>120;
      v.classList.remove('drag'); $('scrimback').style.transition='';
      el=null; axis=null;
      if(wasX&&commit){
        // animate the rest of the way out, then return home
        v.style.transform='translateX(100%)'; $('scrimback').style.opacity='';
        setTimeout(goHome,150);
      } else {
        v.style.transform=''; $('scrimback').style.opacity='';   // snap back
      }
      dx=0;
    }
    var sh=$('shell');
    sh.addEventListener('touchstart',onStart,{passive:true});
    sh.addEventListener('touchmove',onMove,{passive:false});
    sh.addEventListener('touchend',onEnd);
    sh.addEventListener('touchcancel',onEnd);
  })();

  // ===== data application =====
  function applyData(intel){
    state.data=intel;
    renderChrome(intel);
    renderFeed();
    renderRail();
    if(state.openType==='story'){
      var st=storyById(state.openId);
      if(!st){ goHome(); }
      else if(storySig(st)!==state.openSig){ showUpill(); }
    } else if(state.openType==='market'){
      if(!sigById(state.openId)){ goHome(); }
    }
    state.firstPaint=false;
  }
  function fetchIntel(){
    return fetch(SOURCE+(SOURCE.indexOf('?')<0?'?t=':'&t=')+Date.now(),{cache:'no-store'})
      .then(function(r){ if(!r.ok)throw new Error('status '+r.status); return r.json(); })
      .then(function(d){ if(!d||!d.stories)throw new Error('empty'); return d; });
  }
  var _loading=false;
  function load(opts){ opts=opts||{}; if(_loading)return; _loading=true;
    if(opts.spin)$('refBtn').classList.add('spin');
    clock();
    fetchIntel().then(function(d){
      $('errbar').classList.remove('on');
      var firstEver=!state.data;
      applyData(d);
      if(firstEver) route();
      reveal();
    }).catch(function(){
      if(!state.data){ $('statusLbl').textContent='NO DATA';
        $('errbar').textContent='Could not load briefing. Retrying…'; $('errbar').classList.add('on'); reveal(); }
    }).then(function(){ _loading=false; setTimeout(function(){$('refBtn').classList.remove('spin');},500); });
  }
  $('refBtn').addEventListener('click',function(){ load({spin:true}); });

  // ===== pull-to-refresh (home view only, at the top) =====
  (function(){
    var ptr=$('ptr'),home=$('home'),startY=0,pulling=false,dist=0,MAX=90,TRIG=62;
    function atTop(){ return state.openType==null && home.scrollTop<=0; }
    home.addEventListener('touchstart',function(e){ if(!atTop()||e.touches.length!==1){pulling=false;return;} startY=e.touches[0].clientY; pulling=true; dist=0; },{passive:true});
    home.addEventListener('touchmove',function(e){ if(!pulling)return;
      dist=e.touches[0].clientY-startY;
      if(dist<=0){ ptr.style.opacity='0'; return; }
      if(atTop()){ if(e.cancelable)e.preventDefault();
        var d=Math.min(dist*0.6,MAX);
        ptr.style.opacity=String(Math.min(d/TRIG,1));
        ptr.style.transform='translateX(-50%) scale('+(0.6+Math.min(d/MAX,1)*0.4)+') rotate('+(d*2.4)+'deg)';
      }
    },{passive:false});
    function endPull(){ if(!pulling)return; pulling=false;
      if(dist>=TRIG){ ptr.classList.add('spin'); ptr.style.opacity='1'; ptr.style.transform='translateX(-50%) scale(1)';
        load({}); setTimeout(function(){ ptr.classList.remove('spin'); ptr.style.opacity='0'; },650); }
      else { ptr.style.opacity='0'; }
      dist=0;
    }
    home.addEventListener('touchend',endPull); home.addEventListener('touchcancel',endPull);
  })();

  // ===== splash =====
  var _revealed=false;
  function reveal(){ if(_revealed)return; _revealed=true;
    var sp=$('splash'); if(!sp)return; sp.classList.add('gone'); setTimeout(function(){sp.style.display='none';},500); }

  // ===== boot =====
  load({});
  setTimeout(reveal,8000);
  setInterval(clock,15000);
  setInterval(function(){ load({}); },POLL_MS);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) load({}); });
})();
</script>
</body>
