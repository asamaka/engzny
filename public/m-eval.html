<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Intel Accuracy · Eval</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#121724; --panel2:#1a2030; --bd:#232c40; --bd2:#324158;
    --tx:#e6ebf5; --tx2:#9aa6bd; --tx3:#6b768c; --accent:#6c9fff;
    --green:#34d399; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa; --purple:#a855f7;
    --coverage:#6c9fff; --freshness:#34d399; --staleness:#22d3ee; --markets:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:980px;margin:0 auto;padding:16px 14px 80px}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:10px 0 8px;display:flex;align-items:center;gap:10px}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.3px}
  header .sub{color:var(--tx3);font-size:12px}
  .btn{background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
  .btn:hover{border-color:var(--bd2);color:var(--tx)}
  .spacer{flex:1}

  .card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
  .card h2{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);margin:0 0 10px;font-weight:700}

  /* score hero */
  .hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .bigscore{font-size:52px;font-weight:800;line-height:1;letter-spacing:-1px}
  .bigscore small{font-size:18px;color:var(--tx3);font-weight:600}
  .grade{font-size:30px;font-weight:800;padding:6px 16px;border-radius:12px;line-height:1}
  .heroinfo{color:var(--tx2);font-size:12.5px}
  .heroinfo b{color:var(--tx)}
  .heroinfo .row{margin:2px 0}

  /* sub-score bars */
  .bars{display:flex;flex-direction:column;gap:9px}
  .barrow{display:grid;grid-template-columns:120px 1fr 46px;align-items:center;gap:10px;font-size:12.5px}
  .barrow .lbl{color:var(--tx2)}
  .barrow .lbl small{color:var(--tx3)}
  .bar{height:9px;background:var(--panel2);border:1px solid var(--bd);border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px}
  .barrow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

  /* trend sparkline */
  .trend svg{width:100%;height:86px;display:block}
  .trend .axis{fill:var(--tx3);font-size:9px}
  .trendlegend{display:flex;justify-content:space-between;color:var(--tx3);font-size:11px;margin-top:4px}

  /* badges */
  .badge{font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 8px;border-radius:999px;text-transform:uppercase;flex-shrink:0}
  .imp{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);flex-shrink:0}

  /* collapsible rows */
  .item{border:1px solid var(--bd);border-left-width:3px;border-radius:9px;margin:8px 0;background:var(--panel2);overflow:hidden}
  .item>.ih{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer}
  .item>.ih:hover{background:var(--panel)}
  .item .ttl{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .item .ttl.wrap{white-space:normal}
  .item>.ib{display:none;padding:2px 11px 11px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--tx2)}
  .item.open>.ib{display:block}
  .item .ib p{margin:8px 0}
  .item .ib b{color:var(--tx)}
  .caret{transition:transform .12s;color:var(--tx3);font-size:10px;flex-shrink:0}
  .item.open .caret{transform:rotate(90deg)}
  .kvline{color:var(--tx3);font-size:11.5px;margin-top:3px}
  .sugg{color:var(--green)}

  .center{text-align:center;color:var(--tx3);padding:40px 0}
  .err{color:var(--red)}
  .mut{color:var(--tx3)}
  .gate{max-width:360px;margin:60px auto;text-align:center}
  .gate input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--panel);color:var(--tx);font-size:14px;margin:10px 0}
  pre{white-space:pre-wrap;word-break:break-word;background:#0a0d13;border:1px solid var(--bd);border-radius:7px;padding:10px;margin:6px 0 0;font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfd8ea}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Intel Accuracy</h1>
    <span class="sub">snapshot vs reality</span>
    <span class="spacer"></span>
    <button class="btn" id="refreshBtn" style="display:none">↻ Refresh</button>
  </header>
  <div id="view"><div class="center">Loading…</div></div>
</div>
<script>
const V = document.getElementById('view');
const refreshBtn = document.getElementById('refreshBtn');

// ---- token (shared with /m/debug) ----
function getToken(){
  const u = new URL(location.href);
  const t = u.searchParams.get('token');
  if (t){ localStorage.setItem('thinx_dbg_tk', t); u.searchParams.delete('token'); history.replaceState({}, '', u.pathname + u.search + u.hash); }
  return localStorage.getItem('thinx_dbg_tk') || '';
}
async function api(pathStr){
  const tk = getToken();
  const r = await fetch('/api/tv/intel' + pathStr + (pathStr.includes('?')?'&':'?') + 'token=' + encodeURIComponent(tk));
  if (r.status === 401 || r.status === 403){ const e = new Error('unauthorized'); e.auth = true; throw e; }
  if (r.status === 404){ const e = new Error('no evaluation stored yet'); e.empty = true; throw e; }
  if (!r.ok){ throw new Error('HTTP ' + r.status); }
  return r.json();
}
function tokenGate(msg){
  refreshBtn.style.display = 'none';
  V.innerHTML = '<div class="gate"><div>'+(msg||'Enter the debug token to view eval results.')+'</div>'+
    '<input id="tkin" type="password" placeholder="debug token" autocomplete="off">'+
    '<button class="btn" id="tkgo" style="width:100%">View results</button></div>';
  document.getElementById('tkgo').onclick = ()=>{ const v=document.getElementById('tkin').value.trim(); if(v){ localStorage.setItem('thinx_dbg_tk', v); load(); } };
  document.getElementById('tkin').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('tkgo').click(); });
}

// ---- helpers ----
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function rel(iso){
  const d = Date.now() - Date.parse(iso); if(!isFinite(d)) return '';
  const m = Math.round(d/60000); if(m<1) return 'just now'; if(m<60) return m+'m ago';
  const h = Math.round(m/60); if(h<48) return h+'h ago'; return Math.round(h/24)+'d ago';
}
function fmtTime(iso){ try{ return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch{ return iso; } }
function scoreColor(n){ return n>=70?'var(--green)':n>=50?'var(--amber)':'var(--red)'; }
function gradeColor(g){ g=(g||'').toUpperCase(); return (g==='A'||g==='B')?'var(--green)':g==='C'?'var(--amber)':'var(--red)'; }
function impColor(n){ return n>=5?'var(--red)':n>=4?'var(--amber)':'var(--tx3)'; }
const STATUS = {
  missing:{c:'var(--red)',t:'missing'},
  covered_reword:{c:'var(--amber)',t:'reword'},
  covered_shallow:{c:'var(--amber)',t:'shallow'},
  over_broad:{c:'var(--blue)',t:'over-broad'},
  merged:{c:'var(--blue)',t:'merged'},
  covered_well:{c:'var(--green)',t:'covered'},
};
function statusInfo(s){ return STATUS[s] || {c:'var(--tx3)',t:(s||'?').replace(/_/g,' ')}; }
const PRIO = { P0:'var(--red)', P1:'#fb923c', P2:'var(--blue)', P3:'var(--tx3)' };

// ---- sub-score bars ----
function bars(scores){
  const defs = [
    ['Coverage', scores.coverage, 'var(--coverage)', '40%'],
    ['Freshness', scores.freshness, 'var(--freshness)', '25%'],
    ['Markets', scores.marketAlignment, 'var(--markets)', '20%'],
    ['Staleness', scores.staleness, 'var(--staleness)', '15%'],
  ];
  return '<div class="bars">'+defs.map(([lbl,v,col,w])=>{
    v = v==null?0:v;
    return '<div class="barrow"><span class="lbl">'+lbl+' <small>('+w+')</small></span>'+
      '<span class="bar"><span class="fill" style="width:'+v+'%;background:'+col+'"></span></span>'+
      '<span class="val" style="color:'+scoreColor(v)+'">'+v+'</span></div>';
  }).join('')+'</div>';
}

// ---- composite trend sparkline ----
function trend(history){
  const pts = history.slice().reverse().filter(h=>typeof h.composite==='number'); // oldest -> newest
  if (pts.length < 2) return '<div class="mut">Not enough history to chart yet.</div>';
  const W=300,H=70,P=4;
  const x = i => P + i*(W-2*P)/(pts.length-1);
  const y = v => (H-P) - (v/100)*(H-2*P);
  const line = pts.map((h,i)=> (i?'L':'M')+x(i).toFixed(1)+' '+y(h.composite).toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  const grid = [50,75].map(g=>'<line x1="0" y1="'+y(g).toFixed(1)+'" x2="'+W+'" y2="'+y(g).toFixed(1)+'" stroke="var(--bd)" stroke-dasharray="3 4"/><text class="axis" x="2" y="'+(y(g)-2).toFixed(1)+'">'+g+'</text>').join('');
  const dots = pts.map((h,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(h.composite).toFixed(1)+'" r="'+(i===pts.length-1?3:1.7)+'" fill="'+(i===pts.length-1?scoreColor(h.composite):'var(--accent)')+'"/>').join('');
  return '<div class="trend"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      grid+
      '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>'+
      dots+
    '</svg><div class="trendlegend"><span>'+esc(fmtTime(pts[0].evaluatedAt))+'</span>'+
    '<span>'+pts.length+' runs · latest <b style="color:'+scoreColor(last.composite)+'">'+last.composite+'</b></span>'+
    '<span>'+esc(fmtTime(last.evaluatedAt))+'</span></div></div>';
}

// ---- compact recommendation list (used in historical reflections) ----
function recListCompact(recs){
  if (!recs || !recs.length) return '';
  return '<div style="margin-top:6px">'+recs.map(r=>{
    const col = PRIO[r.priority] || 'var(--tx3)';
    return '<div style="margin:6px 0;padding-left:9px;border-left:2px solid '+col+'">'+
      '<span class="badge" style="background:'+col+'22;color:'+col+'">'+esc(r.priority||'?')+'</span> '+
      '<b style="color:var(--tx)">'+esc(r.target||'')+'</b> '+
      '<span class="mut">('+esc(r.type||'')+')</span>'+
      '<div style="margin-top:2px">'+esc(r.detail||'')+'</div></div>';
  }).join('')+'</div>';
}

// ---- collapsible item ----
function item(color, head, bodyHtml){
  return '<div class="item" style="border-left-color:'+color+'">'+
    '<div class="ih"><span class="caret">▶</span>'+head+'</div>'+
    '<div class="ib">'+bodyHtml+'</div></div>';
}

function render(data){
  const L = data.latest, H = data.history || [];
  const s = L.scores || {};
  const grade = (L.reflection && L.reflection.grade) || '–';
  const wv = L.reality || {}, heads = wv.topHeadlines || [];
  const gaps = L.gapAnalysis || [];
  const recs = (L.reflection && L.reflection.recommendations) || [];
  const missed = (L.coverage && L.coverage.missed) || [];
  const feedOnly = L.feedOnlyStories || [];
  const ma = L.marketAlignment || {};

  let html = '';

  // hero + score breakdown
  html += '<div class="card"><div class="hero">'+
      '<div class="bigscore" style="color:'+scoreColor(s.composite)+'">'+s.composite+'<small>/100</small></div>'+
      '<div class="grade" style="background:'+gradeColor(grade)+'22;color:'+gradeColor(grade)+'">'+esc(grade)+'</div>'+
      '<div class="heroinfo">'+
        '<div class="row">evaluated <b>'+esc(rel(L.evaluatedAt))+'</b> · '+esc(fmtTime(L.evaluatedAt))+'</div>'+
        '<div class="row">snapshot <b>'+esc(rel(L.snapshotGeneratedAt))+'</b>'+(L.snapshotReused?' <span class="mut">(reused)</span>':'')+'</div>'+
        '<div class="row mut">judge '+esc((L.models&&L.models.judge)||'?')+' · worldview '+esc(((L.models&&L.models.worldview)||[]).join('+')||'?')+'</div>'+
      '</div></div>'+
    '<div style="margin-top:14px">'+bars(s)+'</div></div>';

  // trend
  html += '<div class="card"><h2>Composite trend</h2>'+trend(H)+'</div>';

  // past evaluations — every historical run's reflection (newest first, latest
  // excluded since it's shown in full below). Older entries (pre-dating reflection
  // capture) fall back to their summary stats.
  const past = H.filter(h=> h.evaluatedAt !== L.evaluatedAt);
  if (past.length){
    html += '<div class="card"><h2>Past evaluations ('+past.length+')</h2>'+
      past.map(h=>{
        const sc = (h.scores && h.scores.composite!=null) ? h.scores.composite : h.composite;
        const gc = gradeColor(h.grade);
        const head = '<span class="badge" style="background:'+gc+'22;color:'+gc+'">'+esc(h.grade||'–')+'</span>'+
          '<span class="imp" style="color:'+scoreColor(sc)+'">'+esc(sc)+'</span>'+
          '<span class="ttl wrap">'+esc(fmtTime(h.evaluatedAt))+' <span class="mut">· '+esc(rel(h.evaluatedAt))+'</span></span>';
        let body = '';
        const refl = h.reflection;
        if (refl && (refl.narrative || (refl.recommendations||[]).length)){
          if (refl.narrative) body += '<p>'+esc(refl.narrative)+'</p>';
          body += recListCompact(refl.recommendations||[]);
        } else {
          body += '<p class="mut">Full reflection not captured for this run.</p>';
          if (h.topMiss) body += '<p><b>Top miss:</b> '+esc(h.topMiss)+'</p>';
          body += '<div class="kvline">gaps '+esc(h.gapCount)+' · missing '+esc(h.missingCount)+' · missed '+esc(h.missedCount)+' · recs '+esc(h.recCount)+'</div>';
        }
        return item(gc, head, body);
      }).join('')+'</div>';
  }

  // reflection narrative
  if (L.reflection && L.reflection.narrative)
    html += '<div class="card"><h2>Assessment</h2><div style="color:var(--tx);font-size:13.5px">'+esc(L.reflection.narrative)+'</div></div>';

  // recommendations
  if (recs.length){
    html += '<div class="card"><h2>Structural recommendations ('+recs.length+')</h2>'+
      recs.map(r=>{
        const col = PRIO[r.priority] || 'var(--tx3)';
        const head = '<span class="badge" style="background:'+col+'22;color:'+col+'">'+esc(r.priority||'?')+'</span>'+
          '<span class="imp">'+esc(r.type||'')+'</span><span class="ttl wrap">'+esc(r.target||'')+'</span>';
        let body = '<p>'+esc(r.detail||'')+'</p>';
        if (r.rationale) body += '<p><b>Why:</b> '+esc(r.rationale)+'</p>';
        if (r.generalizes) body += '<p class="mut"><b>Generalizes:</b> '+esc(r.generalizes)+'</p>';
        return item(col, head, body);
      }).join('')+'</div>';
  }

  // gap analysis
  if (gaps.length){
    html += '<div class="card"><h2>Gap analysis — reality vs feed ('+gaps.length+')</h2>'+
      gaps.map(g=>{
        const si = statusInfo(g.status);
        const head = '<span class="badge" style="background:'+si.c+'22;color:'+si.c+'">'+esc(si.t)+'</span>'+
          (g.realityRank?'<span class="imp">#'+esc(g.realityRank)+'</span>':'')+
          '<span class="ttl wrap">'+esc(g.title)+'</span>';
        let body = g.discrepancy ? '<p>'+esc(g.discrepancy)+'</p>' : '<p class="mut">No discrepancy noted.</p>';
        if (g.suggestedTitle) body += '<p class="sugg"><b>Suggested title:</b> '+esc(g.suggestedTitle)+'</p>';
        body += '<div class="kvline">'+
          (g.feedStoryId?'feed: '+esc(g.feedStoryId)+' · ':'')+
          'likely stage: '+esc(g.likelyStage||'?')+(g.confidence?' · confidence: '+esc(g.confidence):'')+'</div>';
        return item(si.c, head, body);
      }).join('')+'</div>';
  }

  // missed stories
  if (missed.length){
    html += '<div class="card"><h2>Missed by the feed ('+missed.length+')</h2>'+
      missed.map(m=>{
        const head = '<span class="imp" style="color:'+impColor(m.importance)+'">'+esc(m.importance||'?')+'/5</span>'+
          '<span class="ttl wrap">'+esc(m.title)+'</span>';
        const body = '<div class="kvline">first reported '+esc(rel(m.firstReportedAt))+
          (m.bestMatch!=null?' · best feed match '+(m.bestMatch*100).toFixed(0)+'%':'')+
          ((m.sources&&m.sources.length)?' · '+esc(m.sources.join(', ')):'')+'</div>';
        return item('var(--red)', head, body);
      }).join('')+'</div>';
  }

  // feed-only stories
  if (feedOnly.length){
    html += '<div class="card"><h2>Feed-only / over-covered ('+feedOnly.length+')</h2>'+
      feedOnly.map(f=>{
        const head = '<span class="badge" style="background:var(--blue)22;color:var(--blue)">'+esc((f.issue||'').replace(/_/g,' '))+'</span>'+
          '<span class="ttl wrap">'+esc(f.headline)+'</span>';
        return item('var(--blue)', head, '<p>'+esc(f.note||'')+'</p>'+(f.feedStoryId?'<div class="kvline">feed: '+esc(f.feedStoryId)+'</div>':''));
      }).join('')+'</div>';
  }

  // market alignment detail
  if ((ma.realCovered||[]).length || (ma.realMissed||[]).length){
    html += '<div class="card"><h2>Market alignment'+(ma.recall!=null?' · recall '+(ma.recall*100).toFixed(0)+'%':'')+'</h2>'+
      (ma.realCovered||[]).map(q=>'<div style="color:var(--tx2);font-size:12.5px;margin:4px 0"><span style="color:var(--green)">✓</span> '+esc(q)+'</div>').join('')+
      (ma.realMissed||[]).map(q=>'<div style="color:var(--tx2);font-size:12.5px;margin:4px 0"><span style="color:var(--red)">✗</span> '+esc(q)+'</div>').join('')+
      '</div>';
  }

  // worldview
  if (heads.length){
    html += '<div class="card"><h2>Reference worldview ('+heads.length+')</h2>'+
      (wv.situation?'<div style="color:var(--tx2);font-size:12.5px;margin-bottom:10px">'+esc(wv.situation)+'</div>':'')+
      heads.map(h=>{
        const head = '<span class="imp" style="color:'+impColor(h.importance)+'">'+esc(h.importance||'?')+'/5</span>'+
          (h.confidence?'<span class="badge" style="background:var(--panel)0;color:var(--tx3);border:1px solid var(--bd)">'+esc(h.confidence)+'</span>':'')+
          '<span class="ttl wrap">'+esc(h.title)+'</span>';
        let body = h.summary?'<p>'+esc(h.summary)+'</p>':'';
        body += '<div class="kvline">'+(h.front?esc(h.front)+' · ':'')+'first reported '+esc(rel(h.firstReportedAt))+
          ((h.providers&&h.providers.length)?' · via '+esc(h.providers.join('+')):'')+
          ((h.sources&&h.sources.length)?' · '+esc(h.sources.join(', ')):'')+'</div>';
        return item('var(--accent)', head, body);
      }).join('')+'</div>';
  }

  V.innerHTML = html;
  V.querySelectorAll('.item > .ih').forEach(ih=> ih.onclick = ()=> ih.parentElement.classList.toggle('open'));
}

async function load(){
  refreshBtn.style.display = 'none';
  V.innerHTML = '<div class="center">Loading…</div>';
  let data;
  try { data = await api('/eval?history=40'); }
  catch(e){
    if (e.auth) return tokenGate();
    if (e.empty) { refreshBtn.style.display=''; refreshBtn.onclick=load; return V.innerHTML = '<div class="center">No evaluation stored yet.<br><span class="mut">The eval cron writes a report every few hours.</span></div>'; }
    return V.innerHTML = '<div class="center err">'+esc(e.message)+'</div>';
  }
  refreshBtn.style.display = ''; refreshBtn.onclick = load;
  render(data);
}
load();
</script>
</body>
</html>
