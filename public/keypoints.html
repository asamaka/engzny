<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keypoints - thinx.fun</title>
    <link href="/styles/output.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-100">
    <div class="navbar bg-base-200 border-b border-base-300 sticky top-0 z-20">
        <div class="flex-1">
            <button class="btn btn-ghost btn-sm" onclick="window.history.back()">← back</button>
        </div>
        <div class="flex-none font-semibold text-primary">keypoints</div>
    </div>

    <main class="p-4 pb-10 max-w-2xl mx-auto space-y-4">
        <div id="loadingState" class="grid place-items-center py-10 gap-3">
            <span class="loading loading-spinner loading-lg text-primary"></span>
            <p class="text-sm text-base-content/60">extracting keypoints...</p>
        </div>

        <div id="contentContainer" class="hidden space-y-4">
            <div class="card bg-base-200 border border-base-300 shadow-sm" id="overviewCard">
                <div class="card-body">
                    <div class="badge badge-primary badge-outline w-fit">What am I looking at?</div>
                    <h2 class="card-title" id="mainTopic"></h2>
                    <p class="text-sm text-base-content/80 leading-relaxed" id="immediateAnswer"></p>
                </div>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-1" id="trailsNav"></div>
            <div class="grid grid-cols-1 gap-4" id="cardsContainer"></div>
        </div>

        <div id="emptyState" class="hidden"></div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const imageDataSource = urlParams.get('img') || sessionStorage.getItem('currentImage');

        function showEmpty(msg, type = 'warning') {
            const empty = document.getElementById('emptyState');
            empty.classList.remove('hidden');
            empty.innerHTML = `<div class="alert alert-${type}"><span>${msg}</span></div>`;
        }

        if (!imageDataSource) {
            document.getElementById('loadingState').classList.add('hidden');
            showEmpty('No image provided');
        } else {
            extractKeypoints(imageDataSource);
        }

        async function extractKeypoints(imageData) {
            try {
                const response = await fetch('/api/keypoints', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: imageData.startsWith('data:') ? imageData : `data:image/png;base64,${imageData}`
                    })
                });

                if (!response.ok) throw new Error('Failed to extract keypoints');
                const data = await response.json();
                displayKeypoints(data);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingState').classList.add('hidden');
                showEmpty(`Failed to extract keypoints: ${error.message}`, 'error');
            }
        }

        function displayKeypoints(data) {
            document.getElementById('loadingState').classList.add('hidden');

            if (!data.keypoints || data.keypoints.length === 0) {
                showEmpty('No keypoints found in this image');
                return;
            }

            document.getElementById('contentContainer').classList.remove('hidden');
            document.getElementById('mainTopic').textContent = data.overview.mainTopic;
            document.getElementById('immediateAnswer').textContent = data.overview.immediateAnswer;

            renderTrailsNav(data.trails);
            renderCards(data.keypoints);
        }

        function renderTrailsNav(trails) {
            const nav = document.getElementById('trailsNav');
            nav.innerHTML = '';

            const allFilter = document.createElement('button');
            allFilter.className = 'btn btn-sm btn-primary';
            allFilter.innerHTML = `all <span class="opacity-70">(${Object.values(trails).reduce((sum, t) => sum + t.count, 0)})</span>`;
            allFilter.onclick = () => filterByTrail('all');
            nav.appendChild(allFilter);

            Object.entries(trails).forEach(([trailName, trail]) => {
                if (trail.count > 0) {
                    const filter = document.createElement('button');
                    filter.className = 'btn btn-sm btn-outline';
                    filter.dataset.trail = trailName;
                    filter.innerHTML = `${trailName} <span class="opacity-70">(${trail.count})</span>`;
                    filter.onclick = () => filterByTrail(trailName);
                    nav.appendChild(filter);
                }
            });
        }

        function renderCards(keypoints) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            keypoints.forEach(kp => {
                const card = document.createElement('div');
                card.className = 'card bg-base-200 border border-base-300 shadow-sm';
                card.dataset.trail = kp.trail;

                let html = `
                    <div class="card-body">
                        <div class="badge badge-outline w-fit">${kp.trail}</div>
                        <div class="text-base font-semibold">${kp.title}</div>
                        <div class="text-sm text-base-content/60">${kp.description}</div>
                        <div class="divider my-1"></div>
                        <div class="text-sm text-primary font-medium">Q: ${kp.obviousQuestion}</div>
                        <div class="p-3 rounded-box bg-base-300 text-sm text-base-content/90">${kp.quickAnswer}</div>
                `;

                if (kp.extractedText) {
                    html += `<div class="text-xs p-3 rounded-box bg-base-300/70 italic text-base-content/70">"${kp.extractedText}"</div>`;
                }

                const priorityBadge = kp.priority === 'critical' ? 'badge-error' :
                    kp.priority === 'high' ? 'badge-warning' :
                    kp.priority === 'medium' ? 'badge-info' : 'badge-ghost';
                html += `<div class="flex gap-2 flex-wrap">`;
                html += `<span class="badge ${priorityBadge}">${kp.priority}</span>`;
                if (kp.needsVerification) html += `<span class="badge badge-warning badge-outline">needs verification</span>`;
                html += `</div>`;

                if (kp.deepDivePrompts && kp.deepDivePrompts.length > 0) {
                    html += `
                        <button class="btn btn-outline btn-sm w-full mt-3" onclick="toggleDeepDive(this)">+ explore deeper</button>
                        <div class="deep-dive-section hidden mt-3">
                            <div class="text-xs uppercase tracking-wide text-base-content/50 mb-2">Dive deeper:</div>
                            <ul class="menu bg-base-300 rounded-box">
                                ${kp.deepDivePrompts.map(prompt => `<li><a>${prompt}</a></li>`).join('')}
                            </ul>
                        </div>
                    `;
                }

                html += `</div>`;
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function filterByTrail(trailName) {
            document.querySelectorAll('#trailsNav button').forEach(f => {
                f.classList.remove('btn-primary');
                f.classList.add('btn-outline');
            });

            if (trailName === 'all') {
                const b = document.querySelector('#trailsNav button');
                b.classList.add('btn-primary');
                b.classList.remove('btn-outline');
            } else {
                const b = document.querySelector(`#trailsNav button[data-trail="${trailName}"]`);
                if (b) {
                    b.classList.add('btn-primary');
                    b.classList.remove('btn-outline');
                }
            }

            document.querySelectorAll('#cardsContainer .card').forEach(card => {
                if (trailName === 'all' || card.dataset.trail === trailName) card.classList.remove('hidden');
                else card.classList.add('hidden');
            });
        }

        function toggleDeepDive(btn) {
            const section = btn.nextElementSibling;
            section.classList.toggle('hidden');
            btn.textContent = section.classList.contains('hidden') ? '+ explore deeper' : '− collapse';
        }
    </script>
</body>
</html>
