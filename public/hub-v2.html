                    </div>`;
                }

                case 'chart_card': {
                    const items = Array.isArray(d.data) ? d.data : [];
                    const maxVal = Math.max(...items.map(i => typeof i.value === 'number' ? i.value : 0), 1);
                    const unit = d.unit || '';
                    const cType = d.chartType || 'bar';

                    let chartHtml = '';

                    if (cType === 'bar') {
                        chartHtml = `<div class="chart-bars">${items.slice(0, 8).map((item, i) => {
                            const pct = Math.round((item.value / maxVal) * 100);
                            const color = item.color || CHART_COLORS[i % CHART_COLORS.length];
                            return `<div class="chart-bar-row">
                                <div class="chart-bar-label">${esc(item.label || '')}</div>
                                <div class="chart-bar-track">
                                    <div class="chart-bar-fill" style="width:${pct}%;background:${color}">
                                        ${pct > 20 ? `<span class="chart-bar-value">${item.value}${unit}</span>` : ''}
                                    </div>
                                </div>
                                ${pct <= 20 ? `<span style="font-size:0.58rem;color:var(--text-secondary);min-width:30px">${item.value}${unit}</span>` : ''}
                            </div>`;
                        }).join('')}</div>`;
                    } else if (cType === 'pie') {
                        const total = items.reduce((s, i) => s + (typeof i.value === 'number' ? i.value : 0), 0) || 1;
                        let cumPct = 0;
                        const segments = items.slice(0, 6).map((item, i) => {
                            const pct = (item.value / total) * 100;
                            const color = item.color || CHART_COLORS[i % CHART_COLORS.length];
                            const start = cumPct;
                            cumPct += pct;
                            return { ...item, pct, color, start };
                        });
                        const gradientStops = segments.map(s => `${s.color} ${s.start}% ${s.start + s.pct}%`).join(', ');
                        chartHtml = `<div class="chart-pie-container">
                            <div class="chart-pie" style="border-radius:50%;background:conic-gradient(${gradientStops})"></div>
                            <div class="chart-legend">${segments.map(s =>
                                `<div class="chart-legend-item">
                                    <span class="chart-legend-dot" style="background:${s.color}"></span>
                                    <span>${esc(s.label)}</span>
                                    <span class="chart-legend-value">${Math.round(s.pct)}%</span>
                                </div>`
                            ).join('')}</div>
                        </div>`;
                    } else if (cType === 'progress') {
                        chartHtml = `<div class="chart-progress-items">${items.slice(0, 6).map((item, i) => {
                            const pct = Math.min(Math.round((item.value / maxVal) * 100), 100);
                            const color = item.color || CHART_COLORS[i % CHART_COLORS.length];
                            return `<div>
                                <div class="chart-progress-label">
                                    <span class="chart-progress-name">${esc(item.label || '')}</span>
                                    <span class="chart-progress-value">${item.value}${unit}</span>
                                </div>
                                <div class="chart-progress-track">
                                    <div class="chart-progress-fill" style="width:${pct}%;background:${color}"></div>
                                </div>
                            </div>`;
                        }).join('')}</div>`;
                    } else {
                        chartHtml = `<div class="chart-bars">${items.slice(0, 8).map((item, i) => {
                            const pct = Math.round((item.value / maxVal) * 100);
                            const color = item.color || CHART_COLORS[i % CHART_COLORS.length];
                            return `<div class="chart-bar-row">
                                <div class="chart-bar-label">${esc(item.label || '')}</div>
                                <div class="chart-bar-track">
                                    <div class="chart-bar-fill" style="width:${pct}%;background:${color}">
                                        ${pct > 20 ? `<span class="chart-bar-value">${item.value}${unit}</span>` : ''}
                                    </div>
                                </div>
                            </div>`;
                        }).join('')}</div>`;
                    }

                    return `<div class="card-inner">
                        ${getCardTypeLabel('chart_card')}
                        <div class="chart-title">${esc(d.title || 'Data')}</div>
                        ${chartHtml}
                        ${d.insight ? `<div class="chart-insight">💡 ${linkify(d.insight)}</div>` : ''}
                    </div>`;
                }

                case 'did_you_know_card': {
                    const hasDykImage = d.imageUrl && typeof d.imageUrl === 'string' && d.imageUrl.startsWith('http');
                    let dykSourceHtml = '';
                    if (d.sourceUrl && typeof d.sourceUrl === 'string' && d.sourceUrl.startsWith('http')) {
                        try {
                            const domain = new URL(d.sourceUrl).hostname;
                            dykSourceHtml = `<div class="dyk-source">Source: ${renderLink(d.sourceUrl, domain)}</div>`;
                        } catch(e) { /* ignore invalid URLs */ }
                    }
                    return `${hasDykImage ? `<div class="dyk-image-wrap">
                        <img class="dyk-image" src="${esc(d.imageUrl)}" alt="" onerror="this.parentElement.style.display='none'">
                        <div class="dyk-image-overlay"></div>
                    </div>` : ''}
                    <div class="card-inner">
                        <div class="dyk-header">
                            <span class="dyk-emoji">${esc(d.emoji || '💡')}</span>
                            <span class="dyk-label">Did you know?</span>
                            ${d.category ? `<span class="dyk-category">${esc(d.category)}</span>` : ''}
                        </div>
                        <div class="dyk-fact">${linkify(d.fact || '')}</div>
                        ${dykSourceHtml}
                    </div>`;
                }

                case 'verification_card': {
                    const vStatus = d.status || 'searching';
                    const isSearching = vStatus === 'searching';
                    const statusIcons = {
                        searching: 'search',
                        partially_verified: 'pending',
                        verified: 'check_circle',
                        denied: 'cancel',
                        unconfirmed: 'help',
                        conflicting: 'warning',
                    };
                    const statusLabels = {
                        searching: 'Searching sources...',
                        partially_verified: 'Partially verified',
                        verified: 'Verified by multiple sources',
                        denied: 'Denied by sources',
                        unconfirmed: 'No confirmation found',
                        conflicting: 'Conflicting reports',
                    };
                    const sourceStatusIcons = {
                        checking: 'hourglass_top',
                        confirmed: 'check_circle',
                        denied: 'cancel',
                        not_yet_reported: 'schedule',
                        no_info: 'remove_circle_outline',
                    };
                    const sourceStatusLabels = {
                        checking: 'Checking...',
                        confirmed: 'Confirms',
                        denied: 'Denies',
                        not_yet_reported: 'Not yet reported',
                        no_info: 'No info found',
                    };

                    return `<div class="card-inner">
                        <div class="verify-header">
                            <div class="verify-icon ${esc(vStatus)}">
                                <span class="material-symbols-rounded">${statusIcons[vStatus] || 'search'}</span>
                            </div>
                            <div class="verify-status-text">
                                <span class="verify-status-label ${esc(vStatus)}">${statusLabels[vStatus] || 'Checking'}</span>
                            </div>
                        </div>
                        ${isSearching ? `<div class="verify-searching-bar"><div class="verify-searching-bar-fill"></div></div>` : ''}
                        <div class="verify-claim">${linkify(d.claim || '')}</div>
                        <div class="verify-sources">
                            ${(d.sources || []).map(src => {
                                const sObj = typeof src === 'object' ? src : { name: String(src), status: 'checking' };
                                const sStatus = sObj.status || 'checking';
                                const hasUrl = sObj.url && typeof sObj.url === 'string' && sObj.url.startsWith('http');
                                return `<div class="verify-source">
                                    <div class="verify-source-status ${esc(sStatus)}">
                                        <span class="material-symbols-rounded">${sourceStatusIcons[sStatus] || 'hourglass_top'}</span>
                                    </div>
                                    <div>
                                        <div class="verify-source-name">${esc(sObj.name || 'Source')}</div>
                                        ${sObj.snippet ? `<div class="verify-source-snippet">${linkify(sObj.snippet)}</div>` : `<div class="verify-source-snippet" style="color:var(--text-muted);font-style:italic">${sourceStatusLabels[sStatus] || 'Checking...'}</div>`}
                                        ${hasUrl ? `<a href="${esc(sObj.url)}" target="_blank" rel="noopener noreferrer" class="verify-source-link">${esc(new URL(sObj.url).hostname)}</a>` : ''}
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                        ${d.summary ? `<div class="verify-summary">${linkify(d.summary)}</div>` : ''}
                        ${d.lastChecked ? `<div class="verify-last-checked">Last checked: ${esc(d.lastChecked)}</div>` : ''}
                    </div>`;
                }

                default:
                    return `<div class="card-inner">
                        ${getCardTypeLabel(cardType)}
                        ${Object.entries(d).filter(([k]) => !k.startsWith('_')).map(([key, val]) => {
                            if (val === null || val === undefined) return '';
                            if (Array.isArray(val)) {
                                return `<div style="margin-bottom:5px">
                                    <div style="font-size:0.62rem;font-weight:700;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:0.08em">${esc(key.replace(/_/g, ' '))}</div>
                                    ${val.slice(0, 5).map(v => `<div style="font-size:0.72rem;color:var(--text);padding:2px 0 2px 8px;border-left:2px solid var(--border)">${renderItemValue(v)}</div>`).join('')}
                                </div>`;
                            }
                            if (typeof val === 'object') {
                                return `<div style="margin-bottom:5px">
                                    <div style="font-size:0.62rem;font-weight:700;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:0.08em">${esc(key.replace(/_/g, ' '))}</div>
                                    <div style="font-size:0.72rem;color:var(--text)">${renderItemValue(val)}</div>
                                </div>`;
                            }
                            return `<div style="margin-bottom:5px">
                                <div style="font-size:0.62rem;font-weight:700;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:0.08em">${esc(key.replace(/_/g, ' '))}</div>
                                <div style="font-size:0.72rem;color:var(--text)">${linkify(val)}</div>
                            </div>`;
                        }).join('')}
                    </div>`;
            }
        }

        // === Error & Reset ===
        function showError(message) {
            errorText.textContent = message;
            errorState.classList.add('active');
            progressOverlay.classList.remove('active');
        }

        function reset() {
            if (currentImageUrl) {
                URL.revokeObjectURL(currentImageUrl);
                currentImageUrl = null;
            }
            currentImageBase64 = null;
            totalCards = 0;
            completedCards = 0;
            blueprintReceived = false;
            pipelineComplete = false;
            firstCardShown = false;
            pendingBlueprint = null;
            populatedCardIds.clear();
            retryCount = 0;
            if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
            if (completionTimeout) { clearTimeout(completionTimeout); completionTimeout = null; }
            if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
            if (enhanceMsgInterval) { clearInterval(enhanceMsgInterval); enhanceMsgInterval = null; }
            if (uploadProgressInterval) { clearInterval(uploadProgressInterval); uploadProgressInterval = null; }
            stopAnalysisProgressTick();
            if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

            pasteState.classList.remove('hidden');
            mainCanvas.classList.remove('active');
            screenshotLayer.className = 'screenshot-layer';
            progressOverlay.classList.remove('active', 'uploading', 'analyzing', 'ready', 'hiding');
            progressRing.classList.remove('complete');
            updateProgress(0, 'UPLOADING', 'Sending screenshot...');
            resultsOverlay.classList.remove('visible');
            errorState.classList.remove('active');
            cardGrid.innerHTML = '';
            cardGrid.classList.remove('single-card');
            contentAnalysisEl.style.display = 'none';
            followUpSection.style.display = 'none';
            followUpList.innerHTML = '';
            layoutProgress.style.display = '';
            layoutProgressFill.style.width = '0%';
        }

        // === Event Listeners ===
        pasteZone.addEventListener('click', readClipboard);
        retryBtn.addEventListener('click', reset);
        layoutBack.addEventListener('click', reset);

        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    handleImage(item.getAsFile());
                    return;
                }
            }
        });

        document.addEventListener('dragover', (e) => { e.preventDefault(); });
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer?.files?.[0];
            if (file && file.type.startsWith('image/')) {
                handleImage(file);
            }
        });

        if (navigator.clipboard?.read) {
            navigator.permissions?.query?.({ name: 'clipboard-read' })
                .then(r => { if (r.state === 'granted') readClipboard(); })
                .catch(() => {});
        }

        // === Example Images ===
        const EXAMPLE_IMAGES = [
            {
                label: 'WhatsApp Chat',
                category: 'messaging',
                thumbUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Image_in_a_spanish_whatsapp_chat.jpg/150px-Image_in_a_spanish_whatsapp_chat.jpg',
                fullUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Image_in_a_spanish_whatsapp_chat.jpg/640px-Image_in_a_spanish_whatsapp_chat.jpg',
            },
            {
                label: 'Instagram Post',
                category: 'social',
                thumbUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Example_Instagram_CC_licence.png/150px-Example_Instagram_CC_licence.png',
                fullUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Example_Instagram_CC_licence.png/640px-Example_Instagram_CC_licence.png',
            },
            {
                label: 'Emergency Alert',
                category: 'alert',
                thumbUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Alerta_SAE_Rengo_20240204-0109.png/150px-Alerta_SAE_Rengo_20240204-0109.png',

                fullUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Dad_joke.jpg/640px-Dad_joke.jpg',

            {
                label: 'Phone Settings',
                category: 'android',
                thumbUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Asus_ZC500TG-1A024TW_about-the-mobile-phone_screenshot_20151021.png/150px-Asus_ZC500TG-1A024TW_about-the-mobile-phone_screenshot_20151021.png',
                fullUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Asus_ZC500TG-1A024TW_about-the-mobile-phone_screenshot_20151021.png/640px-Asus_ZC500TG-1A024TW_about-the-mobile-phone_screenshot_20151021.png',

            },
        ];

        function renderExampleCards() {
            const grid = document.getElementById('examplesGrid');
            EXAMPLE_IMAGES.forEach((example, i) => {
                const card = document.createElement('div');
                card.className = 'example-card';
                card.dataset.index = i;
                const thumbProxy = '/api/example-image?url=' + encodeURIComponent(example.thumbUrl);
                card.innerHTML = `
                    <div class="example-thumb">
                        <img src="${esc(thumbProxy)}" alt="${esc(example.label)}" loading="lazy"
                             onerror="this.style.display='none';this.parentElement.innerHTML='<span class=\\'material-symbols-rounded\\'>image</span>'">
                    </div>
                    <span class="example-label">${esc(example.label)}</span>
                    <span class="example-category">${esc(example.category)}</span>
                `;
                card.addEventListener('click', () => loadExampleImage(i, card));
                grid.appendChild(card);
            });
        }

        async function loadExampleImage(index, cardEl) {
            const example = EXAMPLE_IMAGES[index];
            if (!example) return;

            cardEl.classList.add('loading');

            try {
                const proxyUrl = '/api/example-image?url=' + encodeURIComponent(example.fullUrl);
                const resp = await fetch(proxyUrl);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const blob = await resp.blob();
                if (!blob.type.startsWith('image/')) {
                    throw new Error('Not an image');
                }
                handleImage(blob);
            } catch (err) {
                cardEl.classList.remove('loading');
                showError('Could not load example image. Please try another or paste your own screenshot.');
            }
        }

        renderExampleCards();
    </script>
</body>
</html>
