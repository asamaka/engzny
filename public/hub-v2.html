<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>thinx.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --md-bg: #0f1318;
            --md-surface: #1a1f27;
            --md-surface-variant: #222830;
            --md-surface-bright: #2a3140;
            --md-surface-container: #1e2430;
            --md-surface-container-high: #283040;
            --md-on-surface: #e2e6ed;
            --md-on-surface-variant: #8b95a5;
            --md-outline: #3a4250;
            --md-outline-variant: #2c3340;
            --md-primary: #7cacf8;
            --md-primary-container: #1a3560;
            --md-on-primary: #002f65;
            --md-on-primary-container: #d4e3ff;
            --md-secondary: #b8c6dc;
            --md-secondary-container: #3a4758;
            --md-tertiary: #d4bde6;
            --md-tertiary-container: #4a3560;
            --md-error: #ffb4ab;
            --md-error-container: #93000a;
            --md-success: #7dd99a;
            --md-success-container: #1a4028;
            --md-warning: #f5c842;
            --md-warning-container: #4a3800;
            --md-info: #7cacf8;
            --md-radius-xs: 4px;
            --md-radius-sm: 8px;
            --md-radius-md: 12px;
            --md-radius-lg: 16px;
            --md-radius-xl: 28px;
            --md-elevation-1: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
            --md-elevation-2: 0 3px 6px rgba(0,0,0,0.32), 0 3px 6px rgba(0,0,0,0.23);
            --md-elevation-3: 0 10px 20px rgba(0,0,0,0.35), 0 6px 6px rgba(0,0,0,0.23);
            --md-elevation-4: 0 14px 28px rgba(0,0,0,0.4), 0 10px 10px rgba(0,0,0,0.22);
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--md-bg);
            color: var(--md-on-surface);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* === PASTE STATE === */
        #pasteState {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
            background: var(--md-bg);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #pasteState.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .paste-zone {
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            border: 2px dashed var(--md-outline);
            border-radius: var(--md-radius-xl);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--md-surface);
        }

        .paste-zone:hover, .paste-zone:active {
            border-color: var(--md-primary);
            background: var(--md-primary-container);
            transform: scale(1.02);
            box-shadow: var(--md-elevation-2);
        }

        .paste-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--md-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .paste-icon .material-symbols-rounded {
            font-size: 32px;
            color: var(--md-primary);
        }

        .paste-zone:hover .paste-icon {
            background: var(--md-primary);
        }

        .paste-zone:hover .paste-icon .material-symbols-rounded {
            color: var(--md-on-primary);
        }

        .paste-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--md-on-surface);
        }

        .paste-hint {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--md-on-surface-variant);
            letter-spacing: 0.01em;
        }

        /* === MAIN CANVAS === */
        #mainCanvas {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: none;
        }

        #mainCanvas.active { display: block; }

        .screenshot-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screenshot-layer img {
            max-width: 92%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: var(--md-radius-lg);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screenshot-layer.scanning img {
            opacity: 1;
            filter: brightness(0.85);
        }

        .screenshot-layer.fading { opacity: 0.06; }
        .screenshot-layer.gone { opacity: 0; pointer-events: none; }

        .scan-line {
            position: fixed;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--md-primary), transparent);
            box-shadow: 0 0 24px var(--md-primary), 0 0 60px rgba(124,172,248,0.2);
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .scan-line.active {
            opacity: 1;
            animation: scanMove 2.5s ease-in-out infinite;
        }

        @keyframes scanMove {
            0% { top: 8%; }
            50% { top: 88%; }
            100% { top: 8%; }
        }

        .scan-corners {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .scan-corners.active { opacity: 1; }

        .scan-corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: var(--md-primary);
            border-style: solid;
            border-width: 0;
            border-radius: 4px;
        }

        .scan-corner.tl { top: 7%; left: 4%; border-top-width: 3px; border-left-width: 3px; }
        .scan-corner.tr { top: 7%; right: 4%; border-top-width: 3px; border-right-width: 3px; }
        .scan-corner.bl { bottom: 10%; left: 4%; border-bottom-width: 3px; border-left-width: 3px; }
        .scan-corner.br { bottom: 10%; right: 4%; border-bottom-width: 3px; border-right-width: 3px; }

        /* === STATUS BAR === */
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 16px 20px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            background: linear-gradient(transparent, rgba(15,19,24,0.96) 30%);
            display: none;
        }

        .status-bar.active { display: block; }

        .status-progress {
            width: 100%;
            height: 4px;
            background: var(--md-surface-variant);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .status-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--md-primary), var(--md-tertiary));
            border-radius: 4px;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-text {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--md-primary);
            text-transform: uppercase;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* === RESULTS OVERLAY === */
        .results-overlay {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding-bottom: 80px;
        }

        .results-overlay.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* === HEADER === */
        .layout-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 19, 24, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--md-outline-variant);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .layout-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .layout-back {
            background: none;
            border: none;
            color: var(--md-on-surface-variant);
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            padding: 6px 8px;
            border-radius: var(--md-radius-sm);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .layout-back:hover {
            color: var(--md-primary);
            background: var(--md-primary-container);
        }

        .layout-badge {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 4px 12px;
            border-radius: var(--md-radius-xl);
            background: var(--md-primary-container);
            color: var(--md-primary);
        }

        .layout-progress {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .layout-progress-bar {
            width: 80px;
            height: 4px;
            background: var(--md-surface-variant);
            border-radius: 4px;
            overflow: hidden;
        }

        .layout-progress-fill {
            height: 100%;
            background: var(--md-primary);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .layout-progress-text {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--md-on-surface-variant);
        }

        /* === CONTENT ANALYSIS === */
        .content-analysis {
            padding: 20px 16px;
            background: linear-gradient(180deg, var(--md-surface) 0%, transparent 100%);
        }

        .content-analysis-intent {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--md-on-surface);
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .top-questions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .top-question {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 6px 14px;
            background: var(--md-surface-variant);
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-radius-xl);
            color: var(--md-secondary);
            cursor: default;
            transition: all 0.2s ease;
        }

        .top-question:hover {
            background: var(--md-surface-bright);
            border-color: var(--md-outline);
        }

        /* === CARD GRID === */
        .card-grid {
            padding: 12px;
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr;
        }

        .card-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .card-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

        @media (max-width: 640px) {
            .card-grid.cols-2, .card-grid.cols-3 { grid-template-columns: 1fr; }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .card-grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
        }

        .card-grid .span-full { grid-column: 1 / -1; }
        .card-grid .span-2 { grid-column: span 2; }
        @media (max-width: 640px) {
            .card-grid .span-2 { grid-column: span 1; }
        }

        /* === CARD BASE === */
        .card {
            background: var(--md-surface);
            border-radius: var(--md-radius-lg);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(16px) scale(0.97);
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.3s ease;
            box-shadow: var(--md-elevation-1);
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card:hover {
            box-shadow: var(--md-elevation-2);
        }

        .card.loading {
            min-height: 100px;
        }

        .card.loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(124,172,248,0.04) 35%,
                rgba(124,172,248,0.08) 50%,
                rgba(124,172,248,0.04) 65%,
                transparent 100%
            );
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .card.populated {
            animation: cardPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPop {
            from { transform: scale(0.95); opacity: 0.6; }
            60% { transform: scale(1.015); }
            to { transform: scale(1); opacity: 1; }
        }

        .card.just-populated {
            box-shadow: var(--md-elevation-3), 0 0 0 1px rgba(124,172,248,0.2);
        }

        .card-inner { padding: 20px; }

        .card-type-label {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--md-on-surface-variant);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-type-icon {
            width: 28px;
            height: 28px;
            border-radius: var(--md-radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-type-icon .material-symbols-rounded {
            font-size: 16px;
        }

        /* === HERO SUMMARY === */
        .card-hero { background: linear-gradient(135deg, var(--md-surface) 0%, var(--md-surface-variant) 100%); }
        .card-hero .card-inner { padding: 24px 20px; }

        .card-hero .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 5px 14px;
            border-radius: var(--md-radius-xl);
            background: var(--md-primary-container);
            color: var(--md-primary);
            margin-bottom: 14px;
        }

        .card-hero .hero-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        .card-hero .hero-subtitle {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--md-on-surface-variant);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .card-hero .hero-takeaway {
            font-size: 0.88rem;
            color: var(--md-on-surface);
            line-height: 1.65;
            padding: 14px 16px;
            background: var(--md-surface-container);
            border-radius: var(--md-radius-md);
            border-left: 4px solid var(--md-primary);
        }

        /* === KEY METRIC === */
        .card-metric .card-inner {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .card-metric .metric-value {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--md-primary);
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin: 4px 0;
        }

        .card-metric .metric-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--md-on-surface-variant);
            margin-top: 4px;
        }

        .card-metric .metric-context {
            font-size: 0.78rem;
            color: var(--md-on-surface-variant);
            margin-top: 10px;
            padding: 8px 12px;
            background: var(--md-surface-variant);
            border-radius: var(--md-radius-sm);
            line-height: 1.4;
            width: 100%;
        }

        .card-metric .metric-trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--md-radius-xl);
            margin-top: 8px;
        }

        .card-metric .metric-trend.up { background: var(--md-success-container); color: var(--md-success); }
        .card-metric .metric-trend.down { background: var(--md-error-container); color: var(--md-error); }
        .card-metric .metric-trend.stable { background: rgba(124,172,248,0.15); color: var(--md-info); }

        /* === INFO LIST === */
        .card-list .list-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
        }

        .card-list .list-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px solid var(--md-outline-variant);
            font-size: 0.84rem;
            gap: 12px;
        }

        .card-list .list-item:last-child { border-bottom: none; }

        .card-list .list-item-label {
            color: var(--md-on-surface-variant);
            flex-shrink: 0;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-list .list-item-icon {
            font-size: 1rem;
        }

        .card-list .list-item-value {
            color: var(--md-on-surface);
            text-align: right;
            word-break: break-word;
            font-weight: 400;
        }

        .card-list .list-item.highlight .list-item-value {
            color: var(--md-primary);
            font-weight: 600;
        }

        /* === FACT CHECK === */
        .card-fact-check .fact-claim {
            font-size: 0.88rem;
            color: var(--md-on-surface);
            line-height: 1.6;
            padding: 14px 16px;
            background: var(--md-surface-variant);
            border-radius: var(--md-radius-md);
            margin-bottom: 14px;
            font-style: italic;
        }

        .card-fact-check .fact-verdict {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 6px 14px;
            border-radius: var(--md-radius-xl);
            margin-bottom: 12px;
        }

        .fact-verdict.verified { background: var(--md-success-container); color: var(--md-success); }
        .fact-verdict.misleading { background: var(--md-warning-container); color: var(--md-warning); }
        .fact-verdict.false { background: var(--md-error-container); color: var(--md-error); }
        .fact-verdict.unverified { background: rgba(124,172,248,0.15); color: var(--md-info); }
        .fact-verdict.partially_true { background: var(--md-warning-container); color: var(--md-warning); }
        .fact-verdict.needs_context { background: rgba(212,189,230,0.15); color: var(--md-tertiary); }

        .card-fact-check .fact-explanation {
            font-size: 0.84rem;
            color: var(--md-on-surface);
            line-height: 1.6;
        }

        .card-fact-check .fact-confidence {
            font-size: 0.72rem;
            color: var(--md-on-surface-variant);
            margin-top: 10px;
        }

        /* === PERSON CARD === */
        .card-person .person-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .card-person .person-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--md-primary-container), var(--md-tertiary-container));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--md-primary);
            flex-shrink: 0;
        }

        .card-person .person-name {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }

        .card-person .person-role {
            font-size: 0.78rem;
            color: var(--md-on-surface-variant);
            margin-top: 2px;
        }

        .card-person .person-handle {
            font-size: 0.78rem;
            color: var(--md-primary);
            margin-top: 1px;
        }

        .card-person .person-context {
            font-size: 0.84rem;
            color: var(--md-on-surface);
            line-height: 1.6;
        }

        .card-person .person-details {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-person .person-detail-item {
            font-size: 0.78rem;
            color: var(--md-on-surface-variant);
            padding: 4px 0;
            padding-left: 12px;
            border-left: 2px solid var(--md-outline-variant);
        }

        /* === PRODUCT CARD === */
        .card-product {
            background: linear-gradient(135deg, var(--md-surface) 0%, rgba(26,64,40,0.2) 100%);
        }

        .card-product .product-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .card-product .product-price {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--md-success);
            margin-bottom: 10px;
        }

        .card-product .product-rating {
            font-size: 0.8rem;
            color: var(--md-warning);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-product .product-features {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .card-product .product-features li {
            font-size: 0.78rem;
            color: var(--md-on-surface);
            padding: 6px 14px;
            background: var(--md-surface-variant);
            border-radius: var(--md-radius-xl);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-product .product-features li::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--md-success);
            flex-shrink: 0;
        }

        .card-product .product-verdict {
            font-size: 0.84rem;
            color: var(--md-on-surface);
            line-height: 1.6;
            padding: 14px 16px;
            background: var(--md-surface-container);
            border-radius: var(--md-radius-md);
            border-left: 4px solid var(--md-success);
            margin-bottom: 12px;
        }

        .card-product .product-warnings {
            list-style: none;
            margin-top: 8px;
        }

        .card-product .product-warnings li {
            font-size: 0.78rem;
            color: var(--md-warning);
            padding: 6px 0;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .card-product .product-warnings li::before {
            content: '!';
            font-weight: 700;
            font-size: 0.65rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--md-warning-container);
            color: var(--md-warning);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* === TIMELINE === */
        .card-timeline .timeline-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
        }

        .card-timeline .timeline-event {
            display: flex;
            gap: 14px;
            padding: 10px 0;
            font-size: 0.82rem;
            position: relative;
        }

        .card-timeline .timeline-event::before {
            content: '';
            position: absolute;
            left: 57px;
            top: 28px;
            bottom: -10px;
            width: 2px;
            background: var(--md-outline-variant);
            border-radius: 1px;
        }

        .card-timeline .timeline-event:last-child::before { display: none; }

        .card-timeline .timeline-date {
            color: var(--md-primary);
            min-width: 50px;
            flex-shrink: 0;
            text-align: right;
            font-weight: 500;
        }

        .card-timeline .timeline-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--md-outline);
            margin-top: 5px;
            flex-shrink: 0;
            z-index: 1;
            border: 2px solid var(--md-surface);
        }

        .card-timeline .timeline-event.highlight .timeline-dot {
            background: var(--md-primary);
            box-shadow: 0 0 8px rgba(124,172,248,0.4);
        }

        .card-timeline .timeline-text { color: var(--md-on-surface); line-height: 1.5; }

        /* === QUOTE === */
        .card-quote {
            background: linear-gradient(135deg, var(--md-surface) 0%, rgba(74,53,96,0.2) 100%);
        }

        .card-quote .quote-text {
            font-size: 1rem;
            color: var(--md-on-surface);
            line-height: 1.7;
            font-style: italic;
            padding: 16px 20px;
            border-left: 4px solid var(--md-tertiary);
            background: var(--md-surface-variant);
            border-radius: 0 var(--md-radius-md) var(--md-radius-md) 0;
        }

        .card-quote .quote-attribution {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--md-tertiary);
            margin-top: 12px;
        }

        .card-quote .quote-context {
            font-size: 0.78rem;
            color: var(--md-on-surface-variant);
            margin-top: 6px;
            line-height: 1.5;
        }

        /* === COMPARISON === */
        .card-comparison .comparison-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
        }

        .card-comparison table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.8rem;
        }

        .card-comparison th {
            text-align: left;
            padding: 10px 12px;
            color: var(--md-primary);
            font-weight: 600;
            background: var(--md-surface-variant);
        }

        .card-comparison th:first-child { border-radius: var(--md-radius-sm) 0 0 0; }
        .card-comparison th:last-child { border-radius: 0 var(--md-radius-sm) 0 0; }

        .card-comparison td {
            padding: 10px 12px;
            color: var(--md-on-surface);
            border-bottom: 1px solid var(--md-outline-variant);
        }

        .card-comparison tr:last-child td { border-bottom: none; }
        .card-comparison tr:hover td { background: var(--md-surface-variant); }

        /* === WARNING === */
        .card-warning { border-left: 4px solid var(--md-warning); }
        .card-warning.level-critical { border-left-color: var(--md-error); }

        .card-warning .warning-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .card-warning .warning-icon-wrap {
            width: 36px;
            height: 36px;
            border-radius: var(--md-radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--md-warning-container);
            flex-shrink: 0;
        }

        .card-warning .warning-icon-wrap .material-symbols-rounded { color: var(--md-warning); font-size: 20px; }
        .card-warning.level-critical .warning-icon-wrap { background: var(--md-error-container); }
        .card-warning.level-critical .warning-icon-wrap .material-symbols-rounded { color: var(--md-error); }

        .card-warning .warning-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--md-warning);
        }

        .card-warning.level-critical .warning-title { color: var(--md-error); }

        .card-warning .warning-details {
            font-size: 0.84rem;
            color: var(--md-on-surface);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .card-warning .warning-advice {
            font-size: 0.8rem;
            color: var(--md-on-surface);
            padding: 12px 16px;
            background: var(--md-surface-variant);
            border-radius: var(--md-radius-md);
            line-height: 1.5;
        }

        /* === ACTION CARD === */
        .card-action .action-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
        }

        .card-action .action-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--md-outline-variant);
        }

        .card-action .action-item:last-child { border-bottom: none; }

        .card-action .action-bullet {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--md-primary-container);
            color: var(--md-primary);
            font-size: 0.72rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .card-action .action-label {
            font-size: 0.88rem;
            color: var(--md-on-surface);
            font-weight: 600;
        }

        .card-action .action-desc {
            font-size: 0.78rem;
            color: var(--md-on-surface-variant);
            margin-top: 4px;
            line-height: 1.5;
        }

        .card-action .action-priority {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 8px;
            border-radius: var(--md-radius-xl);
            margin-top: 6px;
        }

        .action-priority.high { background: var(--md-error-container); color: var(--md-error); }
        .action-priority.medium { background: var(--md-warning-container); color: var(--md-warning); }
        .action-priority.low { background: rgba(124,172,248,0.15); color: var(--md-info); }

        /* === TEXT EXTRACT === */
        .card-extract .extract-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
        }

        .card-extract .extract-text {
            font-size: 0.84rem;
            color: var(--md-on-surface);
            line-height: 1.7;
            padding: 16px;
            background: var(--md-surface-variant);
            border-radius: var(--md-radius-md);
            border-left: 3px solid var(--md-outline);
            white-space: pre-wrap;
            font-family: 'Inter', sans-serif;
        }

        .card-extract .extract-source {
            font-size: 0.72rem;
            color: var(--md-on-surface-variant);
            margin-top: 8px;
        }

        /* === LOCATION === */
        .card-location .location-name {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .card-location .location-address {
            font-size: 0.8rem;
            color: var(--md-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-location .location-context {
            font-size: 0.84rem;
            color: var(--md-on-surface);
            line-height: 1.6;
        }

        .card-location .location-details {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-location .location-detail-item {
            font-size: 0.78rem;
            color: var(--md-on-surface-variant);
            padding: 4px 0 4px 12px;
            border-left: 2px solid var(--md-outline-variant);
        }

        /* === ERROR STATE === */
        #errorState {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
            background: var(--md-bg);
            padding: 2rem;
            text-align: center;
        }

        #errorState.active { display: flex; }

        .error-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--md-error-container);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .error-icon .material-symbols-rounded { font-size: 32px; color: var(--md-error); }

        .error-text {
            color: var(--md-error);
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .retry-btn {
            padding: 12px 32px;
            background: var(--md-surface);
            border: 1px solid var(--md-outline);
            border-radius: var(--md-radius-xl);
            color: var(--md-on-surface);
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .retry-btn:hover {
            background: var(--md-primary-container);
            border-color: var(--md-primary);
            color: var(--md-primary);
        }

        /* === PLACEHOLDERS === */
        .placeholder-line {
            height: 14px;
            background: var(--md-surface-variant);
            border-radius: var(--md-radius-sm);
            margin-bottom: 10px;
        }
        .placeholder-line.short { width: 55%; }
        .placeholder-line.medium { width: 78%; }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
    </style>
</head>
<body>
    <!-- Paste State -->
    <div id="pasteState">
        <div class="paste-zone" id="pasteZone">
            <div class="paste-icon">
                <span class="material-symbols-rounded">content_paste</span>
            </div>
            <span class="paste-text">Tap to paste screenshot</span>
        </div>
        <p class="paste-hint">or press Ctrl+V / Cmd+V</p>
    </div>

    <!-- Main Canvas -->
    <div id="mainCanvas">
        <div class="screenshot-layer" id="screenshotLayer">
            <img id="screenshotImg" alt="">
        </div>

        <div class="scan-line" id="scanLine"></div>

        <div class="scan-corners" id="scanCorners">
            <div class="scan-corner tl"></div>
            <div class="scan-corner tr"></div>
            <div class="scan-corner bl"></div>
            <div class="scan-corner br"></div>
        </div>

        <div class="results-overlay" id="resultsOverlay">
            <div class="layout-header">
                <div class="layout-header-left">
                    <button class="layout-back" id="layoutBack">
                        <span class="material-symbols-rounded" style="font-size:18px">arrow_back</span>
                        New
                    </button>
                    <span class="layout-badge" id="layoutBadge"></span>
                </div>
                <div class="layout-progress" id="layoutProgress">
                    <div class="layout-progress-bar">
                        <div class="layout-progress-fill" id="layoutProgressFill"></div>
                    </div>
                    <span class="layout-progress-text" id="layoutProgressText"></span>
                </div>
            </div>
            <div class="content-analysis" id="contentAnalysis" style="display:none;">
                <div class="content-analysis-intent" id="analysisIntent"></div>
                <div class="top-questions" id="topQuestions"></div>
            </div>
            <div class="card-grid" id="cardGrid"></div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
        <div class="status-progress">
            <div class="status-progress-fill" id="statusProgressFill"></div>
        </div>
        <div class="status-text" id="statusText">initializing</div>
    </div>

    <!-- Error State -->
    <div id="errorState">
        <div class="error-icon">
            <span class="material-symbols-rounded">error</span>
        </div>
        <p class="error-text" id="errorText">something went wrong</p>
        <button class="retry-btn" id="retryBtn">Try Again</button>
    </div>

    <script>
        const pasteState = document.getElementById('pasteState');
        const mainCanvas = document.getElementById('mainCanvas');
        const screenshotLayer = document.getElementById('screenshotLayer');
        const screenshotImg = document.getElementById('screenshotImg');
        const scanLine = document.getElementById('scanLine');
        const scanCorners = document.getElementById('scanCorners');
        const resultsOverlay = document.getElementById('resultsOverlay');
        const statusBar = document.getElementById('statusBar');
        const statusProgressFill = document.getElementById('statusProgressFill');
        const statusText = document.getElementById('statusText');
        const layoutBadge = document.getElementById('layoutBadge');
        const layoutProgressFill = document.getElementById('layoutProgressFill');
        const layoutProgressText = document.getElementById('layoutProgressText');
        const contentAnalysisEl = document.getElementById('contentAnalysis');
        const analysisIntent = document.getElementById('analysisIntent');
        const topQuestionsEl = document.getElementById('topQuestions');
        const cardGrid = document.getElementById('cardGrid');
        const errorText = document.getElementById('errorText');
        const retryBtn = document.getElementById('retryBtn');
        const layoutBack = document.getElementById('layoutBack');
        const layoutProgress = document.getElementById('layoutProgress');
        const errorState = document.getElementById('errorState');
        const pasteZone = document.getElementById('pasteZone');

        let currentImageUrl = null;
        let currentImageBase64 = null;
        let totalCards = 0;
        let completedCards = 0;

        // === Utilities ===
        function esc(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'object') {
                if (Array.isArray(val)) return val.map(v => esc(v)).join(', ');
                const meaningful = val.label || val.name || val.value || val.text || val.title || val.header || val.event || val.description;
                if (meaningful) return esc(meaningful);
                return esc(JSON.stringify(val));
            }
            const d = document.createElement('div');
            d.textContent = String(val);
            return d.innerHTML;
        }

        function renderItemValue(item) {
            if (typeof item === 'string') return esc(item);
            if (typeof item === 'object' && item !== null) {
                const parts = [];
                if (item.label || item.name) parts.push(`<strong>${esc(item.label || item.name)}</strong>`);
                if (item.value) parts.push(esc(item.value));
                if (item.description) parts.push(`<span style="color:var(--md-on-surface-variant)">${esc(item.description)}</span>`);
                if (parts.length) return parts.join(': ');
                return esc(item);
            }
            return esc(item);
        }

        const CARD_ICONS = {
            hero_summary: { icon: 'auto_awesome', bg: 'var(--md-primary-container)', color: 'var(--md-primary)' },
            key_metric: { icon: 'monitoring', bg: 'var(--md-primary-container)', color: 'var(--md-primary)' },
            info_list: { icon: 'list_alt', bg: 'var(--md-surface-bright)', color: 'var(--md-secondary)' },
            fact_check: { icon: 'fact_check', bg: 'var(--md-warning-container)', color: 'var(--md-warning)' },
            person_card: { icon: 'person', bg: 'rgba(212,189,230,0.15)', color: 'var(--md-tertiary)' },
            product_card: { icon: 'shopping_bag', bg: 'var(--md-success-container)', color: 'var(--md-success)' },
            timeline_card: { icon: 'timeline', bg: 'rgba(124,172,248,0.15)', color: 'var(--md-info)' },
            quote_card: { icon: 'format_quote', bg: 'rgba(212,189,230,0.15)', color: 'var(--md-tertiary)' },
            comparison_card: { icon: 'compare', bg: 'var(--md-surface-bright)', color: 'var(--md-secondary)' },
            warning_card: { icon: 'warning', bg: 'var(--md-warning-container)', color: 'var(--md-warning)' },
            action_card: { icon: 'bolt', bg: 'var(--md-primary-container)', color: 'var(--md-primary)' },
            text_extract: { icon: 'description', bg: 'var(--md-surface-bright)', color: 'var(--md-secondary)' },
            location_card: { icon: 'location_on', bg: 'rgba(124,172,248,0.15)', color: 'var(--md-info)' },
        };

        function getCardTypeLabel(cardType) {
            const info = CARD_ICONS[cardType] || { icon: 'info', bg: 'var(--md-surface-bright)', color: 'var(--md-secondary)' };
            return `<div class="card-type-label">
                <div class="card-type-icon" style="background:${info.bg}">
                    <span class="material-symbols-rounded" style="color:${info.color}">${info.icon}</span>
                </div>
                ${cardType.replace(/_/g, ' ')}
            </div>`;
        }

        // === Image Handling ===
        async function readClipboard() {
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    const imageType = item.types.find(t => t.startsWith('image/'));
                    if (imageType) {
                        const blob = await item.getType(imageType);
                        handleImage(blob);
                        return;
                    }
                }
                showError('No image found in clipboard');
            } catch (err) {
                if (err.name === 'NotAllowedError') {
                    showError('Clipboard access denied');
                } else {
                    showError('Could not read clipboard');
                }
            }
        }

        function handleImage(blob) {
            currentImageUrl = URL.createObjectURL(blob);
            screenshotImg.src = currentImageUrl;
            pasteState.classList.add('hidden');
            mainCanvas.classList.add('active');
            screenshotLayer.className = 'screenshot-layer scanning';
            scanLine.classList.add('active');
            scanCorners.classList.add('active');
            statusBar.classList.add('active');
            statusProgressFill.style.width = '5%';
            statusText.textContent = 'analyzing screenshot';

            const reader = new FileReader();
            reader.onloadend = () => {
                currentImageBase64 = reader.result;
                startPipeline(currentImageBase64);
            };
            reader.readAsDataURL(blob);
        }

        // === Telemetry ===
        const telemetry = {
            pipelineStart: null,
            uploadStart: null,
            uploadEnd: null,
            firstEventAt: null,
            eventsReceived: [],
            requestId: null,

            reset() {
                this.pipelineStart = Date.now();
                this.uploadStart = null;
                this.uploadEnd = null;
                this.firstEventAt = null;
                this.eventsReceived = [];
                this.requestId = null;
            },

            markUploadStart() { this.uploadStart = Date.now(); },
            markUploadEnd() { this.uploadEnd = Date.now(); },

            trackEvent(event) {
                const now = Date.now();
                if (!this.firstEventAt) this.firstEventAt = now;
                const elapsed = now - (this.pipelineStart || now);
                this.eventsReceived.push({ event, elapsed });
            },

            _buildPayload(extra = {}) {
                const now = Date.now();
                return {
                    requestId: this.requestId,
                    url: location.href,
                    userAgent: navigator.userAgent,
                    screen: `${screen.width}x${screen.height}`,
                    connection: navigator.connection ? {
                        type: navigator.connection.effectiveType,
                        downlink: navigator.connection.downlink,
                        rtt: navigator.connection.rtt,
                    } : null,
                    totalDuration: this.pipelineStart ? now - this.pipelineStart : null,
                    uploadDuration: (this.uploadStart && this.uploadEnd) ? this.uploadEnd - this.uploadStart : null,
                    firstEventDelay: (this.pipelineStart && this.firstEventAt) ? this.firstEventAt - this.pipelineStart : null,
                    eventsReceived: this.eventsReceived,
                    retries: retryCount,
                    state: {
                        blueprintReceived,
                        pipelineComplete,
                        totalCards,
                        completedCards,
                    },
                    ...extra,
                };
            },

            reportError(message, extra = {}) {
                const payload = { ...this._buildPayload(extra), message, outcome: 'error' };
                fetch('/api/debug/client-error', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportSuccess() {
                const payload = { ...this._buildPayload(), outcome: 'success' };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportOutcome(outcome, error = null) {
                const payload = { ...this._buildPayload(), outcome, error };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },
        };

        // === Pipeline ===
        let blueprintReceived = false;
        let pipelineComplete = false;
        let pipelineTimeout = null;
        let completionTimeout = null;
        let stallTimer = null;
        let lastEventTime = 0;
        let retryCount = 0;
        const MAX_RETRIES = 2;

        function resetStallTimer() {
            lastEventTime = Date.now();
            if (stallTimer) clearTimeout(stallTimer);
            if (pipelineComplete) return;
            stallTimer = setTimeout(() => {
                if (!pipelineComplete && blueprintReceived) {
                    const stallDuration = Date.now() - lastEventTime;
                    telemetry.reportError(`SSE stall detected (${Math.round(stallDuration/1000)}s)`, {
                        type: 'sse_stall',
                        completedCards,
                        totalCards,
                        retryCount,
                    });
                    if (retryCount < MAX_RETRIES && currentImageBase64) {
                        retryCount++;
                        statusText.textContent = `reconnecting (attempt ${retryCount})...`;
                        startPipelineInner(currentImageBase64);
                    } else {
                        showError('Connection to server lost. Please try again.');
                    }
                }
            }, 20000);
        }

        async function startPipeline(imageDataUrl) {
            retryCount = 0;
            await startPipelineInner(imageDataUrl);
        }

        let currentEventSource = null;

        async function startPipelineInner(imageDataUrl) {
            blueprintReceived = false;
            pipelineComplete = false;
            lastEventTime = Date.now();
            telemetry.reset();

            if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
            if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

            try {
                statusText.textContent = 'uploading screenshot';
                telemetry.markUploadStart();
                const startResp = await fetch('/api/hub/v2/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageDataUrl }),
                });
                telemetry.markUploadEnd();

                if (!startResp.ok) {
                    const err = await startResp.json().catch(() => ({ error: `Upload failed (HTTP ${startResp.status})` }));
                    throw new Error(err.error || `Upload failed (HTTP ${startResp.status})`);
                }

                const { requestId } = await startResp.json();
                telemetry.requestId = requestId;
                statusText.textContent = 'connecting to pipeline';

                await new Promise((resolve, reject) => {
                    const es = new EventSource(`/api/hub/v2/stream/${requestId}`);
                    currentEventSource = es;

                    pipelineTimeout = setTimeout(() => {
                        if (!blueprintReceived) {
                            es.close();
                            telemetry.reportError('No response from server (30s)', { type: 'timeout_no_skeleton' });
                            reject(new Error('Could not connect to analysis server. Please try again.'));
                        }
                    }, 30000);

                    es.addEventListener('connected', (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent('connected');
                            handleSSEEvent('connected', data);
                            resetStallTimer();
                        } catch {}
                    });

                    es.addEventListener('progress', (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent('progress');
                            handleSSEEvent('progress', data);
                            resetStallTimer();
                        } catch {}
                    });

                    es.addEventListener('blueprint', (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent('blueprint');
                            handleSSEEvent('blueprint', data);
                            resetStallTimer();
                        } catch {}
                    });

                    es.addEventListener('layout_update', (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent('layout_update');
                            handleSSEEvent('layout_update', data);
                            resetStallTimer();
                        } catch {}
                    });

                    es.addEventListener('card', (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent('card');
                            handleSSEEvent('card', data);
                            resetStallTimer();
                        } catch {}
                    });

                    es.addEventListener('complete', (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent('complete');
                            handleSSEEvent('complete', data);
                        } catch {}
                        es.close();
                        currentEventSource = null;
                        telemetry.reportSuccess();
                        resolve();
                    });

                    es.addEventListener('error', (e) => {
                        if (es.readyState === EventSource.CLOSED) {
                            if (!pipelineComplete) {
                                if (!blueprintReceived) {
                                    reject(new Error('Connection lost before analysis started'));
                                } else {
                                    reject(new Error('Connection lost during analysis'));
                                }
                            }
                            return;
                        }
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent('error');
                            es.close();
                            currentEventSource = null;
                            reject(new Error(data.message || 'Analysis failed'));
                        } catch {
                            es.close();
                            currentEventSource = null;
                            if (!pipelineComplete) {
                                reject(new Error('Connection to server lost'));
                            }
                        }
                    });
                });

            } catch (err) {
                if (retryCount < MAX_RETRIES && currentImageBase64 && !pipelineComplete) {
                    retryCount++;
                    statusText.textContent = `reconnecting (attempt ${retryCount})...`;
                    startPipelineInner(currentImageBase64);
                    return;
                }
                telemetry.reportError(err.message || 'connection failed', { type: 'pipeline_error' });
                telemetry.reportOutcome('error', err.message);
                showError(err.message || 'Connection failed');
            } finally {
                if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
                if (completionTimeout) { clearTimeout(completionTimeout); completionTimeout = null; }
            }
        }

        function handleSSEEvent(event, data) {
            switch (event) {
                case 'connected':
                    statusProgressFill.style.width = '10%';
                    statusText.textContent = 'connected to pipeline';
                    break;

                case 'progress':
                    statusProgressFill.style.width = Math.min(data.progress, 95) + '%';
                    statusText.textContent = data.message || 'processing';
                    if (data.phase === 'researching') {
                        layoutProgressFill.style.width = data.progress + '%';
                        layoutProgressText.textContent = `${completedCards}/${totalCards}`;
                    }
                    break;

                case 'blueprint':
                    onBlueprintReceived(data);
                    break;

                case 'layout_update':
                    onLayoutUpdate(data);
                    break;

                case 'card':
                    onCardReceived(data);
                    break;

                case 'complete':
                    onPipelineComplete();
                    break;

                case 'error':
                    telemetry.reportError(data.message || 'analysis failed', { type: 'sse_error' });
                    showError(data.message || 'Analysis failed');
                    break;
            }
        }

        function onBlueprintReceived(blueprint) {
            blueprintReceived = true;
            if (pipelineTimeout) {
                clearTimeout(pipelineTimeout);
                pipelineTimeout = null;
            }

            if (completionTimeout) clearTimeout(completionTimeout);
            completionTimeout = setTimeout(() => {
                if (!pipelineComplete) {
                    telemetry.reportError('Analysis timed out after skeleton (90s)', {
                        type: 'timeout_post_skeleton',
                        completedCards,
                        totalCards,
                    });
                    showError('Analysis is taking too long. Please try again.');
                }
            }, 90000);

            totalCards = (blueprint.cards || []).length;
            completedCards = 0;

            scanLine.classList.remove('active');
            scanCorners.classList.remove('active');
            screenshotLayer.className = 'screenshot-layer fading';

            statusProgressFill.style.width = '15%';
            statusText.textContent = 'analyzing screenshot';

            const ct = blueprint.contentAnalysis?.contentType || 'analyzing';
            layoutBadge.textContent = ct.replace(/_/g, ' ');

            cardGrid.innerHTML = '';
            (blueprint.cards || []).forEach((card, index) => {
                const el = createCardElement(card);
                cardGrid.appendChild(el);
                setTimeout(() => {
                    el.classList.add('visible');
                }, 80 + index * 60);
            });

            layoutProgressFill.style.width = '10%';
            layoutProgressText.textContent = 'analyzing';
            setTimeout(() => {
                resultsOverlay.classList.add('visible');
            }, 100);
        }

        function onLayoutUpdate(blueprint) {
            totalCards = (blueprint.cards || []).length;
            completedCards = 0;

            const ct = blueprint.contentAnalysis?.contentType || 'general';
            layoutBadge.textContent = ct.replace(/_/g, ' ');

            if (blueprint.contentAnalysis) {
                contentAnalysisEl.style.display = '';
                analysisIntent.textContent = blueprint.contentAnalysis.intent || '';
                topQuestionsEl.innerHTML = '';
                (blueprint.contentAnalysis.topQuestions || []).forEach(q => {
                    const span = document.createElement('span');
                    span.className = 'top-question';
                    span.textContent = q;
                    topQuestionsEl.appendChild(span);
                });
            }

            const cols = blueprint.layout?.columns || 1;
            cardGrid.className = 'card-grid' + (cols > 1 ? ` cols-${Math.min(cols, 3)}` : '');

            cardGrid.innerHTML = '';
            (blueprint.cards || []).forEach((card, index) => {
                const el = createCardElement(card);
                cardGrid.appendChild(el);
                setTimeout(() => {
                    el.classList.add('visible');
                }, 50 + index * 40);
            });

            statusText.textContent = `researching ${totalCards} cards`;
            layoutProgressFill.style.width = '30%';
            layoutProgressText.textContent = `0/${totalCards}`;
        }

        function onCardReceived(data) {
            completedCards++;

            const el = document.getElementById(`card-${data.cardId}`);
            if (!el) return;

            el.classList.remove('loading');
            el.classList.add('populated', 'just-populated');
            el.innerHTML = renderCardContent(data.cardType, data.data);

            setTimeout(() => {
                el.classList.remove('just-populated');
            }, 1500);

            const pct = 30 + Math.round((completedCards / totalCards) * 65);
            statusProgressFill.style.width = pct + '%';
            statusText.textContent = `card ${completedCards}/${totalCards} complete`;
            layoutProgressFill.style.width = pct + '%';
            layoutProgressText.textContent = `${completedCards}/${totalCards}`;
        }

        function onPipelineComplete() {
            pipelineComplete = true;
            if (completionTimeout) {
                clearTimeout(completionTimeout);
                completionTimeout = null;
            }
            if (stallTimer) {
                clearTimeout(stallTimer);
                stallTimer = null;
            }

            screenshotLayer.className = 'screenshot-layer gone';

            statusProgressFill.style.width = '100%';
            statusText.textContent = 'complete';
            setTimeout(() => {
                statusBar.classList.remove('active');
            }, 1200);

            layoutProgress.style.display = 'none';
        }

        // === Card Rendering ===
        function createCardElement(card) {
            const el = document.createElement('div');
            el.id = `card-${card.id}`;
            el.className = `card card-${card.cardType.replace(/_/g, '-')} loading`;
            el.dataset.cardType = card.cardType;

            const span = card.gridPosition?.columnSpan || 1;
            if (span >= 3 || card.cardType === 'hero_summary' || card.cardType === 'comparison_card' || card.cardType === 'warning_card') {
                el.classList.add('span-full');
            } else if (span === 2) {
                el.classList.add('span-2');
            }

            el.innerHTML = renderPlaceholder(card);
            return el;
        }

        function renderPlaceholder(card) {
            const pd = card.placeholderData || {};
            const type = card.cardType;

            if (type === 'hero_summary') {
                return `<div class="card-inner">
                    ${pd.badge ? `<span class="hero-badge">${esc(pd.badge)}</span>` : ''}
                    <div class="hero-title">${esc(pd.title || 'Analyzing...')}</div>
                    <div class="hero-subtitle">${esc(pd.subtitle || 'Identifying content...')}</div>
                    <div class="placeholder-line medium"></div>
                </div>`;
            }

            return `<div class="card-inner">
                ${getCardTypeLabel(type)}
                <div class="placeholder-line medium"></div>
                <div class="placeholder-line short"></div>
                <div class="placeholder-line"></div>
            </div>`;
        }

        function renderCardContent(cardType, data) {
            const d = data || {};

            switch (cardType) {
                case 'hero_summary':
                    return `<div class="card-inner">
                        ${d.badge ? `<span class="hero-badge" ${d.badgeColor ? `style="background:${esc(d.badgeColor)}22;color:${esc(d.badgeColor)}"` : ''}>${esc(d.badge)}</span>` : ''}
                        ${d.icon ? `<span style="font-size:1.5rem;margin-bottom:8px;display:inline-block">${esc(d.icon)}</span>` : ''}
                        <div class="hero-title">${esc(d.title || 'Analysis')}</div>
                        <div class="hero-subtitle">${esc(d.subtitle || '')}</div>
                        ${d.takeaway ? `<div class="hero-takeaway">${esc(d.takeaway)}</div>` : ''}
                    </div>`;

                case 'key_metric':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('key_metric')}
                        <div class="metric-value" ${d.color ? `style="color:${esc(d.color)}"` : ''}>${esc(d.unit && d.unit.length === 1 ? d.unit : '')}${esc(d.value || '—')}</div>
                        <div class="metric-label">${esc(d.label || '')}</div>
                        ${d.trend && d.trend !== 'none' ? `<span class="metric-trend ${esc(d.trend)}">
                            <span class="material-symbols-rounded" style="font-size:14px">${d.trend === 'up' ? 'trending_up' : d.trend === 'down' ? 'trending_down' : 'trending_flat'}</span>
                            ${esc(d.trend)}
                        </span>` : ''}
                        ${d.context ? `<div class="metric-context">${esc(d.context)}</div>` : ''}
                    </div>`;

                case 'info_list':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('info_list')}
                        <div class="list-title">${esc(d.title || 'Details')}</div>
                        ${(d.items || []).map(item => {
                            if (typeof item === 'object' && item !== null) {
                                const label = item.label || item.name || item.key || '';
                                const value = item.value || item.description || item.text || '';
                                return `<div class="list-item${item.highlight ? ' highlight' : ''}">
                                    <span class="list-item-label">${item.icon ? `<span class="list-item-icon">${esc(item.icon)}</span>` : ''}${esc(label)}</span>
                                    <span class="list-item-value">${esc(value)}</span>
                                </div>`;
                            }
                            return `<div class="list-item">
                                <span class="list-item-value" style="text-align:left">${esc(item)}</span>
                            </div>`;
                        }).join('')}
                    </div>`;

                case 'fact_check':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('fact_check')}
                        <div class="fact-claim">${esc(d.claim || '')}</div>
                        <div class="fact-verdict ${esc(d.verdict || 'unverified')}">
                            <span class="material-symbols-rounded" style="font-size:14px">${
                                d.verdict === 'verified' ? 'check_circle' :
                                d.verdict === 'false' ? 'cancel' :
                                d.verdict === 'misleading' ? 'warning' : 'help'
                            }</span>
                            ${esc(d.verdict || 'unverified')}
                        </div>
                        <div class="fact-explanation">${esc(d.explanation || '')}</div>
                        ${d.source ? `<div class="fact-confidence">Source: ${esc(d.source)}</div>` : ''}
                        ${d.confidence ? `<div class="fact-confidence">Confidence: ${esc(d.confidence)}</div>` : ''}
                    </div>`;

                case 'person_card':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('person_card')}
                        <div class="person-header">
                            <div class="person-avatar">${esc(d.name ? d.name[0].toUpperCase() : '?')}</div>
                            <div>
                                <div class="person-name">${esc(d.name || 'Unknown')}</div>
                                ${d.role ? `<div class="person-role">${esc(d.role)}</div>` : ''}
                                ${d.handle ? `<div class="person-handle">${esc(d.handle)}</div>` : ''}
                            </div>
                        </div>
                        <div class="person-context">${esc(d.context || '')}</div>
                        ${(d.details || []).length ? `<div class="person-details">${d.details.map(det =>
                            `<div class="person-detail-item">${renderItemValue(det)}</div>`
                        ).join('')}</div>` : ''}
                    </div>`;

                case 'product_card':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('product_card')}
                        <div class="product-name">${esc(d.name || 'Product')}</div>
                        ${d.price ? `<div class="product-price">${esc(d.price)}</div>` : ''}
                        ${d.rating ? `<div class="product-rating">
                            <span class="material-symbols-rounded" style="font-size:16px;font-variation-settings:'FILL' 1">star</span>
                            ${esc(d.rating)}
                        </div>` : ''}
                        ${(d.features || []).length ? `<ul class="product-features">${d.features.map(f =>
                            `<li>${renderItemValue(f)}</li>`
                        ).join('')}</ul>` : ''}
                        ${d.verdict ? `<div class="product-verdict">${esc(d.verdict)}</div>` : ''}
                        ${(d.warnings || []).length ? `<ul class="product-warnings">${d.warnings.map(w =>
                            `<li>${renderItemValue(w)}</li>`
                        ).join('')}</ul>` : ''}
                    </div>`;

                case 'timeline_card':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('timeline_card')}
                        <div class="timeline-title">${esc(d.title || 'Timeline')}</div>
                        ${(d.events || []).map(ev => {
                            const evObj = typeof ev === 'object' ? ev : { event: String(ev) };
                            return `<div class="timeline-event${evObj.highlight ? ' highlight' : ''}">
                                <div class="timeline-date">${esc(evObj.date || '')}</div>
                                <div class="timeline-dot"></div>
                                <div class="timeline-text">${esc(evObj.event || evObj.text || evObj.description || '')}</div>
                            </div>`;
                        }).join('')}
                    </div>`;

                case 'quote_card':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('quote_card')}
                        <div class="quote-text">"${esc(d.quote || '')}"</div>
                        ${d.attribution ? `<div class="quote-attribution">— ${esc(d.attribution)}</div>` : ''}
                        ${d.context ? `<div class="quote-context">${esc(d.context)}</div>` : ''}
                    </div>`;

                case 'comparison_card':
                    if (!d.columns || !d.columns.length) {
                        return `<div class="card-inner">${getCardTypeLabel('comparison_card')}<div class="comparison-title">${esc(d.title || 'Comparison')}</div><div style="color:var(--md-on-surface-variant);font-size:0.82rem">No data available</div></div>`;
                    }
                    const cols = Array.isArray(d.columns) ? d.columns : [];
                    const maxRows = Math.max(...cols.map(c => (Array.isArray(c.values) ? c.values : []).length), 0);
                    return `<div class="card-inner">
                        ${getCardTypeLabel('comparison_card')}
                        <div class="comparison-title">${esc(d.title || 'Comparison')}</div>
                        <table>
                            <thead><tr>
                                ${d.rows ? '<th></th>' : ''}
                                ${cols.map(c => `<th>${esc(typeof c === 'object' ? (c.header || c.name || '') : c)}</th>`).join('')}
                            </tr></thead>
                            <tbody>${Array.from({ length: maxRows }, (_, i) => `<tr>
                                ${d.rows ? `<td style="color:var(--md-on-surface-variant);font-weight:500">${esc(Array.isArray(d.rows) ? d.rows[i] || '' : '')}</td>` : ''}
                                ${cols.map(c => {
                                    const vals = Array.isArray(c.values) ? c.values : [];
                                    return `<td>${esc(vals[i] || '')}</td>`;
                                }).join('')}
                            </tr>`).join('')}</tbody>
                        </table>
                    </div>`;

                case 'warning_card': {
                    const level = d.level || 'warning';
                    return `<div class="card-inner level-${esc(level)}">
                        <div class="warning-header">
                            <div class="warning-icon-wrap">
                                <span class="material-symbols-rounded">${level === 'critical' ? 'error' : level === 'info' ? 'info' : 'warning'}</span>
                            </div>
                            <span class="warning-title">${esc(d.title || 'Warning')}</span>
                        </div>
                        <div class="warning-details">${esc(d.details || '')}</div>
                        ${d.advice ? `<div class="warning-advice">${esc(d.advice)}</div>` : ''}
                    </div>`;
                }

                case 'action_card':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('action_card')}
                        <div class="action-title">${esc(d.title || 'Next Steps')}</div>
                        ${(d.actions || []).map((a, i) => {
                            const aObj = typeof a === 'object' ? a : { label: String(a) };
                            return `<div class="action-item">
                                <span class="action-bullet">${i + 1}</span>
                                <div>
                                    <div class="action-label">${esc(aObj.label || aObj.name || '')}</div>
                                    ${aObj.description ? `<div class="action-desc">${esc(aObj.description)}</div>` : ''}
                                    ${aObj.priority ? `<span class="action-priority ${esc(aObj.priority)}">${esc(aObj.priority)}</span>` : ''}
                                </div>
                            </div>`;
                        }).join('')}
                    </div>`;

                case 'text_extract':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('text_extract')}
                        <div class="extract-title">${esc(d.title || 'Extracted Text')}</div>
                        <div class="extract-text">${esc(d.text || '')}</div>
                        ${d.source ? `<div class="extract-source">${esc(d.source)}</div>` : ''}
                    </div>`;

                case 'location_card':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('location_card')}
                        <div class="location-name">${esc(d.name || 'Location')}</div>
                        ${d.address ? `<div class="location-address">
                            <span class="material-symbols-rounded" style="font-size:14px">place</span>
                            ${esc(d.address)}
                        </div>` : ''}
                        <div class="location-context">${esc(d.context || '')}</div>
                        ${(d.details || []).length ? `<div class="location-details">${d.details.map(det =>
                            `<div class="location-detail-item">${renderItemValue(det)}</div>`
                        ).join('')}</div>` : ''}
                    </div>`;

                default:
                    return `<div class="card-inner">
                        ${getCardTypeLabel(cardType)}
                        ${Object.entries(d).filter(([k]) => !k.startsWith('_')).map(([key, val]) => {
                            if (val === null || val === undefined) return '';
                            if (Array.isArray(val)) {
                                return `<div style="margin-bottom:8px">
                                    <div style="font-size:0.72rem;font-weight:600;color:var(--md-on-surface-variant);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em">${esc(key.replace(/_/g, ' '))}</div>
                                    ${val.map(v => `<div style="font-size:0.82rem;color:var(--md-on-surface);padding:4px 0 4px 12px;border-left:2px solid var(--md-outline-variant)">${renderItemValue(v)}</div>`).join('')}
                                </div>`;
                            }
                            if (typeof val === 'object') {
                                return `<div style="margin-bottom:8px">
                                    <div style="font-size:0.72rem;font-weight:600;color:var(--md-on-surface-variant);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em">${esc(key.replace(/_/g, ' '))}</div>
                                    <div style="font-size:0.82rem;color:var(--md-on-surface)">${renderItemValue(val)}</div>
                                </div>`;
                            }
                            return `<div style="margin-bottom:8px">
                                <div style="font-size:0.72rem;font-weight:600;color:var(--md-on-surface-variant);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em">${esc(key.replace(/_/g, ' '))}</div>
                                <div style="font-size:0.82rem;color:var(--md-on-surface)">${esc(val)}</div>
                            </div>`;
                        }).join('')}
                    </div>`;
            }
        }

        // === Error & Reset ===
        function showError(message) {
            errorText.textContent = message;
            errorState.classList.add('active');
            statusBar.classList.remove('active');
            scanLine.classList.remove('active');
            scanCorners.classList.remove('active');
        }

        function reset() {
            if (currentImageUrl) {
                URL.revokeObjectURL(currentImageUrl);
                currentImageUrl = null;
            }
            currentImageBase64 = null;
            totalCards = 0;
            completedCards = 0;
            blueprintReceived = false;
            pipelineComplete = false;
            retryCount = 0;
            if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
            if (completionTimeout) { clearTimeout(completionTimeout); completionTimeout = null; }
            if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
            if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

            pasteState.classList.remove('hidden');
            mainCanvas.classList.remove('active');
            screenshotLayer.className = 'screenshot-layer';
            scanLine.classList.remove('active');
            scanCorners.classList.remove('active');
            resultsOverlay.classList.remove('visible');
            statusBar.classList.remove('active');
            errorState.classList.remove('active');
            cardGrid.innerHTML = '';
            contentAnalysisEl.style.display = 'none';
            layoutProgress.style.display = '';
            layoutProgressFill.style.width = '0%';
            statusProgressFill.style.width = '0%';
        }

        // === Event Listeners ===
        pasteZone.addEventListener('click', readClipboard);
        retryBtn.addEventListener('click', reset);
        layoutBack.addEventListener('click', reset);

        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    handleImage(item.getAsFile());
                    return;
                }
            }
        });

        document.addEventListener('dragover', (e) => { e.preventDefault(); });
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer?.files?.[0];
            if (file && file.type.startsWith('image/')) {
                handleImage(file);
            }
        });

        if (navigator.clipboard?.read) {
            navigator.permissions?.query?.({ name: 'clipboard-read' })
                .then(r => { if (r.state === 'granted') readClipboard(); })
                .catch(() => {});
        }
    </script>
</body>
</html>
