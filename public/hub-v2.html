<!DOCTYPE html>
<html lang="en" data-theme="thinx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>thinx.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
    <style>
/* ============================================================
   THINX.FUN — Complete Stylesheet
   No external CSS framework dependencies. Everything is here.
   ============================================================ */

:root {
    --bg: #08090d;
    --surface: #12151c;
    --surface-2: #181c26;
    --surface-3: #1f2533;
    --border: #1e2330;
    --border-light: #2a3040;
    --text: #e8eaf0;
    --text-secondary: #8b92a5;
    --text-muted: #5a6178;
    --accent: #5b8af5;
    --accent-dim: rgba(91,138,245,0.12);
    --green: #34d399;
    --green-dim: rgba(52,211,153,0.12);
    --yellow: #fbbf24;
    --yellow-dim: rgba(251,191,36,0.12);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.12);
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.12);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 6px;
    --card-pad: 20px;
    --grid-gap: 16px;
    --grid-pad: 16px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---- Icons ---- */
.icon {
    font-family: 'Material Symbols Rounded';
    font-weight: normal;
    font-style: normal;
    display: inline-block;
    line-height: 1;
    text-transform: none;
    letter-spacing: normal;
    word-wrap: normal;
    white-space: nowrap;
    direction: ltr;
    -webkit-font-smoothing: antialiased;
    font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
}
.icon-fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }

/* ---- Paste/Upload Screen ---- */
.paste-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
    gap: 16px;
}
.paste-screen.hidden { display: none; }

.paste-zone {
    width: 100%;
    max-width: 400px;
    padding: 48px 24px;
    border: 2px dashed var(--border-light);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}
.paste-zone:hover, .paste-zone:active {
    border-color: var(--accent);
    background: var(--accent-dim);
}
.paste-zone .icon { font-size: 48px; color: var(--text-muted); }
.paste-zone-title { font-size: 1.1rem; font-weight: 600; color: var(--text); }
.paste-zone-sub { font-size: 0.8rem; color: var(--text-muted); }

.upload-actions { display: flex; gap: 10px; margin-top: 8px; }

.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
}
.btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--accent); }
.btn .icon { font-size: 18px; }
.btn.loading { pointer-events: none; opacity: 0.5; }

/* ---- Main Canvas (screenshot + results) ---- */
.main-canvas { display: none; position: relative; min-height: 100vh; }
.main-canvas.active { display: block; }

.screenshot-layer {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    transition: opacity 0.5s;
}
.screenshot-layer img {
    max-width: 100%; max-height: 100vh; object-fit: contain;
    filter: brightness(0.3);
}
.screenshot-layer.hidden { opacity: 0; pointer-events: none; }

/* ---- Progress Overlay ---- */
.progress-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(8,9,13,0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
}
.progress-overlay.active { display: flex; }

.progress-ring-wrap { position: relative; width: 80px; height: 80px; }
.progress-ring-wrap svg { width: 80px; height: 80px; transform: rotate(-90deg); }
.progress-ring-bg { fill: none; stroke: var(--surface-3); stroke-width: 4; }
.progress-ring-fill {
    fill: none; stroke: var(--accent); stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.4s ease;
}
.progress-pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; font-weight: 700; color: var(--accent);
}
.progress-phase {
    font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted);
}
.progress-label { font-size: 0.85rem; color: var(--text-secondary); }

/* ---- Results Area ---- */
.results {
    position: relative;
    z-index: 10;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    padding-bottom: 80px;
}
.results.visible { opacity: 1; transform: translateY(0); }

/* ---- Header ---- */
.header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(8,9,13,0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 12px var(--grid-pad);
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 10px; }

.back-btn {
    background: none; border: none;
    color: var(--text-secondary);
    font-family: var(--font); font-size: 0.82rem;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: var(--radius-xs);
    display: flex; align-items: center; gap: 4px;
    transition: all 0.15s;
}
.back-btn:hover { color: var(--accent); background: var(--accent-dim); }
.back-btn .icon { font-size: 18px; }

.content-badge {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 5px 14px;
    border-radius: 100px;
    background: var(--accent-dim);
    color: var(--accent);
}

.header-progress {
    display: flex; align-items: center; gap: 8px;
}
.header-progress-bar {
    width: 60px; height: 3px;
    background: var(--surface-3);
    border-radius: 2px;
    overflow: hidden;
}
.header-progress-fill {
    height: 100%; width: 0%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
}
.header-progress-text {
    font-size: 0.65rem; color: var(--text-muted); font-weight: 500;
    white-space: nowrap;
}

/* ============================================================
   CARD GRID
   ============================================================ */
.card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--grid-gap);
    padding: var(--grid-pad);
}
@media (min-width: 600px) {
    .card-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 1100px) {
    .card-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 24px; }
}
.card-grid .span-full { grid-column: 1 / -1; }
@media (min-width: 600px) {
    .card-grid .span-2 { grid-column: span 2; }
}

/* ============================================================
   CARD — Unified structure
   Every card: .card > .card-head + .card-body + optional .card-foot
   ============================================================ */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease, border-color 0.2s;
}
.card.visible { opacity: 1; transform: translateY(0); }
.card:hover { border-color: var(--border-light); }

/* Card header — icon + type label */
.card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px var(--card-pad) 0;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
}
.card-head-icon {
    width: 26px; height: 26px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.card-head-icon .icon { font-size: 16px; }

/* Card body — the actual content, always padded */
.card-body { padding: var(--card-pad); }
.card-head + .card-body { padding-top: 12px; }

/* Card footer — links, sources */
.card-foot {
    padding: 0 var(--card-pad) 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.card-foot a {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.75rem;
    color: var(--accent);
    padding: 4px 10px;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-xs);
    transition: all 0.15s;
}
.card-foot a:hover { background: var(--accent-dim); text-decoration: none; }
.card-foot a .icon { font-size: 14px; }

/* ---- Card loading skeleton ---- */
.card.loading .card-body { min-height: 60px; }
.card.loading .skeleton {
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: var(--radius-xs);
    height: 14px;
    margin-bottom: 10px;
}
.card.loading .skeleton:last-child { margin-bottom: 0; }
.card.loading .skeleton.w60 { width: 60%; }
.card.loading .skeleton.w80 { width: 80%; }
.card.loading .skeleton.w40 { width: 40%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ---- Card populated animation ---- */
@keyframes card-pop {
    0% { transform: translateY(8px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}
.card.just-populated { animation: card-pop 0.35s ease forwards; }

/* ============================================================
   CARD BODY CONTENT STYLES
   Reusable patterns used across card types
   ============================================================ */

/* Title */
.card-title {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1.25;
    margin-bottom: 6px;
}

/* Subtitle / description */
.card-subtitle {
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.55;
}

/* Badge (inside card body) */
.badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 100px;
    line-height: 1.4;
}
.badge-accent { background: var(--accent-dim); color: var(--accent); }
.badge-green { background: var(--green-dim); color: var(--green); }
.badge-yellow { background: var(--yellow-dim); color: var(--yellow); }
.badge-red { background: var(--red-dim); color: var(--red); }
.badge-purple { background: var(--purple-dim); color: var(--purple); }
.badge-muted { background: var(--surface-3); color: var(--text-secondary); }

/* Callout box (takeaway, context) */
.callout {
    font-size: 0.85rem;
    line-height: 1.55;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    margin-top: 12px;
    color: var(--text-secondary);
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
}
.callout-warn { border-left-color: var(--yellow); }
.callout-green { border-left-color: var(--green); }

/* Key-value row */
.kv-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
}
.kv-row:last-child { border-bottom: none; }
.kv-label { color: var(--text-muted); flex-shrink: 0; }
.kv-value { color: var(--text); text-align: right; font-weight: 500; word-break: break-word; }

/* Bullet list */
.bullet-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.bullet-list li {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5;
}
.bullet-list li::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    margin-top: 7px;
}
.bullet-list.green li::before { background: var(--green); }
.bullet-list.yellow li::before { background: var(--yellow); }
.bullet-list.red li::before { background: var(--red); }

/* Avatar row */
.avatar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 1.2rem; font-weight: 700;
    background: var(--accent-dim); color: var(--accent);
    overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-info { min-width: 0; }
.avatar-name { font-weight: 700; font-size: 0.95rem; color: var(--text); }
.avatar-sub { font-size: 0.78rem; color: var(--text-muted); }

/* Big metric */
.metric-value {
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
}
.metric-label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; }

/* Quote */
.quote-mark { font-size: 2.5rem; color: var(--purple-dim); font-family: Georgia, serif; line-height: 0.8; }
.quote-text { font-size: 0.9rem; font-style: italic; color: var(--text-secondary); line-height: 1.6; margin: 8px 0; }
.quote-attr { font-size: 0.78rem; color: var(--purple); font-weight: 600; }

/* Source row (verification) */
.source-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
}
.source-row:last-child { margin-bottom: 0; }
.source-row .icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.source-row-body { min-width: 0; flex: 1; }
.source-name { font-size: 0.85rem; font-weight: 600; color: var(--text); }
.source-snippet { font-size: 0.78rem; color: var(--text-muted); line-height: 1.5; margin-top: 2px; }
.source-url { font-size: 0.72rem; color: var(--accent); margin-top: 3px; display: block; }

/* Timeline */
.timeline { display: flex; flex-direction: column; gap: 0; }
.timeline-item {
    display: flex; gap: 12px;
    padding-bottom: 16px;
    position: relative;
}
.timeline-item:last-child { padding-bottom: 0; }
.timeline-dot-col {
    display: flex; flex-direction: column; align-items: center;
    width: 12px; flex-shrink: 0;
    padding-top: 5px;
}
.timeline-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--surface-3);
    flex-shrink: 0;
}
.timeline-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent-dim); }
.timeline-line {
    flex: 1; width: 2px;
    background: var(--border);
    margin-top: 6px;
}
.timeline-item:last-child .timeline-line { display: none; }
.timeline-date { font-size: 0.72rem; color: var(--text-muted); font-family: monospace; }
.timeline-text { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }

/* Warning/alert card */
.alert-box {
    display: flex; gap: 12px; align-items: flex-start;
    padding: var(--card-pad);
    border-radius: var(--radius);
}
.alert-box .icon { font-size: 22px; flex-shrink: 0; }
.alert-box.warn { background: var(--yellow-dim); color: var(--yellow); }
.alert-box.error { background: var(--red-dim); color: var(--red); }
.alert-box.info { background: var(--accent-dim); color: var(--accent); }
.alert-title { font-weight: 700; font-size: 0.9rem; color: var(--text); }
.alert-detail { font-size: 0.82rem; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }

/* Chart (simple bar) */
.bar-chart { display: flex; flex-direction: column; gap: 10px; }
.bar-row-label { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 3px; }
.bar-row-label span:first-child { color: var(--text-secondary); }
.bar-row-label span:last-child { font-weight: 600; color: var(--text); font-family: monospace; }
.bar-track { width: 100%; height: 6px; background: var(--surface-3); border-radius: 3px; }
.bar-fill { height: 6px; border-radius: 3px; transition: width 0.4s ease; }

/* ---- Follow-up Questions ---- */
.follow-up-section {
    padding: 20px var(--grid-pad) 24px;
    display: none;
}
.follow-up-title {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 10px;
}
.fq-item { border-bottom: 1px solid var(--border); }
.fq-item:last-child { border-bottom: none; }
.fq-question {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 0;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--text);
    font-weight: 500;
}
.fq-question .icon { font-size: 18px; color: var(--text-muted); transition: transform 0.2s; }
.fq-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
}
.fq-answer-inner {
    padding: 0 0 14px 28px;
    font-size: 0.82rem;
    color: var(--text-secondary);
    line-height: 1.6;
}
.fq-item.open .fq-question .icon { transform: rotate(45deg); }
.fq-item.open .fq-answer { max-height: 300px; }

/* ---- Error State ---- */
.error-state {
    display: none;
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 200;
    background: var(--red-dim);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 500;
    max-width: 90%;
    text-align: center;
}
.error-state.active { display: block; }

/* ---- Misc ---- */
input[type="file"] { display: none; }
.hidden { display: none !important; }
    </style>
</head>
<body>

<!-- ==================== PASTE / UPLOAD SCREEN ==================== -->
<div class="paste-screen" id="pasteScreen">
    <div class="paste-zone" id="pasteZone">
        <span class="icon" style="font-size:48px">content_paste</span>
        <div class="paste-zone-title">Paste a screenshot</div>
        <div class="paste-zone-sub">or tap to read from clipboard</div>
    </div>
    <div class="upload-actions">
        <button class="btn" id="uploadBtn">
            <span class="icon">photo_camera</span> Upload
        </button>
        <button class="btn" id="demoBtn">
            <span class="icon">play_circle</span> Try Demo
        </button>
    </div>
    <input type="file" id="photoInput" accept="image/*">
</div>

<!-- ==================== MAIN CANVAS ==================== -->
<div class="main-canvas" id="mainCanvas">
    <div class="screenshot-layer" id="screenshotLayer">
        <img id="screenshotImg" alt="">
    </div>

    <!-- Progress Overlay -->
    <div class="progress-overlay" id="progressOverlay">
        <div class="progress-ring-wrap">
            <svg viewBox="0 0 100 100">
                <circle class="progress-ring-bg" cx="50" cy="50" r="45"/>
                <circle class="progress-ring-fill" id="progressRing" cx="50" cy="50" r="45"
                    stroke-dasharray="282.74" stroke-dashoffset="282.74"/>
            </svg>
            <div class="progress-pct" id="progressPct">0%</div>
        </div>
        <div class="progress-phase" id="progressPhase">UPLOADING</div>
        <div class="progress-label" id="progressLabel">Compressing...</div>
    </div>

    <!-- Results -->
    <div class="results" id="results">
        <div class="header">
            <div class="header-left">
                <button class="back-btn" id="backBtn">
                    <span class="icon">arrow_back</span> New
                </button>
                <span class="content-badge" id="contentBadge"></span>
            </div>
            <div class="header-progress" id="headerProgress">
                <div class="header-progress-bar">
                    <div class="header-progress-fill" id="headerProgressFill"></div>
                </div>
                <span class="header-progress-text" id="headerProgressText"></span>
            </div>
        </div>

        <div class="card-grid" id="cardGrid"></div>

        <div class="follow-up-section" id="followUpSection">
            <div class="follow-up-title">Questions</div>
            <div id="followUpList"></div>
        </div>
    </div>
</div>

<!-- Error toast -->
<div class="error-state" id="errorState"></div>

<script>
// ============================================================
//  THINX.FUN — App Logic
//  Clean rewrite: upload → SSE → card rendering → telemetry
// ============================================================

(function() {

    // ============================================================

    function esc(val) {
        if (val == null) return '';
        if (typeof val === 'object') {
            try { val = JSON.stringify(val); } catch { val = String(val); }
        }
        return String(val)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function linkify(text) {
        const safe = esc(text);
        return safe.replace(/(https?:\/\/[^\s<&]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    // ============================================================
    //  PROGRESS HELPERS
    // ============================================================

    function updateProgress(pct, phase, label) {
        currentPct = pct;
        const offset = RING_C - (pct / 100) * RING_C;
        progressRing.style.strokeDashoffset = offset;
        progressPct.textContent = Math.round(pct) + '%';
        if (phase) progressPhase.textContent = phase;
        if (label) progressLabel.textContent = label;
    }

    function startAnalysisTick(from) {
        stopAnalysisTick();
        let pct = from;
        analysisTick = setInterval(() => {
            pct += 0.15;
            if (pct >= 85) { stopAnalysisTick(); return; }
            updateProgress(pct, null, null);
        }, 300);
    }

    function stopAnalysisTick() {
        if (analysisTick) { clearInterval(analysisTick); analysisTick = null; }

    // ============================================================
    //  TELEMETRY
    // ============================================================

    const telemetry = {
        pipelineStart: null,
        uploadStart: null,
        uploadEnd: null,
        firstEventAt: null,
        eventsReceived: [],
        requestId: null,

        reset() {
            this.pipelineStart = Date.now();
            this.uploadStart = this.uploadEnd = this.firstEventAt = null;
            this.eventsReceived = [];
            this.requestId = null;
        },
        markUploadStart() { this.uploadStart = Date.now(); },
        markUploadEnd()   { this.uploadEnd = Date.now(); },

        trackEvent(event) {
            const now = Date.now();
            if (!this.firstEventAt) this.firstEventAt = now;
            this.eventsReceived.push({ event, elapsed: now - (this.pipelineStart || now) });
        },

        _payload(extra = {}) {
            const now = Date.now();
            return {
                requestId: this.requestId,
                url: location.href,
                userAgent: navigator.userAgent,
                screen: `${screen.width}x${screen.height}`,
                connection: navigator.connection ? {
                    type: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt,
                } : null,
                totalDuration: this.pipelineStart ? now - this.pipelineStart : null,
                uploadDuration: (this.uploadStart && this.uploadEnd) ? this.uploadEnd - this.uploadStart : null,
                firstEventDelay: (this.pipelineStart && this.firstEventAt) ? this.firstEventAt - this.pipelineStart : null,
                eventsReceived: this.eventsReceived,
                retries: retryCount,
                state: { blueprintReceived, pipelineComplete, totalCards, completedCards },
                ...extra,
            };
        },

        reportError(msg, extra = {}) {
            fetch('/api/debug/client-error', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...this._payload(extra), message: msg, outcome: 'error' }),
            }).catch(() => {});
        },
        reportSuccess() {
            fetch('/api/debug/client-report', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...this._payload(), outcome: 'success' }),
            }).catch(() => {});
        },
    };

    // ============================================================
    //  IMAGE HANDLING
    // ============================================================

    function loadImg(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = src;
        });
    }

    async function compress(blob) {
        if (blob.size <= UPLOAD_TARGET_SIZE) return blob;
        const url = URL.createObjectURL(blob);
        try {
            const img = await loadImg(url);
            let w = img.naturalWidth, h = img.naturalHeight;
            const s = Math.min(MAX_DIM / w, MAX_DIM / h, 1);
            w = Math.round(w * s); h = Math.round(h * s);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const tryQ = (tw, th, q) => {
                canvas.width = tw; canvas.height = th;
                ctx.drawImage(img, 0, 0, tw, th);
                return new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
            };
            for (const q of [0.85, 0.7, 0.55, 0.4]) {
                const r = await tryQ(w, h, q);
                if (r && r.size <= UPLOAD_TARGET_SIZE) return r;
            }
            for (const ds of [0.75, 0.5, 0.35]) {
                const r = await tryQ(Math.round(w*ds), Math.round(h*ds), 0.7);
                if (r && r.size <= UPLOAD_TARGET_SIZE) return r;
            }
            return await tryQ(Math.round(w*0.3), Math.round(h*0.3), 0.5);
        } finally { URL.revokeObjectURL(url); }
    }

    async function makeThumbnail(blob) {
        try {
            const url = URL.createObjectURL(blob);
            try {
                const img = await loadImg(url);
                const scale = Math.min(360 / img.naturalWidth, 1);
                const w = Math.round(img.naturalWidth * scale);
                const h = Math.round(img.naturalHeight * scale);
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h);
                return c.toDataURL('image/jpeg', 0.7).replace(/^data:image\/\w+;base64,/, '');
            } finally { URL.revokeObjectURL(url); }
        } catch { return null; }
    }

    async function readClipboard() {
        try {
            const items = await navigator.clipboard.read();
            for (const item of items) {
                const t = item.types.find(t => t.startsWith('image/'));
                if (t) { handleImage(await item.getType(t)); return; }
            }
            showError('No image found in clipboard');
        } catch (err) {
            showError(err.name === 'NotAllowedError' ? 'Clipboard access denied' : 'Could not read clipboard');
        }
    }

    async function handleImage(blob) {
        currentImageUrl = URL.createObjectURL(blob);
        screenshotImg.src = currentImageUrl;
        pasteScreen.classList.add('hidden');
        mainCanvas.classList.add('active');
        screenshotLayer.classList.remove('hidden');
        progressOverlay.classList.add('active');
        updateProgress(0, 'UPLOADING', 'Compressing...');

        try { blob = await compress(blob); } catch(e) { console.warn('Compression failed:', e); }
        currentThumbBase64 = await makeThumbnail(blob);
        updateProgress(5, 'UPLOADING', 'Sending screenshot...');

        const reader = new FileReader();
        reader.onloadend = () => {
            currentImageBase64 = reader.result;
            startPipeline(currentImageBase64);
        };
        reader.readAsDataURL(blob);
    }

    // ============================================================
    //  PIPELINE — Upload + SSE
    // ============================================================

    function startPipeline(imageDataUrl) {
        telemetry.reset();
        blueprintReceived = false;
        pipelineComplete = false;
        firstCardShown = false;
        pendingBlueprint = null;
        populatedCardIds.clear();
        totalCards = 0;
        completedCards = 0;
        startPipelineInner(imageDataUrl);
    }

    async function startPipelineInner(imageDataUrl) {
        try {
            telemetry.markUploadStart();
            const { requestId } = await new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/hub/v2/start');
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) updateProgress((e.loaded/e.total)*30, 'UPLOADING', 'Sending screenshot...');
                });
                xhr.addEventListener('load', () => {
                    telemetry.markUploadEnd();
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try { resolve(JSON.parse(xhr.responseText)); }
                        catch { reject(new Error('Invalid server response')); }
                    } else {
                        reject(new Error(`Upload failed (HTTP ${xhr.status})`));
                    }
                });
                xhr.addEventListener('error', () => { telemetry.markUploadEnd(); reject(new Error('Upload failed — network error')); });
                const payload = { image: imageDataUrl };
                if (currentThumbBase64) payload.thumb = currentThumbBase64;
                xhr.send(JSON.stringify(payload));
            });

            telemetry.requestId = requestId;
            updateProgress(32, 'ANALYZING', 'Connecting...');
            startAnalysisTick(32);

            await new Promise((resolve, reject) => {
                const es = new EventSource(`/api/hub/v2/stream/${requestId}`);
                currentEventSource = es;

                pipelineTimeout = setTimeout(() => {
                    if (!blueprintReceived) {
                        es.close();
                        telemetry.reportError('No response from server (30s)', { type: 'timeout_no_skeleton' });
                        reject(new Error('Could not connect to analysis server. Please try again.'));
                    }
                }, 30000);

                const events = ['connected','progress','blueprint','layout_preview','layout_update','card','card_update','card_add','phase','complete'];
                events.forEach(evt => {
                    es.addEventListener(evt, (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent(evt);
                            handleSSE(evt, data);
                            if (evt !== 'complete') resetStallTimer();
                            if (evt === 'complete') {
                                es.close(); currentEventSource = null;
                                telemetry.reportSuccess();
                                resolve();
                            }
                        } catch {}
                    });
                });

                es.addEventListener('error', () => {
                    es.close(); currentEventSource = null;
                    if (!pipelineComplete) reject(new Error('Connection lost'));
                });
            });

        } catch (err) {
            if (retryCount < MAX_RETRIES && currentImageBase64) {
                retryCount++;
                progressLabel.textContent = `Reconnecting (attempt ${retryCount})...`;
                startPipelineInner(currentImageBase64);
            } else {
                showError(err.message || 'Something went wrong');
            }
        }
    }

    function resetStallTimer() {
        lastEventTime = Date.now();
        if (stallTimer) clearTimeout(stallTimer);
        if (pipelineComplete) return;
        stallTimer = setTimeout(() => {
            if (!pipelineComplete && blueprintReceived) {
                telemetry.reportError('SSE stall (20s)', { type: 'sse_stall', completedCards, totalCards });
                if (retryCount < MAX_RETRIES && currentImageBase64) {
                    retryCount++;
                    startPipelineInner(currentImageBase64);
                } else {
                    showError('Connection lost. Please try again.');
                }
            }
        }, 20000);
    }

    // ============================================================
    //  SSE EVENT HANDLERS
    // ============================================================

    const PHASE_LABELS = {
        classifying: 'Analyzing screenshot...',
        designing: 'Designing layout...',
        researching: 'Researching...',
        enhancing: 'Enhancing cards...',
        reviewing: 'Finalizing...',
    };

    function handleSSE(evt, data) {
        switch (evt) {
            case 'connected':
                updateProgress(35, 'ANALYZING', 'Quick analysis starting...');
                break;

            case 'progress': {
                const label = PHASE_LABELS[data.phase] || data.message || 'Working...';
                const pct = data.progress ? 30 + (data.progress / 100) * 57 : null;
                if (pct) updateProgress(pct, 'ANALYZING', label);
                else progressLabel.textContent = label;
                if (data.phase === 'enhancing' || data.phase === 'researching' || data.phase === 'reviewing') {
                    const hp = data.progress || 0;
                    headerProgressFill.style.width = hp + '%';
                    headerProgressText.textContent = data.phase === 'reviewing' ? 'Finalizing...' : `${data.phase}...`;
                }
                break;
            }

            case 'blueprint':
                onBlueprint(data);
                break;

            case 'layout_preview':
                onLayoutPreview(data);
                break;

            case 'layout_update':
                onLayoutUpdate(data);
                break;

            case 'card':
                onCard(data);
                break;

            case 'card_update':
                onCardUpdate(data);
                break;

            case 'card_add':
                onCardAdd(data);
                break;

            case 'phase':
                if (data.phase && PHASE_LABELS[data.phase]) {
                    progressLabel.textContent = PHASE_LABELS[data.phase];
                }
                break;

            case 'complete':
                onComplete(data);
                break;
        }
    }

    function onBlueprint(data) {
        blueprintReceived = true;
        if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
        completionTimeout = setTimeout(() => {
            if (!pipelineComplete) {
                telemetry.reportError('Pipeline timeout (90s)', { type: 'completion_timeout' });
                showError('Analysis is taking too long. Please try again.');
            }
        }, 90000);
        pendingBlueprint = data;
        totalCards = data.cards?.length || 0;
        const ct = data.contentAnalysis?.contentType || 'general';
        contentBadge.textContent = contentLabel(ct);
        updateProgress(40, 'ANALYZING', 'Designing cards...');
    }

    function onLayoutPreview(data) {
        totalCards = data.cards?.length || totalCards;
        if (data.contentAnalysis) {
            contentBadge.textContent = contentLabel(data.contentAnalysis.contentType);
            renderFollowUp(data.contentAnalysis);
        }
        updateProgress(55, 'ANALYZING', 'Populating cards...');
    }

    function onLayoutUpdate(data) {
        stopAnalysisTick();
        cardGrid.innerHTML = '';

        const allCards = data.cards || [];
        totalCards = allCards.length;

        allCards.forEach(card => {
            const el = createCard(card);
            if (card.populatedData || card.data) {
                renderCardInto(el, card.cardType, card.populatedData || card.data);
                el.classList.add('visible');
                populatedCardIds.add(card.id);
                completedCards++;
            } else {
                renderSkeleton(el, card.cardType);
                el.classList.add('visible');
            }
            cardGrid.appendChild(el);
        });

        if (data.contentAnalysis) {
            contentBadge.textContent = contentLabel(data.contentAnalysis.contentType);
            renderFollowUp(data.contentAnalysis);
        }

        screenshotLayer.classList.add('hidden');
        progressOverlay.classList.remove('active');
        results.classList.add('visible');
    }

    function onCard(data) {
        const id = data.cardId;
        if (populatedCardIds.has(id)) return;
        populatedCardIds.add(id);
        completedCards++;

        const el = document.getElementById(`card-${id}`);
        if (el) {
            renderCardInto(el, data.cardType, data.data);
            el.classList.remove('loading');
            el.classList.add('just-populated');
            setTimeout(() => el.classList.remove('just-populated'), 400);
        }

        const pct = 60 + (completedCards / Math.max(totalCards, 1)) * 35;
        headerProgressFill.style.width = Math.min(pct, 95) + '%';
        headerProgressText.textContent = `${completedCards}/${totalCards}`;
    }

    function onCardUpdate(data) {
        const el = document.getElementById(`card-${data.cardId}`);
        if (!el) return;
        const existing = el._cardData || {};
        const merged = { ...existing, ...data.data };
        renderCardInto(el, data.cardType, merged);
    }

    function onCardAdd(data) {
        totalCards++;
        const card = {
            id: data.cardId,
            cardType: data.cardType,
            gridPosition: data.gridPosition || {},
        };
        const el = createCard(card);
        renderCardInto(el, data.cardType, data.data);
        el.classList.add('visible', 'just-populated');
        cardGrid.appendChild(el);
        populatedCardIds.add(data.cardId);
        completedCards++;
        setTimeout(() => el.classList.remove('just-populated'), 400);
    }

    function onComplete() {
        pipelineComplete = true;
        if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
        if (completionTimeout) { clearTimeout(completionTimeout); completionTimeout = null; }
        if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
        stopAnalysisTick();
        screenshotLayer.classList.add('hidden');
        progressOverlay.classList.remove('active');
        results.classList.add('visible');
        headerProgress.style.display = 'none';

        sendRenderCapture();
    }

    // ============================================================
    //  CARD CREATION & RENDERING
    // ============================================================

    function createCard(card) {
        const el = document.createElement('div');
        el.id = `card-${card.id}`;
        el.className = 'card';
        el.dataset.type = card.cardType;

        const span = card.gridPosition?.columnSpan || 1;
        if (span >= 3 || FULL_WIDTH.has(card.cardType)) el.classList.add('span-full');
        else if (span === 2 || TWO_COL.has(card.cardType)) el.classList.add('span-2');

        return el;
    }

    function renderSkeleton(el, cardType) {
        const meta = CARD_META[cardType] || DEFAULT_META;
        el.classList.add('loading');
        el.innerHTML = `
            ${meta.label ? `<div class="card-head">
                <div class="card-head-icon" style="background:${meta.bg}"><span class="icon" style="color:${meta.color};font-size:16px">${meta.icon}</span></div>
                ${meta.label}
            </div>` : ''}
            <div class="card-body">
                <div class="skeleton w80"></div>
                <div class="skeleton w60"></div>
                <div class="skeleton w40"></div>
            </div>
        `;
    }

    function renderCardInto(el, cardType, data) {
        const d = data || {};
        el._cardData = d;
        el.classList.remove('loading');
        const meta = CARD_META[cardType] || DEFAULT_META;

        const head = meta.label ? `<div class="card-head">
            <div class="card-head-icon" style="background:${meta.bg}"><span class="icon" style="color:${meta.color};font-size:16px">${meta.icon}</span></div>
            ${esc(meta.label)}
        </div>` : '';

        let body = '';
        switch (cardType) {
            case 'hero_summary':
                body = renderHero(d); break;
            case 'key_metric':
                body = renderMetric(d); break;
            case 'info_list':
                body = renderInfoList(d); break;
            case 'fact_check':
                body = renderFactCheck(d); break;
            case 'verification_card':
                body = renderVerification(d); break;
            case 'person_card':
                body = renderPerson(d); break;
            case 'product_card':
                body = renderProduct(d); break;
            case 'quote_card':
                body = renderQuote(d); break;
            case 'timeline_card':
                body = renderTimeline(d); break;
            case 'warning_card':
                body = renderWarning(d); break;
            case 'action_card':
                body = renderActions(d); break;
            case 'text_extract':
                body = renderTextExtract(d); break;
            case 'news_card':
                body = renderNews(d); break;
            case 'did_you_know_card':
                body = renderDidYouKnow(d); break;
            case 'chart_card':
                body = renderChart(d); break;
            case 'comparison_card':
                body = renderComparison(d); break;
            case 'location_card':
            case 'map_card':
                body = renderLocation(d); break;
            case 'link_card':
                body = renderLinks(d); break;
            case 'chat_card':
                body = renderChat(d); break;
            case 'order_card':
                body = renderOrder(d); break;
            case 'source_card':
                body = renderSource(d); break;
            case 'stats_grid_card':
                body = renderStatsGrid(d); break;
            case 'gallery_card':
                body = renderGallery(d); break;
            default:
                body = renderGeneric(d); break;
        }

        const foot = buildFooter(d);
        el.innerHTML = head + `<div class="card-body">${body}</div>` + foot;
    }

    function buildFooter(d) {
        const links = [];
        if (d.url) links.push({ href: d.url, label: 'Source', icon: 'open_in_new' });
        if (d.mapUrl) links.push({ href: d.mapUrl, label: 'Map', icon: 'map' });
        if (d.profileUrl) links.push({ href: d.profileUrl, label: 'Profile', icon: 'person' });
        if (d.sourceUrl && d.sourceUrl !== d.url) links.push({ href: d.sourceUrl, label: d.source || 'Source', icon: 'link' });
        (d.citations || []).forEach(c => {
            if (c.url) links.push({ href: c.url, label: c.title || c.domain || 'Link', icon: 'link' });
        });
        if (!links.length) return '';
        return `<div class="card-foot">${links.map(l =>
            `<a href="${esc(l.href)}" target="_blank" rel="noopener noreferrer"><span class="icon">${l.icon}</span> ${esc(l.label)}</a>`
        ).join('')}</div>`;
    }

    // ---- Individual card renderers ----

    function renderHero(d) {
        return `
            ${d.emoji ? `<div style="font-size:2rem;margin-bottom:8px">${esc(d.emoji)}</div>` : ''}
            ${d.badge ? `<div class="badge badge-accent" style="margin-bottom:10px">${esc(d.badge)}</div>` : ''}
            <div class="card-title">${esc(d.title || 'Analysis')}</div>
            <div class="card-subtitle">${linkify(d.subtitle || '')}</div>
            ${d.takeaway ? `<div class="callout">${linkify(d.takeaway)}</div>` : ''}
        `;
    }

    function renderMetric(d) {
        const trend = d.trend && d.trend !== 'none' ? d.trend : null;
        const trendClass = trend === 'up' ? 'badge-green' : trend === 'down' ? 'badge-red' : 'badge-accent';
        return `
            <div class="metric-label">${esc(d.label || '')}</div>
            <div class="metric-value" ${d.color ? `style="color:${esc(d.color)}"` : ''}>${esc((d.unit && d.unit.length === 1 ? d.unit : '') + (d.value || '—'))}</div>
            ${trend ? `<div style="margin-top:8px"><span class="badge ${trendClass}">${esc(trend)}</span></div>` : ''}
            ${d.context ? `<div class="card-subtitle" style="margin-top:8px">${linkify(d.context)}</div>` : ''}
        `;
    }

    function renderInfoList(d) {
        const items = d.items || [];
        if (!items.length) return `<div class="card-subtitle">No details available</div>`;
        return `
            ${d.title ? `<div style="font-weight:700;font-size:0.9rem;margin-bottom:10px">${esc(d.title)}</div>` : ''}
            ${items.map(item => {
                if (typeof item === 'object' && item !== null) {
                    const label = item.label || item.name || item.key || '';
                    const value = item.value || item.description || item.text || '';
                    return `<div class="kv-row">
                        <span class="kv-label">${esc(label)}</span>
                        <span class="kv-value">${linkify(value)}</span>
                    </div>`;
                }
                return `<div class="kv-row"><span class="kv-value">${linkify(item)}</span></div>`;
            }).join('')}
        `;
    }

    function renderFactCheck(d) {
        const v = d.verdict || 'unverified';
        const cfg = {
            verified: { badge: 'badge-green', label: 'Verified', icon: 'check_circle' },
            false: { badge: 'badge-red', label: 'False', icon: 'cancel' },
            misleading: { badge: 'badge-yellow', label: 'Misleading', icon: 'warning' },
            partially_true: { badge: 'badge-yellow', label: 'Partially True', icon: 'change_circle' },
            needs_context: { badge: 'badge-purple', label: 'Needs Context', icon: 'help' },
            unverified: { badge: 'badge-muted', label: 'Unverified', icon: 'help' },
        };
        const c = cfg[v] || cfg.unverified;
        return `
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
                <span class="icon icon-fill" style="font-size:24px;color:var(--${v === 'verified' ? 'green' : v === 'false' ? 'red' : 'yellow'})">${c.icon}</span>
                <span class="badge ${c.badge}">${c.label}</span>
            </div>
            ${d.claim ? `<div class="card-subtitle" style="font-style:italic;margin-bottom:8px">${linkify(d.claim)}</div>` : ''}
            ${d.explanation ? `<div class="card-subtitle" style="font-size:0.8rem">${linkify(d.explanation)}</div>` : ''}
        `;
    }

    function renderVerification(d) {
        const st = d.status || 'searching';
        const statusMap = {
            searching: { label: 'Searching...', badge: 'badge-accent' },
            verified: { label: 'Verified', badge: 'badge-green' },
            denied: { label: 'Denied', badge: 'badge-red' },
            partially_verified: { label: 'Partially Verified', badge: 'badge-yellow' },
            unconfirmed: { label: 'Unconfirmed', badge: 'badge-muted' },
            conflicting: { label: 'Conflicting', badge: 'badge-yellow' },
        };
        const sc = statusMap[st] || statusMap.searching;
        const sourceIcons = {
            confirmed: { icon: 'check_circle', color: 'var(--green)' },
            denied: { icon: 'cancel', color: 'var(--red)' },
            checking: { icon: 'hourglass_top', color: 'var(--text-muted)' },
            not_yet_reported: { icon: 'schedule', color: 'var(--text-muted)' },
            no_info: { icon: 'remove_circle_outline', color: 'var(--text-muted)' },
        };
        return `
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
                <span class="badge ${sc.badge}">${sc.label}</span>
            </div>
            ${d.claim ? `<div class="card-subtitle" style="font-style:italic;margin-bottom:12px">${linkify(d.claim)}</div>` : ''}
            ${(d.sources || []).map(src => {
                const s = typeof src === 'object' ? src : { name: String(src), status: 'checking' };
                const si = sourceIcons[s.status] || sourceIcons.checking;
                return `<div class="source-row">
                    <span class="icon icon-fill" style="color:${si.color}">${si.icon}</span>
                    <div class="source-row-body">
                        <div class="source-name">${esc(s.name || 'Source')}</div>
                        ${s.snippet ? `<div class="source-snippet">${linkify(s.snippet)}</div>` : ''}
                        ${s.url ? `<a class="source-url" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc((() => { try { return new URL(s.url).hostname; } catch { return 'source'; } })())}</a>` : ''}
                    </div>
                </div>`;
            }).join('')}
            ${d.summary ? `<div class="callout" style="margin-top:12px">${linkify(d.summary)}</div>` : ''}
            ${d.lastChecked ? `<div style="font-size:0.72rem;color:var(--text-muted);margin-top:8px">Last checked: ${esc(d.lastChecked)}</div>` : ''}
        `;
    }

    function renderPerson(d) {
        const initial = d.name ? d.name[0].toUpperCase() : '?';
        const hasPhoto = d.photoUrl && typeof d.photoUrl === 'string' && d.photoUrl.startsWith('http');
        return `
            <div class="avatar-row">
                <div class="avatar" ${hasPhoto ? '' : `style="background:var(--purple-dim);color:var(--purple)"`}>
                    ${hasPhoto ? `<img src="${esc(d.photoUrl)}" alt="${esc(d.name)}" onerror="this.style.display='none';this.parentElement.textContent='${esc(initial)}'">` : esc(d.emoji || initial)}
                </div>
                <div class="avatar-info">
                    <div class="avatar-name">${esc(d.name || 'Unknown')}</div>
                    ${d.role ? `<div class="avatar-sub">${esc(d.role)}</div>` : ''}
                    ${d.handle ? `<div class="avatar-sub" style="color:var(--accent)">${esc(d.handle)}</div>` : ''}
                </div>
            </div>
            ${d.context ? `<div class="card-subtitle">${linkify(d.context)}</div>` : ''}
            ${d.notableInfo ? `<div class="callout">${linkify(d.notableInfo)}</div>` : ''}
        `;
    }

    function renderProduct(d) {
        const features = (d.features || []).map(f => typeof f === 'object' ? (f.name || f.label || f.text || String(f)) : String(f)).slice(0, 6);
        const warnings = (d.warnings || []).map(w => typeof w === 'object' ? (w.name || w.label || w.text || String(w)) : String(w)).slice(0, 3);
        return `
            <div style="display:flex;gap:12px;margin-bottom:12px">
                ${d.emoji ? `<div style="font-size:2rem">${esc(d.emoji)}</div>` : ''}
                <div>
                    <div style="font-weight:700;font-size:1rem;color:var(--text)">${esc(d.name || 'Product')}</div>
                    ${d.price ? `<div style="font-size:1.2rem;font-weight:800;color:var(--green)">${esc(d.price)}</div>` : ''}
                    ${d.rating ? `<div style="font-size:0.82rem;color:var(--yellow)">★ ${esc(d.rating)}</div>` : ''}
                </div>
            </div>
            ${features.length ? `<ul class="bullet-list green">${features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
            ${d.verdict ? `<div class="callout callout-green" style="margin-top:12px">${linkify(d.verdict)}</div>` : ''}
            ${warnings.length ? `<ul class="bullet-list yellow" style="margin-top:10px">${warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
        `;
    }

    function renderQuote(d) {
        return `
            <div class="quote-mark">\u201C</div>
            <div class="quote-text">${linkify(d.quote || '')}</div>
            ${d.attribution ? `<div class="quote-attr">\u2014 ${esc(d.attribution)}</div>` : ''}
            ${d.context ? `<div class="card-subtitle" style="margin-top:8px;font-size:0.78rem">${linkify(d.context)}</div>` : ''}
        `;
    }

    function renderTimeline(d) {
        const events = d.events || [];
        return `
            ${d.title ? `<div style="font-weight:700;font-size:0.9rem;margin-bottom:12px">${esc(d.title)}</div>` : ''}
            <div class="timeline">
                ${events.map((ev, i) => {
                    const e = typeof ev === 'object' ? ev : { event: String(ev) };
                    const text = e.event || e.text || e.description || '';
                    return `<div class="timeline-item">
                        <div class="timeline-dot-col">
                            <div class="timeline-dot ${e.highlight ? 'active' : ''}"></div>
                            <div class="timeline-line"></div>
                        </div>
                        <div style="min-width:0">
                            ${e.date ? `<div class="timeline-date">${esc(e.date)}</div>` : ''}
                            <div class="timeline-text">${linkify(text)}</div>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        `;
    }

    function renderWarning(d) {
        const level = d.level || 'warning';
        const cls = level === 'critical' ? 'error' : level === 'info' ? 'info' : 'warn';
        const icon = level === 'critical' ? 'error' : level === 'info' ? 'info' : 'warning';
        return `
            <div class="alert-box ${cls}">
                <span class="icon icon-fill">${icon}</span>
                <div>
                    <div class="alert-title">${esc(d.title || 'Warning')}</div>
                    ${d.details ? `<div class="alert-detail">${linkify(d.details)}</div>` : ''}
                    ${d.advice ? `<div class="callout" style="margin-top:8px">${linkify(d.advice)}</div>` : ''}
                </div>
            </div>
        `;
    }

    function renderActions(d) {
        const actions = d.actions || [];
        return `
            ${d.title ? `<div style="font-weight:700;font-size:0.9rem;margin-bottom:12px">${esc(d.title)}</div>` : ''}
            <ol style="list-style:none;display:flex;flex-direction:column;gap:10px">
                ${actions.map((a, i) => {
                    const o = typeof a === 'object' ? a : { label: String(a) };
                    return `<li style="display:flex;gap:10px;align-items:flex-start">
                        <div style="width:24px;height:24px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0">${i+1}</div>
                        <div>
                            <div style="font-size:0.85rem;font-weight:500;color:var(--text)">${o.url ? `<a href="${esc(o.url)}" target="_blank">${esc(o.label || o.name || '')}</a>` : esc(o.label || o.name || '')}</div>
                            ${o.description ? `<div class="card-subtitle" style="font-size:0.78rem">${linkify(o.description)}</div>` : ''}
                        </div>
                    </li>`;
                }).join('')}
            </ol>
        `;
    }

    function renderTextExtract(d) {
        return `
            ${d.title ? `<div style="font-weight:700;font-size:0.9rem;margin-bottom:10px">${esc(d.title)}</div>` : ''}
            <div style="font-family:monospace;font-size:0.82rem;background:var(--surface-2);padding:12px;border-radius:var(--radius-sm);white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto;line-height:1.6;color:var(--text-secondary)">${linkify(d.text || '')}</div>
        `;
    }

    function renderNews(d) {
        return `
            ${d.category ? `<div class="badge badge-accent" style="margin-bottom:10px">${esc(d.category)}</div>` : ''}
            <div style="font-weight:700;font-size:1rem;margin-bottom:4px;color:var(--text)">${esc(d.headline || 'News')}</div>
            <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:8px">
                ${d.source ? `<span style="font-weight:600">${esc(d.source)}</span>` : ''}
                ${d.date ? ` · ${esc(d.date)}` : ''}
            </div>
            ${d.summary ? `<div class="card-subtitle">${linkify(d.summary)}</div>` : ''}
            ${d.relatedContext ? `<div class="callout" style="margin-top:10px">${linkify(d.relatedContext)}</div>` : ''}
        `;
    }

    function renderDidYouKnow(d) {
        return `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                <span style="font-size:1.3rem">${esc(d.emoji || '💡')}</span>
                <span style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--yellow)">Did you know?</span>
            </div>
            <div class="card-subtitle">${linkify(d.fact || '')}</div>
        `;
    }

    const CHART_COLORS = ['#5b8af5','#34d399','#fbbf24','#f87171','#a78bfa','#f472b6','#38bdf8','#fb923c'];

    function renderChart(d) {
        const items = Array.isArray(d.data) ? d.data : [];
        if (!items.length) return '<div class="card-subtitle">No data</div>';
        const max = Math.max(...items.map(i => typeof i.value === 'number' ? i.value : 0), 1);
        const unit = d.unit || '';
        return `
            ${d.title ? `<div style="font-weight:700;font-size:0.9rem;margin-bottom:12px">${esc(d.title)}</div>` : ''}
            <div class="bar-chart">
                ${items.slice(0, 8).map((item, i) => {
                    const pct = Math.round((item.value / max) * 100);
                    const color = item.color || CHART_COLORS[i % CHART_COLORS.length];
                    return `<div>
                        <div class="bar-row-label"><span>${esc(item.label || '')}</span><span>${item.value}${unit}</span></div>
                        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
                    </div>`;
                }).join('')}
            </div>
            ${d.insight ? `<div class="callout" style="margin-top:12px">${linkify(d.insight)}</div>` : ''}
        `;
    }

    function renderComparison(d) {
        if (!d.columns?.length) return `<div class="card-subtitle">No comparison data</div>`;
        const maxRows = Math.max(...d.columns.map(c => (c.values || []).length), 0);
        return `
            ${d.title ? `<div style="font-weight:700;font-size:0.9rem;margin-bottom:12px">${esc(d.title)}</div>` : ''}
            <div style="overflow-x:auto">
                <table style="width:100%;border-collapse:collapse;font-size:0.82rem">
                    <thead><tr>
                        ${d.rows ? '<th style="padding:6px 8px;text-align:left;color:var(--text-muted);border-bottom:1px solid var(--border)"></th>' : ''}
                        ${d.columns.map(c => `<th style="padding:6px 8px;text-align:left;color:var(--accent);font-weight:700;border-bottom:1px solid var(--border)">${esc(typeof c === 'object' ? (c.header || c.name || '') : c)}</th>`).join('')}
                    </tr></thead>
                    <tbody>${Array.from({length: maxRows}, (_, i) => `<tr>
                        ${d.rows ? `<td style="padding:6px 8px;color:var(--text-muted);border-bottom:1px solid var(--border)">${esc(Array.isArray(d.rows) ? d.rows[i] || '' : '')}</td>` : ''}
                        ${d.columns.map(c => `<td style="padding:6px 8px;border-bottom:1px solid var(--border)">${linkify((c.values || [])[i] || '')}</td>`).join('')}
                    </tr>`).join('')}</tbody>
                </table>
            </div>
        `;
    }

    function renderLocation(d) {
        const mapsUrl = d.mapUrl || (d.name ? `https://maps.google.com/?q=${encodeURIComponent(d.name)}` : '');
        return `
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                <span class="icon icon-fill" style="font-size:24px;color:var(--accent)">${d.emoji || 'location_on'}</span>
                <div>
                    <div style="font-weight:700;font-size:0.95rem;color:var(--text)">${esc(d.name || 'Location')}</div>
                    ${d.address ? `<div style="font-size:0.78rem;color:var(--text-muted)">${esc(d.address)}</div>` : ''}
                </div>
            </div>
            ${d.context ? `<div class="card-subtitle">${linkify(d.context)}</div>` : ''}
        `;
    }

    function renderLinks(d) {
        return `
            ${d.title ? `<div style="font-weight:700;font-size:0.9rem;margin-bottom:12px">${esc(d.title)}</div>` : ''}
            <div style="display:flex;flex-direction:column;gap:8px">
                ${(d.links || []).map(link => {
                    const l = typeof link === 'object' ? link : { label: String(link), url: '' };
                    return `<div style="display:flex;align-items:flex-start;gap:10px">
                        <span class="icon" style="font-size:18px;color:var(--accent);flex-shrink:0;margin-top:2px">link</span>
                        <div>
                            ${l.url ? `<a href="${esc(l.url)}" target="_blank" style="font-size:0.85rem;font-weight:500">${esc(l.label || l.url)}</a>` : `<span style="font-size:0.85rem">${esc(l.label || '')}</span>`}
                            ${l.description ? `<div style="font-size:0.75rem;color:var(--text-muted)">${esc(l.description)}</div>` : ''}
                        </div>
                    </div>`;
                }).join('')}
            </div>
        `;
    }

    function renderChat(d) {
        return `
            ${d.title ? `<div style="font-weight:700;font-size:0.9rem;margin-bottom:12px">${esc(d.title)}</div>` : ''}
            <div style="display:flex;flex-direction:column;gap:6px">
                ${(d.messages || []).map(msg => {
                    const m = typeof msg === 'object' ? msg : { text: String(msg), sender: '' };
                    const align = m.isUser ? 'flex-end' : 'flex-start';
                    const bg = m.isUser ? 'var(--accent-dim)' : 'var(--surface-2)';
                    return `<div style="display:flex;flex-direction:column;align-items:${align}">
                        ${m.sender ? `<div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:2px">${esc(m.sender)}</div>` : ''}
                        <div style="background:${bg};padding:8px 12px;border-radius:12px;font-size:0.85rem;max-width:80%;color:var(--text)">${linkify(m.text || '')}</div>
                    </div>`;
                }).join('')}
            </div>
        `;
    }

    function renderOrder(d) {
        return `
            ${d.title ? `<div style="font-weight:700;font-size:0.9rem;margin-bottom:10px">${esc(d.title)}</div>` : ''}
            ${(d.items || []).map(item => {
                const o = typeof item === 'object' ? item : { name: String(item) };
                return `<div class="kv-row">
                    <span class="kv-label">${o.quantity ? `${o.quantity}× ` : ''}${esc(o.name || '')}</span>
                    ${o.price ? `<span class="kv-value">${esc(o.price)}</span>` : ''}
                </div>`;
            }).join('')}
            ${d.total ? `<div style="display:flex;justify-content:space-between;padding-top:10px;margin-top:4px;border-top:2px solid var(--border)">
                <span style="font-weight:700;font-size:0.9rem">Total</span>
                <span style="font-weight:800;font-size:1.1rem;color:var(--accent)">${esc(d.total)}</span>
            </div>` : ''}
        `;
    }

    function renderSource(d) {
        const hasImg = d.imageUrl && typeof d.imageUrl === 'string' && d.imageUrl.startsWith('http');
        return `
            <div class="avatar-row">
                <div class="avatar">
                    ${hasImg ? `<img src="${esc(d.imageUrl)}" alt="" onerror="this.style.display='none'">` : `<span class="icon">source</span>`}
                </div>
                <div class="avatar-info">
                    <div class="avatar-name">${esc(d.name || 'Source')}</div>
                    ${d.type ? `<div class="avatar-sub">${esc(d.type)}</div>` : ''}
                </div>
            </div>
            ${d.context ? `<div class="card-subtitle">${linkify(d.context)}</div>` : ''}
            ${d.credibility ? `<div style="margin-top:8px"><span class="badge ${d.credibility === 'high' ? 'badge-green' : d.credibility === 'low' ? 'badge-red' : 'badge-yellow'}">${esc(d.credibility)} credibility</span></div>` : ''}
        `;
    }

    function renderStatsGrid(d) {
        return `
            ${d.title ? `<div style="font-weight:700;font-size:0.9rem;margin-bottom:12px">${esc(d.title)}</div>` : ''}
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
                ${(d.stats || []).map(s => {
                    const o = typeof s === 'object' ? s : { label: String(s), value: '' };
                    return `<div style="background:var(--surface-2);padding:12px;border-radius:var(--radius-sm)">
                        ${o.emoji ? `<div style="font-size:1.2rem;margin-bottom:4px">${esc(o.emoji)}</div>` : ''}
                        <div style="font-size:0.72rem;color:var(--text-muted)">${esc(o.label || '')}</div>
                        <div style="font-size:1.1rem;font-weight:800;color:var(--accent)">${esc(o.value || '—')}</div>
                    </div>`;
                }).join('')}
            </div>
        `;
    }

    function renderGallery(d) {
        return `
            ${d.title ? `<div style="font-weight:700;font-size:0.9rem;margin-bottom:12px">${esc(d.title)}</div>` : ''}
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
                ${(d.images || []).slice(0, 6).map(img => {
                    const o = typeof img === 'object' ? img : { url: String(img) };
                    return `<div style="aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-2)">
                        <img src="${esc(o.url || '')}" alt="${esc(o.caption || '')}" style="width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.style.display='none'">
                    </div>`;
                }).join('')}
            </div>
        `;
    }

    function renderGeneric(d) {
        const entries = Object.entries(d).filter(([k,v]) => v != null && !['citations','url','sourceUrl','mapUrl','profileUrl'].includes(k));
        if (!entries.length) return '<div class="card-subtitle">No data available</div>';
        return entries.map(([k, v]) => {
            const label = k.replace(/([A-Z])/g, ' $1').replace(/[_-]/g, ' ').trim();
            const display = typeof v === 'object' ? JSON.stringify(v) : String(v);
            return `<div class="kv-row">
                <span class="kv-label">${esc(label)}</span>
                <span class="kv-value">${linkify(display)}</span>
            </div>`;
        }).join('');
    }

    // ============================================================
    //  FOLLOW-UP QUESTIONS
    // ============================================================

    function renderFollowUp(contentAnalysis) {
        const qs = contentAnalysis.followUpQuestions || [];
        const topQ = contentAnalysis.topQuestions || [];
        const all = [];
        qs.forEach(q => {
            if (typeof q === 'object' && q.question) all.push({ q: q.question, a: q.answer || '' });
            else if (typeof q === 'string') all.push({ q, a: '' });
        });
        topQ.forEach(q => { if (!all.some(a => a.q === q)) all.push({ q, a: '' }); });
        if (!all.length) return;

        followUpSection.style.display = '';
        followUpList.innerHTML = '';
        all.slice(0, 5).forEach(item => {
            const div = document.createElement('div');
            div.className = 'fq-item';
            div.innerHTML = `
                <div class="fq-question"><span class="icon">add</span><div>${esc(item.q)}</div></div>
                <div class="fq-answer"><div class="fq-answer-inner">${item.a ? linkify(item.a) : '<span style="color:var(--text-muted);font-style:italic">Tap to expand...</span>'}</div></div>
            `;
            div.querySelector('.fq-question').addEventListener('click', () => div.classList.toggle('open'));
            followUpList.appendChild(div);
        });
    }

    // ============================================================
    //  RENDER CAPTURE (for reports)
    // ============================================================

    function sendRenderCapture() {
        try {
            const rid = telemetry.requestId;
            if (!rid || !cardGrid.children.length) return;
            const payload = JSON.stringify({
                requestId: rid,
                cardHtml: cardGrid.outerHTML,
                clientState: {
                    viewport: { width: innerWidth, height: innerHeight, devicePixelRatio: devicePixelRatio || 2 },
                    screen: { width: screen.width, height: screen.height },
                    cards: { total: cardGrid.children.length, populated: cardGrid.querySelectorAll('.card:not(.loading)').length },
                    userAgent: navigator.userAgent,
                },
            });
            navigator.sendBeacon('/api/hub/v2/render-capture', new Blob([payload], { type: 'application/json' }));
        } catch {}

        setTimeout(() => asyncRenderCapture(), 500);
    }

    async function asyncRenderCapture() {
        try {
            const rid = telemetry.requestId;
            if (!rid) return;
            await waitForCards();

            if (typeof html2canvas === 'function') {
                const canvas = await html2canvas(cardGrid, {
                    backgroundColor: '#08090d',
                    scale: 2,
                    useCORS: true,
                    logging: false,
                });
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                const base64 = dataUrl.replace(/^data:image\/\w+;base64,/, '');
                await fetch('/api/hub/v2/render-capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requestId: rid, image: base64 }),
                });
            }
        } catch (e) { console.warn('Render capture failed:', e); }
    }

    function waitForCards() {
        return new Promise(resolve => {
            let checks = 0;
            const poll = () => {
                if (!cardGrid.querySelector('.card.loading') || checks++ > 20) resolve();
                else setTimeout(poll, 500);
            };
            poll();
        });
    }

    // ============================================================
    //  ERROR & RESET
    // ============================================================

    function showError(msg) {
        errorState.textContent = msg;
        errorState.classList.add('active');
        setTimeout(() => errorState.classList.remove('active'), 6000);
    }

    function reset() {
        if (currentImageUrl) { URL.revokeObjectURL(currentImageUrl); currentImageUrl = null; }
        currentImageBase64 = null;
        currentThumbBase64 = null;
        totalCards = 0;
        completedCards = 0;
        blueprintReceived = false;
        pipelineComplete = false;
        firstCardShown = false;
        pendingBlueprint = null;
        populatedCardIds.clear();
        retryCount = 0;
        if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
        if (completionTimeout) { clearTimeout(completionTimeout); completionTimeout = null; }
        if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
        stopAnalysisTick();
        if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

        pasteScreen.classList.remove('hidden');
        mainCanvas.classList.remove('active');
        screenshotLayer.classList.remove('hidden');
        progressOverlay.classList.remove('active');
        updateProgress(0, 'UPLOADING', 'Compressing...');
        results.classList.remove('visible');
        errorState.classList.remove('active');
        cardGrid.innerHTML = '';
        followUpSection.style.display = 'none';
        followUpList.innerHTML = '';
        headerProgress.style.display = '';
        headerProgressFill.style.width = '0%';
        demoBtn.classList.remove('loading');
    }

    // ============================================================
    //  EVENT LISTENERS
    // ============================================================

    backBtn.addEventListener('click', reset);
    pasteZone.addEventListener('click', readClipboard);
    uploadBtn.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', (e) => {
        const f = e.target.files?.[0];
        if (f && f.type.startsWith('image/')) handleImage(f);
        photoInput.value = '';
    });

    document.addEventListener('paste', (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (const item of items) {
            if (item.type.startsWith('image/')) {
                e.preventDefault();
                handleImage(item.getAsFile());
                return;
            }
        }
    });

    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => {
        e.preventDefault();
        const f = e.dataTransfer?.files?.[0];
        if (f && f.type.startsWith('image/')) handleImage(f);
    });

    if (navigator.clipboard?.read) {
        navigator.permissions?.query?.({ name: 'clipboard-read' })
            .then(r => { if (r.state === 'granted') readClipboard(); })
            .catch(() => {});
    }

    demoBtn.addEventListener('click', async () => {
        demoBtn.classList.add('loading');
        try {
            const resp = await fetch('/api/example-image?url=' + encodeURIComponent(DEMO_URL));
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const blob = await resp.blob();
            if (!blob.type.startsWith('image/')) throw new Error('Not an image');
            handleImage(blob);
        } catch {
            demoBtn.classList.remove('loading');
            showError('Could not load demo image. Paste a screenshot instead.');
        }
    });

})();
</script>
</body>
</html>
