<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>thinx.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #08090d;
            --bg-raised: #0d0f14;
            --surface: #12151c;
            --surface-2: #181c26;
            --surface-3: #1f2533;
            --surface-bright: #283040;
            --border: #1a1f2e;
            --border-bright: #252d40;
            --text: #e4e8f0;
            --text-secondary: #8892a6;
            --text-muted: #545e72;
            --accent: #5b8af5;
            --accent-dim: #3b6ad5;
            --accent-bg: rgba(91,138,245,0.10);
            --accent-bg-strong: rgba(91,138,245,0.18);
            --green: #4cd68a;
            --green-bg: rgba(76,214,138,0.12);
            --green-dim: #2a8a50;
            --red: #f06060;
            --red-bg: rgba(240,96,96,0.12);
            --yellow: #f0c040;
            --yellow-bg: rgba(240,192,64,0.10);
            --purple: #a07ef0;
            --purple-bg: rgba(160,126,240,0.10);
            --orange: #f09040;
            --orange-bg: rgba(240,144,64,0.10);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --radius-pill: 100px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
            --glass: rgba(18,21,28,0.75);
            --glass-border: rgba(255,255,255,0.06);
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* === PASTE STATE === */
        #pasteState {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
            background: var(--bg);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #pasteState.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .paste-zone {
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            border: 2px dashed var(--border-bright);
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--surface);
        }

        .paste-zone:hover, .paste-zone:active {
            border-color: var(--accent);
            background: var(--accent-bg);
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(91,138,245,0.12);
        }

        .paste-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-bg-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .paste-icon .material-symbols-rounded {
            font-size: 30px;
            color: var(--accent);
        }

        .paste-zone:hover .paste-icon {
            background: var(--accent);
        }

        .paste-zone:hover .paste-icon .material-symbols-rounded {
            color: #fff;
        }

        .paste-text {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text);
        }

        .paste-hint {
            margin-top: 1.5rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* === EXAMPLE IMAGES === */
        .examples-section {
            margin-top: 2.5rem;
            width: 100%;
            max-width: 400px;
            padding: 0 16px;
        }

        .examples-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .examples-divider::before,
        .examples-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .examples-divider span {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .example-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 10px 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .example-card:hover {
            border-color: var(--accent-dim);
            background: var(--accent-bg);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .example-card:active { transform: scale(0.97); }

        .example-card.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .example-card.loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(91,138,245,0.06) 50%, transparent 100%);
            animation: shimmer 1.5s ease-in-out infinite;
        }

        .example-thumb {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .example-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        .example-thumb .material-symbols-rounded {
            font-size: 24px;
            color: var(--text-muted);
        }

        .example-label {
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.3;
        }

        .example-category {
            font-size: 0.56rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            padding: 2px 6px;
            background: var(--surface-2);
            border-radius: var(--radius-pill);
        }

        @media (max-width: 360px) {
            .examples-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* === MAIN CANVAS === */
        #mainCanvas {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: none;
        }

        #mainCanvas.active { display: block; }

        .screenshot-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screenshot-layer img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screenshot-layer.scanning img {
            opacity: 0.35;
            filter: brightness(0.7) blur(2px);
        }

        .screenshot-layer.fading { opacity: 0.06; }
        .screenshot-layer.gone { opacity: 0; pointer-events: none; }

        /* Progress overlay */
        .progress-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .progress-overlay.active { opacity: 1; }

        .progress-ring {
            width: 96px;
            height: 96px;
            position: relative;
            margin-bottom: 20px;
        }

        .progress-ring svg {
            width: 96px;
            height: 96px;
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            fill: none;
            stroke: var(--surface-3);
            stroke-width: 3;
        }

        .progress-ring-fill {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-pct {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .progress-ring.complete .progress-ring-fill {
            stroke: var(--green);
            transition: stroke-dashoffset 0.3s ease-out, stroke 0.3s;
        }

        .progress-ring.complete .progress-pct { color: var(--green); }

        .progress-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            max-width: 240px;
            line-height: 1.4;
        }

        .progress-phase {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .progress-overlay.uploading .progress-phase { color: var(--accent); }
        .progress-overlay.analyzing .progress-phase { color: var(--yellow); }
        .progress-overlay.ready .progress-phase { color: var(--green); }

        .progress-overlay.hiding {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.4s, transform 0.4s;
        }

        /* === RESULTS OVERLAY === */
        .results-overlay {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding-bottom: 80px;
        }

        .results-overlay.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* === HEADER === */
        .layout-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 9, 13, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .layout-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .layout-back {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .layout-back:hover {
            color: var(--accent);
            background: var(--accent-bg);
        }

        .layout-badge {
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: var(--accent-bg-strong);
            color: var(--accent);
        }

        .layout-progress {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .layout-progress-bar {
            width: 80px;
            height: 3px;
            background: var(--surface-3);
            border-radius: 4px;
            overflow: hidden;
        }

        .layout-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .layout-progress-text {
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* === CONTENT ANALYSIS === */
        .content-analysis {
            padding: 10px 16px 4px;
        }

        .content-analysis-intent {
            font-size: 0.78rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 6px;
            line-height: 1.45;
        }

        .content-analysis-intent:empty { display: none; }

        /* top-questions moved to follow-up section at bottom */

        /* === CARD GRID === */
        .card-grid {
            padding: 8px;
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(2, 1fr);
        }

        @media (min-width: 768px) {
            .card-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        }

        @media (min-width: 1200px) {
            .card-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
        }

        .card-grid .span-full { grid-column: 1 / -1; }
        .card-grid .span-2 { grid-column: span 2; }
        @media (max-width: 480px) {
            .card-grid .span-2 { grid-column: 1 / -1; }
        }

        .card-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .card-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

        .card-grid.single-card {
            grid-template-columns: 1fr;
            max-width: 520px;
            margin: 0 auto;
        }

        /* === CARD BASE — Glassmorphism === */
        .card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(10px) scale(0.98);
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card:hover {
            border-color: rgba(255,255,255,0.10);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .card.loading { min-height: 72px; }

        .card.loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(91,138,245,0.04) 30%, rgba(91,138,245,0.08) 50%, rgba(91,138,245,0.04) 70%, transparent 100%);
            animation: shimmer 1.8s ease-in-out infinite;
        }

        .card.loading .placeholder-line {
            animation: placeholderPulse 2s ease-in-out infinite;
        }
        .card.loading .placeholder-line:nth-child(2) { animation-delay: 0.15s; }
        .card.loading .placeholder-line:nth-child(3) { animation-delay: 0.3s; }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes placeholderPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        .card.loading.researching {
            border-color: rgba(91,138,245,0.15);
        }

        .card.loading.researching::before {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: researchDot 1s ease-in-out infinite;
        }

        @keyframes researchDot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .skeleton-status {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.4s;
            font-style: italic;
        }

        .card.loading.researching .skeleton-status { opacity: 1; }

        .web-citations {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .web-citations-label {
            font-size: 0.56rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .web-citation-link {
            font-size: 0.56rem;
            color: var(--accent-dim);
            text-decoration: none;
            padding: 1px 5px;
            border-radius: 4px;
            background: var(--accent-bg);
        }

        .web-citation-link:hover {
            color: var(--accent);
            background: var(--accent-bg-strong);
        }

        .card.populated { animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

        @keyframes cardPop {
            from { transform: scale(0.96); opacity: 0.7; }
            60% { transform: scale(1.01); }
            to { transform: scale(1); opacity: 1; }
        }

        .card.just-populated {
            border-color: rgba(91,138,245,0.25);
            box-shadow: 0 0 24px rgba(91,138,245,0.1);
        }

        .card.card-updating {
            animation: cardUpdate 0.5s ease-out;
            border-color: rgba(240,192,64,0.3);
            box-shadow: 0 0 16px rgba(240,192,64,0.1);
        }

        @keyframes cardUpdate {
            0% { transform: scale(1); }
            30% { transform: scale(0.98); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card.just-added {
            animation: cardSlideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-color: rgba(76,214,138,0.3);
            box-shadow: 0 0 16px rgba(76,214,138,0.1);
        }

        @keyframes cardSlideIn {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            60% { transform: translateY(-4px) scale(1.01); }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .card-update-badge, .card-add-badge {
            font-size: 0.52rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 6px;
            display: inline-block;
            animation: badgeFadeIn 0.3s ease-out;
        }

        .card-update-badge { color: var(--yellow); background: var(--yellow-bg); }
        .card-add-badge { color: var(--green); background: var(--green-bg); }

        @keyframes badgeFadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-inner { padding: 14px; }

        .card.entering {
            animation: cardEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(14px) scale(0.95); }
            60% { transform: translateY(-2px) scale(1.01); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card .card-source-tag {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.48rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 2;
            opacity: 0.7;
            transition: opacity 0.5s;
        }

        .card .card-source-tag.source-haiku { background: var(--accent-bg); color: var(--accent); }
        .card .card-source-tag.source-sonnet { background: var(--yellow-bg); color: var(--yellow); }
        .card .card-source-tag.source-sonar { background: var(--green-bg); color: var(--green); }
        .card .card-source-tag.source-review { background: var(--purple-bg); color: var(--purple); }

        /* Card type header — subtle, small */
        .card-type-label {
            font-size: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.7;
        }

        .card-type-icon {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-type-icon .material-symbols-rounded { font-size: 10px; }

        /* === HERO SUMMARY — Large visual card === */
        .card-hero {
            background: linear-gradient(145deg, var(--surface) 0%, var(--surface-2) 60%, rgba(91,138,245,0.06) 100%);
            border-color: var(--border-bright);
        }

        .card-hero .hero-image-wrap {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .card-hero .hero-image {
            width: 100%;
            height: 130px;
            object-fit: cover;
            display: block;
        }

        @media (min-width: 768px) {
            .card-hero .hero-image { height: 170px; }
        }

        .card-hero .hero-image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--surface) 0%, transparent 70%);
        }

        .card-hero .hero-image-badge {
            position: absolute;
            top: 10px;
            left: 12px;
            z-index: 2;
        }

        .card-hero .card-inner { padding: 16px; }
        .card-hero.has-image .card-inner { padding-top: 10px; }

        .card-hero .hero-emoji {
            font-size: 2rem;
            margin-bottom: 6px;
            display: block;
            line-height: 1;
        }

        .card-hero .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            background: var(--accent-bg-strong);
            color: var(--accent);
            margin-bottom: 10px;
        }

        .card-hero .hero-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.15;
            letter-spacing: -0.03em;
            max-height: 3.5em;
            overflow: hidden;
        }

        .card-hero .hero-subtitle {
            font-size: 0.78rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 10px;
            line-height: 1.45;
            max-height: 2.9em;
            overflow: hidden;
        }

        .card-hero .hero-takeaway {
            font-size: 0.74rem;
            color: var(--text);
            line-height: 1.45;
            padding: 8px 12px;
            background: rgba(91,138,245,0.06);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--accent);
            max-height: 4.5em;
            overflow: hidden;
        }

        .card-hero .hero-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 10px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            padding: 5px 10px;
            background: var(--accent-bg);
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .card-hero .hero-link:hover { background: var(--accent-bg-strong); }

        /* === KEY METRIC — Big number focus === */
        .card-metric {
            background: linear-gradient(145deg, var(--surface) 0%, rgba(91,138,245,0.05) 100%);
        }

        .card-metric .card-inner {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 14px;
        }

        .card-metric .metric-emoji {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }

        .card-metric .metric-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.05;
            letter-spacing: -0.04em;
            margin: 2px 0;
        }

        .card-metric .metric-label {
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .card-metric .metric-context {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 6px;
            padding: 4px 8px;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            line-height: 1.35;
            width: 100%;
        }

        .card-metric .metric-trend {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.58rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: var(--radius-pill);
            margin-top: 4px;
        }

        .card-metric .metric-trend.up { background: var(--green-bg); color: var(--green); }
        .card-metric .metric-trend.down { background: var(--red-bg); color: var(--red); }
        .card-metric .metric-trend.stable { background: var(--accent-bg); color: var(--accent); }

        /* === INFO LIST — Clean, compact === */
        .card-list .list-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .card-list .list-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.76rem;
        }

        .card-list .list-item:last-child { border-bottom: none; }

        .card-list .list-item-emoji {
            font-size: 0.9rem;
            flex-shrink: 0;
            width: 20px;
            text-align: center;
        }

        .card-list .list-item-label {
            color: var(--text-secondary);
            flex-shrink: 0;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }

        .card-list .list-item-icon { font-size: 0.85rem; }

        .card-list .list-item-value {
            color: var(--text);
            text-align: right;
            word-break: break-word;
            font-weight: 400;
            margin-left: auto;
        }

        .card-list .list-item.highlight .list-item-value {
            color: var(--accent);
            font-weight: 600;
        }

        .card-list .list-item-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .card-list .list-item-link:hover { text-decoration: underline; }

        /* === FACT CHECK — Visual verdict === */
        .card-fact-check {
            border-left: 3px solid var(--yellow);
            border-top: none;
        }
        .card-fact-check.verdict-verified { border-left-color: var(--green); }
        .card-fact-check.verdict-false { border-left-color: var(--red); }
        .card-fact-check.verdict-misleading { border-left-color: var(--yellow); }
        .card-fact-check.verdict-unverified { border-left-color: var(--accent); }
        .card-fact-check.verdict-needs_context { border-left-color: var(--purple); }
        .card-fact-check.verdict-partially_true { border-left-color: var(--orange); }

        .card-fact-check .fact-verdict-visual {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card-fact-check .fact-verdict-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-fact-check .fact-verdict-icon .material-symbols-rounded {
            font-size: 20px;
            font-variation-settings: 'FILL' 1;
        }

        .card-fact-check .fact-verdict-icon.verified { background: var(--green-bg); color: var(--green); }
        .card-fact-check .fact-verdict-icon.false { background: var(--red-bg); color: var(--red); }
        .card-fact-check .fact-verdict-icon.misleading { background: var(--yellow-bg); color: var(--yellow); }
        .card-fact-check .fact-verdict-icon.unverified { background: var(--accent-bg); color: var(--accent); }
        .card-fact-check .fact-verdict-icon.needs_context { background: var(--purple-bg); color: var(--purple); }
        .card-fact-check .fact-verdict-icon.partially_true { background: var(--orange-bg); color: var(--orange); }

        .card-fact-check .fact-verdict-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-fact-check .fact-verdict-label {
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .card-fact-check .fact-confidence-label {
            font-size: 0.56rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .card-fact-check .fact-claim {
            font-size: 0.78rem;
            color: var(--text);
            line-height: 1.5;
            margin-bottom: 8px;
            font-style: italic;
        }

        .card-fact-check .fact-explanation {
            font-size: 0.72rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .card-fact-check .fact-source {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .card-fact-check .fact-source a {
            color: var(--accent);
            text-decoration: none;
        }
        .card-fact-check .fact-source a:hover { text-decoration: underline; }

        /* === PERSON CARD — Avatar focus === */
        .card-person .person-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-person .person-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border: 2px solid var(--border-bright);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .card-person .person-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }

        .card-person .person-role {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .card-person .person-handle {
            font-size: 0.68rem;
            color: var(--accent);
            margin-top: 1px;
        }

        .card-person .person-handle a {
            color: var(--accent);
            text-decoration: none;
        }
        .card-person .person-handle a:hover { text-decoration: underline; }

        .card-person .person-context {
            font-size: 0.74rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .card-person .person-details {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-person .person-detail-item {
            font-size: 0.68rem;
            color: var(--text-secondary);
            padding: 2px 0 2px 8px;
            border-left: 2px solid var(--border);
        }

        /* === PRODUCT CARD === */
        .card-product {
            background: linear-gradient(145deg, var(--surface) 0%, rgba(76,214,138,0.04) 100%);
        }

        .card-product .product-header {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-product .product-image {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-md);
            background: var(--surface-2);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-product .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-product .product-image .material-symbols-rounded {
            font-size: 28px;
            color: var(--text-muted);
        }

        .card-product .product-emoji {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }

        .card-product .product-name {
            font-size: 0.92rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 3px;
        }

        .card-product .product-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--green);
            margin-bottom: 4px;
        }

        .card-product .product-rating {
            font-size: 0.72rem;
            color: var(--yellow);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .card-product .product-features {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 8px 0;
        }

        .card-product .product-features li {
            font-size: 0.68rem;
            color: var(--text);
            padding: 3px 8px;
            background: var(--surface-2);
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-product .product-features li::before {
            content: '';
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }

        .card-product .product-verdict {
            font-size: 0.72rem;
            color: var(--text);
            line-height: 1.5;
            padding: 8px 10px;
            background: rgba(76,214,138,0.06);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--green);
            margin-bottom: 6px;
        }

        .card-product .product-warnings {
            list-style: none;
            margin-top: 4px;
        }

        .card-product .product-warnings li {
            font-size: 0.68rem;
            color: var(--yellow);
            padding: 3px 0;
            display: flex;
            align-items: flex-start;
            gap: 5px;
        }

        .card-product .product-warnings li::before {
            content: '!';
            font-weight: 800;
            font-size: 0.55rem;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--yellow-bg);
            color: var(--yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .card-product .product-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            padding: 5px 10px;
            background: var(--accent-bg);
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .card-product .product-link:hover { background: var(--accent-bg-strong); }

        /* === TIMELINE — Visual dots === */
        .card-timeline .timeline-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .card-timeline .timeline-event {
            display: flex;
            gap: 10px;
            padding: 6px 0;
            font-size: 0.72rem;
            position: relative;
        }

        .card-timeline .timeline-event::before {
            content: '';
            position: absolute;
            left: 52px;
            top: 22px;
            bottom: -6px;
            width: 2px;
            background: var(--border);
            border-radius: 1px;
        }

        .card-timeline .timeline-event:last-child::before { display: none; }

        .card-timeline .timeline-date {
            color: var(--accent);
            min-width: 44px;
            flex-shrink: 0;
            text-align: right;
            font-weight: 600;
            font-size: 0.66rem;
        }

        .card-timeline .timeline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-bright);
            margin-top: 4px;
            flex-shrink: 0;
            z-index: 1;
        }

        .card-timeline .timeline-event.highlight .timeline-dot {
            background: var(--accent);
            box-shadow: 0 0 8px rgba(91,138,245,0.4);
        }

        .card-timeline .timeline-text { color: var(--text); line-height: 1.45; }

        .card-timeline .timeline-text a {
            color: var(--accent);
            text-decoration: none;
        }
        .card-timeline .timeline-text a:hover { text-decoration: underline; }

        /* === QUOTE — Stylish === */
        .card-quote {
            background: linear-gradient(145deg, var(--surface) 0%, rgba(160,126,240,0.06) 100%);
            border-left: 3px solid var(--purple);
        }

        .card-quote .quote-mark {
            font-size: 2.2rem;
            color: var(--purple);
            opacity: 0.3;
            line-height: 1;
            margin-bottom: -8px;
            font-family: Georgia, serif;
        }

        .card-quote .quote-text {
            font-size: 0.84rem;
            color: var(--text);
            line-height: 1.6;
            font-style: italic;
            padding: 8px 10px;
            background: rgba(160,126,240,0.05);
            border-radius: var(--radius-md);
        }

        .card-quote .quote-attribution {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--purple);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-quote .quote-attribution::before {
            content: '';
            width: 14px;
            height: 2px;
            background: var(--purple);
            opacity: 0.5;
        }

        .card-quote .quote-context {
            font-size: 0.68rem;
            color: var(--text-secondary);
            margin-top: 3px;
            line-height: 1.4;
        }

        /* === COMPARISON === */
        .card-comparison .comparison-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .card-comparison table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.7rem;
        }

        .card-comparison th {
            text-align: left;
            padding: 6px 8px;
            color: var(--accent);
            font-weight: 700;
            background: var(--surface-2);
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-comparison th:first-child { border-radius: var(--radius-sm) 0 0 0; }
        .card-comparison th:last-child { border-radius: 0 var(--radius-sm) 0 0; }

        .card-comparison td {
            padding: 6px 8px;
            color: var(--text);
            border-bottom: 1px solid var(--glass-border);
        }

        .card-comparison tr:last-child td { border-bottom: none; }

        /* === WARNING — Bold visual severity === */
        .card-warning { border-left: 3px solid var(--yellow); border-top: none; }
        .card-warning.level-critical { border-left-color: var(--red); background: linear-gradient(145deg, var(--surface) 0%, rgba(240,96,96,0.05) 100%); }
        .card-warning.level-warning { background: linear-gradient(145deg, var(--surface) 0%, rgba(240,192,64,0.04) 100%); }
        .card-warning.level-info { border-left-color: var(--accent); background: linear-gradient(145deg, var(--surface) 0%, rgba(91,138,245,0.04) 100%); }

        .card-warning .warning-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .card-warning .warning-icon-wrap {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--yellow-bg);
            flex-shrink: 0;
        }

        .card-warning .warning-icon-wrap .material-symbols-rounded {
            color: var(--yellow);
            font-size: 20px;
            font-variation-settings: 'FILL' 1;
        }

        .card-warning.level-critical .warning-icon-wrap { background: var(--red-bg); }
        .card-warning.level-critical .warning-icon-wrap .material-symbols-rounded { color: var(--red); }
        .card-warning.level-info .warning-icon-wrap { background: var(--accent-bg); }
        .card-warning.level-info .warning-icon-wrap .material-symbols-rounded { color: var(--accent); }

        .card-warning .warning-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--yellow);
        }

        .card-warning.level-critical .warning-title { color: var(--red); }
        .card-warning.level-info .warning-title { color: var(--accent); }

        .card-warning .warning-details {
            font-size: 0.74rem;
            color: var(--text);
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .card-warning .warning-advice {
            font-size: 0.7rem;
            color: var(--text);
            padding: 8px 10px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            line-height: 1.4;
        }

        /* === ACTION CARD === */
        .card-action {
            border-left: 3px solid var(--accent);
        }

        .card-action .action-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .card-action .action-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .card-action .action-item:last-child { border-bottom: none; }

        .card-action .action-bullet {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent-bg-strong);
            color: var(--accent);
            font-size: 0.62rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .card-action .action-label {
            font-size: 0.78rem;
            color: var(--text);
            font-weight: 600;
        }

        .card-action .action-label a {
            color: var(--accent);
            text-decoration: none;
        }
        .card-action .action-label a:hover { text-decoration: underline; }

        .card-action .action-desc {
            font-size: 0.68rem;
            color: var(--text-secondary);
            margin-top: 2px;
            line-height: 1.4;
        }

        .card-action .action-priority {
            display: inline-block;
            font-size: 0.54rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 2px 6px;
            border-radius: var(--radius-pill);
            margin-top: 3px;
        }

        .action-priority.high { background: var(--red-bg); color: var(--red); }
        .action-priority.medium { background: var(--yellow-bg); color: var(--yellow); }
        .action-priority.low { background: var(--accent-bg); color: var(--accent); }

        /* === TEXT EXTRACT === */
        .card-extract .extract-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .card-extract .extract-text {
            font-size: 0.74rem;
            color: var(--text);
            line-height: 1.6;
            padding: 10px 12px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--border-bright);
            white-space: pre-wrap;
            font-family: 'Inter', sans-serif;
            max-height: 140px;
            overflow: hidden;
            position: relative;
        }

        .card-extract .extract-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(transparent, var(--surface-2));
            pointer-events: none;
        }

        .card-extract .extract-source {
            font-size: 0.62rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* === LOCATION — Pin visual === */
        .card-location {
            background: linear-gradient(145deg, var(--surface) 0%, rgba(91,138,245,0.04) 100%);
        }

        .card-location .location-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .card-location .location-pin {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-bg-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-location .location-pin .material-symbols-rounded {
            font-size: 20px;
            color: var(--accent);
            font-variation-settings: 'FILL' 1;
        }

        .card-location .location-emoji {
            font-size: 1.3rem;
        }

        .card-location .location-name {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
        }

        .card-location .location-address {
            font-size: 0.7rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-location .location-address a {
            color: var(--accent);
            text-decoration: none;
        }
        .card-location .location-address a:hover { text-decoration: underline; }

        .card-location .location-context {
            font-size: 0.72rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .card-location .location-details {
            margin-top: 6px;
            display: flex;
            flex-direction: column;

        /* === VERIFICATION CARD — Live source tracking === */
        .card-verification {
            background: linear-gradient(145deg, var(--surface) 0%, rgba(91,138,245,0.06) 100%);
            border: 1px solid rgba(91,138,245,0.2);
        }

        .card-verification .verify-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .card-verification .verify-icon {
            width: 36px;
            height: 36px;

            align-items: center;
            justify-content: center;
            flex-shrink: 0;

        .card-verification .verify-icon .material-symbols-rounded {
            font-size: 20px;

        .card-verification .verify-icon.denied { background: var(--red-bg); color: var(--red); }
        .card-verification .verify-icon.unconfirmed { background: var(--surface-3); color: var(--text-muted); }
        .card-verification .verify-icon.conflicting { background: var(--orange-bg); color: var(--orange); }

        @keyframes verifyPulse {

        .card-verification .verify-status-text {

        .card-verification .verify-status-label {

        .card-verification .verify-status-label.searching { color: var(--accent); }
        .card-verification .verify-status-label.partially_verified { color: var(--yellow); }
        .card-verification .verify-status-label.verified { color: var(--green); }
        .card-verification .verify-status-label.denied { color: var(--red); }
        .card-verification .verify-status-label.unconfirmed { color: var(--text-muted); }
        .card-verification .verify-status-label.conflicting { color: var(--orange); }

        .card-verification .verify-claim {
            font-size: 0.82rem;

            line-height: 1.45;
            margin-bottom: 14px;
            font-weight: 500;

        .card-verification .verify-sources {
            display: flex;
            flex-direction: column;
            gap: 6px;

        .card-verification .verify-source {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 10px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            transition: background 0.2s;
        }

        .card-verification .verify-source-status {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;

        .card-verification .verify-source-status .material-symbols-rounded {
            font-size: 13px;
            font-variation-settings: 'FILL' 1;
        }

        .card-verification .verify-source-status.checking {
            background: var(--accent-bg);
            animation: sourcePulse 1.5s ease-in-out infinite;
        }
        .card-verification .verify-source-status.checking .material-symbols-rounded { color: var(--accent); }
        .card-verification .verify-source-status.confirmed { background: var(--green-bg); }

        .card-verification .verify-summary {

        /* === FOLLOW-UP QUESTIONS — Interactive at bottom === */
        .follow-up-section {
            padding: 16px 8px 24px;
        }

        .follow-up-header {
            font-size: 0.68rem;
            font-weight: 700;

            flex-shrink: 0;
            transition: transform 0.3s;

        .follow-up-item.open .follow-up-question .fq-icon {
            transform: rotate(45deg);
            background: var(--accent-bg-strong);

        .follow-up-question .fq-icon .material-symbols-rounded {
            font-size: 14px;
            color: var(--accent);

        .follow-up-question .fq-text {
            font-size: 0.78rem;

        .follow-up-answer-text {
            font-size: 0.74rem;

            border-left: 3px solid var(--accent);
        }

        /* === ERROR STATE === */
        #errorState {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;

            padding: 2rem;
            text-align: center;
        }

        #errorState.active { display: flex; }

        .error-icon {
            width: 60px;
            height: 60px;

            align-items: center;
            justify-content: center;
            margin-bottom: 20px;

        .error-icon .material-symbols-rounded { font-size: 28px; color: var(--red); }

        .error-text {
            color: var(--red);

            font-weight: 500;
            margin-bottom: 24px;

        }

        .retry-btn {
            padding: 12px 32px;
            background: var(--surface);
            border: 1px solid var(--border-bright);

            color: var(--text);

            font-weight: 500;
            cursor: pointer;

        .retry-btn:hover {

            color: var(--accent);
        }

        /* === PLACEHOLDERS === */
        .placeholder-line {
            height: 10px;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
        }
        .placeholder-line.short { width: 55%; }
        .placeholder-line.medium { width: 78%; }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .auto-link {
            color: var(--accent);
            text-decoration: none;
            word-break: break-all;
        }
        .auto-link:hover { text-decoration: underline; }

        <p class="paste-hint">or press Ctrl+V / Cmd+V</p>

        <div class="examples-section">

            <div class="examples-grid" id="examplesGrid"></div>
        </div>
    </div>

    <div id="mainCanvas">
        <div class="screenshot-layer" id="screenshotLayer">
            <img id="screenshotImg" alt="">

        <div class="progress-overlay" id="progressOverlay">
