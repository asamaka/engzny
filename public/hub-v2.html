                        ${d.context ? `<p class="text-xs text-base-content/50">${linkify(d.context)}</p>` : ''}
                        ${mapsLink ? `<a href="${esc(mapsLink)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-xs btn-outline mt-2 gap-1"><span class="material-symbols-rounded text-sm">open_in_new</span> Open in Maps</a>` : ''}
                    </div>`;
                }

                case 'order_card': {
                    const orderItems = d.items || d.products || d.entries || d.lineItems || d.orderItems || [];
                    const orderStatus = d.status || d.orderStatus || d.state || '';
                    const orderTotal = d.total || d.orderTotal || d.grandTotal || d.sum || d.subtotal || '';
                    const orderEta = d.deliveryTime || d.eta || d.delivery || d.estimatedDelivery || d.shippingTime || '';
                    return `<div class="p-4">
                        <div class="flex items-center gap-2 mb-3">
                            ${d.emoji ? `<span class="text-xl">${esc(d.emoji)}</span>` : ''}
                            <h3 class="font-bold text-sm text-white">${esc(d.title || d.name || d.storeName || d.restaurant || 'Order')}</h3>
                            ${orderStatus ? `<span class="badge badge-sm badge-success">${esc(orderStatus)}</span>` : ''}
                        </div>
                        <div class="divide-y divide-base-300">
                        ${orderItems.map(item => {
                            const iObj = typeof item === 'object' ? item : { name: String(item) };
                            const iName = iObj.name || iObj.label || iObj.title || iObj.product || iObj.description || iObj.item || '';
                            const iPrice = iObj.price || iObj.cost || iObj.amount || iObj.value || '';
                            const iQty = iObj.quantity || iObj.qty || iObj.count || '';
                            return `<div class="flex items-center justify-between py-2 text-sm">
                                <span>${iQty ? `<span class="text-base-content/40">${iQty}× </span>` : ''}${esc(iName)}</span>
                                ${iPrice ? `<span class="font-mono font-medium">${esc(String(iPrice))}</span>` : ''}
                            </div>`;
                        }).join('')}
                        </div>
                        ${orderTotal ? `<div class="flex justify-between items-center pt-3 mt-1 border-t-2 border-base-300">
                            <span class="font-bold text-sm">Total</span>
                            <span class="font-extrabold text-lg text-primary">${esc(String(orderTotal))}</span>
                        </div>` : ''}
                        ${orderEta ? `<div class="text-xs text-base-content/40 mt-2 flex items-center gap-1"><span class="material-symbols-rounded text-sm">schedule</span> ${esc(orderEta)}</div>` : ''}
                    </div>`;
                }

                case 'stats_grid_card':
                    return `<div class="p-4">
                        ${d.title ? `<h3 class="font-bold text-sm text-white mb-3">${esc(d.title)}</h3>` : ''}
                        <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">
                        ${(d.stats || d.data || d.items || []).map(s => {
                            const sObj = typeof s === 'object' ? s : { label: String(s), value: '' };
                            const sLabel = sObj.label || sObj.name || sObj.title || sObj.metric || sObj.key || '';
                            const sValue = sObj.value != null ? String(sObj.value) : sObj.stat || sObj.number || sObj.amount || '—';
                            return `<div class="stat p-3 bg-base-300 rounded-xl">
                                ${sObj.emoji ? `<div class="stat-figure text-lg">${esc(sObj.emoji)}</div>` : ''}
                                <div class="stat-title text-xs">${esc(sLabel)}</div>
                                <div class="stat-value text-lg text-primary">${esc(sValue)}</div>
                                ${sObj.trend ? `<div class="stat-desc"><span class="badge badge-xs ${sObj.trend === 'up' ? 'badge-success' : sObj.trend === 'down' ? 'badge-error' : 'badge-info'}">${sObj.trend}</span></div>` : ''}
                            </div>`;
                        }).join('')}
                        </div>
                    </div>`;

                case 'gallery_card':
                    return `<div class="p-4">
                        <h3 class="font-bold text-sm text-white mb-3">${esc(d.title || 'Gallery')}</h3>
                        <div class="grid grid-cols-2 gap-2">
                        ${(d.images || []).slice(0, 6).map(img => {
                            const iObj = typeof img === 'object' ? img : { url: String(img) };
                            return `<figure class="rounded-xl overflow-hidden aspect-video bg-base-300">
                                <img src="${esc(iObj.url || '')}" alt="${esc(iObj.caption || '')}" class="w-full h-full object-cover" loading="lazy" onerror="this.style.display='none'">
                            </figure>`;
                        }).join('')}
                        </div>
                    </div>`;

                case 'source_card': {
                    const credColors = { high: 'badge-success', medium: 'badge-warning', low: 'badge-error', unknown: 'badge-ghost' };
                    const hasSourceImg = d.imageUrl && typeof d.imageUrl === 'string' && d.imageUrl.startsWith('http');
                    return `<div class="p-4">
                        <div class="flex items-center gap-3">
                            ${hasSourceImg ? `<div class="avatar"><div class="w-10 h-10 rounded-full"><img src="${esc(d.imageUrl)}" alt="" loading="lazy"></div></div>` : `<div class="w-10 h-10 rounded-full bg-base-300 flex items-center justify-center"><span class="material-symbols-rounded text-base-content/40 text-lg">source</span></div>`}
                            <div class="min-w-0 flex-1">
                                <div class="font-bold text-sm">${d.profileUrl ? renderLink(d.profileUrl, d.name || 'Source') : esc(d.name || 'Source')}</div>
                                ${d.type ? `<div class="text-xs text-base-content/40">${esc(d.type)}</div>` : ''}
                            </div>
                            ${d.credibility ? `<span class="badge badge-sm ${credColors[d.credibility] || 'badge-ghost'}">${esc(d.credibility)}</span>` : ''}
                        </div>
                        ${d.context ? `<p class="text-sm text-base-content/60 mt-2">${linkify(d.context)}</p>` : ''}
                        ${d.followers ? `<div class="text-xs text-base-content/40 mt-1">${esc(d.followers)} followers</div>` : ''}
                    </div>`;
                }

                default:
                    return `<div class="p-4">
                        <div class="text-xs font-bold uppercase tracking-wider text-base-content/30 mb-2">${esc(cardType.replace(/_/g, ' '))}</div>
                        ${Object.entries(d).filter(([k]) => !k.startsWith('_')).map(([key, val]) => {
                            if (val === null || val === undefined) return '';
                            if (Array.isArray(val)) {
                                return `<div class="mb-2">
                                    <div class="text-xs font-bold text-base-content/40 uppercase tracking-wider mb-1">${esc(key.replace(/_/g, ' '))}</div>
                                    ${val.slice(0, 5).map(v => `<div class="text-sm pl-3 border-l-2 border-base-300 py-0.5">${renderItemValue(v)}</div>`).join('')}
                                </div>`;
                            }
                            if (typeof val === 'object') {
                                return `<div class="mb-2">
                                    <div class="text-xs font-bold text-base-content/40 uppercase tracking-wider mb-1">${esc(key.replace(/_/g, ' '))}</div>
                                    <div class="text-sm">${renderItemValue(val)}</div>
                                </div>`;
                            }
                            return `<div class="mb-2">
                                <div class="text-xs font-bold text-base-content/40 uppercase tracking-wider mb-1">${esc(key.replace(/_/g, ' '))}</div>
                                <div class="text-sm">${linkify(val)}</div>
                            </div>`;
                        }).join('')}
                    </div>`;
            }
        }

        // === Error & Reset ===
        function showError(message) {
            errorText.textContent = message;
            errorState.classList.remove('hidden');
            errorState.classList.add('grid');
            progressOverlay.classList.add('hidden');
        }

        function reset() {
            if (currentImageUrl) {
                URL.revokeObjectURL(currentImageUrl);
                currentImageUrl = null;
            }
            currentImageBase64 = null;
            totalCards = 0;
            completedCards = 0;
            allCardsReadyShown = false;
            blueprintReceived = false;
            pipelineComplete = false;
            firstCardShown = false;
            pendingBlueprint = null;
            populatedCardIds.clear();
            retryCount = 0;
            if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
            if (completionTimeout) { clearTimeout(completionTimeout); completionTimeout = null; }
            if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
            if (enhanceMsgInterval) { clearInterval(enhanceMsgInterval); enhanceMsgInterval = null; }
            if (uploadProgressInterval) { clearInterval(uploadProgressInterval); uploadProgressInterval = null; }
            stopAnalysisProgressTick();
            if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

            pasteState.classList.remove('hidden');
            mainCanvas.classList.add('hidden');
            progressOverlay.classList.add('hidden');
            updateProgress(0, 'UPLOADING', 'Sending screenshot...');
            resultsOverlay.classList.add('hidden');
            errorState.classList.add('hidden');
            errorState.classList.remove('grid');
            cardGrid.innerHTML = '';
            cardGrid.classList.remove('max-w-xl', 'mx-auto');
            followUpSection.classList.add('hidden');
            followUpList.innerHTML = '';
            const ctxCard = document.getElementById('overallContextCard');
            if (ctxCard) ctxCard.classList.add('hidden');
            layoutProgress.style.display = '';
            layoutProgressFill.value = 0;
            applyLayoutTheme(DEFAULT_THEME);
            document.getElementById('demoBtn')?.classList.remove('loading');
        }

        // === Event Listeners ===
        pasteZone.addEventListener('click', readClipboard);
        retryBtn.addEventListener('click', reset);
        layoutBack.addEventListener('click', reset);

        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    handleImage(item.getAsFile());
                    return;
                }
            }
        });

        document.addEventListener('dragover', (e) => { e.preventDefault(); });
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer?.files?.[0];
            if (file && file.type.startsWith('image/')) {
                handleImage(file);
            }
        });

        if (navigator.clipboard?.read) {
            navigator.permissions?.query?.({ name: 'clipboard-read' })
                .then(r => { if (r.state === 'granted') readClipboard(); })
                .catch(() => {});
        }

        // === Demo & Upload ===
        const DEMO_IMAGE_URL = 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Image_in_a_spanish_whatsapp_chat.jpg/640px-Image_in_a_spanish_whatsapp_chat.jpg';

        const demoBtn = document.getElementById('demoBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const photoInput = document.getElementById('photoInput');

        demoBtn.addEventListener('click', async () => {
            demoBtn.classList.add('loading');
            try {
                const proxyUrl = '/api/example-image?url=' + encodeURIComponent(DEMO_IMAGE_URL);
                const resp = await fetch(proxyUrl);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const blob = await resp.blob();
                if (!blob.type.startsWith('image/')) throw new Error('Not an image');
                handleImage(blob);
            } catch (err) {
                demoBtn.classList.remove('loading');
                showError('Could not load demo image. Please paste a screenshot instead.');
            }
        });

        uploadBtn.addEventListener('click', () => photoInput.click());

        photoInput.addEventListener('change', (e) => {
            const file = e.target.files?.[0];
            if (file && file.type.startsWith('image/')) {
                handleImage(file);
            }
            photoInput.value = '';
        });
    </script>
</body>
</html>
