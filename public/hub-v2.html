<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>thinx.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0d12;
            --bg-raised: #0f1319;
            --surface: #151a22;
            --surface-2: #1b222c;
            --surface-3: #222a36;
            --surface-bright: #2a3444;
            --border: #1e2736;
            --border-bright: #2d3a4e;
            --text: #e8ecf2;
            --text-secondary: #8d99ae;
            --text-muted: #5c6878;
            --accent: #6c9fff;
            --accent-dim: #3d6cc7;
            --accent-bg: rgba(108,159,255,0.08);
            --accent-bg-strong: rgba(108,159,255,0.15);
            --green: #5bdb8a;
            --green-bg: rgba(91,219,138,0.1);
            --green-dim: #2a7a4a;
            --red: #ff6b6b;
            --red-bg: rgba(255,107,107,0.1);
            --yellow: #ffd15c;
            --yellow-bg: rgba(255,209,92,0.08);
            --purple: #b48eff;
            --purple-bg: rgba(180,142,255,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-pill: 100px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 20px rgba(108,159,255,0.15);
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* === PASTE STATE === */
        #pasteState {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
            background: var(--bg);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #pasteState.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .paste-zone {
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            border: 2px dashed var(--border-bright);
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--surface);
        }

        .paste-zone:hover, .paste-zone:active {
            border-color: var(--accent);
            background: var(--accent-bg);
            transform: scale(1.02);
            box-shadow: var(--shadow-glow);
        }

        .paste-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-bg-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .paste-icon .material-symbols-rounded {
            font-size: 32px;
            color: var(--accent);
        }

        .paste-zone:hover .paste-icon {
            background: var(--accent);
        }

        .paste-zone:hover .paste-icon .material-symbols-rounded {
            color: #fff;
        }

        .paste-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
        }

        .paste-hint {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* === EXAMPLE IMAGES === */
        .examples-section {
            margin-top: 2.5rem;
            width: 100%;
            max-width: 400px;
            padding: 0 16px;
        }

        .examples-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .examples-divider::before,
        .examples-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .examples-divider span {
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .example-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 10px 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .example-card:hover {
            border-color: var(--accent-dim);
            background: var(--accent-bg);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .example-card:active {
            transform: scale(0.97);
        }

        .example-card.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .example-card.loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(108,159,255,0.06) 50%,
                transparent 100%
            );
            animation: shimmer 1.5s ease-in-out infinite;
        }

        .example-thumb {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .example-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        .example-thumb .material-symbols-rounded {
            font-size: 24px;
            color: var(--text-muted);
        }

        .example-label {
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.3;
        }

        .example-category {
            font-size: 0.58rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            padding: 2px 6px;
            background: var(--surface-2);
            border-radius: var(--radius-pill);
        }

        @media (max-width: 360px) {
            .examples-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* === MAIN CANVAS === */
        #mainCanvas {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: none;
        }

        #mainCanvas.active { display: block; }

        .screenshot-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screenshot-layer img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screenshot-layer.scanning img {
            opacity: 0.35;
            filter: brightness(0.7) blur(2px);
        }

        .screenshot-layer.fading { opacity: 0.06; }
        .screenshot-layer.gone { opacity: 0; pointer-events: none; }

        /* Progress overlay — replaces laser scan */
        .progress-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .progress-overlay.active { opacity: 1; }

        .progress-ring {
            width: 100px;
            height: 100px;
            position: relative;
            margin-bottom: 24px;
        }

        .progress-ring svg {
            width: 100px;
            height: 100px;
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            fill: none;
            stroke: var(--surface-3);
            stroke-width: 3;
        }

        .progress-ring-fill {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-pct {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .progress-ring.complete .progress-ring-fill {
            stroke: var(--green);
            transition: stroke-dashoffset 0.3s ease-out, stroke 0.3s;
        }

        .progress-ring.complete .progress-pct {
            color: var(--green);
        }

        .progress-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            max-width: 240px;
            line-height: 1.4;
        }

        .progress-phase {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .progress-overlay.uploading .progress-phase { color: var(--accent); }
        .progress-overlay.analyzing .progress-phase { color: var(--yellow); }
        .progress-overlay.ready .progress-phase { color: var(--green); }

        .progress-overlay.hiding {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.4s, transform 0.4s;
        }

        /* Bottom status bar removed — using circular progress only */

        /* === RESULTS OVERLAY === */
        .results-overlay {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            width: 100%;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding-bottom: 80px;
        }

        .results-overlay.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* === HEADER === */
        .layout-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 13, 18, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .layout-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .layout-back {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.82rem;
            cursor: pointer;
            font-family: inherit;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .layout-back:hover {
            color: var(--accent);
            background: var(--accent-bg);
        }

        .layout-badge {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: var(--accent-bg-strong);
            color: var(--accent);
        }

        .layout-progress {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .layout-progress-bar {
            width: 80px;
            height: 3px;
            background: var(--surface-3);
            border-radius: 4px;
            overflow: hidden;
        }

        .layout-progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .layout-progress-text {
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* === CONTENT ANALYSIS === */
        .content-analysis {
            padding: 16px 16px 12px;
        }

        .content-analysis-intent {
            font-size: 0.92rem;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .top-questions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .top-question {
            font-size: 0.72rem;
            font-weight: 500;
            padding: 5px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            color: var(--text-secondary);
            cursor: default;
            transition: all 0.2s ease;
        }

        .top-question:hover {
            background: var(--surface-3);
            border-color: var(--border-bright);
            color: var(--text);
        }

        /* === CARD GRID — Dashboard Layout === */
        .card-grid {
            padding: 10px;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2, 1fr);
        }

        @media (min-width: 768px) {
            .card-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px; }
        }

        @media (min-width: 1200px) {
            .card-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
        }

        .card-grid .span-full { grid-column: 1 / -1; }
        .card-grid .span-2 { grid-column: span 2; }
        @media (max-width: 480px) {
            .card-grid .span-2 { grid-column: 1 / -1; }
        }

        .card-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .card-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

        /* Single-card intro state */
        .card-grid.single-card {
            grid-template-columns: 1fr;
            max-width: 520px;
            margin: 0 auto;
        }

        /* === CARD BASE === */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card:hover {
            border-color: var(--border-bright);
            box-shadow: var(--shadow-sm);
        }

        .card.loading {
            min-height: 80px;
        }

        .card.loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(108,159,255,0.04) 30%,
                rgba(108,159,255,0.08) 50%,
                rgba(108,159,255,0.04) 70%,
                transparent 100%
            );
            animation: shimmer 1.8s ease-in-out infinite;
        }

        .card.loading .placeholder-line {
            animation: placeholderPulse 2s ease-in-out infinite;
        }

        .card.loading .placeholder-line:nth-child(2) { animation-delay: 0.15s; }
        .card.loading .placeholder-line:nth-child(3) { animation-delay: 0.3s; }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes placeholderPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        .card.loading.researching {
            border-color: rgba(108,159,255,0.15);
        }

        .card.loading.researching::before {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: researchDot 1s ease-in-out infinite;
        }

        @keyframes researchDot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .skeleton-status {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.4s;
            font-style: italic;
        }

        .card.loading.researching .skeleton-status {
            opacity: 1;
        }

        .web-citations {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .web-citations-label {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .web-citation-link {
            font-size: 0.6rem;
            color: var(--accent-dim);
            text-decoration: none;
            padding: 1px 5px;
            border-radius: 4px;
            background: var(--accent-bg);
        }

        .web-citation-link:hover {
            color: var(--accent);
            background: var(--accent-bg-strong);
        }

        .card.populated {
            animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPop {
            from { transform: scale(0.96); opacity: 0.7; }
            60% { transform: scale(1.01); }
            to { transform: scale(1); opacity: 1; }
        }

        .card.just-populated {
            border-color: rgba(108,159,255,0.3);
            box-shadow: var(--shadow-glow);
        }

        .card.card-updating {
            animation: cardUpdate 0.5s ease-out;
            border-color: rgba(255,193,7,0.4);
            box-shadow: 0 0 12px rgba(255,193,7,0.15);
        }

        @keyframes cardUpdate {
            0% { transform: scale(1); }
            30% { transform: scale(0.98); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card.just-added {
            animation: cardSlideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-color: rgba(76,175,80,0.4);
            box-shadow: 0 0 12px rgba(76,175,80,0.15);
        }

        @keyframes cardSlideIn {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            60% { transform: translateY(-4px) scale(1.01); }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .card-update-badge, .card-add-badge {
            font-size: 0.55rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 8px;
            display: inline-block;
            animation: badgeFadeIn 0.3s ease-out;
        }

        .card-update-badge {
            color: #ffc107;
            background: rgba(255,193,7,0.15);
        }

        .card-add-badge {
            color: #4caf50;
            background: rgba(76,175,80,0.15);
        }

        @keyframes badgeFadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-inner { padding: 14px; }

        /* Progressive entrance — cards fade in sequentially */
        .card.entering {
            animation: cardEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(16px) scale(0.95); }
            60% { transform: translateY(-2px) scale(1.01); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Phase indicator on cards */
        .card .card-source-tag {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 2;
            opacity: 0.7;
            transition: opacity 0.5s;
        }

        .card .card-source-tag.source-haiku { background: var(--accent-bg); color: var(--accent); }
        .card .card-source-tag.source-sonnet { background: var(--yellow-bg); color: var(--yellow); }
        .card .card-source-tag.source-sonar { background: var(--green-bg); color: var(--green); }
        .card .card-source-tag.source-review { background: var(--purple-bg); color: var(--purple); }

        .card-type-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-type-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-type-icon .material-symbols-rounded {
            font-size: 14px;
        }

        /* === HERO SUMMARY === */
        .card-hero {
            background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
            border-color: var(--border-bright);
        }

        .card-hero .hero-image-wrap {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .card-hero .hero-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }

        @media (min-width: 768px) {
            .card-hero .hero-image { height: 180px; }
        }

        .card-hero .hero-image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--surface) 0%, transparent 60%);
        }

        .card-hero .hero-image-badge {
            position: absolute;
            top: 10px;
            left: 12px;
            z-index: 2;
        }

        .card-hero .card-inner { padding: 20px 16px; }
        .card-hero.has-image .card-inner { padding-top: 12px; }

        .card-hero .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: var(--accent-bg-strong);
            color: var(--accent);
            margin-bottom: 12px;
        }

        .card-hero .hero-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.25;
            letter-spacing: -0.02em;
        }

        .card-hero .hero-subtitle {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .card-hero .hero-takeaway {
            font-size: 0.84rem;
            color: var(--text);
            line-height: 1.6;
            padding: 12px 14px;
            background: var(--surface-3);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--accent);
        }

        .card-hero .hero-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            padding: 6px 12px;
            background: var(--accent-bg);
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .card-hero .hero-link:hover { background: var(--accent-bg-strong); }

        /* === KEY METRIC === */
        .card-metric {
            background: linear-gradient(135deg, var(--surface) 0%, rgba(108,159,255,0.03) 100%);
        }

        .card-metric .card-inner {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 14px;
        }

        .card-metric .metric-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin: 4px 0;
        }

        .card-metric .metric-label {
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .card-metric .metric-context {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 8px;
            padding: 5px 8px;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            line-height: 1.4;
            width: 100%;
        }

        .card-metric .metric-trend {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.62rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: var(--radius-pill);
            margin-top: 5px;
        }

        .card-metric .metric-trend.up { background: var(--green-bg); color: var(--green); }
        .card-metric .metric-trend.down { background: var(--red-bg); color: var(--red); }
        .card-metric .metric-trend.stable { background: var(--accent-bg); color: var(--accent); }

        /* === INFO LIST === */
        .card-list .list-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .card-list .list-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            gap: 12px;
        }

        .card-list .list-item:last-child { border-bottom: none; }

        .card-list .list-item-label {
            color: var(--text-secondary);
            flex-shrink: 0;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-list .list-item-icon { font-size: 0.9rem; }

        .card-list .list-item-value {
            color: var(--text);
            text-align: right;
            word-break: break-word;
            font-weight: 400;
        }

        .card-list .list-item.highlight .list-item-value {
            color: var(--accent);
            font-weight: 600;
        }

        .card-list .list-item-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .card-list .list-item-link:hover { text-decoration: underline; }

        /* === FACT CHECK === */
        .card-fact-check {
            border-top: 3px solid var(--yellow);
        }
        .card-fact-check.verdict-verified { border-top-color: var(--green); }
        .card-fact-check.verdict-false { border-top-color: var(--red); }
        .card-fact-check.verdict-misleading { border-top-color: var(--yellow); }
        .card-fact-check.verdict-unverified { border-top-color: var(--accent); }
        .card-fact-check.verdict-needs_context { border-top-color: var(--purple); }

        .card-fact-check .fact-claim {
            font-size: 0.84rem;
            color: var(--text);
            line-height: 1.6;
            padding: 12px 14px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            font-style: italic;
            position: relative;
        }

        .card-fact-check .fact-claim::before {
            content: '"';
            font-size: 1.5rem;
            color: var(--text-muted);
            opacity: 0.3;
            position: absolute;
            top: 4px;
            left: 8px;
        }

        .card-fact-check .fact-verdict {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            margin-bottom: 10px;
        }

        .fact-verdict.verified { background: var(--green-bg); color: var(--green); }
        .fact-verdict.misleading { background: var(--yellow-bg); color: var(--yellow); }
        .fact-verdict.false { background: var(--red-bg); color: var(--red); }
        .fact-verdict.unverified { background: var(--accent-bg); color: var(--accent); }
        .fact-verdict.partially_true { background: var(--yellow-bg); color: var(--yellow); }
        .fact-verdict.needs_context { background: var(--purple-bg); color: var(--purple); }

        .card-fact-check .fact-confidence {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.58rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            margin-left: 6px;
            background: var(--surface-2);
            color: var(--text-muted);
        }

        .card-fact-check .fact-explanation {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.6;
        }

        .card-fact-check .fact-source {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .card-fact-check .fact-source a {
            color: var(--accent);
            text-decoration: none;
        }

        .card-fact-check .fact-source a:hover { text-decoration: underline; }

        /* === PERSON CARD === */
        .card-person .person-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card-person .person-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-bg-strong), var(--purple-bg));
            border: 2px solid var(--border-bright);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            flex-shrink: 0;
        }

        .card-person .person-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        .card-person .person-role {
            font-size: 0.74rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .card-person .person-handle {
            font-size: 0.74rem;
            color: var(--accent);
            margin-top: 1px;
        }

        .card-person .person-handle a {
            color: var(--accent);
            text-decoration: none;
        }

        .card-person .person-handle a:hover { text-decoration: underline; }

        .card-person .person-context {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.6;
        }

        .card-person .person-details {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .card-person .person-detail-item {
            font-size: 0.74rem;
            color: var(--text-secondary);
            padding: 3px 0 3px 10px;
            border-left: 2px solid var(--border);
        }

        /* === PRODUCT CARD === */
        .card-product {
            background: linear-gradient(135deg, var(--surface) 0%, rgba(91,219,138,0.04) 100%);
        }

        .card-product .product-header {
            display: flex;
            gap: 14px;
            margin-bottom: 12px;
        }

        .card-product .product-image {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-md);
            background: var(--surface-2);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-product .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-product .product-image .material-symbols-rounded {
            font-size: 32px;
            color: var(--text-muted);
        }

        .card-product .product-name {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .card-product .product-price {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--green);
            margin-bottom: 6px;
        }

        .card-product .product-rating {
            font-size: 0.76rem;
            color: var(--yellow);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .card-product .product-features {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 12px 0;
        }

        .card-product .product-features li {
            font-size: 0.74rem;
            color: var(--text);
            padding: 4px 10px;
            background: var(--surface-2);
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-product .product-features li::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }

        .card-product .product-verdict {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.6;
            padding: 10px 12px;
            background: var(--surface-3);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--green);
            margin-bottom: 8px;
        }

        .card-product .product-warnings {
            list-style: none;
            margin-top: 6px;
        }

        .card-product .product-warnings li {
            font-size: 0.74rem;
            color: var(--yellow);
            padding: 4px 0;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .card-product .product-warnings li::before {
            content: '!';
            font-weight: 800;
            font-size: 0.6rem;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--yellow-bg);
            color: var(--yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .card-product .product-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 10px;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            padding: 6px 12px;
            background: var(--accent-bg);
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .card-product .product-link:hover { background: var(--accent-bg-strong); }

        /* === TIMELINE === */
        .card-timeline .timeline-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 14px;
        }

        .card-timeline .timeline-event {
            display: flex;
            gap: 12px;
            padding: 8px 0;
            font-size: 0.78rem;
            position: relative;
        }

        .card-timeline .timeline-event::before {
            content: '';
            position: absolute;
            left: 55px;
            top: 26px;
            bottom: -8px;
            width: 2px;
            background: var(--border);
            border-radius: 1px;
        }

        .card-timeline .timeline-event:last-child::before { display: none; }

        .card-timeline .timeline-date {
            color: var(--accent);
            min-width: 48px;
            flex-shrink: 0;
            text-align: right;
            font-weight: 600;
            font-size: 0.72rem;
        }

        .card-timeline .timeline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-bright);
            margin-top: 5px;
            flex-shrink: 0;
            z-index: 1;
        }

        .card-timeline .timeline-event.highlight .timeline-dot {
            background: var(--accent);
            box-shadow: 0 0 6px rgba(108,159,255,0.4);
        }

        .card-timeline .timeline-text { color: var(--text); line-height: 1.5; }

        .card-timeline .timeline-text a {
            color: var(--accent);
            text-decoration: none;
        }

        .card-timeline .timeline-text a:hover { text-decoration: underline; }

        /* === QUOTE === */
        .card-quote {
            background: linear-gradient(135deg, var(--surface) 0%, rgba(180,142,255,0.06) 100%);
            border-left: 3px solid var(--purple);
        }

        .card-quote .quote-mark {
            font-size: 2.5rem;
            color: var(--purple);
            opacity: 0.25;
            line-height: 1;
            margin-bottom: -12px;
            font-family: Georgia, serif;
        }

        .card-quote .quote-text {
            font-size: 0.92rem;
            color: var(--text);
            line-height: 1.7;
            font-style: italic;
            padding: 12px 14px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
        }

        .card-quote .quote-attribution {
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--purple);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-quote .quote-attribution::before {
            content: '';
            width: 16px;
            height: 2px;
            background: var(--purple);
            opacity: 0.5;
        }

        .card-quote .quote-context {
            font-size: 0.74rem;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.5;
        }

        /* === COMPARISON === */
        .card-comparison .comparison-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 14px;
        }

        .card-comparison table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.76rem;
        }

        .card-comparison th {
            text-align: left;
            padding: 8px 10px;
            color: var(--accent);
            font-weight: 700;
            background: var(--surface-2);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-comparison th:first-child { border-radius: var(--radius-sm) 0 0 0; }
        .card-comparison th:last-child { border-radius: 0 var(--radius-sm) 0 0; }

        .card-comparison td {
            padding: 8px 10px;
            color: var(--text);
            border-bottom: 1px solid var(--border);
        }

        .card-comparison tr:last-child td { border-bottom: none; }

        /* === WARNING === */
        .card-warning { border-left: 3px solid var(--yellow); border-top: none; }
        .card-warning.level-critical { border-left-color: var(--red); background: linear-gradient(135deg, var(--surface) 0%, rgba(255,107,107,0.04) 100%); }
        .card-warning.level-warning { background: linear-gradient(135deg, var(--surface) 0%, rgba(255,209,92,0.03) 100%); }
        .card-warning.level-info { border-left-color: var(--accent); background: linear-gradient(135deg, var(--surface) 0%, rgba(108,159,255,0.03) 100%); }

        .card-warning .warning-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card-warning .warning-icon-wrap {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--yellow-bg);
            flex-shrink: 0;
        }

        .card-warning .warning-icon-wrap .material-symbols-rounded { color: var(--yellow); font-size: 18px; }
        .card-warning.level-critical .warning-icon-wrap { background: var(--red-bg); }
        .card-warning.level-critical .warning-icon-wrap .material-symbols-rounded { color: var(--red); }
        .card-warning.level-info .warning-icon-wrap { background: var(--accent-bg); }
        .card-warning.level-info .warning-icon-wrap .material-symbols-rounded { color: var(--accent); }

        .card-warning .warning-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--yellow);
        }

        .card-warning.level-critical .warning-title { color: var(--red); }
        .card-warning.level-info .warning-title { color: var(--accent); }

        .card-warning .warning-details {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .card-warning .warning-advice {
            font-size: 0.76rem;
            color: var(--text);
            padding: 10px 12px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            line-height: 1.5;
        }

        /* === ACTION CARD === */
        .card-action {
            border-left: 3px solid var(--accent);
        }

        .card-action .action-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .card-action .action-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .card-action .action-item:last-child { border-bottom: none; }

        .card-action .action-bullet {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-bg-strong);
            color: var(--accent);
            font-size: 0.68rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .card-action .action-label {
            font-size: 0.84rem;
            color: var(--text);
            font-weight: 600;
        }

        .card-action .action-label a {
            color: var(--accent);
            text-decoration: none;
        }
        .card-action .action-label a:hover { text-decoration: underline; }

        .card-action .action-desc {
            font-size: 0.74rem;
            color: var(--text-secondary);
            margin-top: 3px;
            line-height: 1.5;
        }

        .card-action .action-priority {
            display: inline-block;
            font-size: 0.58rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 2px 7px;
            border-radius: var(--radius-pill);
            margin-top: 4px;
        }

        .action-priority.high { background: var(--red-bg); color: var(--red); }
        .action-priority.medium { background: var(--yellow-bg); color: var(--yellow); }
        .action-priority.low { background: var(--accent-bg); color: var(--accent); }

        /* === TEXT EXTRACT === */
        .card-extract .extract-title {
            font-size: 0.84rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .card-extract .extract-text {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.7;
            padding: 12px 14px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--border-bright);
            white-space: pre-wrap;
            font-family: 'Inter', sans-serif;
        }

        .card-extract .extract-source {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* === LOCATION === */
        .card-location .location-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .card-location .location-address {
            font-size: 0.76rem;
            color: var(--accent);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-location .location-address a {
            color: var(--accent);
            text-decoration: none;
        }

        .card-location .location-address a:hover { text-decoration: underline; }

        .card-location .location-context {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.6;
        }

        .card-location .location-details {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .card-location .location-detail-item {
            font-size: 0.74rem;
            color: var(--text-secondary);
            padding: 3px 0 3px 10px;
            border-left: 2px solid var(--border);
        }

        /* === LINK CARD === */
        .card-links .links-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .card-links .link-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .card-links .link-item:last-child { border-bottom: none; }

        .card-links .link-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--accent-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .card-links .link-icon .material-symbols-rounded {
            font-size: 14px;
            color: var(--accent);
        }

        .card-links .link-label {
            font-size: 0.82rem;
            font-weight: 600;
        }

        .card-links .link-label a {
            color: var(--accent);
            text-decoration: none;
        }

        .card-links .link-label a:hover { text-decoration: underline; }

        .card-links .link-desc {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
            line-height: 1.4;
        }

        /* === ERROR STATE === */
        #errorState {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
            background: var(--bg);
            padding: 2rem;
            text-align: center;
        }

        #errorState.active { display: flex; }

        .error-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--red-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .error-icon .material-symbols-rounded { font-size: 32px; color: var(--red); }

        .error-text {
            color: var(--red);
            font-size: 0.92rem;
            font-weight: 500;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .retry-btn {
            padding: 12px 32px;
            background: var(--surface);
            border: 1px solid var(--border-bright);
            border-radius: var(--radius-pill);
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .retry-btn:hover {
            background: var(--accent-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* === PLACEHOLDERS === */
        .placeholder-line {
            height: 12px;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
        }
        .placeholder-line.short { width: 55%; }
        .placeholder-line.medium { width: 78%; }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        /* === AUTO-LINKIFY === */
        .auto-link {
            color: var(--accent);
            text-decoration: none;
            word-break: break-all;
        }
        .auto-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Paste State -->
    <div id="pasteState">
        <div class="paste-zone" id="pasteZone">
            <div class="paste-icon">
                <span class="material-symbols-rounded">content_paste</span>
            </div>
            <span class="paste-text">Tap to paste screenshot</span>
        </div>
        <p class="paste-hint">or press Ctrl+V / Cmd+V</p>

        <div class="examples-section">
            <div class="examples-divider"><span>or try an example</span></div>
            <div class="examples-grid" id="examplesGrid"></div>
        </div>
    </div>

    <!-- Main Canvas -->
    <div id="mainCanvas">
        <div class="screenshot-layer" id="screenshotLayer">
            <img id="screenshotImg" alt="">
        </div>

        <div class="progress-overlay" id="progressOverlay">
            <div class="progress-ring" id="progressRing">
                <svg viewBox="0 0 100 100">
                    <defs><linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--accent)"/>
                        <stop offset="100%" stop-color="var(--purple)"/>
                    </linearGradient></defs>
                    <circle class="progress-ring-bg" cx="50" cy="50" r="45"/>
                    <circle class="progress-ring-fill" id="progressRingFill" cx="50" cy="50" r="45"/>
                </svg>
                <div class="progress-pct" id="progressPct">0%</div>
            </div>
            <div class="progress-phase" id="progressPhase">UPLOADING</div>
            <div class="progress-label" id="progressLabel">Sending screenshot...</div>
        </div>

        <div class="results-overlay" id="resultsOverlay">
            <div class="layout-header">
                <div class="layout-header-left">
                    <button class="layout-back" id="layoutBack">
                        <span class="material-symbols-rounded" style="font-size:18px">arrow_back</span>
                        New
                    </button>
                    <span class="layout-badge" id="layoutBadge"></span>
                </div>
                <div class="layout-progress" id="layoutProgress">
                    <div class="layout-progress-bar">
                        <div class="layout-progress-fill" id="layoutProgressFill"></div>
                    </div>
                    <span class="layout-progress-text" id="layoutProgressText"></span>
                </div>
            </div>
            <div class="content-analysis" id="contentAnalysis" style="display:none;">
                <div class="content-analysis-intent" id="analysisIntent"></div>
                <div class="top-questions" id="topQuestions"></div>
            </div>
            <div class="card-grid" id="cardGrid"></div>
        </div>
    </div>

    <!-- Status bar removed — circular progress only -->

    <!-- Error State -->
    <div id="errorState">
        <div class="error-icon">
            <span class="material-symbols-rounded">error</span>
        </div>
        <p class="error-text" id="errorText">something went wrong</p>
        <button class="retry-btn" id="retryBtn">Try Again</button>
    </div>

    <script>
        const pasteState = document.getElementById('pasteState');
        const mainCanvas = document.getElementById('mainCanvas');
        const screenshotLayer = document.getElementById('screenshotLayer');
        const screenshotImg = document.getElementById('screenshotImg');
        const progressOverlay = document.getElementById('progressOverlay');
        const progressRingFill = document.getElementById('progressRingFill');
        const progressPct = document.getElementById('progressPct');
        const progressPhase = document.getElementById('progressPhase');
        const progressLabel = document.getElementById('progressLabel');
        const progressRing = document.getElementById('progressRing');
        const RING_CIRCUMFERENCE = 2 * Math.PI * 45; // r=45

        function updateProgress(pct, phase, label) {
            const offset = RING_CIRCUMFERENCE - (pct / 100) * RING_CIRCUMFERENCE;
            progressRingFill.style.strokeDashoffset = offset;
            progressPct.textContent = Math.round(pct) + '%';
            if (phase) progressPhase.textContent = phase;
            if (label) progressLabel.textContent = label;
            if (pct >= 100) {
                progressRing.classList.add('complete');
            } else {
                progressRing.classList.remove('complete');
            }
        }
        const resultsOverlay = document.getElementById('resultsOverlay');
        const layoutBadge = document.getElementById('layoutBadge');
        const layoutProgressFill = document.getElementById('layoutProgressFill');
        const layoutProgressText = document.getElementById('layoutProgressText');
        const contentAnalysisEl = document.getElementById('contentAnalysis');
        const analysisIntent = document.getElementById('analysisIntent');
        const topQuestionsEl = document.getElementById('topQuestions');
        const cardGrid = document.getElementById('cardGrid');
        const errorText = document.getElementById('errorText');
        const retryBtn = document.getElementById('retryBtn');
        const layoutBack = document.getElementById('layoutBack');
        const layoutProgress = document.getElementById('layoutProgress');
        const errorState = document.getElementById('errorState');
        const pasteZone = document.getElementById('pasteZone');

        let currentImageUrl = null;
        let currentImageBase64 = null;
        let totalCards = 0;
        let completedCards = 0;

        // === Utilities ===
        function esc(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'object') {
                if (Array.isArray(val)) return val.map(v => esc(v)).join(', ');
                const meaningful = val.label || val.name || val.value || val.text || val.title || val.header || val.event || val.description;
                if (meaningful) return esc(meaningful);
                return esc(JSON.stringify(val));
            }
            const d = document.createElement('div');
            d.textContent = String(val);
            return d.innerHTML;
        }

        function linkify(text) {
            if (!text) return '';
            const escaped = esc(text);
            return escaped.replace(
                /(https?:\/\/[^\s<>"']+)/gi,
                '<a href="$1" target="_blank" rel="noopener noreferrer" class="auto-link">$1</a>'
            );
        }

        function normalizeFeature(item) {
            if (typeof item === 'string') return item;
            if (typeof item === 'object' && item !== null) {
                return item.label || item.name || item.value || item.text ||
                       item.description || item.type || item.feature ||
                       JSON.stringify(item);
            }
            return String(item);
        }

        function renderItemValue(item) {
            if (typeof item === 'string') return linkify(item);
            if (typeof item === 'object' && item !== null) {
                const parts = [];
                if (item.label || item.name) parts.push(`<strong>${esc(item.label || item.name)}</strong>`);
                if (item.value) parts.push(linkify(item.value));
                if (item.description) parts.push(`<span style="color:var(--text-secondary)">${linkify(item.description)}</span>`);
                if (parts.length) return parts.join(': ');
                return linkify(normalizeFeature(item));
            }
            return esc(item);
        }

        function renderLink(url, label, extraClass) {
            if (!url || typeof url !== 'string' || !url.startsWith('http')) return '';
            const cls = extraClass ? ` class="${extraClass}"` : ' class="auto-link"';
            return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer"${cls}>${esc(label || url)}</a>`;
        }

        const CARD_ICONS = {
            hero_summary: { icon: 'auto_awesome', bg: 'var(--accent-bg-strong)', color: 'var(--accent)' },
            key_metric: { icon: 'monitoring', bg: 'var(--accent-bg)', color: 'var(--accent)' },
            info_list: { icon: 'list_alt', bg: 'var(--surface-3)', color: 'var(--text-secondary)' },
            fact_check: { icon: 'fact_check', bg: 'var(--yellow-bg)', color: 'var(--yellow)' },
            person_card: { icon: 'person', bg: 'var(--purple-bg)', color: 'var(--purple)' },
            product_card: { icon: 'shopping_bag', bg: 'var(--green-bg)', color: 'var(--green)' },
            timeline_card: { icon: 'timeline', bg: 'var(--accent-bg)', color: 'var(--accent)' },
            quote_card: { icon: 'format_quote', bg: 'var(--purple-bg)', color: 'var(--purple)' },
            comparison_card: { icon: 'compare', bg: 'var(--surface-3)', color: 'var(--text-secondary)' },
            warning_card: { icon: 'warning', bg: 'var(--yellow-bg)', color: 'var(--yellow)' },
            action_card: { icon: 'bolt', bg: 'var(--accent-bg-strong)', color: 'var(--accent)' },
            text_extract: { icon: 'description', bg: 'var(--surface-3)', color: 'var(--text-secondary)' },
            location_card: { icon: 'location_on', bg: 'var(--accent-bg)', color: 'var(--accent)' },
            link_card: { icon: 'link', bg: 'var(--accent-bg)', color: 'var(--accent)' },
        };

        function getCardTypeLabel(cardType) {
            const info = CARD_ICONS[cardType] || { icon: 'info', bg: 'var(--surface-3)', color: 'var(--text-secondary)' };
            return `<div class="card-type-label">
                <div class="card-type-icon" style="background:${info.bg}">
                    <span class="material-symbols-rounded" style="color:${info.color}">${info.icon}</span>
                </div>
                ${cardType.replace(/_/g, ' ')}
            </div>`;
        }

        // === Image Handling ===
        async function readClipboard() {
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    const imageType = item.types.find(t => t.startsWith('image/'));
                    if (imageType) {
                        const blob = await item.getType(imageType);
                        handleImage(blob);
                        return;
                    }
                }
                showError('No image found in clipboard');
            } catch (err) {
                if (err.name === 'NotAllowedError') {
                    showError('Clipboard access denied');
                } else {
                    showError('Could not read clipboard');
                }
            }
        }

        let uploadProgressInterval = null;
        let analysisProgressInterval = null;
        let currentContinuousPct = 0;

        function startAnalysisProgressTick(fromPct) {
            if (analysisProgressInterval) clearInterval(analysisProgressInterval);
            currentContinuousPct = fromPct;
            analysisProgressInterval = setInterval(() => {
                if (currentContinuousPct < 88) {
                    currentContinuousPct += (88 - currentContinuousPct) * 0.02;
                    updateProgress(currentContinuousPct, null, null);
                }
            }, 300);
        }

        function stopAnalysisProgressTick() {
            if (analysisProgressInterval) {
                clearInterval(analysisProgressInterval);
                analysisProgressInterval = null;
            }
        }

        function handleImage(blob) {
            currentImageUrl = URL.createObjectURL(blob);
            screenshotImg.src = currentImageUrl;
            pasteState.classList.add('hidden');
            mainCanvas.classList.add('active');
            screenshotLayer.className = 'screenshot-layer scanning';
            progressOverlay.classList.add('active');
            progressOverlay.classList.add('uploading');
            progressOverlay.classList.remove('analyzing', 'ready', 'hiding');
            updateProgress(0, 'UPLOADING', 'Sending screenshot...');

            const reader = new FileReader();
            reader.onloadend = () => {
                currentImageBase64 = reader.result;
                startPipeline(currentImageBase64);
            };
            reader.readAsDataURL(blob);
        }

        // === Telemetry ===
        const telemetry = {
            pipelineStart: null,
            uploadStart: null,
            uploadEnd: null,
            firstEventAt: null,
            eventsReceived: [],
            requestId: null,

            reset() {
                this.pipelineStart = Date.now();
                this.uploadStart = null;
                this.uploadEnd = null;
                this.firstEventAt = null;
                this.eventsReceived = [];
                this.requestId = null;
            },

            markUploadStart() { this.uploadStart = Date.now(); },
            markUploadEnd() { this.uploadEnd = Date.now(); },

            trackEvent(event) {
                const now = Date.now();
                if (!this.firstEventAt) this.firstEventAt = now;
                const elapsed = now - (this.pipelineStart || now);
                this.eventsReceived.push({ event, elapsed });
            },

            _buildPayload(extra = {}) {
                const now = Date.now();
                return {
                    requestId: this.requestId,
                    url: location.href,
                    userAgent: navigator.userAgent,
                    screen: `${screen.width}x${screen.height}`,
                    connection: navigator.connection ? {
                        type: navigator.connection.effectiveType,
                        downlink: navigator.connection.downlink,
                        rtt: navigator.connection.rtt,
                    } : null,
                    totalDuration: this.pipelineStart ? now - this.pipelineStart : null,
                    uploadDuration: (this.uploadStart && this.uploadEnd) ? this.uploadEnd - this.uploadStart : null,
                    firstEventDelay: (this.pipelineStart && this.firstEventAt) ? this.firstEventAt - this.pipelineStart : null,
                    eventsReceived: this.eventsReceived,
                    retries: retryCount,
                    state: {
                        blueprintReceived,
                        pipelineComplete,
                        totalCards,
                        completedCards,
                    },
                    ...extra,
                };
            },

            reportError(message, extra = {}) {
                const payload = { ...this._buildPayload(extra), message, outcome: 'error' };
                fetch('/api/debug/client-error', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportSuccess() {
                const payload = { ...this._buildPayload(), outcome: 'success' };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportOutcome(outcome, error = null) {
                const payload = { ...this._buildPayload(), outcome, error };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },
        };

        // === Pipeline ===
        let blueprintReceived = false;
        let pipelineComplete = false;
        let pipelineTimeout = null;
        let completionTimeout = null;
        let stallTimer = null;
        let lastEventTime = 0;
        let retryCount = 0;
        const MAX_RETRIES = 2;

        function resetStallTimer() {
            lastEventTime = Date.now();
            if (stallTimer) clearTimeout(stallTimer);
            if (pipelineComplete) return;
            stallTimer = setTimeout(() => {
                if (!pipelineComplete && blueprintReceived) {
                    const stallDuration = Date.now() - lastEventTime;
                    telemetry.reportError(`SSE stall detected (${Math.round(stallDuration/1000)}s)`, {
                        type: 'sse_stall',
                        completedCards,
                        totalCards,
                        retryCount,
                    });
                    if (retryCount < MAX_RETRIES && currentImageBase64) {
                        retryCount++;
                        progressLabel.textContent = `Reconnecting (attempt ${retryCount})...`;
                        startPipelineInner(currentImageBase64);
                    } else {
                        showError('Connection to server lost. Please try again.');
                    }
                }
            }, 20000);
        }

        async function startPipeline(imageDataUrl) {
            retryCount = 0;
            await startPipelineInner(imageDataUrl);
        }

        let currentEventSource = null;

        async function startPipelineInner(imageDataUrl) {
            blueprintReceived = false;
            pipelineComplete = false;
            lastEventTime = Date.now();
            telemetry.reset();

            if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
            if (uploadProgressInterval) { clearInterval(uploadProgressInterval); uploadProgressInterval = null; }
            stopAnalysisProgressTick();
            if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

            try {
                telemetry.markUploadStart();

                const { requestId, status } = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/api/hub/v2/start');
                    xhr.setRequestHeader('Content-Type', 'application/json');

                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const uploadPct = (e.loaded / e.total) * 30;
                            updateProgress(uploadPct, 'UPLOADING', 'Sending screenshot...');
                        }
                    });

                    xhr.addEventListener('load', () => {
                        telemetry.markUploadEnd();
                        if (xhr.status >= 200 && xhr.status < 300) {
                            try {
                                resolve(JSON.parse(xhr.responseText));
                            } catch {
                                reject(new Error('Invalid server response'));
                            }
                        } else {
                            try {
                                const err = JSON.parse(xhr.responseText);
                                reject(new Error(err.error || `Upload failed (HTTP ${xhr.status})`));
                            } catch {
                                reject(new Error(`Upload failed (HTTP ${xhr.status})`));
                            }
                        }
                    });

                    xhr.addEventListener('error', () => {
                        telemetry.markUploadEnd();
                        reject(new Error('Upload failed — network error'));
                    });

                    xhr.send(JSON.stringify({ image: imageDataUrl }));
                });

                telemetry.requestId = requestId;

                progressOverlay.classList.remove('uploading');
                progressOverlay.classList.add('analyzing');
                updateProgress(32, 'ANALYZING', 'Quick analysis starting...');
                startAnalysisProgressTick(32);

                await new Promise((resolve, reject) => {
                    const es = new EventSource(`/api/hub/v2/stream/${requestId}`);
                    currentEventSource = es;

                    pipelineTimeout = setTimeout(() => {
                        if (!blueprintReceived) {
                            es.close();
                            telemetry.reportError('No response from server (30s)', { type: 'timeout_no_skeleton' });
                            reject(new Error('Could not connect to analysis server. Please try again.'));
                        }
                    }, 30000);

                    const events = ['connected', 'progress', 'blueprint', 'layout_preview', 'layout_update', 'card', 'card_update', 'card_add', 'phase', 'complete'];
                    events.forEach(evt => {
                        es.addEventListener(evt, (e) => {
                            try {
                                const data = JSON.parse(e.data);
                                telemetry.trackEvent(evt);
                                handleSSEEvent(evt, data);
                                if (evt !== 'complete') resetStallTimer();
                                if (evt === 'complete') {
                                    es.close();
                                    currentEventSource = null;
                                    telemetry.reportSuccess();
                                    resolve();
                                }
                            } catch {}
                        });
                    });

                    es.addEventListener('error', (e) => {
                        if (es.readyState === EventSource.CLOSED) {
                            if (!pipelineComplete) {
                                reject(new Error(blueprintReceived ? 'Connection lost during analysis' : 'Connection lost before analysis started'));
                            }
                            return;
                        }
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent('error');
                            es.close();
                            currentEventSource = null;
                            reject(new Error(data.message || 'Analysis failed'));
                        } catch {
                            es.close();
                            currentEventSource = null;
                            if (!pipelineComplete) {
                                reject(new Error('Connection to server lost'));
                            }
                        }
                    });
                });

            } catch (err) {
                if (retryCount < MAX_RETRIES && currentImageBase64 && !pipelineComplete) {
                    retryCount++;
                    progressLabel.textContent = `Reconnecting (attempt ${retryCount})...`;
                    startPipelineInner(currentImageBase64);
                    return;
                }
                telemetry.reportError(err.message || 'connection failed', { type: 'pipeline_error' });
                telemetry.reportOutcome('error', err.message);
                showError(err.message || 'Connection failed');
            } finally {
                if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
                if (completionTimeout) { clearTimeout(completionTimeout); completionTimeout = null; }
            }
        }

        function handleSSEEvent(event, data) {
            switch (event) {
                case 'connected':
                    currentContinuousPct = Math.max(currentContinuousPct, 35);
                    updateProgress(currentContinuousPct, 'ANALYZING', 'Quick analysis starting...');
                    break;

                case 'progress': {
                    const phaseLabels = {
                        classifying: 'ANALYZING',
                        designing: 'DESIGNING',
                        researching: 'RESEARCHING',
                        enhancing: 'ENHANCING',
                        reviewing: 'REVIEWING',
                    };
                    const phaseLabel = phaseLabels[data.phase] || 'ANALYZING';
                    const mappedPct = 30 + Math.min(data.progress, 95) * 0.6;
                    currentContinuousPct = Math.max(currentContinuousPct, mappedPct);
                    updateProgress(currentContinuousPct, phaseLabel, data.message || 'Processing...');
                    if (data.phase === 'enhancing' || data.phase === 'researching' || data.phase === 'reviewing') {
                        layoutProgressFill.style.width = data.progress + '%';
                        layoutProgressText.textContent = data.phase === 'enhancing' ? 'enhancing' : data.phase === 'reviewing' ? 'reviewing' : `${completedCards}/${totalCards}`;
                    }
                    break;
                }

                case 'blueprint':
                    onBlueprintReceived(data);
                    break;

                case 'layout_preview':
                    onLayoutPreview(data);
                    break;

                case 'layout_update':
                    onLayoutUpdate(data);
                    break;

                case 'card':
                    onCardReceived(data);
                    break;

                case 'card_update':
                    onCardUpdated(data);
                    break;

                case 'card_add':
                    onCardAdded(data);
                    break;

                case 'phase':
                    onPhaseChange(data);
                    break;

                case 'complete':
                    onPipelineComplete();
                    break;

                case 'error':
                    telemetry.reportError(data.message || 'analysis failed', { type: 'sse_error' });
                    showError(data.message || 'Analysis failed');
                    break;
            }
        }

        let pendingBlueprint = null;
        let firstCardShown = false;
        const populatedCardIds = new Set();

        function onBlueprintReceived(blueprint) {
            blueprintReceived = true;
            if (pipelineTimeout) {
                clearTimeout(pipelineTimeout);
                pipelineTimeout = null;
            }

            if (completionTimeout) clearTimeout(completionTimeout);
            completionTimeout = setTimeout(() => {
                if (!pipelineComplete) {
                    telemetry.reportError('Analysis timed out after skeleton (90s)', {
                        type: 'timeout_post_skeleton',
                        completedCards,
                        totalCards,
                    });
                    showError('Analysis is taking too long. Please try again.');
                }
            }, 90000);

            pendingBlueprint = blueprint;
            totalCards = (blueprint.cards || []).length;
