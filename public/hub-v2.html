<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>thinx.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0d12;
            --bg-raised: #0f1319;
            --surface: #151a22;
            --surface-2: #1b222c;
            --surface-3: #222a36;
            --surface-bright: #2a3444;
            --border: #1e2736;
            --border-bright: #2d3a4e;
            --text: #e8ecf2;
            --text-secondary: #8d99ae;
            --text-muted: #5c6878;
            --accent: #6c9fff;
            --accent-dim: #3d6cc7;
            --accent-bg: rgba(108,159,255,0.08);
            --accent-bg-strong: rgba(108,159,255,0.15);
            --green: #5bdb8a;
            --green-bg: rgba(91,219,138,0.1);
            --green-dim: #2a7a4a;
            --red: #ff6b6b;
            --red-bg: rgba(255,107,107,0.1);
            --yellow: #ffd15c;
            --yellow-bg: rgba(255,209,92,0.08);
            --purple: #b48eff;
            --purple-bg: rgba(180,142,255,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-pill: 100px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 20px rgba(108,159,255,0.15);
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* === PASTE STATE === */
        #pasteState {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
            background: var(--bg);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #pasteState.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .paste-zone {
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            border: 2px dashed var(--border-bright);
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--surface);
        }

        .paste-zone:hover, .paste-zone:active {
            border-color: var(--accent);
            background: var(--accent-bg);
            transform: scale(1.02);
            box-shadow: var(--shadow-glow);
        }

        .paste-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-bg-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .paste-icon .material-symbols-rounded {
            font-size: 32px;
            color: var(--accent);
        }

        .paste-zone:hover .paste-icon {
            background: var(--accent);
        }

        .paste-zone:hover .paste-icon .material-symbols-rounded {
            color: #fff;
        }

        .paste-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
        }

        .paste-hint {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* === MAIN CANVAS === */
        #mainCanvas {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: none;
        }

        #mainCanvas.active { display: block; }

        .screenshot-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screenshot-layer img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screenshot-layer.scanning img {
            opacity: 0.35;
            filter: brightness(0.7) blur(2px);
        }

        .screenshot-layer.fading { opacity: 0.06; }
        .screenshot-layer.gone { opacity: 0; pointer-events: none; }

        /* Progress overlay — replaces laser scan */
        .progress-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .progress-overlay.active { opacity: 1; }

        .progress-ring {
            width: 80px;
            height: 80px;
            position: relative;
            margin-bottom: 20px;
        }

        .progress-ring svg {
            width: 80px;
            height: 80px;
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            fill: none;
            stroke: var(--surface-3);
            stroke-width: 4;
        }

        .progress-ring-fill {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 226;
            stroke-dashoffset: 226;
            transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-pct {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        .progress-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            max-width: 240px;
            line-height: 1.4;
        }

        .progress-phase {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }

        /* Bottom status bar — secondary progress */
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 12px 20px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: linear-gradient(transparent, rgba(10,13,18,0.96) 30%);
            display: none;
        }

        .status-bar.active { display: block; }

        .status-progress {
            width: 100%;
            height: 4px;
            background: var(--surface-3);
            border-radius: 4px;
            overflow: hidden;
        }

        .status-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            border-radius: 4px;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* === RESULTS OVERLAY === */
        .results-overlay {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            width: 100%;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding-bottom: 80px;
        }

        .results-overlay.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* === HEADER === */
        .layout-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 13, 18, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .layout-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .layout-back {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.82rem;
            cursor: pointer;
            font-family: inherit;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .layout-back:hover {
            color: var(--accent);
            background: var(--accent-bg);
        }

        .layout-badge {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: var(--accent-bg-strong);
            color: var(--accent);
        }

        .layout-progress {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .layout-progress-bar {
            width: 80px;
            height: 3px;
            background: var(--surface-3);
            border-radius: 4px;
            overflow: hidden;
        }

        .layout-progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .layout-progress-text {
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* === CONTENT ANALYSIS === */
        .content-analysis {
            padding: 16px 16px 12px;
        }

        .content-analysis-intent {
            font-size: 0.92rem;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .top-questions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .top-question {
            font-size: 0.72rem;
            font-weight: 500;
            padding: 5px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            color: var(--text-secondary);
            cursor: default;
            transition: all 0.2s ease;
        }

        .top-question:hover {
            background: var(--surface-3);
            border-color: var(--border-bright);
            color: var(--text);
        }

        /* === CARD GRID === */
        .card-grid {
            padding: 8px;
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr;
        }

        .card-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .card-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

        @media (max-width: 640px) {
            .card-grid.cols-2, .card-grid.cols-3 { grid-template-columns: 1fr; }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .card-grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
        }

        .card-grid .span-full { grid-column: 1 / -1; }
        .card-grid .span-2 { grid-column: span 2; }
        @media (max-width: 640px) {
            .card-grid .span-2 { grid-column: span 1; }
        }

        /* === CARD BASE === */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card:hover {
            border-color: var(--border-bright);
            box-shadow: var(--shadow-sm);
        }

        .card.loading {
            min-height: 80px;
        }

        .card.loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(108,159,255,0.03) 35%,
                rgba(108,159,255,0.06) 50%,
                rgba(108,159,255,0.03) 65%,
                transparent 100%
            );
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .card.populated {
            animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPop {
            from { transform: scale(0.96); opacity: 0.7; }
            60% { transform: scale(1.01); }
            to { transform: scale(1); opacity: 1; }
        }

        .card.just-populated {
            border-color: rgba(108,159,255,0.3);
            box-shadow: var(--shadow-glow);
        }

        .card-inner { padding: 16px; }

        .card-type-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-type-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-type-icon .material-symbols-rounded {
            font-size: 14px;
        }

        /* === HERO SUMMARY === */
        .card-hero {
            background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
            border-color: var(--border-bright);
        }
        .card-hero .card-inner { padding: 20px 16px; }

        .card-hero .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: var(--accent-bg-strong);
            color: var(--accent);
            margin-bottom: 12px;
        }

        .card-hero .hero-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .card-hero .hero-subtitle {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .card-hero .hero-takeaway {
            font-size: 0.84rem;
            color: var(--text);
            line-height: 1.6;
            padding: 12px 14px;
            background: var(--surface-3);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--accent);
        }

        .card-hero .hero-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            padding: 6px 12px;
            background: var(--accent-bg);
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .card-hero .hero-link:hover { background: var(--accent-bg-strong); }

        /* === KEY METRIC === */
        .card-metric .card-inner {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .card-metric .metric-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin: 4px 0;
        }

        .card-metric .metric-label {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .card-metric .metric-context {
            font-size: 0.74rem;
            color: var(--text-muted);
            margin-top: 10px;
            padding: 6px 10px;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            line-height: 1.4;
            width: 100%;
        }

        .card-metric .metric-trend {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-pill);
            margin-top: 6px;
        }

        .card-metric .metric-trend.up { background: var(--green-bg); color: var(--green); }
        .card-metric .metric-trend.down { background: var(--red-bg); color: var(--red); }
        .card-metric .metric-trend.stable { background: var(--accent-bg); color: var(--accent); }

        /* === INFO LIST === */
        .card-list .list-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .card-list .list-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            gap: 12px;
        }

        .card-list .list-item:last-child { border-bottom: none; }

        .card-list .list-item-label {
            color: var(--text-secondary);
            flex-shrink: 0;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-list .list-item-icon { font-size: 0.9rem; }

        .card-list .list-item-value {
            color: var(--text);
            text-align: right;
            word-break: break-word;
            font-weight: 400;
        }

        .card-list .list-item.highlight .list-item-value {
            color: var(--accent);
            font-weight: 600;
        }

        .card-list .list-item-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .card-list .list-item-link:hover { text-decoration: underline; }

        /* === FACT CHECK === */
        .card-fact-check .fact-claim {
            font-size: 0.84rem;
            color: var(--text);
            line-height: 1.6;
            padding: 12px 14px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            font-style: italic;
        }

        .card-fact-check .fact-verdict {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            margin-bottom: 10px;
        }

        .fact-verdict.verified { background: var(--green-bg); color: var(--green); }
        .fact-verdict.misleading { background: var(--yellow-bg); color: var(--yellow); }
        .fact-verdict.false { background: var(--red-bg); color: var(--red); }
        .fact-verdict.unverified { background: var(--accent-bg); color: var(--accent); }
        .fact-verdict.partially_true { background: var(--yellow-bg); color: var(--yellow); }
        .fact-verdict.needs_context { background: var(--purple-bg); color: var(--purple); }

        .card-fact-check .fact-explanation {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.6;
        }

        .card-fact-check .fact-source {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .card-fact-check .fact-source a {
            color: var(--accent);
            text-decoration: none;
        }

        .card-fact-check .fact-source a:hover { text-decoration: underline; }

        /* === PERSON CARD === */
        .card-person .person-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card-person .person-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-bg-strong), var(--purple-bg));
            border: 2px solid var(--border-bright);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            flex-shrink: 0;
        }

        .card-person .person-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        .card-person .person-role {
            font-size: 0.74rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .card-person .person-handle {
            font-size: 0.74rem;
            color: var(--accent);
            margin-top: 1px;
        }

        .card-person .person-handle a {
            color: var(--accent);
            text-decoration: none;
        }

        .card-person .person-handle a:hover { text-decoration: underline; }

        .card-person .person-context {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.6;
        }

        .card-person .person-details {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .card-person .person-detail-item {
            font-size: 0.74rem;
            color: var(--text-secondary);
            padding: 3px 0 3px 10px;
            border-left: 2px solid var(--border);
        }

        /* === PRODUCT CARD === */
        .card-product {
            background: linear-gradient(135deg, var(--surface) 0%, rgba(91,219,138,0.04) 100%);
        }

        .card-product .product-header {
            display: flex;
            gap: 14px;
            margin-bottom: 12px;
        }

        .card-product .product-image {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-md);
            background: var(--surface-2);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-product .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-product .product-image .material-symbols-rounded {
            font-size: 32px;
            color: var(--text-muted);
        }

        .card-product .product-name {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .card-product .product-price {

        .card-product .product-rating {

        .card-product .product-features {

        .card-product .product-features li {

        .card-product .product-verdict {

        }

        .card-product .product-warnings {
            list-style: none;
            margin-top: 6px;
        }

        .card-product .product-warnings li {
            font-size: 0.74rem;
            color: var(--yellow);
            padding: 4px 0;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .card-product .product-warnings li::before {
            content: '!';
            font-weight: 800;
            font-size: 0.6rem;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--yellow-bg);
            color: var(--yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .card-product .product-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 10px;
            font-size: 0.76rem;
            font-weight: 600;

            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .card-product .product-link:hover { background: var(--accent-bg-strong); }

        /* === TIMELINE === */
        .card-timeline .timeline-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 14px;
        }

        .card-timeline .timeline-event {
            display: flex;
            gap: 12px;
            padding: 8px 0;
            font-size: 0.78rem;
            position: relative;
        }

        .card-timeline .timeline-event::before {
            content: '';
            position: absolute;
            left: 55px;
            top: 26px;
            bottom: -8px;
            width: 2px;
            background: var(--border);
            border-radius: 1px;
        }

        .card-timeline .timeline-event:last-child::before { display: none; }

        .card-timeline .timeline-date {
            color: var(--accent);
            min-width: 48px;
            flex-shrink: 0;
            text-align: right;
            font-weight: 600;
            font-size: 0.72rem;
        }

        .card-timeline .timeline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-bright);
            margin-top: 5px;
            flex-shrink: 0;
            z-index: 1;
        }

        .card-timeline .timeline-event.highlight .timeline-dot {
            background: var(--accent);
            box-shadow: 0 0 6px rgba(108,159,255,0.4);
        }

        .card-timeline .timeline-text { color: var(--text); line-height: 1.5; }

        .card-timeline .timeline-text a {
            color: var(--accent);

        }

        .card-timeline .timeline-text a:hover { text-decoration: underline; }

        /* === QUOTE === */
        .card-quote {
            background: linear-gradient(135deg, var(--surface) 0%, rgba(180,142,255,0.04) 100%);
        }

        .card-quote .quote-mark {
            font-size: 2rem;
            color: var(--purple);
            opacity: 0.3;
            line-height: 1;
            margin-bottom: -8px;
        }

        .card-quote .quote-text {
            font-size: 0.92rem;
            color: var(--text);
            line-height: 1.7;
            font-style: italic;
            padding: 12px 14px;

            background: var(--surface-2);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
        }

        .card-quote .quote-attribution {
            font-size: 0.74rem;

            color: var(--purple);

        .card-quote .quote-context {
            font-size: 0.74rem;

        /* === COMPARISON === */
        .card-comparison .comparison-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 14px;
        }

        .card-comparison table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.76rem;
        }

        .card-comparison th {
            text-align: left;
            padding: 8px 10px;
            color: var(--accent);
            font-weight: 700;
            background: var(--surface-2);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-comparison th:first-child { border-radius: var(--radius-sm) 0 0 0; }
        .card-comparison th:last-child { border-radius: 0 var(--radius-sm) 0 0; }

        .card-comparison td {
            padding: 8px 10px;
            color: var(--text);
            border-bottom: 1px solid var(--border);

        .card-comparison tr:last-child td { border-bottom: none; }

        /* === WARNING === */
        .card-warning { border-left: 3px solid var(--yellow); }
        .card-warning.level-critical { border-left-color: var(--red); }
        .card-warning.level-info { border-left-color: var(--accent); }

        .card-warning .warning-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card-warning .warning-icon-wrap {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--yellow-bg);
            flex-shrink: 0;
        }

        .card-warning .warning-icon-wrap .material-symbols-rounded { color: var(--yellow); font-size: 18px; }
        .card-warning.level-critical .warning-icon-wrap { background: var(--red-bg); }
        .card-warning.level-critical .warning-icon-wrap .material-symbols-rounded { color: var(--red); }
        .card-warning.level-info .warning-icon-wrap { background: var(--accent-bg); }
        .card-warning.level-info .warning-icon-wrap .material-symbols-rounded { color: var(--accent); }

        .card-warning .warning-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--yellow);
        }

        .card-warning.level-critical .warning-title { color: var(--red); }
        .card-warning.level-info .warning-title { color: var(--accent); }

        .card-warning .warning-details {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .card-warning .warning-advice {
            font-size: 0.76rem;
            color: var(--text);
            padding: 10px 12px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            line-height: 1.5;

        /* === ACTION CARD === */
        .card-action .action-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .card-action .action-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .card-action .action-item:last-child { border-bottom: none; }

        .card-action .action-bullet {
            width: 24px;
            height: 24px;
            border-radius: 50%;

            font-weight: 800;
            display: flex;

            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .card-action .action-label {
            font-size: 0.84rem;
            color: var(--text);
            font-weight: 600;
        }

        .card-action .action-label a {
            color: var(--accent);
            text-decoration: none;
        }
        .card-action .action-label a:hover { text-decoration: underline; }

        .card-action .action-desc {
            font-size: 0.74rem;
            color: var(--text-secondary);
            margin-top: 3px;
            line-height: 1.5;
        }

        .card-action .action-priority {
            display: inline-block;
            font-size: 0.58rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 2px 7px;
            border-radius: var(--radius-pill);
            margin-top: 4px;
        }

        .action-priority.high { background: var(--red-bg); color: var(--red); }
        .action-priority.medium { background: var(--yellow-bg); color: var(--yellow); }
        .action-priority.low { background: var(--accent-bg); color: var(--accent); }

        /* === TEXT EXTRACT === */
        .card-extract .extract-title {
            font-size: 0.84rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .card-extract .extract-text {
            font-size: 0.8rem;
            color: var(--text);
            line-height: 1.7;
            padding: 12px 14px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--border-bright);
            white-space: pre-wrap;
            font-family: 'Inter', sans-serif;
        }

        .card-extract .extract-source {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* === LOCATION === */
        .card-location .location-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;

        .card-location .location-address {
            font-size: 0.76rem;
