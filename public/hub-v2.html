<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>thinx.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <!-- DaisyUI 5 + Tailwind CSS 4 (CDN, no build step) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
</head>
<body>
    <!-- Paste State -->
    <div id="pasteState" class="fixed inset-0 z-50 grid place-items-center bg-base-100 p-6">
        <div class="w-full max-w-sm space-y-4 text-center">
            <div id="pasteZone" class="card bg-base-200 border border-base-300 shadow-xl cursor-pointer transition hover:border-primary">
                <div class="card-body items-center py-12">
                    <div class="avatar placeholder">
                        <div class="bg-primary/20 text-primary rounded-full w-16">
                            <span class="material-symbols-rounded text-3xl">content_paste</span>
                        </div>
                    </div>
                    <h2 class="card-title text-base">Tap to paste screenshot</h2>
                    <p class="text-xs text-base-content/60">or press Ctrl+V / Cmd+V</p>
                </div>
            </div>

            <div class="join join-vertical w-full gap-2">
                <button class="btn btn-primary w-full gap-2" id="demoBtn">
                    <span class="material-symbols-rounded">play_circle</span>
                    Try Demo
                </button>
                <button class="btn btn-outline w-full gap-2" id="uploadBtn">
                    <span class="material-symbols-rounded">photo_library</span>
                    Upload Photo
                </button>
            </div>
            <input type="file" id="photoInput" accept="image/*" class="hidden">
        </div>
    </div>

    <!-- Main Canvas -->
    <div id="mainCanvas" class="hidden min-h-screen bg-base-100">
        <div id="screenshotLayer" class="fixed inset-0 z-0 flex items-center justify-center p-4 opacity-0 pointer-events-none hidden">
            <img id="screenshotImg" alt="" class="max-h-[70vh] max-w-full rounded-box shadow-2xl">
        </div>

        <div id="progressOverlay" class="fixed inset-0 z-10 grid place-items-center bg-base-100/80 backdrop-blur-sm">
            <div class="card bg-base-200 border border-base-300 shadow-xl w-80">
                <div class="card-body items-center text-center">
                    <span class="loading loading-ring loading-lg text-primary"></span>
                    <div class="badge badge-primary badge-outline" id="progressPhase">UPLOADING</div>
                    <progress id="progressBar" class="progress progress-primary w-full" value="0" max="100"></progress>
                    <p id="progressPct" class="text-sm font-semibold">0%</p>
                    <p id="progressLabel" class="text-xs text-base-content/70">Sending screenshot...</p>
                </div>
            </div>
        </div>

        <div id="resultsOverlay" class="relative z-20 hidden pb-20">
            <div class="navbar sticky top-0 z-20 bg-base-100/90 border-b border-base-300 backdrop-blur">
                <div class="flex-1 gap-2">
                    <button class="btn btn-ghost btn-sm gap-1" id="layoutBack">
                        <span class="material-symbols-rounded text-base">arrow_back</span>
                        New
                    </button>
                    <span class="badge badge-primary badge-outline" id="layoutBadge"></span>
                </div>
                <div class="flex-none items-center gap-2" id="layoutProgress">
                    <progress class="progress progress-primary w-24" value="0" max="100" id="layoutProgressFill"></progress>
                    <span class="text-xs text-base-content/60" id="layoutProgressText"></span>
                </div>
            </div>

            <div id="cardGrid" class="grid grid-cols-1 gap-4 p-4 md:grid-cols-2 xl:grid-cols-3"></div>

            <div id="followUpSection" class="hidden p-4 pt-2 space-y-3">
                <div id="overallContextCard" class="hidden card bg-primary/5 border border-primary/20 shadow-sm">
                    <div class="card-body py-3 px-4">
                        <div class="flex items-start gap-2">
                            <span class="material-symbols-rounded text-primary text-lg mt-0.5">auto_awesome</span>
                            <div>
                                <div class="text-xs font-semibold text-primary uppercase tracking-wider mb-1">Context</div>
                                <p class="text-sm text-base-content/80 leading-relaxed" id="overallContextText"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card bg-base-200 border border-base-300 shadow-sm">
                    <div class="card-body">
                        <div class="flex items-center gap-2 text-sm font-semibold text-base-content/70">
                            <span class="material-symbols-rounded text-primary">forum</span>
                            Questions you might have
                        </div>
                        <div class="space-y-2" id="followUpList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Error State -->
    <div id="errorState" class="fixed inset-0 z-50 hidden place-items-center bg-base-100 p-6">
        <div class="card bg-base-200 border border-error/30 shadow-xl w-full max-w-sm">
            <div class="card-body items-center text-center">
                <div class="avatar placeholder">
                    <div class="bg-error/20 text-error rounded-full w-16">
                        <span class="material-symbols-rounded text-3xl">error</span>
                    </div>
                </div>
                <p id="errorText" class="text-sm text-error">Something went wrong</p>
                <button class="btn btn-error btn-outline" id="retryBtn">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        const pasteState = document.getElementById('pasteState');
        const mainCanvas = document.getElementById('mainCanvas');
        const screenshotLayer = document.getElementById('screenshotLayer');
        const screenshotImg = document.getElementById('screenshotImg');
        const progressOverlay = document.getElementById('progressOverlay');
        const progressBar = document.getElementById('progressBar');
        const progressPct = document.getElementById('progressPct');
        const progressPhase = document.getElementById('progressPhase');
        const progressLabel = document.getElementById('progressLabel');
        const DEFAULT_THEME = 'night';
        const LAYOUT_THEME_MAP = {
            simple: 'night',
            editorial: 'business',
            dashboard: 'dim',
            product_showcase: 'synthwave',
            social_feed: 'dracula',
            breaking_news: 'coffee',
            investigation: 'coffee',
            food_order: 'autumn',
            messaging: 'emerald',
            location_explorer: 'forest',
            media_analysis: 'abyss',
            encyclopedia: 'nord',
            travel_planner: 'sunset',
        };

        function applyLayoutTheme(layoutType) {
            const theme = LAYOUT_THEME_MAP[layoutType] || DEFAULT_THEME;
            document.documentElement.setAttribute('data-theme', theme);
            return theme;
        }

        function updateProgress(pct, phase, label) {
            progressBar.value = Math.max(0, Math.min(100, Math.round(pct)));
            progressPct.textContent = Math.round(pct) + '%';
            if (phase) progressPhase.textContent = phase;
            if (label) progressLabel.textContent = label;
        }
        const resultsOverlay = document.getElementById('resultsOverlay');
        const layoutBadge = document.getElementById('layoutBadge');
        const layoutProgressFill = document.getElementById('layoutProgressFill');
        const layoutProgressText = document.getElementById('layoutProgressText');
        const followUpSection = document.getElementById('followUpSection');
        const followUpList = document.getElementById('followUpList');
        const cardGrid = document.getElementById('cardGrid');
        const errorText = document.getElementById('errorText');
        const retryBtn = document.getElementById('retryBtn');
        const layoutBack = document.getElementById('layoutBack');
        const layoutProgress = document.getElementById('layoutProgress');
        const errorState = document.getElementById('errorState');
        const pasteZone = document.getElementById('pasteZone');

        let currentImageUrl = null;
        let currentImageBase64 = null;
        let totalCards = 0;
        let completedCards = 0;
        let allCardsReadyShown = false;

        function checkAllCardsReady() {
            if (allCardsReadyShown || pipelineComplete || totalCards === 0) return;
            if (completedCards < totalCards) return;
            allCardsReadyShown = true;
            layoutProgressFill.value = 100;
            layoutProgressText.innerHTML = '<span class="text-success flex items-center gap-1"><span class="material-symbols-rounded text-sm">check_circle</span>ready</span>';
            if (enhanceMsgInterval) {
                clearInterval(enhanceMsgInterval);
                enhanceMsgInterval = null;
            }
        }

        function showResultsCanvas() {
            stopAnalysisProgressTick();
            updateProgress(95, 'READY', 'Cards ready');
            progressOverlay.classList.add('hidden');
            resultsOverlay.classList.remove('hidden');
        }

        // === Utilities ===
        function esc(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'object') {
                if (Array.isArray(val)) return val.map(v => esc(v)).join(', ');
                const meaningful = val.label || val.name || val.value || val.text || val.title || val.header || val.event || val.description;
                if (meaningful) return esc(meaningful);
                return esc(JSON.stringify(val));
            }
            const d = document.createElement('div');
            d.textContent = String(val);
            return d.innerHTML;
        }

        function linkify(text) {
            if (!text) return '';
            const escaped = esc(text);
            return escaped.replace(
                /(https?:\/\/[^\s<>"']+)/gi,
                '<a href="$1" target="_blank" rel="noopener noreferrer" class="link link-primary break-all">$1</a>'
            );
        }

        function cleanSummary(text) {
            if (!text) return '';
            return text
                .replace(/\.{2,}/g, '.')
                .replace(/(\.\s*){3,}/g, '. ')
                .replace(/\.\s*$/, '.')
                .trim();
        }

        function cleanCitations(text) {
            if (!text) return '';
            return text
                .replace(/\[(\d+)\]/g, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }

        function timeAgo(iso) {
            if (!iso) return '';
            try {
                const diff = Date.now() - new Date(iso).getTime();
                if (diff < 0) return 'Just now';
                const sec = Math.floor(diff / 1000);
                if (sec < 60) return 'Just now';
                const min = Math.floor(sec / 60);
                if (min < 60) return `${min}m ago`;
                const hr = Math.floor(min / 60);
                if (hr < 24) return `${hr}h ago`;
                const days = Math.floor(hr / 24);
                return `${days}d ago`;
            } catch { return ''; }
        }

        function normalizeFeature(item) {
            if (typeof item === 'string') return item;
            if (typeof item === 'object' && item !== null) {
                return item.label || item.name || item.value || item.text ||
                       item.description || item.type || item.feature ||
                       JSON.stringify(item);
            }
            return String(item);
        }

        function renderItemValue(item) {
            if (typeof item === 'string') return linkify(item);
            if (typeof item === 'object' && item !== null) {
                const parts = [];
                if (item.label || item.name) parts.push(`<strong>${esc(item.label || item.name)}</strong>`);
                if (item.value) parts.push(linkify(item.value));
                if (item.description) parts.push(`<span class="text-base-content/70">${linkify(item.description)}</span>`);
                if (parts.length) return parts.join(': ');
                return linkify(normalizeFeature(item));
            }
            return esc(item);
        }

        function renderLink(url, label, extraClass) {
            if (!url || typeof url !== 'string' || !url.startsWith('http')) return '';
            const cls = extraClass ? ` class="${extraClass}"` : ' class="link link-primary break-all"';
            return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer"${cls}>${esc(label || url)}</a>`;
        }

        const CHART_COLORS = ['#5b8af5', '#4cd68a', '#f0c040', '#f06060', '#a07ef0', '#f09040', '#60d0f0', '#f060a0'];

        function renderFollowUpQuestions(contentAnalysis) {
            const questions = contentAnalysis.followUpQuestions || [];
            const topQ = contentAnalysis.topQuestions || [];

            const answered = [];
            const unanswered = [];

            questions.forEach(q => {
                if (typeof q === 'object' && q.question) {
                    if (q.answer) {
                        answered.push({ question: q.question, answer: cleanCitations(q.answer) });
                    } else {
                        unanswered.push(q.question);
                    }
                } else if (typeof q === 'string') {
                    unanswered.push(q);
                }
            });

            topQ.forEach(q => {
                if (!answered.some(aq => aq.question === q) && !unanswered.includes(q)) {
                    unanswered.push(q);
                }
            });

            if (answered.length === 0 && unanswered.length === 0) return;

            // Render overall context if available
            const ctx = contentAnalysis.overallContext;
            const ctxCard = document.getElementById('overallContextCard');
            const ctxText = document.getElementById('overallContextText');
            if (ctx && ctxCard && ctxText) {
                ctxText.innerHTML = linkify(cleanCitations(cleanSummary(ctx)));
                ctxCard.classList.remove('hidden');
            }

            followUpSection.classList.remove('hidden');
            followUpList.innerHTML = '';

            // Answered questions: expandable with answer
            answered.slice(0, 5).forEach(q => {
                const item = document.createElement('div');
                item.className = 'collapse collapse-arrow bg-base-100 border border-base-300';
                item.innerHTML = `
                    <input type="checkbox" />
                    <div class="collapse-title text-sm font-medium pr-10">${esc(q.question)}</div>
                    <div class="collapse-content">
                        <div class="text-sm text-base-content/80 leading-relaxed">${linkify(cleanSummary(q.answer))}</div>
                    </div>
                `;
                followUpList.appendChild(item);
            });

            // Unanswered questions: simple non-expandable list
            const remaining = 5 - answered.length;
            if (remaining > 0 && unanswered.length > 0) {
                unanswered.slice(0, remaining).forEach(q => {
                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-2 px-4 py-2.5 bg-base-100 border border-base-300 rounded-lg';
                    item.innerHTML = `
                        <span class="material-symbols-rounded text-base-content/30 text-sm">help_outline</span>
                        <span class="text-sm text-base-content/60">${esc(q)}</span>
                    `;
                    followUpList.appendChild(item);
                });
            }
        }

        function renderSparkline(data) {
            if (!Array.isArray(data) || data.length < 2) return '';
            const max = Math.max(...data);
            const min = Math.min(...data);
            const range = max - min || 1;
            const w = 100;
            const h = 24;
            const step = w / (data.length - 1);

            const points = data.map((v, i) => {
                const x = i * step;
                const y = h - ((v - min) / range) * (h - 4) - 2;
                return `${x},${y}`;
            }).join(' ');

            const areaPoints = points + ` ${w},${h} 0,${h}`;

            return `<svg class="w-full h-6 mt-2" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
                <polygon points="${areaPoints}" fill="oklch(64% 0.17 260 / 0.25)"/>
                <polyline points="${points}" fill="none" stroke="oklch(64% 0.17 260)" stroke-width="2" stroke-linecap="round"/>
            </svg>`;
        }

        const CONTENT_TYPE_LABELS = {
            breaking_news: 'Breaking News',
            news: 'News',
            product: 'Product',
            social_media: 'Social Media',
            social: 'Social',
            tech: 'Tech',
            sports: 'Sports',
            data: 'Data',
            analytics: 'Analytics',
            general: 'Analysis',
            article: 'Article',
            report_significant_event: 'Breaking News',
            significant_event: 'Breaking News',
            messaging: 'Messaging',
            chat: 'Chat',
            settings: 'Settings',
            finance: 'Finance',
            health: 'Health',
            science: 'Science',
            entertainment: 'Entertainment',
            analyzing: 'Analyzing...',
        };

        function humanizeContentType(ct) {
            if (!ct) return 'Analysis';
            if (CONTENT_TYPE_LABELS[ct]) return CONTENT_TYPE_LABELS[ct];
            return ct.replace(/[_-]/g, ' ').replace(/\b\w/g, l => l.toUpperCase()).substring(0, 20);
        }

        // === Image Handling ===

        // Vercel serverless has a 4.5MB body limit. Target 1.5MB binary
        // (~2MB base64) for fast mobile uploads and safe headroom.
        // Claude vision processes at 1568px max anyway — no quality loss.
        const UPLOAD_TARGET_SIZE = 1.5 * 1024 * 1024;

        function loadImageEl(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        async function generateThumbnail(blob, maxWidth = 360) {
            try {
                const url = URL.createObjectURL(blob);
                try {
                    const img = await loadImageEl(url);
                    const scale = Math.min(maxWidth / img.naturalWidth, 1);
                    const w = Math.round(img.naturalWidth * scale);
                    const h = Math.round(img.naturalHeight * scale);
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    return dataUrl.replace(/^data:image\/\w+;base64,/, '');
                } finally {
                    URL.revokeObjectURL(url);
                }
            } catch (e) {
                console.warn('Thumbnail generation failed:', e);
                return null;
            }
        }

        let currentThumbBase64 = null;

        async function compressImage(blob) {
            if (blob.size <= UPLOAD_TARGET_SIZE) return blob;

            const url = URL.createObjectURL(blob);
            try {
                const img = await loadImageEl(url);
                const MAX_DIM = 1568;
                let w = img.naturalWidth, h = img.naturalHeight;
                const s = Math.min(MAX_DIM / w, MAX_DIM / h, 1);
                w = Math.round(w * s);
                h = Math.round(h * s);

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const tryCompress = (tw, th, quality) => {
                    canvas.width = tw;
                    canvas.height = th;
                    ctx.drawImage(img, 0, 0, tw, th);
                    return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
                };

                for (const q of [0.85, 0.7, 0.55, 0.4]) {
                    const result = await tryCompress(w, h, q);
                    if (result && result.size <= UPLOAD_TARGET_SIZE) return result;
                }
                for (const ds of [0.75, 0.5, 0.35]) {
                    const result = await tryCompress(Math.round(w * ds), Math.round(h * ds), 0.7);
                    if (result && result.size <= UPLOAD_TARGET_SIZE) return result;
                }
                return await tryCompress(Math.round(w * 0.3), Math.round(h * 0.3), 0.5);
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        async function readClipboard() {
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    const imageType = item.types.find(t => t.startsWith('image/'));
                    if (imageType) {
                        const blob = await item.getType(imageType);
                        handleImage(blob);
                        return;
                    }
                }
                showError('No image found in clipboard');
            } catch (err) {
                if (err.name === 'NotAllowedError') {
                    showError('Clipboard access denied');
                } else {
                    showError('Could not read clipboard');
                }
            }
        }

        let uploadProgressInterval = null;
        let analysisProgressInterval = null;
        let currentContinuousPct = 0;

        function startAnalysisProgressTick(fromPct) {
            if (analysisProgressInterval) clearInterval(analysisProgressInterval);
            currentContinuousPct = fromPct;
            analysisProgressInterval = setInterval(() => {
                if (currentContinuousPct < 88) {
                    currentContinuousPct += (88 - currentContinuousPct) * 0.02;
                    updateProgress(currentContinuousPct, null, null);
                }
            }, 300);
        }

        function stopAnalysisProgressTick() {
            if (analysisProgressInterval) {
                clearInterval(analysisProgressInterval);
                analysisProgressInterval = null;
            }
        }

        async function handleImage(blob) {
            currentImageUrl = URL.createObjectURL(blob);
            screenshotImg.src = currentImageUrl;
            pasteState.classList.add('hidden');
            mainCanvas.classList.remove('hidden');
            progressOverlay.classList.remove('hidden');
            updateProgress(0, 'UPLOADING', 'Compressing...');

            try {
                blob = await compressImage(blob);
            } catch (e) {
                console.warn('Compression failed, using original:', e);
            }

            currentThumbBase64 = await generateThumbnail(blob);

            updateProgress(5, 'UPLOADING', 'Sending screenshot...');

            const reader = new FileReader();
            reader.onloadend = () => {
                currentImageBase64 = reader.result;
                startPipeline(currentImageBase64);
            };
            reader.readAsDataURL(blob);
        }

        // === Telemetry ===
        const telemetry = {
            pipelineStart: null,
            uploadStart: null,
            uploadEnd: null,
            firstEventAt: null,
            eventsReceived: [],
            requestId: null,

            reset() {
                this.pipelineStart = Date.now();
                this.uploadStart = null;
                this.uploadEnd = null;
                this.firstEventAt = null;
                this.eventsReceived = [];
                this.requestId = null;
            },

            markUploadStart() { this.uploadStart = Date.now(); },
            markUploadEnd() { this.uploadEnd = Date.now(); },

            trackEvent(event) {
                const now = Date.now();
                if (!this.firstEventAt) this.firstEventAt = now;
                const elapsed = now - (this.pipelineStart || now);
                this.eventsReceived.push({ event, elapsed });
            },

            _buildPayload(extra = {}) {
                const now = Date.now();
                return {
                    requestId: this.requestId,
                    url: location.href,
                    userAgent: navigator.userAgent,
                    screen: `${screen.width}x${screen.height}`,
                    connection: navigator.connection ? {
                        type: navigator.connection.effectiveType,
                        downlink: navigator.connection.downlink,
                        rtt: navigator.connection.rtt,
                    } : null,
                    totalDuration: this.pipelineStart ? now - this.pipelineStart : null,
                    uploadDuration: (this.uploadStart && this.uploadEnd) ? this.uploadEnd - this.uploadStart : null,
                    firstEventDelay: (this.pipelineStart && this.firstEventAt) ? this.firstEventAt - this.pipelineStart : null,
                    eventsReceived: this.eventsReceived,
                    retries: retryCount,
                    state: {
                        blueprintReceived,
                        pipelineComplete,
                        totalCards,
                        completedCards,
                    },
                    ...extra,
                };
            },

            reportError(message, extra = {}) {
                const payload = { ...this._buildPayload(extra), message, outcome: 'error' };
                fetch('/api/debug/client-error', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportSuccess() {
                const payload = { ...this._buildPayload(), outcome: 'success' };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportOutcome(outcome, error = null) {
                const payload = { ...this._buildPayload(), outcome, error };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },
        };

        // === Pipeline ===
        let blueprintReceived = false;
        let pipelineComplete = false;
        let pipelineTimeout = null;
        let completionTimeout = null;
        let stallTimer = null;
        let lastEventTime = 0;
        let retryCount = 0;
        const MAX_RETRIES = 2;

        function resetStallTimer() {
            lastEventTime = Date.now();
            if (stallTimer) clearTimeout(stallTimer);
            if (pipelineComplete) return;
            stallTimer = setTimeout(() => {
                if (!pipelineComplete && blueprintReceived) {
                    const stallDuration = Date.now() - lastEventTime;
                    telemetry.reportError(`SSE stall detected (${Math.round(stallDuration/1000)}s)`, {
                        type: 'sse_stall',
                        completedCards,
                        totalCards,
                        retryCount,
                    });
                    if (retryCount < MAX_RETRIES && currentImageBase64) {
                        retryCount++;
                        progressLabel.textContent = `Reconnecting (attempt ${retryCount})...`;
                        startPipelineInner(currentImageBase64);
                    } else {
                        showError('Connection to server lost. Please try again.');
                    }
                }
            }, 20000);
        }

        async function startPipeline(imageDataUrl) {
            retryCount = 0;
            await startPipelineInner(imageDataUrl);
        }

        let currentEventSource = null;

        async function startPipelineInner(imageDataUrl) {
            blueprintReceived = false;
            pipelineComplete = false;
            allCardsReadyShown = false;
            lastEventTime = Date.now();
            telemetry.reset();

            if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
            if (uploadProgressInterval) { clearInterval(uploadProgressInterval); uploadProgressInterval = null; }
            stopAnalysisProgressTick();
            if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

            try {
                telemetry.markUploadStart();

                const { requestId, status } = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/api/hub/v2/start');
                    xhr.setRequestHeader('Content-Type', 'application/json');

                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const uploadPct = (e.loaded / e.total) * 30;
                            updateProgress(uploadPct, 'UPLOADING', 'Sending screenshot...');
                        }
                    });

                    xhr.addEventListener('load', () => {
                        telemetry.markUploadEnd();
                        if (xhr.status >= 200 && xhr.status < 300) {
                            try {
                                resolve(JSON.parse(xhr.responseText));
                            } catch {
                                reject(new Error('Invalid server response'));
                            }
                        } else {
                            try {
                                const err = JSON.parse(xhr.responseText);
                                reject(new Error(err.error || `Upload failed (HTTP ${xhr.status})`));
                            } catch {
                                reject(new Error(`Upload failed (HTTP ${xhr.status})`));
                            }
                        }
                    });

                    xhr.addEventListener('error', () => {
                        telemetry.markUploadEnd();
                        reject(new Error('Upload failed — network error'));
                    });

                    const payload = { image: imageDataUrl };
                    if (currentThumbBase64) payload.thumb = currentThumbBase64;
                    xhr.send(JSON.stringify(payload));
                });

                telemetry.requestId = requestId;

                progressOverlay.classList.remove('hidden');
                updateProgress(32, 'ANALYZING', 'Starting investigation...');
                startAnalysisProgressTick(32);

                await new Promise((resolve, reject) => {
                    const es = new EventSource(`/api/hub/v2/stream/${requestId}`);
                    currentEventSource = es;

                    pipelineTimeout = setTimeout(() => {
                        if (!blueprintReceived) {
                            es.close();
                            telemetry.reportError('No response from server (30s)', { type: 'timeout_no_skeleton' });
                            reject(new Error('Could not connect to analysis server. Please try again.'));
                        }
                    }, 30000);

                    const events = ['connected', 'progress', 'blueprint', 'layout_preview', 'layout_update', 'card', 'card_update', 'card_add', 'phase', 'complete'];
                    events.forEach(evt => {
                        es.addEventListener(evt, (e) => {
                            try {
                                const data = JSON.parse(e.data);
                                telemetry.trackEvent(evt);
                                handleSSEEvent(evt, data);
                                if (evt !== 'complete') resetStallTimer();
                                if (evt === 'complete') {
                                    es.close();
                                    currentEventSource = null;
                                    telemetry.reportSuccess();
                                    resolve();
                                }
                            } catch {}
                        });
                    });

                    es.addEventListener('error', (e) => {
                        if (es.readyState === EventSource.CLOSED) {
                            if (!pipelineComplete) {
                                reject(new Error(blueprintReceived ? 'Connection lost during analysis' : 'Connection lost before analysis started'));
                            }
                            return;
                        }
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent('error');
                            es.close();
                            currentEventSource = null;
                            reject(new Error(data.message || 'Analysis failed'));
                        } catch {
                            es.close();
                            currentEventSource = null;
                            if (!pipelineComplete) {
                                reject(new Error('Connection to server lost'));
                            }
                        }
                    });
                });

            } catch (err) {
                if (retryCount < MAX_RETRIES && currentImageBase64 && !pipelineComplete) {
                    retryCount++;
                    progressLabel.textContent = `Reconnecting (attempt ${retryCount})...`;
                    startPipelineInner(currentImageBase64);
                    return;
                }
                telemetry.reportError(err.message || 'connection failed', { type: 'pipeline_error' });
                telemetry.reportOutcome('error', err.message);
                showError(err.message || 'Connection failed');
            } finally {
                if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
                if (completionTimeout) { clearTimeout(completionTimeout); completionTimeout = null; }
            }
        }

        function handleSSEEvent(event, data) {
            switch (event) {
                case 'connected':
                    currentContinuousPct = Math.max(currentContinuousPct, 35);
                    updateProgress(currentContinuousPct, 'ANALYZING', 'Quick analysis starting...');
                    break;

                case 'progress': {
                    const phaseLabels = {
                        classifying: 'ANALYZING',
                        designing: 'DESIGNING',
                        researching: 'RESEARCHING',
                        enhancing: 'INVESTIGATING',
                        reviewing: 'INVESTIGATING',
                    };
                    const phaseLabel = phaseLabels[data.phase] || 'INVESTIGATING';
                    const mappedPct = 30 + Math.min(data.progress, 95) * 0.6;
                    currentContinuousPct = Math.max(currentContinuousPct, mappedPct);
                    updateProgress(currentContinuousPct, phaseLabel, data.message || 'Processing...');
                    if (!allCardsReadyShown && (data.phase === 'enhancing' || data.phase === 'researching' || data.phase === 'reviewing')) {
                        layoutProgressFill.value = data.progress;
                        layoutProgressText.textContent = `${completedCards}/${totalCards}`;
                    }
                    break;
                }

                case 'blueprint':
                    onBlueprintReceived(data);
                    break;

                case 'layout_preview':
                    onLayoutPreview(data);
                    break;

                case 'layout_update':
                    onLayoutUpdate(data);
                    break;

                case 'card':
                    onCardReceived(data);
                    break;

                case 'card_update':
                    onCardUpdated(data);
                    break;

                case 'card_add':
                    onCardAdded(data);
                    break;

                case 'phase':
                    onPhaseChange(data);
                    break;

                case 'complete':
                    onPipelineComplete(data);
                    break;

                case 'error':
                    telemetry.reportError(data.message || 'analysis failed', { type: 'sse_error' });
                    showError(data.message || 'Analysis failed');
                    break;
            }
        }

        let pendingBlueprint = null;
        let firstCardShown = false;
        const populatedCardIds = new Set();

        function onBlueprintReceived(blueprint) {
            blueprintReceived = true;
            if (pipelineTimeout) {
                clearTimeout(pipelineTimeout);
                pipelineTimeout = null;
            }

            if (completionTimeout) clearTimeout(completionTimeout);
            completionTimeout = setTimeout(() => {
                if (!pipelineComplete) {
                    telemetry.reportError('Analysis timed out after skeleton (90s)', {
                        type: 'timeout_post_skeleton',
                        completedCards,
                        totalCards,
                    });
                    showError('Analysis is taking too long. Please try again.');
                }
            }, 90000);

            pendingBlueprint = blueprint;
            totalCards = (blueprint.cards || []).length;
            completedCards = 0;

            const ct = blueprint.contentAnalysis?.contentType || 'analyzing';
            layoutBadge.textContent = humanizeContentType(ct);

            currentContinuousPct = Math.max(currentContinuousPct, 40);
            updateProgress(currentContinuousPct, 'ANALYZING', 'Reading your screenshot...');
            layoutProgressFill.value = 10;
            layoutProgressText.textContent = 'analyzing';
        }

        function onLayoutPreview(blueprint) {
            totalCards = (blueprint.cards || []).length;
            applyLayoutTheme(blueprint.layout?.type);

            const ct = blueprint.contentAnalysis?.contentType || 'general';
            layoutBadge.textContent = humanizeContentType(ct);

            if (blueprint.contentAnalysis) {
                /* removed: intent line no longer shown in user UI */
                renderFollowUpQuestions(blueprint.contentAnalysis);
            }

            currentContinuousPct = Math.max(currentContinuousPct, 55);
            updateProgress(currentContinuousPct, 'DESIGNING', `${ct} detected — designing layout...`);
            layoutProgressFill.value = 15;
            layoutProgressText.textContent = 'designing';
        }

        const enhanceStatusMessages = [
            'Searching source websites...',
            'Validating claims...',
            'Cross-referencing sources...',
            'Adding verified data...',
            'Checking multiple sources...',
            'Enriching with web results...',
            'Compiling findings...',
        ];
        let enhanceMsgInterval = null;

        function onLayoutUpdate(blueprint) {
            totalCards = (blueprint.cards || []).length;
            completedCards = 0;
            allCardsReadyShown = false;
            populatedCardIds.clear();
            applyLayoutTheme(blueprint.layout?.type);

            const ct = blueprint.contentAnalysis?.contentType || 'general';
            layoutBadge.textContent = humanizeContentType(ct);

            if (blueprint.contentAnalysis) {
                /* removed: intent line no longer shown in user UI */
                renderFollowUpQuestions(blueprint.contentAnalysis);
            }

            cardGrid.innerHTML = '';

            const populatedCards = (blueprint.cards || []).filter(c =>
                c.populatedData && Object.keys(c.populatedData).length > 0
            );
            const unpopulatedCards = (blueprint.cards || []).filter(c =>
                !c.populatedData || Object.keys(c.populatedData).length === 0
            );

            if (!firstCardShown && populatedCards.length > 0) {
                firstCardShown = true;
                showResultsCanvas();
            }

            const allCards = [...populatedCards, ...unpopulatedCards];
            const populatedCount = populatedCards.length;

            if (populatedCount <= 1) {
                cardGrid.classList.add('max-w-xl', 'mx-auto');
            } else {
                cardGrid.classList.remove('max-w-xl', 'mx-auto');
            }

            allCards.forEach((card, index) => {
                const hasData = card.populatedData && Object.keys(card.populatedData).length > 0;
                const el = createCardElement(card);

                if (hasData) {
                    completedCards++;
                    populatedCardIds.add(card.id);
                    el.classList.remove('loading');
                    el.classList.add('populated');
                    try {
                        el.innerHTML = renderCardContent(card.cardType, card.populatedData);
                    } catch (e) {
                        console.warn(`[CardRender] ${card.cardType} failed:`, e.message);
                        el.innerHTML = renderFallbackCard(card.cardType, card.populatedData);
                    }
                    el._cardData = card.populatedData;
                    appendCitations(el, card.populatedData);
                }

                cardGrid.appendChild(el);
                el.classList.add('transition-all', 'duration-300');
            });

            if (!firstCardShown && populatedCards.length === 0) {
                showResultsCanvas();
                firstCardShown = true;
            }

            checkAllCardsReady();
            if (!allCardsReadyShown) {
                layoutProgressFill.value = 25;
                layoutProgressText.textContent = 'enhancing';
                startEnhanceStatusRotation();
            }
        }

        function startEnhanceStatusRotation() {
            if (enhanceMsgInterval) clearInterval(enhanceMsgInterval);
            let msgIdx = 0;
            enhanceMsgInterval = setInterval(() => {
                const loadingCards = document.querySelectorAll('.card.loading');
                if ((loadingCards.length === 0 && pipelineComplete) || allCardsReadyShown) {
                    clearInterval(enhanceMsgInterval);
                    enhanceMsgInterval = null;
                    return;
                }
                msgIdx = (msgIdx + 1) % enhanceStatusMessages.length;
                progressLabel.textContent = enhanceStatusMessages[msgIdx];
            }, 3000);
        }

        function onCardReceived(data) {
            if (populatedCardIds.has(data.cardId)) {
                return;
            }
            populatedCardIds.add(data.cardId);
            completedCards++;

            if (!firstCardShown) {
                firstCardShown = true;
                showResultsCanvas();
            }

            if (completedCards > 1) {
                cardGrid.classList.remove('max-w-xl', 'mx-auto');
            }

            const el = document.getElementById(`card-${data.cardId}`);
            if (!el) return;

            el.classList.remove('loading', 'researching');
            el.classList.add('populated');
            try {
                el.innerHTML = renderCardContent(data.cardType, data.data);
            } catch (e) {
                console.warn(`[CardRender] ${data.cardType} failed:`, e.message);
                el.innerHTML = renderFallbackCard(data.cardType, data.data);
            }
            el._cardData = data.data;

            appendCitations(el, data.data);

            checkAllCardsReady();
            if (!allCardsReadyShown) {
                const pct = Math.min(95, 60 + Math.round((completedCards / totalCards) * 35));
                layoutProgressFill.value = pct;
                layoutProgressText.textContent = `${completedCards}/${totalCards}`;
            }
        }

        function onCardUpdated(data) {
            const el = document.getElementById(`card-${data.cardId}`);
            if (!el) return;

            const isNewlyPopulated = !populatedCardIds.has(data.cardId);
            if (isNewlyPopulated) {
                populatedCardIds.add(data.cardId);
                completedCards++;

                if (!firstCardShown) {
                    firstCardShown = true;
                    showResultsCanvas();
                }

                if (completedCards > 1) {
                    cardGrid.classList.remove('max-w-xl', 'mx-auto');
                }
            }

            const existingData = el._cardData || {};
            const mergedData = { ...existingData, ...data.data };
            el._cardData = mergedData;

            el.classList.remove('loading', 'researching');
            el.classList.add('populated');
            try {
                el.innerHTML = renderCardContent(data.cardType, mergedData);
            } catch (e) {
                console.warn(`[CardRender] ${data.cardType} failed:`, e.message);
                el.innerHTML = renderFallbackCard(data.cardType, mergedData);
            }

            appendCitations(el, mergedData);

            if (isNewlyPopulated) {
                checkAllCardsReady();
                if (!allCardsReadyShown) {
                    const pct = Math.min(95, 60 + Math.round((completedCards / totalCards) * 35));
                    layoutProgressFill.value = pct;
                    layoutProgressText.textContent = `${completedCards}/${totalCards}`;
                }
            }

            const srcLabels = { enhance: 'web verified', review: 'researched', 'research-enrich': 'enriched', status: '', reconcile: '' };
            const sourceLabel = srcLabels[data.source] || 'updated';
            if (sourceLabel) {
                const isResearch = data.source === 'review' || data.source === 'research-enrich';
                const sourceTag = document.createElement('span');
                sourceTag.className = `badge badge-xs badge-outline uppercase tracking-wide absolute right-2 top-2 ${isResearch ? 'badge-info' : 'badge-warning'}`;
                sourceTag.dataset.sourceTag = 'true';
                sourceTag.textContent = sourceLabel;
                el.appendChild(sourceTag);
                setTimeout(() => sourceTag.remove(), 4000);
            }
        }

        function onCardAdded(data) {
            totalCards++;
            const cardId = data.cardId;
            if (!populatedCardIds.has(cardId)) {
                populatedCardIds.add(cardId);
                completedCards++;
            }
            const card = {
                id: cardId,
                cardType: data.cardType,
                gridPosition: data.gridPosition || { row: totalCards, column: 1, columnSpan: 1, rowSpan: 1 },
                placeholderData: data.data,
            };

            cardGrid.classList.remove('max-w-xl', 'mx-auto');

            const el = createCardElement(card);
            el.classList.remove('loading');
            el.classList.add('populated');
            try {
                el.innerHTML = renderCardContent(data.cardType, data.data);
            } catch (e) {
                console.warn(`[CardRender] ${data.cardType} failed:`, e.message);
                el.innerHTML = renderFallbackCard(data.cardType, data.data);
            }
            el._cardData = data.data;

            const srcLabels = { enhance: 'web verified', review: 'researched', 'research-enrich': 'enriched' };
            const sourceLabel = srcLabels[data.source] || 'new';
            const isResearch = data.source === 'review' || data.source === 'research-enrich';
            const sourceTag = document.createElement('span');
            sourceTag.className = `badge badge-xs badge-outline uppercase tracking-wide absolute right-2 top-2 ${isResearch ? 'badge-info' : 'badge-warning'}`;
            sourceTag.dataset.sourceTag = 'true';
            sourceTag.textContent = sourceLabel;
            el.appendChild(sourceTag);
            setTimeout(() => sourceTag.remove(), 5000);

            cardGrid.appendChild(el);
            el.classList.add('transition-all', 'duration-300');

            appendCitations(el, data.data);

            checkAllCardsReady();
            if (!allCardsReadyShown) {
                const pct = Math.min(95, 60 + Math.round((completedCards / totalCards) * 35));
                layoutProgressFill.value = pct;
                layoutProgressText.textContent = `${completedCards}/${totalCards}`;
            }
        }

        function onPhaseChange(data) {
            const phaseMessages = {
                haiku: 'Quick analysis...',
                enhancing: 'Investigating sources...',
                reviewing: 'Deep research...',
            };
            const msg = phaseMessages[data.phase] || data.message || '';
            if (msg) {
                progressLabel.textContent = msg;
            }
        }

        function appendCitations(el, data) {
            const citations = data?._researchMeta?.citations || data?._webCitations || [];
            const validCitations = citations
                .map(c => typeof c === 'string' ? c : (c.url || c.cited_url || ''))
                .filter(url => url && url.startsWith('http'));
            if (validCitations.length === 0) return;

            const existing = el.querySelector('.web-citations');
            if (existing) existing.remove();

            const citHtml = `<div class="web-citations mt-2 px-4 pb-4">
                <div class="divider my-1 text-[10px] uppercase tracking-wider text-base-content/40">Sources</div>
                <div class="flex flex-wrap gap-1.5">
                ${validCitations.slice(0, 3).map(url => {
                    let domain;
                    try { domain = new URL(url).hostname.replace(/^www\./, ''); } catch { domain = url.replace(/^https?:\/\//, '').split('/')[0]; }
                    return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="badge badge-outline badge-xs">${esc(domain)}</a>`;
                }).join('')}
                </div>
            </div>`;
            el.insertAdjacentHTML('beforeend', citHtml);
        }

        function onPipelineComplete(data) {
            pipelineComplete = true;
            if (data?.layout?.type) applyLayoutTheme(data.layout.type);
            stopAnalysisProgressTick();
            if (completionTimeout) {
                clearTimeout(completionTimeout);
                completionTimeout = null;
            }
            if (stallTimer) {
                clearTimeout(stallTimer);
                stallTimer = null;
            }
            if (enhanceMsgInterval) {
                clearInterval(enhanceMsgInterval);
                enhanceMsgInterval = null;
            }
            if (uploadProgressInterval) {
                clearInterval(uploadProgressInterval);
                uploadProgressInterval = null;
            }

            progressOverlay.classList.add('hidden');
            cardGrid.classList.remove('max-w-xl', 'mx-auto');

            document.querySelectorAll('[data-source-tag]').forEach(t => t.remove());

            layoutProgress.style.display = 'none';

            if (!firstCardShown) {
                firstCardShown = true;
                resultsOverlay.classList.remove('hidden');
            }

            if (data?.contentAnalysis) {
                const ca = data.contentAnalysis;
                if (ca.additionalQuestions?.length) {
                    ca.followUpQuestions = [
                        ...(ca.followUpQuestions || []),
                        ...ca.additionalQuestions.map(q => ({ question: q })),
                    ];
                }
                renderFollowUpQuestions(ca);
            }

            // Immediately fire-and-forget the rendered card HTML to the server.
            // sendBeacon is guaranteed to deliver even if the user navigates away.
            try {
                const rid = telemetry.requestId;
                if (rid && cardGrid.children.length) {
                    const payload = JSON.stringify({
                        requestId: rid,
                        cardHtml: cardGrid.outerHTML,
                        clientState: {
                            viewport: { width: innerWidth, height: innerHeight, devicePixelRatio: devicePixelRatio || 2 },
                            screen: { width: screen.width, height: screen.height },
                            cards: { total: cardGrid.children.length, populated: cardGrid.querySelectorAll('.card.populated').length },
                            theme: document.documentElement.getAttribute('data-theme') || DEFAULT_THEME,
                            userAgent: navigator.userAgent,
                        },
                    });
                    navigator.sendBeacon('/api/hub/v2/render-capture', new Blob([payload], { type: 'application/json' }));
                }
            } catch (e) { /* sendBeacon is best-effort */ }

            // Also try the full async capture as a bonus (image + inlined DOM snapshot)
            setTimeout(() => captureRenderedCards().catch(e => console.warn('[RenderCapture] Fatal:', e.message)), 500);
        }

        const CAPTURE_STYLE_PROPS = [
            'color', 'backgroundColor', 'backgroundImage',
            'borderTopColor', 'borderRightColor', 'borderBottomColor', 'borderLeftColor',
            'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth',
            'borderTopStyle', 'borderRightStyle', 'borderBottomStyle', 'borderLeftStyle',
            'borderTopLeftRadius', 'borderTopRightRadius', 'borderBottomLeftRadius', 'borderBottomRightRadius',
            'boxShadow', 'textShadow',
            'fontSize', 'fontFamily', 'fontWeight', 'fontStyle', 'lineHeight', 'letterSpacing',
            'textAlign', 'textTransform', 'textDecoration',
            'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
            'marginTop', 'marginRight', 'marginBottom', 'marginLeft',
            'display', 'flexDirection', 'alignItems', 'justifyContent', 'gap', 'flexWrap',
            'gridTemplateColumns', 'gridTemplateRows',
            'width', 'maxWidth', 'minWidth', 'height', 'maxHeight', 'minHeight',
            'overflowX', 'overflowY',
            'opacity', 'visibility',
            'position', 'top', 'right', 'bottom', 'left', 'zIndex',
            'whiteSpace', 'wordBreak', 'wordWrap',
            'listStyleType',
        ];

        function inlineComputedStyles(origElements, clonedElements) {
            for (let i = 0; i < origElements.length && i < clonedElements.length; i++) {
                const cs = getComputedStyle(origElements[i]);
                const el = clonedElements[i];
                CAPTURE_STYLE_PROPS.forEach(p => {
                    const v = cs[p];
                    if (v !== undefined && v !== '') el.style[p] = v;
                });
            }
        }

        function prepareCloneForCapture(target) {
            const clone = target.cloneNode(true);
            clone.querySelectorAll('script, style, link[rel="stylesheet"]').forEach(s => s.remove());
            const origElements = [target, ...target.querySelectorAll('*')];
            const clonedElements = [clone, ...clone.querySelectorAll('*')];
            inlineComputedStyles(origElements, clonedElements);
            clone.style.opacity = '1';
            clone.style.transform = 'none';
            clone.style.position = 'relative';
            return clone;
        }

        function sendRenderCapture(rid, image, domSnapshot, clientState, method) {
            const payload = { requestId: rid, domSnapshot, clientState };
            if (image) payload.image = image;
            else payload.fallback = true;
            fetch('/api/hub/v2/render-capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            }).then(r => {
                if (!r.ok) console.warn('[RenderCapture] Server rejected:', r.status);
                else console.log('[RenderCapture] Saved via', method);
            }).catch(e => console.warn('[RenderCapture] POST failed:', e.message));
        }

        function captureViaForeignObject(target) {
            const w = target.scrollWidth;
            const h = Math.min(target.scrollHeight, 4096);
            const scale = Math.min(window.devicePixelRatio || 2, 2);
            const clone = prepareCloneForCapture(target);
            clone.style.width = w + 'px';
            clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
            const xhtml = new XMLSerializer().serializeToString(clone);
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">'
                + '<foreignObject width="100%" height="100%">' + xhtml + '</foreignObject></svg>';
            const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(w * scale);
                        canvas.height = Math.round(h * scale);
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#0a0d12';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.scale(scale, scale);
                        ctx.drawImage(img, 0, 0, w, h);
                        URL.revokeObjectURL(url);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                        resolve(dataUrl);
                    } catch (e) {
                        URL.revokeObjectURL(url);
                        reject(e);
                    }
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('SVG load failed')); };
                img.src = url;
            });
        }

        function captureViaHtml2Canvas(target) {
            if (typeof html2canvas === 'undefined') return Promise.reject(new Error('not loaded'));
            const origElements = [target, ...target.querySelectorAll('*')];
            const styleCache = origElements.map(el => {
                const cs = getComputedStyle(el);
                const s = {};
                CAPTURE_STYLE_PROPS.forEach(p => { s[p] = cs[p]; });
                return s;
            });
            return html2canvas(target, {
                backgroundColor: '#0a0d12',
                scale: Math.min(window.devicePixelRatio || 2, 2),
                logging: false,
                useCORS: true,
                allowTaint: true,
                width: target.scrollWidth,
                height: Math.min(target.scrollHeight, 4096),
                windowWidth: target.scrollWidth,
                windowHeight: target.scrollHeight,
                onclone: (clonedDoc) => {
                    clonedDoc.querySelectorAll('style, link[rel="stylesheet"]').forEach(s => s.remove());
                    const ct = clonedDoc.getElementById('resultsOverlay');
                    if (!ct) return;
                    ct.style.opacity = '1';
                    ct.style.transform = 'none';
                    const clonedEls = [ct, ...ct.querySelectorAll('*')];
                    for (let i = 0; i < clonedEls.length && i < styleCache.length; i++) {
                        const s = styleCache[i];
                        CAPTURE_STYLE_PROPS.forEach(p => { if (s[p] !== undefined && s[p] !== '') clonedEls[i].style[p] = s[p]; });
                    }
                },
            }).then(canvas => canvas.toDataURL('image/jpeg', 0.82));
        }

        async function captureRenderedCards() {
            const rid = telemetry.requestId;
            if (!rid) {
                console.warn('[RenderCapture] No requestId, skipping');
                return;
            }

            let clientState = null;
            let domSnapshot = null;

            try {
                await waitForCardsToSettle();
            } catch (e) {
                console.warn('[RenderCapture] waitForCardsToSettle error:', e.message);
            }

            const target = resultsOverlay;
            if (!target || !cardGrid.children.length) {
                console.warn('[RenderCapture] No target or empty card grid');
                return;
            }

            try { clientState = collectClientState(); } catch (e) { console.warn('[RenderCapture] collectClientState error:', e.message); }
            try { domSnapshot = serializeDomSnapshot(target); } catch (e) { console.warn('[RenderCapture] serializeDomSnapshot error:', e.message); }

            // Method 1: SVG foreignObject — browser's own renderer, no dependencies
            try {
                const dataUrl = await captureViaForeignObject(target);
                if (dataUrl && dataUrl.length > 1000) {
                    console.log('[RenderCapture] foreignObject succeeded, size:', Math.round(dataUrl.length / 1024), 'KB');
                    sendRenderCapture(rid, dataUrl, domSnapshot, clientState, 'foreignObject');
                    return;
                }
            } catch (e) {
                console.warn('[RenderCapture] foreignObject failed:', e.message);
            }

            // Method 2: html2canvas with aggressive style inlining (strip stylesheets, inline all)
            try {
                const dataUrl = await captureViaHtml2Canvas(target);
                if (dataUrl && dataUrl.length > 1000) {
                    console.log('[RenderCapture] html2canvas succeeded, size:', Math.round(dataUrl.length / 1024), 'KB');
                    sendRenderCapture(rid, dataUrl, domSnapshot, clientState, 'html2canvas');
                    return;
                }
            } catch (e) {
                console.warn('[RenderCapture] html2canvas failed:', e.message);
            }

            // Method 3: DOM snapshot only — always works, server renders as iframe in report
            console.warn('[RenderCapture] All image captures failed, sending DOM snapshot only');
            if (domSnapshot || clientState) {
                sendRenderCapture(rid, null, domSnapshot, clientState, 'dom-only');
            }
        }

        function waitForCardsToSettle() {
            return new Promise(resolve => {
                let checks = 0;
                const maxChecks = 20;
                const interval = setInterval(() => {
                    checks++;
                    const stillLoading = cardGrid.querySelectorAll('.card.loading').length;
                    const stillAnimating = cardGrid.querySelectorAll('.card:not(.populated)').length;
                    if ((stillLoading === 0 && stillAnimating === 0) || checks >= maxChecks) {
                        clearInterval(interval);
                        setTimeout(resolve, 800);
                    }
                }, 250);
            });
        }

        function collectClientState() {
            const state = {
                viewport: {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    devicePixelRatio: window.devicePixelRatio || 1,
                    scrollX: window.scrollX,
                    scrollY: window.scrollY,
                    orientation: screen.orientation?.type || (window.innerWidth > window.innerHeight ? 'landscape' : 'portrait'),
                },
                screen: {
                    width: screen.width,
                    height: screen.height,
                    colorDepth: screen.colorDepth,
                },
                cards: {
                    total: cardGrid.children.length,
                    populated: cardGrid.querySelectorAll('.card.populated').length,
                    loading: cardGrid.querySelectorAll('.card.loading').length,
                    errored: cardGrid.querySelectorAll('.card.error').length,
                    types: Array.from(cardGrid.querySelectorAll('.card')).map(c => ({
                        id: c.id,
                        type: c.dataset.cardType,
                        classes: c.className,
                        rect: { w: c.offsetWidth, h: c.offsetHeight },
                        overflowing: c.scrollHeight > c.clientHeight || c.scrollWidth > c.clientWidth,
                    })),
                },
                layout: {
                    gridComputedCols: getComputedStyle(cardGrid).gridTemplateColumns,
                    gridComputedRows: getComputedStyle(cardGrid).gridTemplateRows,
                    gridGap: getComputedStyle(cardGrid).gap,
                    overlayRect: { w: resultsOverlay.offsetWidth, h: resultsOverlay.offsetHeight },
                    theme: document.documentElement.getAttribute('data-theme') || DEFAULT_THEME,
                },
                performance: {},
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString(),
            };

            try {
                const entries = performance.getEntriesByType('layout-shift');
                if (entries.length) {
                    state.performance.cumulativeLayoutShift = entries.reduce((sum, e) => sum + e.value, 0);
                }
                const paintEntries = performance.getEntriesByType('paint');
                paintEntries.forEach(p => {
                    state.performance[p.name.replace(/-/g, '_')] = Math.round(p.startTime);
                });
                const lcpEntries = performance.getEntriesByType('largest-contentful-paint');
                if (lcpEntries.length) {
                    state.performance.lcp = Math.round(lcpEntries[lcpEntries.length - 1].startTime);
                }
            } catch (e) { /* performance API may not be fully available */ }

            return state;
        }

        function serializeDomSnapshot(target) {
            try {
                const clone = prepareCloneForCapture(target);
                const html = '<!DOCTYPE html><html><head><meta charset="UTF-8">'
                    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
                    + '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">'
                    + '<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">'
                    + '</head><body>' + clone.outerHTML + '</body></html>';
                if (html.length > 1024 * 1024) return html.substring(0, 1024 * 1024);
                return html;
            } catch (e) {
                console.warn('[RenderCapture] DOM snapshot failed:', e.message);
                return null;
            }
        }

        // === Card Rendering ===
        function createCardElement(card) {
            const el = document.createElement('div');

            el.className = 'card bg-base-200 border border-base-300 shadow-sm overflow-hidden loading relative';
            el.dataset.cardType = card.cardType;

            const span = card.gridPosition?.columnSpan || 1;

                            const evLabel = evObj.label || evObj.title || evObj.name || '';

                            const isLast = i === (d.events || []).length - 1;

                            </li>`;

                case 'quote_card': {

                case 'comparison_card': {

                                <div class="font-bold text-base text-white">${esc(d.name || 'Location')}</div>

                    </div>`;
                }

                case 'chart_card': {
                    const items = (Array.isArray(d.data) ? d.data : []).map(raw => {
                        const label = raw.label || raw.name || raw.team || raw.category || raw.key || raw.x || raw.metric || '';
                        let value = typeof raw.value === 'number' ? raw.value : undefined;
                        if (value === undefined) {
                            for (const k of Object.keys(raw)) {
                                if (typeof raw[k] === 'number') { value = raw[k]; break; }
                            }
                        }
                        if (value === undefined) value = parseFloat(raw.value) || 0;
                        return { ...raw, label, value };

                    const maxVal = Math.max(...items.map(i => i.value), 1);
                    const unit = d.unit || '';
                    const cType = d.chartType || 'bar';
                    let chartHtml = '';

                    if (cType === 'bar') {
                        chartHtml = `<div class="space-y-3">${items.slice(0, 8).map((item) => {
                            const pct = Math.round((item.value / maxVal) * 100);
                            return `<div>
                                <div class="flex justify-between text-xs mb-1"><span class="text-base-content/60">${esc(item.label || '')}</span><span class="font-mono font-bold">${item.value}${unit}</span></div>
                                <progress class="progress progress-primary w-full h-2" value="${pct}" max="100"></progress>
                            </div>`;
                        }).join('')}</div>`;
                    } else if (cType === 'pie') {
                        const total = items.reduce((s, i) => s + (typeof i.value === 'number' ? i.value : 0), 0) || 1;
                        chartHtml = `<div class="space-y-3">${items.slice(0, 6).map((item) => {
                            const pct = (item.value / total) * 100;
                            return `<div>
                                <div class="flex justify-between text-xs mb-1"><span class="text-base-content/60">${esc(item.label || '')}</span><span class="font-bold">${Math.round(pct)}%</span></div>
                                <progress class="progress progress-secondary w-full h-2" value="${Math.round(pct)}" max="100"></progress>
                            </div>`;
                        }).join('')}</div>`;
                    } else if (cType === 'progress') {
                        chartHtml = `<div class="space-y-3">${items.slice(0, 6).map((item) => {
                            const pct = Math.min(Math.round((item.value / maxVal) * 100), 100);
                            return `<div>
                                <div class="flex justify-between text-xs mb-1"><span class="text-base-content/60">${esc(item.label || '')}</span><span class="font-bold">${item.value}${unit}</span></div>
                                <progress class="progress progress-accent w-full h-2" value="${pct}" max="100"></progress>
                            </div>`;
                        }).join('')}</div>`;
                    } else {
                        chartHtml = `<div class="space-y-2">${items.slice(0, 8).map((item) => {
                            const pct = Math.round((item.value / maxVal) * 100);
                            return `<div><div class="flex justify-between text-xs mb-1"><span class="text-base-content/60">${esc(item.label || '')}</span><span class="font-mono font-bold">${item.value}${unit}</span></div>

                    return `<div class="p-4">

                        ${d.sourceUrl && d.sourceUrl.startsWith('http') ? (() => { try { return `<div class="text-xs text-base-content/40 mt-2">Source: ${renderLink(d.sourceUrl, new URL(d.sourceUrl).hostname)}</div>`; } catch(e) { return ''; } })() : ''}
                    </div>`;
                }

                case 'verification_card': {
                    const vStatus = d.status || 'searching';
                    const isSearching = vStatus === 'searching';
                    const statusConfig = {
                        searching: { icon: 'search', badge: 'badge-info', label: 'Searching sources...' },
                        partially_verified: { icon: 'pending', badge: 'badge-warning', label: 'Partially verified' },
                        verified: { icon: 'check_circle', badge: 'badge-success', label: 'Verified by sources' },

                        inconclusive: { icon: 'help_outline', cls: 'text-warning' },
                        unverified: { icon: 'help_outline', cls: 'text-warning' },

                    return `<div class="p-4">

                        <p class="text-sm italic text-base-content/70 mb-3 leading-relaxed">${linkify(cleanSummary(d.claim || ''))}</p>

                                        ${hasUrl ? (() => { try { return `<a href="${esc(sObj.url)}" target="_blank" rel="noopener noreferrer" class="text-xs text-primary hover:underline">${esc(new URL(sObj.url).hostname)}</a>`; } catch(e) { return `<a href="${esc(sObj.url)}" target="_blank" rel="noopener noreferrer" class="text-xs text-primary hover:underline">source</a>`; } })() : ''}
