                    <defs><linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--accent)"/>
                        <stop offset="100%" stop-color="var(--purple)"/>
                    </linearGradient></defs>
                    <circle class="progress-ring-bg" cx="50" cy="50" r="45"/>
                    <circle class="progress-ring-fill" id="progressRingFill" cx="50" cy="50" r="45"/>
                </svg>
                <div class="progress-pct" id="progressPct">0%</div>
            </div>
            <div class="progress-phase" id="progressPhase">UPLOADING</div>
            <div class="progress-label" id="progressLabel">Sending screenshot...</div>
        </div>

        <div class="results-overlay" id="resultsOverlay">
            <div class="layout-header">
                <div class="layout-header-left">
                    <button class="layout-back" id="layoutBack">
                        <span class="material-symbols-rounded" style="font-size:18px">arrow_back</span>
                        New
                    </button>
                    <span class="layout-badge" id="layoutBadge"></span>
                </div>
                <div class="layout-progress" id="layoutProgress">
                    <div class="layout-progress-bar">
                        <div class="layout-progress-fill" id="layoutProgressFill"></div>
                    </div>
                    <span class="layout-progress-text" id="layoutProgressText"></span>
                </div>
            </div>
            <div class="content-analysis" id="contentAnalysis" style="display:none;">
                <div class="content-analysis-intent" id="analysisIntent"></div>
            </div>
            <div class="card-grid" id="cardGrid"></div>
            <div class="follow-up-section" id="followUpSection" style="display:none;">
                <div class="follow-up-header">
                    <span class="material-symbols-rounded">forum</span>
                    Questions you might have
                </div>
                <div class="follow-up-list" id="followUpList"></div>
            </div>
        </div>
    </div>

    <!-- Error State -->
    <div id="errorState">
        <div class="error-icon">
            <span class="material-symbols-rounded">error</span>
        </div>
        <p class="error-text" id="errorText">something went wrong</p>
        <button class="retry-btn" id="retryBtn">Try Again</button>
    </div>

    <script>
        const pasteState = document.getElementById('pasteState');
        const mainCanvas = document.getElementById('mainCanvas');
        const screenshotLayer = document.getElementById('screenshotLayer');
        const screenshotImg = document.getElementById('screenshotImg');
        const progressOverlay = document.getElementById('progressOverlay');
        const progressRingFill = document.getElementById('progressRingFill');
        const progressPct = document.getElementById('progressPct');
        const progressPhase = document.getElementById('progressPhase');
        const progressLabel = document.getElementById('progressLabel');
        const progressRing = document.getElementById('progressRing');
        const RING_CIRCUMFERENCE = 2 * Math.PI * 45;

        function updateProgress(pct, phase, label) {
            const offset = RING_CIRCUMFERENCE - (pct / 100) * RING_CIRCUMFERENCE;
            progressRingFill.style.strokeDashoffset = offset;
            progressPct.textContent = Math.round(pct) + '%';
            if (phase) progressPhase.textContent = phase;
            if (label) progressLabel.textContent = label;
            if (pct >= 100) {
                progressRing.classList.add('complete');
            } else {
                progressRing.classList.remove('complete');
            }
        }
        const resultsOverlay = document.getElementById('resultsOverlay');
        const layoutBadge = document.getElementById('layoutBadge');
        const layoutProgressFill = document.getElementById('layoutProgressFill');
        const layoutProgressText = document.getElementById('layoutProgressText');
        const contentAnalysisEl = document.getElementById('contentAnalysis');
        const analysisIntent = document.getElementById('analysisIntent');
        const followUpSection = document.getElementById('followUpSection');
        const followUpList = document.getElementById('followUpList');
        const cardGrid = document.getElementById('cardGrid');
        const errorText = document.getElementById('errorText');
        const retryBtn = document.getElementById('retryBtn');
        const layoutBack = document.getElementById('layoutBack');
        const layoutProgress = document.getElementById('layoutProgress');
        const errorState = document.getElementById('errorState');
        const pasteZone = document.getElementById('pasteZone');

        let currentImageUrl = null;
        let currentImageBase64 = null;
        let totalCards = 0;
        let completedCards = 0;

        // === Utilities ===
        function esc(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'object') {
                if (Array.isArray(val)) return val.map(v => esc(v)).join(', ');
                const meaningful = val.label || val.name || val.value || val.text || val.title || val.header || val.event || val.description;
                if (meaningful) return esc(meaningful);
                return esc(JSON.stringify(val));
            }
            const d = document.createElement('div');
            d.textContent = String(val);
            return d.innerHTML;
        }

        function linkify(text) {
            if (!text) return '';
            const escaped = esc(text);
            return escaped.replace(
                /(https?:\/\/[^\s<>"']+)/gi,
                '<a href="$1" target="_blank" rel="noopener noreferrer" class="auto-link">$1</a>'
            );
        }

        function normalizeFeature(item) {
            if (typeof item === 'string') return item;
            if (typeof item === 'object' && item !== null) {
                return item.label || item.name || item.value || item.text ||
                       item.description || item.type || item.feature ||
                       JSON.stringify(item);
            }
            return String(item);
        }

        function renderItemValue(item) {
            if (typeof item === 'string') return linkify(item);
            if (typeof item === 'object' && item !== null) {
                const parts = [];
                if (item.label || item.name) parts.push(`<strong>${esc(item.label || item.name)}</strong>`);
                if (item.value) parts.push(linkify(item.value));
                if (item.description) parts.push(`<span style="color:var(--text-secondary)">${linkify(item.description)}</span>`);
                if (parts.length) return parts.join(': ');
                return linkify(normalizeFeature(item));
            }
            return esc(item);
        }

        function renderLink(url, label, extraClass) {
            if (!url || typeof url !== 'string' || !url.startsWith('http')) return '';
            const cls = extraClass ? ` class="${extraClass}"` : ' class="auto-link"';
            return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer"${cls}>${esc(label || url)}</a>`;
        }

        const CARD_ICONS = {
            hero_summary: { icon: 'auto_awesome', bg: 'var(--accent-bg-strong)', color: 'var(--accent)' },
            key_metric: { icon: 'monitoring', bg: 'var(--accent-bg)', color: 'var(--accent)' },
            info_list: { icon: 'list_alt', bg: 'var(--surface-3)', color: 'var(--text-secondary)' },
            fact_check: { icon: 'fact_check', bg: 'var(--yellow-bg)', color: 'var(--yellow)' },
            person_card: { icon: 'person', bg: 'var(--purple-bg)', color: 'var(--purple)' },
            product_card: { icon: 'shopping_bag', bg: 'var(--green-bg)', color: 'var(--green)' },
            timeline_card: { icon: 'timeline', bg: 'var(--accent-bg)', color: 'var(--accent)' },
            quote_card: { icon: 'format_quote', bg: 'var(--purple-bg)', color: 'var(--purple)' },
            comparison_card: { icon: 'compare', bg: 'var(--surface-3)', color: 'var(--text-secondary)' },
            warning_card: { icon: 'warning', bg: 'var(--yellow-bg)', color: 'var(--yellow)' },
            action_card: { icon: 'bolt', bg: 'var(--accent-bg-strong)', color: 'var(--accent)' },
            text_extract: { icon: 'description', bg: 'var(--surface-3)', color: 'var(--text-secondary)' },
            location_card: { icon: 'location_on', bg: 'var(--accent-bg)', color: 'var(--accent)' },
            link_card: { icon: 'link', bg: 'var(--accent-bg)', color: 'var(--accent)' },
            news_card: { icon: 'newspaper', bg: 'var(--red-bg)', color: 'var(--red)' },
            chart_card: { icon: 'bar_chart', bg: 'var(--accent-bg-strong)', color: 'var(--accent)' },
            did_you_know_card: { icon: 'lightbulb', bg: 'var(--yellow-bg)', color: 'var(--yellow)' },
            verification_card: { icon: 'verified', bg: 'var(--accent-bg-strong)', color: 'var(--accent)' },
        };

        const CHART_COLORS = ['#5b8af5', '#4cd68a', '#f0c040', '#f06060', '#a07ef0', '#f09040', '#60d0f0', '#f060a0'];

        function renderFollowUpQuestions(contentAnalysis) {
            const questions = contentAnalysis.followUpQuestions || [];
            const topQ = contentAnalysis.topQuestions || [];

            const allQuestions = [];

            questions.forEach(q => {
                if (typeof q === 'object' && q.question) {
                    allQuestions.push({ question: q.question, answer: q.answer || '' });
                } else if (typeof q === 'string') {
                    allQuestions.push({ question: q, answer: '' });
                }
            });

            topQ.forEach(q => {
                if (!allQuestions.some(aq => aq.question === q)) {
                    allQuestions.push({ question: q, answer: '' });
                }
            });

            if (allQuestions.length === 0) return;

            followUpSection.style.display = '';
            followUpList.innerHTML = '';

            allQuestions.slice(0, 5).forEach((q, i) => {
                const item = document.createElement('div');
                item.className = 'follow-up-item';
                item.innerHTML = `
                    <div class="follow-up-question" data-idx="${i}">
                        <div class="fq-icon"><span class="material-symbols-rounded">add</span></div>
                        <div class="fq-text">${esc(q.question)}</div>
                    </div>
                    <div class="follow-up-answer">
                        <div class="follow-up-answer-text">${q.answer ? linkify(q.answer) : '<span style="color:var(--text-muted);font-style:italic">Tap to expand...</span>'}</div>
                    </div>
                `;

                item.querySelector('.follow-up-question').addEventListener('click', () => {
                    item.classList.toggle('open');
                });

                followUpList.appendChild(item);
            });
        }

        function renderSparkline(data) {
            if (!Array.isArray(data) || data.length < 2) return '';
            const max = Math.max(...data);
            const min = Math.min(...data);
            const range = max - min || 1;
            const w = 100;
            const h = 24;
            const step = w / (data.length - 1);

            const points = data.map((v, i) => {
                const x = i * step;
                const y = h - ((v - min) / range) * (h - 4) - 2;
                return `${x},${y}`;
            }).join(' ');

            const areaPoints = points + ` ${w},${h} 0,${h}`;

            return `<svg class="metric-sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
                <polygon class="sparkline-area" points="${areaPoints}"/>
                <polyline points="${points}"/>
            </svg>`;
        }

        const CONTENT_TYPE_LABELS = {
            breaking_news: 'Breaking News',
            news: 'News',
            product: 'Product',
            social_media: 'Social Media',
            social: 'Social',
            tech: 'Tech',
            sports: 'Sports',
            data: 'Data',
            analytics: 'Analytics',
            general: 'Analysis',
            article: 'Article',
            report_significant_event: 'Breaking News',
            significant_event: 'Breaking News',
            messaging: 'Messaging',
            chat: 'Chat',
            settings: 'Settings',
            finance: 'Finance',
            health: 'Health',
            science: 'Science',
            entertainment: 'Entertainment',
            analyzing: 'Analyzing...',
        };

        function humanizeContentType(ct) {
            if (!ct) return 'Analysis';
            if (CONTENT_TYPE_LABELS[ct]) return CONTENT_TYPE_LABELS[ct];
            return ct.replace(/[_-]/g, ' ').replace(/\b\w/g, l => l.toUpperCase()).substring(0, 20);
        }

        const CARDS_WITHOUT_LABEL = new Set([
            'hero_summary', 'verification_card', 'did_you_know_card', 'news_card', 'chart_card', 'warning_card',
        ]);

        function getCardTypeLabel(cardType) {
            if (CARDS_WITHOUT_LABEL.has(cardType)) return '';
            const info = CARD_ICONS[cardType] || { icon: 'info', bg: 'var(--surface-3)', color: 'var(--text-secondary)' };
            return `<div class="card-type-label">
                <div class="card-type-icon" style="background:${info.bg}">
                    <span class="material-symbols-rounded" style="color:${info.color}">${info.icon}</span>
                </div>
                ${cardType.replace(/_/g, ' ')}
            </div>`;
        }

        // === Image Handling ===
        async function readClipboard() {
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    const imageType = item.types.find(t => t.startsWith('image/'));
                    if (imageType) {
                        const blob = await item.getType(imageType);
                        handleImage(blob);
                        return;
                    }
                }
                showError('No image found in clipboard');
            } catch (err) {
                if (err.name === 'NotAllowedError') {
                    showError('Clipboard access denied');
                } else {
                    showError('Could not read clipboard');
                }
            }
        }

        let uploadProgressInterval = null;
        let analysisProgressInterval = null;
        let currentContinuousPct = 0;

        function startAnalysisProgressTick(fromPct) {
            if (analysisProgressInterval) clearInterval(analysisProgressInterval);
            currentContinuousPct = fromPct;
            analysisProgressInterval = setInterval(() => {
                if (currentContinuousPct < 88) {
                    currentContinuousPct += (88 - currentContinuousPct) * 0.02;
                    updateProgress(currentContinuousPct, null, null);
                }
            }, 300);
        }

        function stopAnalysisProgressTick() {
            if (analysisProgressInterval) {
                clearInterval(analysisProgressInterval);
                analysisProgressInterval = null;
            }
        }

        function handleImage(blob) {
            currentImageUrl = URL.createObjectURL(blob);
            screenshotImg.src = currentImageUrl;
            pasteState.classList.add('hidden');
            mainCanvas.classList.add('active');
            screenshotLayer.className = 'screenshot-layer scanning';
            progressOverlay.classList.add('active');
            progressOverlay.classList.add('uploading');
            progressOverlay.classList.remove('analyzing', 'ready', 'hiding');
            updateProgress(0, 'UPLOADING', 'Sending screenshot...');

            const reader = new FileReader();
            reader.onloadend = () => {
                currentImageBase64 = reader.result;
                startPipeline(currentImageBase64);
            };
            reader.readAsDataURL(blob);
        }

        // === Telemetry ===
        const telemetry = {
            pipelineStart: null,
            uploadStart: null,
            uploadEnd: null,
            firstEventAt: null,
            eventsReceived: [],
            requestId: null,

            reset() {
                this.pipelineStart = Date.now();
                this.uploadStart = null;
                this.uploadEnd = null;
                this.firstEventAt = null;
                this.eventsReceived = [];
                this.requestId = null;
            },

            markUploadStart() { this.uploadStart = Date.now(); },
            markUploadEnd() { this.uploadEnd = Date.now(); },

            trackEvent(event) {
                const now = Date.now();
                if (!this.firstEventAt) this.firstEventAt = now;
                const elapsed = now - (this.pipelineStart || now);
                this.eventsReceived.push({ event, elapsed });
            },

            _buildPayload(extra = {}) {
                const now = Date.now();
                return {
                    requestId: this.requestId,
                    url: location.href,
                    userAgent: navigator.userAgent,
                    screen: `${screen.width}x${screen.height}`,
                    connection: navigator.connection ? {
                        type: navigator.connection.effectiveType,
                        downlink: navigator.connection.downlink,
                        rtt: navigator.connection.rtt,
                    } : null,
                    totalDuration: this.pipelineStart ? now - this.pipelineStart : null,
                    uploadDuration: (this.uploadStart && this.uploadEnd) ? this.uploadEnd - this.uploadStart : null,
                    firstEventDelay: (this.pipelineStart && this.firstEventAt) ? this.firstEventAt - this.pipelineStart : null,
                    eventsReceived: this.eventsReceived,
                    retries: retryCount,
                    state: {
                        blueprintReceived,
                        pipelineComplete,
                        totalCards,
                        completedCards,
                    },
                    ...extra,
                };
            },

            reportError(message, extra = {}) {
                const payload = { ...this._buildPayload(extra), message, outcome: 'error' };
                fetch('/api/debug/client-error', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportSuccess() {
                const payload = { ...this._buildPayload(), outcome: 'success' };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportOutcome(outcome, error = null) {
                const payload = { ...this._buildPayload(), outcome, error };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },
        };

        // === Pipeline ===
        let blueprintReceived = false;
        let pipelineComplete = false;
        let pipelineTimeout = null;
        let completionTimeout = null;
        let stallTimer = null;
        let lastEventTime = 0;
        let retryCount = 0;
        const MAX_RETRIES = 2;

        function resetStallTimer() {
            lastEventTime = Date.now();
            if (stallTimer) clearTimeout(stallTimer);
            if (pipelineComplete) return;
            stallTimer = setTimeout(() => {
                if (!pipelineComplete && blueprintReceived) {
                    const stallDuration = Date.now() - lastEventTime;
                    telemetry.reportError(`SSE stall detected (${Math.round(stallDuration/1000)}s)`, {
                        type: 'sse_stall',
                        completedCards,
                        totalCards,
                        retryCount,
                    });
                    if (retryCount < MAX_RETRIES && currentImageBase64) {
                        retryCount++;
                        progressLabel.textContent = `Reconnecting (attempt ${retryCount})...`;
                        startPipelineInner(currentImageBase64);
                    } else {
                        showError('Connection to server lost. Please try again.');
                    }
                }
            }, 20000);
        }

        async function startPipeline(imageDataUrl) {
            retryCount = 0;
            await startPipelineInner(imageDataUrl);
        }

        let currentEventSource = null;

        async function startPipelineInner(imageDataUrl) {
            blueprintReceived = false;
            pipelineComplete = false;
            lastEventTime = Date.now();
            telemetry.reset();

            if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
            if (uploadProgressInterval) { clearInterval(uploadProgressInterval); uploadProgressInterval = null; }
            stopAnalysisProgressTick();
            if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

            try {
                telemetry.markUploadStart();

                const { requestId, status } = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/api/hub/v2/start');
                    xhr.setRequestHeader('Content-Type', 'application/json');

                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const uploadPct = (e.loaded / e.total) * 30;
                            updateProgress(uploadPct, 'UPLOADING', 'Sending screenshot...');
                        }
                    });

                    xhr.addEventListener('load', () => {
                        telemetry.markUploadEnd();
                        if (xhr.status >= 200 && xhr.status < 300) {
                            try {
                                resolve(JSON.parse(xhr.responseText));
                            } catch {
                                reject(new Error('Invalid server response'));
                            }
                        } else {
                            try {
                                const err = JSON.parse(xhr.responseText);
                                reject(new Error(err.error || `Upload failed (HTTP ${xhr.status})`));
                            } catch {
                                reject(new Error(`Upload failed (HTTP ${xhr.status})`));
                            }
                        }
                    });

                    xhr.addEventListener('error', () => {
                        telemetry.markUploadEnd();
                        reject(new Error('Upload failed — network error'));
                    });

                    xhr.send(JSON.stringify({ image: imageDataUrl }));
                });

                telemetry.requestId = requestId;

                progressOverlay.classList.remove('uploading');
                progressOverlay.classList.add('analyzing');
                updateProgress(32, 'ANALYZING', 'Quick analysis starting...');
                startAnalysisProgressTick(32);

                await new Promise((resolve, reject) => {
                    const es = new EventSource(`/api/hub/v2/stream/${requestId}`);
                    currentEventSource = es;

                    pipelineTimeout = setTimeout(() => {
                        if (!blueprintReceived) {
                            es.close();
                            telemetry.reportError('No response from server (30s)', { type: 'timeout_no_skeleton' });
                            reject(new Error('Could not connect to analysis server. Please try again.'));
                        }
                    }, 30000);

                    const events = ['connected', 'progress', 'blueprint', 'layout_preview', 'layout_update', 'card', 'card_update', 'card_add', 'phase', 'complete'];
                    events.forEach(evt => {
                        es.addEventListener(evt, (e) => {
                            try {
                                const data = JSON.parse(e.data);
                                telemetry.trackEvent(evt);
                                handleSSEEvent(evt, data);
                                if (evt !== 'complete') resetStallTimer();
                                if (evt === 'complete') {
                                    es.close();
                                    currentEventSource = null;
                                    telemetry.reportSuccess();
                                    resolve();
                                }
                            } catch {}
                        });
                    });

                    es.addEventListener('error', (e) => {
                        if (es.readyState === EventSource.CLOSED) {
                            if (!pipelineComplete) {
                                reject(new Error(blueprintReceived ? 'Connection lost during analysis' : 'Connection lost before analysis started'));
                            }
                            return;
                        }
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent('error');
                            es.close();
                            currentEventSource = null;
                            reject(new Error(data.message || 'Analysis failed'));
                        } catch {
                            es.close();
                            currentEventSource = null;
                            if (!pipelineComplete) {
                                reject(new Error('Connection to server lost'));
                            }
                        }
                    });
                });

            } catch (err) {
                if (retryCount < MAX_RETRIES && currentImageBase64 && !pipelineComplete) {
                    retryCount++;
                    progressLabel.textContent = `Reconnecting (attempt ${retryCount})...`;
                    startPipelineInner(currentImageBase64);
                    return;
                }
                telemetry.reportError(err.message || 'connection failed', { type: 'pipeline_error' });
                telemetry.reportOutcome('error', err.message);
                showError(err.message || 'Connection failed');
            } finally {
                if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
                if (completionTimeout) { clearTimeout(completionTimeout); completionTimeout = null; }
            }
        }

        function handleSSEEvent(event, data) {
            switch (event) {
                case 'connected':
                    currentContinuousPct = Math.max(currentContinuousPct, 35);
                    updateProgress(currentContinuousPct, 'ANALYZING', 'Quick analysis starting...');
                    break;

                case 'progress': {
                    const phaseLabels = {
                        classifying: 'ANALYZING',
                        designing: 'DESIGNING',
                        researching: 'RESEARCHING',
                        enhancing: 'ENHANCING',
                        reviewing: 'REVIEWING',
                    };
                    const phaseLabel = phaseLabels[data.phase] || 'ANALYZING';
                    const mappedPct = 30 + Math.min(data.progress, 95) * 0.6;
                    currentContinuousPct = Math.max(currentContinuousPct, mappedPct);
                    updateProgress(currentContinuousPct, phaseLabel, data.message || 'Processing...');
                    if (data.phase === 'enhancing' || data.phase === 'researching' || data.phase === 'reviewing') {
                        layoutProgressFill.style.width = data.progress + '%';
                        layoutProgressText.textContent = data.phase === 'enhancing' ? 'enhancing' : data.phase === 'reviewing' ? 'reviewing' : `${completedCards}/${totalCards}`;
                    }
                    break;
                }

                case 'blueprint':
                    onBlueprintReceived(data);
                    break;

                case 'layout_preview':
                    onLayoutPreview(data);
                    break;

                case 'layout_update':
                    onLayoutUpdate(data);
                    break;

                case 'card':
                    onCardReceived(data);
                    break;

                case 'card_update':
                    onCardUpdated(data);
                    break;

                case 'card_add':
                    onCardAdded(data);
                    break;

                case 'phase':
                    onPhaseChange(data);
                    break;

                case 'complete':
                    onPipelineComplete();
                    break;

                case 'error':
                    telemetry.reportError(data.message || 'analysis failed', { type: 'sse_error' });
                    showError(data.message || 'Analysis failed');
                    break;
            }
        }

        let pendingBlueprint = null;
        let firstCardShown = false;
        const populatedCardIds = new Set();

        function onBlueprintReceived(blueprint) {
            blueprintReceived = true;
            if (pipelineTimeout) {
                clearTimeout(pipelineTimeout);
                pipelineTimeout = null;
            }

            if (completionTimeout) clearTimeout(completionTimeout);
            completionTimeout = setTimeout(() => {
                if (!pipelineComplete) {
                    telemetry.reportError('Analysis timed out after skeleton (90s)', {
                        type: 'timeout_post_skeleton',
                        completedCards,
                        totalCards,
                    });
                    showError('Analysis is taking too long. Please try again.');
                }
            }, 90000);

            pendingBlueprint = blueprint;
            totalCards = (blueprint.cards || []).length;
            completedCards = 0;

            const ct = blueprint.contentAnalysis?.contentType || 'analyzing';
            layoutBadge.textContent = humanizeContentType(ct);

            currentContinuousPct = Math.max(currentContinuousPct, 40);
            updateProgress(currentContinuousPct, 'ANALYZING', 'Reading your screenshot...');
            layoutProgressFill.style.width = '10%';
            layoutProgressText.textContent = 'analyzing';
        }

        function onLayoutPreview(blueprint) {
            totalCards = (blueprint.cards || []).length;

            const ct = blueprint.contentAnalysis?.contentType || 'general';
            layoutBadge.textContent = humanizeContentType(ct);

            if (blueprint.contentAnalysis) {
                contentAnalysisEl.style.display = '';
                const intent = blueprint.contentAnalysis.intent || '';
                const looksLikeLabel = /^[a-z_]+$/.test(intent) || intent.length < 10;
                analysisIntent.textContent = looksLikeLabel ? '' : intent;
                contentAnalysisEl.style.display = looksLikeLabel && !intent ? 'none' : '';
                renderFollowUpQuestions(blueprint.contentAnalysis);
            }

            currentContinuousPct = Math.max(currentContinuousPct, 55);
            updateProgress(currentContinuousPct, 'DESIGNING', `${ct} detected — designing layout...`);
            layoutProgressFill.style.width = '15%';
            layoutProgressText.textContent = 'designing';
        }

        const enhanceStatusMessages = [
            'Sonnet analyzing deeper...',
            'Enriching card content...',
            'Searching for more context...',
            'Verifying information...',
            'Cross-referencing sources...',
            'Adding insights...',
            'Compiling research...',
        ];
        let enhanceMsgInterval = null;

        function onLayoutUpdate(blueprint) {
            totalCards = (blueprint.cards || []).length;

            const ct = blueprint.contentAnalysis?.contentType || 'general';
            layoutBadge.textContent = humanizeContentType(ct);

            if (blueprint.contentAnalysis) {
                contentAnalysisEl.style.display = '';
                const intent = blueprint.contentAnalysis.intent || '';
                const looksLikeLabel = /^[a-z_]+$/.test(intent) || intent.length < 10;
                analysisIntent.textContent = looksLikeLabel ? '' : intent;
                contentAnalysisEl.style.display = looksLikeLabel && !intent ? 'none' : '';
                renderFollowUpQuestions(blueprint.contentAnalysis);
            }

            cardGrid.innerHTML = '';

            const populatedCards = (blueprint.cards || []).filter(c =>
                c.populatedData && Object.keys(c.populatedData).length > 0
            );
            const unpopulatedCards = (blueprint.cards || []).filter(c =>
                !c.populatedData || Object.keys(c.populatedData).length === 0
            );

            if (!firstCardShown && populatedCards.length > 0) {
                firstCardShown = true;
                stopAnalysisProgressTick();
                updateProgress(95, 'READY', 'Cards ready');
                progressOverlay.classList.add('hiding');
                setTimeout(() => {
                    progressOverlay.classList.remove('active', 'uploading', 'analyzing', 'ready', 'hiding');
                }, 400);
                screenshotLayer.className = 'screenshot-layer fading';
                setTimeout(() => resultsOverlay.classList.add('visible'), 100);
            }

            const allCards = [...populatedCards, ...unpopulatedCards];
            const populatedCount = populatedCards.length;

            if (populatedCount <= 1) {
                cardGrid.classList.add('single-card');
            } else {
                cardGrid.classList.remove('single-card');
            }

            allCards.forEach((card, index) => {
                const hasData = card.populatedData && Object.keys(card.populatedData).length > 0;
                const el = createCardElement(card);

                if (hasData) {
                    completedCards++;
                    populatedCardIds.add(card.id);
                    el.classList.remove('loading');
                    el.classList.add('populated');
                    el.innerHTML = renderCardContent(card.cardType, card.populatedData);
                    el._cardData = card.populatedData;
                    appendCitations(el, card.populatedData);
                }

                cardGrid.appendChild(el);
                setTimeout(() => {
                    el.classList.add('visible');
                    if (hasData) {
                        el.classList.add('entering');
                    } else {
                        setTimeout(() => el.classList.add('researching'), 200);
                    }
                }, 60 + index * 80);
            });

            if (!firstCardShown && populatedCards.length === 0) {
                stopAnalysisProgressTick();
                updateProgress(90, 'ANALYZING', 'Preparing cards...');
                progressOverlay.classList.add('hiding');
                setTimeout(() => {
                    progressOverlay.classList.remove('active', 'uploading', 'analyzing', 'ready', 'hiding');
                }, 400);
                screenshotLayer.className = 'screenshot-layer fading';
                setTimeout(() => resultsOverlay.classList.add('visible'), 100);
                firstCardShown = true;
            }

            layoutProgressFill.style.width = '25%';
            layoutProgressText.textContent = 'enhancing';

            startEnhanceStatusRotation();
        }

        function startEnhanceStatusRotation() {
            if (enhanceMsgInterval) clearInterval(enhanceMsgInterval);
            let msgIdx = 0;
            enhanceMsgInterval = setInterval(() => {
                const loadingCards = document.querySelectorAll('.card.loading.researching');
                if (loadingCards.length === 0 && pipelineComplete) {
                    clearInterval(enhanceMsgInterval);
                    enhanceMsgInterval = null;
                    return;
                }
                msgIdx = (msgIdx + 1) % enhanceStatusMessages.length;
                loadingCards.forEach(card => {
                    const statusEl = card.querySelector('.skeleton-status');
                    if (statusEl) {
                        statusEl.textContent = enhanceStatusMessages[msgIdx];
                    }
                });
            }, 3000);
        }

        function onCardReceived(data) {
            if (populatedCardIds.has(data.cardId)) {
                return;
            }
            populatedCardIds.add(data.cardId);
            completedCards++;

            if (!firstCardShown) {
                firstCardShown = true;
                stopAnalysisProgressTick();
                updateProgress(95, 'READY', 'Cards ready');
                progressOverlay.classList.add('hiding');
                setTimeout(() => {
                    progressOverlay.classList.remove('active', 'uploading', 'analyzing', 'ready', 'hiding');
                }, 400);
                screenshotLayer.className = 'screenshot-layer fading';
                setTimeout(() => resultsOverlay.classList.add('visible'), 100);
            }

            if (completedCards > 1) {
                cardGrid.classList.remove('single-card');
            }

            const el = document.getElementById(`card-${data.cardId}`);
            if (!el) return;

            el.classList.remove('loading', 'researching');
            el.classList.add('populated', 'just-populated', 'entering');
            el.innerHTML = renderCardContent(data.cardType, data.data);
            el._cardData = data.data;

            appendCitations(el, data.data);

            setTimeout(() => {
                el.classList.remove('just-populated');
            }, 1500);

            const pct = 60 + Math.round((completedCards / totalCards) * 35);
            layoutProgressFill.style.width = pct + '%';
            layoutProgressText.textContent = `${completedCards}/${totalCards}`;
        }

        function onCardUpdated(data) {
            const el = document.getElementById(`card-${data.cardId}`);
            if (!el) return;

            const existingData = el._cardData || {};
            const mergedData = { ...existingData, ...data.data };
            el._cardData = mergedData;

            el.classList.remove('loading', 'researching');
            el.classList.add('populated');
            el.innerHTML = renderCardContent(data.cardType, mergedData);

            el.classList.add('card-updating');
            setTimeout(() => el.classList.remove('card-updating'), 800);

            appendCitations(el, mergedData);

            const sourceClass = data.source === 'review' ? 'source-sonar' : 'source-sonnet';
            const sourceLabel = data.source === 'review' ? 'researched' : 'enhanced';
            const sourceTag = document.createElement('span');
            sourceTag.className = `card-source-tag ${sourceClass}`;
            sourceTag.textContent = sourceLabel;
            el.appendChild(sourceTag);
            setTimeout(() => sourceTag.remove(), 4000);
        }

        function onCardAdded(data) {
            totalCards++;
            completedCards++;
            const cardId = data.cardId;
            const card = {
                id: cardId,
                cardType: data.cardType,
                gridPosition: data.gridPosition || { row: totalCards, column: 1, columnSpan: 1, rowSpan: 1 },
                placeholderData: data.data,
            };

            cardGrid.classList.remove('single-card');

            const el = createCardElement(card);
            el.classList.remove('loading');
            el.classList.add('populated');
            el.innerHTML = renderCardContent(data.cardType, data.data);
            el._cardData = data.data;

            const sourceClass = data.source === 'review' ? 'source-sonar' : data.source === 'sonnet' ? 'source-sonnet' : 'source-haiku';
            const sourceLabel = data.source === 'review' ? 'research' : data.source === 'sonnet' ? 'enhanced' : 'new';
            const sourceTag = document.createElement('span');
            sourceTag.className = `card-source-tag ${sourceClass}`;
            sourceTag.textContent = sourceLabel;
            el.appendChild(sourceTag);
            setTimeout(() => sourceTag.remove(), 5000);

            cardGrid.appendChild(el);
            setTimeout(() => {
                el.classList.add('visible', 'just-added', 'entering');
                setTimeout(() => el.classList.remove('just-added'), 1500);
            }, 50);

            appendCitations(el, data.data);

            const pct = 60 + Math.round((completedCards / totalCards) * 35);
            layoutProgressFill.style.width = pct + '%';
            layoutProgressText.textContent = `${completedCards}/${totalCards}`;
        }

        function onPhaseChange(data) {
            const phaseMessages = {
                haiku: 'Quick analysis...',
                enhancing: 'Enhancing with Sonnet...',
                reviewing: 'Incorporating research...',
            };
            const msg = phaseMessages[data.phase] || data.message || '';
            if (msg) {
                progressLabel.textContent = msg;
            }
        }

        function appendCitations(el, data) {
            const citations = data?._researchMeta?.citations || data?._webCitations || [];
            if (citations.length > 0) {
                const inner = el.querySelector('.card-inner');
                if (inner) {
                    const citHtml = `<div class="web-citations">
                        <span class="web-citations-label">Sources</span>
                        ${citations.slice(0, 3).map((c, i) => {
                            const url = typeof c === 'string' ? c : (c.url || c.cited_url || '');
                            if (!url) return '';
                            const domain = url.replace(/^https?:\/\//, '').split('/')[0];
                            return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="web-citation-link">${esc(domain)}</a>`;
                        }).join('')}
                    </div>`;
                    inner.insertAdjacentHTML('beforeend', citHtml);
                }
            }
        }

        function onPipelineComplete() {
            pipelineComplete = true;
            stopAnalysisProgressTick();
            if (completionTimeout) {
                clearTimeout(completionTimeout);
                completionTimeout = null;
            }
            if (stallTimer) {
                clearTimeout(stallTimer);
                stallTimer = null;
            }
            if (enhanceMsgInterval) {
                clearInterval(enhanceMsgInterval);
                enhanceMsgInterval = null;
            }
            if (uploadProgressInterval) {
                clearInterval(uploadProgressInterval);
                uploadProgressInterval = null;
            }

            screenshotLayer.className = 'screenshot-layer gone';
            progressOverlay.classList.remove('active', 'uploading', 'analyzing', 'ready', 'hiding');
            cardGrid.classList.remove('single-card');

            document.querySelectorAll('.card-source-tag').forEach(t => t.remove());

            layoutProgress.style.display = 'none';

            if (!firstCardShown) {
                firstCardShown = true;
                setTimeout(() => resultsOverlay.classList.add('visible'), 100);
            }
        }

        // === Card Rendering ===
        function createCardElement(card) {
            const el = document.createElement('div');
            el.id = `card-${card.id}`;

            const cssClassMap = { link_card: 'links', did_you_know_card: 'did-you-know', verification_card: 'verification' };
            const cssClass = cssClassMap[card.cardType] || card.cardType.replace(/_/g, '-');
            el.className = `card card-${cssClass} loading`;
            el.dataset.cardType = card.cardType;

            const span = card.gridPosition?.columnSpan || 1;
            const fullWidthTypes = ['hero_summary', 'comparison_card', 'verification_card'];
            const twoColTypes = ['timeline_card', 'info_list', 'action_card', 'text_extract', 'link_card', 'news_card'];

            if (span >= 3 || fullWidthTypes.includes(card.cardType)) {
                el.classList.add('span-full');
            } else if (span === 2 || twoColTypes.includes(card.cardType)) {
                el.classList.add('span-2');
            }

            if (card.cardType === 'warning_card') {
                const level = card.placeholderData?.level || card.populatedData?.level || 'warning';
                el.classList.add(`level-${level}`);
            }

            if (card.cardType === 'fact_check') {
                const verdict = card.populatedData?.verdict || card.placeholderData?.verdict || 'unverified';
                el.classList.add(`verdict-${verdict}`);
            }

            if (card.cardType === 'hero_summary') {
                const hasImage = card.populatedData?.imageUrl || card.placeholderData?.imageUrl;
                if (hasImage) el.classList.add('has-image');
            }

            if (card.cardType === 'news_card') {
                const hasImage = card.populatedData?.imageUrl || card.placeholderData?.imageUrl;
                if (hasImage) el.classList.add('has-image');
            }

            el.innerHTML = renderPlaceholder(card);
            return el;
        }

        function renderPlaceholder(card) {
            const pd = card.placeholderData || {};
            const type = card.cardType;

            if (type === 'hero_summary') {
                return `<div class="card-inner">
                    ${pd.emoji ? `<span class="hero-emoji">${esc(pd.emoji)}</span>` : ''}
                    ${pd.badge ? `<span class="hero-badge">${esc(pd.badge)}</span>` : ''}
                    <div class="hero-title">${esc(pd.title || 'Analyzing...')}</div>
                    <div class="hero-subtitle">${esc(pd.subtitle || 'Identifying content...')}</div>
                    <div class="placeholder-line medium"></div>
                </div>`;
            }

            if (type === 'key_metric' && pd.value) {
                return `<div class="card-inner">
                    ${getCardTypeLabel(type)}
                    <div class="metric-value" style="opacity:0.5">${esc(pd.value || '...')}</div>
                    <div class="metric-label">${esc(pd.label || '')}</div>
                    <div class="placeholder-line short"></div>
                </div>`;
            }

            if (type === 'product_card' && pd.name) {
                return `<div class="card-inner">
                    ${getCardTypeLabel(type)}
                    <div class="product-name" style="opacity:0.6">${esc(pd.name)}</div>
                    ${pd.price ? `<div class="product-price" style="opacity:0.4">${esc(pd.price)}</div>` : ''}
                    <div class="placeholder-line medium"></div>
                    <div class="placeholder-line short"></div>
                </div>`;
            }

            if (type === 'person_card' && pd.name) {
                return `<div class="card-inner">
                    ${getCardTypeLabel(type)}
                    <div class="person-header">
                        <div class="person-avatar" style="opacity:0.5">${esc(pd.emoji || (pd.name ? pd.name[0].toUpperCase() : '?'))}</div>
                        <div>
                            <div class="person-name" style="opacity:0.6">${esc(pd.name)}</div>
                            ${pd.role ? `<div class="person-role">${esc(pd.role)}</div>` : ''}
                        </div>
                    </div>
                    <div class="placeholder-line medium"></div>
                </div>`;
            }

            return `<div class="card-inner">
                ${getCardTypeLabel(type)}
                <div class="placeholder-line medium"></div>
                <div class="placeholder-line short"></div>
                <div class="placeholder-line"></div>
                <div class="skeleton-status">Searching the web...</div>
            </div>`;
        }

        function renderCardContent(cardType, data) {
            const d = data || {};

            switch (cardType) {
                case 'hero_summary': {
                    const hasImage = d.imageUrl && typeof d.imageUrl === 'string' && d.imageUrl.startsWith('http');
                    return `${hasImage ? `<div class="hero-image-wrap">
                        <img class="hero-image" src="${esc(d.imageUrl)}" alt="" onerror="this.parentElement.style.display='none';this.closest('.card-hero')?.classList.remove('has-image')">
                        <div class="hero-image-overlay"></div>
                        ${d.badge ? `<div class="hero-image-badge"><span class="hero-badge" ${d.badgeColor ? `style="background:${esc(d.badgeColor)}15;color:${esc(d.badgeColor)};backdrop-filter:blur(8px)"` : 'style="backdrop-filter:blur(8px)"'}>${esc(d.badge)}</span></div>` : ''}
                    </div>` : ''}
                    <div class="card-inner">
                        ${!hasImage && d.emoji ? `<span class="hero-emoji">${esc(d.emoji)}</span>` : ''}
                        ${!hasImage && d.badge ? `<span class="hero-badge" ${d.badgeColor ? `style="background:${esc(d.badgeColor)}15;color:${esc(d.badgeColor)}"` : ''}>${esc(d.badge)}</span>` : ''}
                        <div class="hero-title">${esc(d.title || 'Analysis')}</div>
                        <div class="hero-subtitle">${linkify(d.subtitle || '')}</div>
                        ${d.takeaway ? `<div class="hero-takeaway">${linkify(d.takeaway)}</div>` : ''}
                        ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer" class="hero-link"><span class="material-symbols-rounded" style="font-size:13px">open_in_new</span> Source</a>` : ''}
                    </div>`;
                }

                case 'key_metric':
                    return `<div class="card-inner">
                        ${d.emoji ? `<span class="metric-emoji">${esc(d.emoji)}</span>` : getCardTypeLabel('key_metric')}
                        <div class="metric-value" ${d.color ? `style="color:${esc(d.color)}"` : ''}>${esc(d.unit && d.unit.length === 1 ? d.unit : '')}${esc(d.value || '—')}</div>
                        <div class="metric-label">${esc(d.label || '')}</div>
                        ${d.trend && d.trend !== 'none' ? `<span class="metric-trend ${esc(d.trend)}">
                            <span class="material-symbols-rounded" style="font-size:11px">${d.trend === 'up' ? 'trending_up' : d.trend === 'down' ? 'trending_down' : 'trending_flat'}</span>
                            ${esc(d.trend)}
                        </span>` : ''}
                        ${Array.isArray(d.sparkline) && d.sparkline.length >= 2 ? renderSparkline(d.sparkline) : ''}
                        ${d.context ? `<div class="metric-context">${linkify(d.context)}</div>` : ''}
                    </div>`;

                case 'info_list':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('info_list')}
                        <div class="list-title">${esc(d.title || 'Details')}</div>
                        ${(d.items || []).map(item => {
                            if (typeof item === 'object' && item !== null) {
                                const label = item.label || item.name || item.key || '';
                                const value = item.value || item.description || item.text || '';
                                const hasUrl = item.url && typeof item.url === 'string' && item.url.startsWith('http');
                                const emoji = item.emoji || item.icon || '';
                                return `<div class="list-item${item.highlight ? ' highlight' : ''}">
                                    ${emoji ? `<span class="list-item-emoji">${esc(emoji)}</span>` : ''}
                                    <span class="list-item-label">${esc(label)}</span>
                                    <span class="list-item-value">${hasUrl ? renderLink(item.url, value, 'list-item-link') : linkify(value)}</span>
                                </div>`;
                            }
                            return `<div class="list-item">
                                <span class="list-item-value" style="text-align:left">${linkify(item)}</span>
                            </div>`;
                        }).join('')}
                    </div>`;

                case 'fact_check': {
                    const verdict = d.verdict || 'unverified';
                    const verdictIcon = verdict === 'verified' ? 'check_circle' :
                                       verdict === 'false' ? 'cancel' :
                                       verdict === 'misleading' ? 'warning' :
                                       verdict === 'partially_true' ? 'change_circle' : 'help';
                    const verdictColor = verdict === 'verified' ? 'var(--green)' :
                                        verdict === 'false' ? 'var(--red)' :
                                        verdict === 'misleading' ? 'var(--yellow)' :
                                        verdict === 'partially_true' ? 'var(--orange)' :
                                        verdict === 'needs_context' ? 'var(--purple)' : 'var(--accent)';
                    return `<div class="card-inner">
                        ${getCardTypeLabel('fact_check')}
                        <div class="fact-verdict-visual">
                            <div class="fact-verdict-icon ${esc(verdict)}">
                                <span class="material-symbols-rounded">${verdictIcon}</span>
                            </div>
                            <div class="fact-verdict-text">
                                <span class="fact-verdict-label" style="color:${verdictColor}">${esc(verdict.replace(/_/g, ' '))}</span>
                                ${d.confidence ? `<span class="fact-confidence-label">${esc(d.confidence)} confidence</span>` : ''}
                            </div>
                        </div>
                        <div class="fact-claim">${linkify(d.claim || '')}</div>
                        ${d.explanation ? `<div class="fact-explanation">${linkify(d.explanation)}</div>` : ''}
                        ${d.source ? `<div class="fact-source">${d.sourceUrl ? `Source: ${renderLink(d.sourceUrl, d.source)}` : `Source: ${esc(d.source)}`}</div>` : ''}
                    </div>`;
                }

                case 'person_card': {
                    const hasPhoto = d.photoUrl && typeof d.photoUrl === 'string' && d.photoUrl.startsWith('http');
                    const avatar = d.emoji || (d.name ? d.name[0].toUpperCase() : '?');
                    return `<div class="card-inner">
                        ${getCardTypeLabel('person_card')}
                        <div class="person-header">
                            ${hasPhoto
                                ? `<img class="person-photo" src="${esc(d.photoUrl)}" alt="${esc(d.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="person-avatar" style="display:none">${esc(avatar)}</div>`
                                : `<div class="person-avatar">${esc(avatar)}</div>`
                            }
                            <div>
                                <div class="person-name">${esc(d.name || 'Unknown')}</div>
                                ${d.role ? `<div class="person-role">${esc(d.role)}</div>` : ''}
                                ${d.handle ? `<div class="person-handle">${d.profileUrl ? renderLink(d.profileUrl, d.handle) : esc(d.handle)}</div>` : ''}
                            </div>
                        </div>
                        ${d.context ? `<div class="person-context">${linkify(d.context)}</div>` : ''}
                        ${d.notableInfo ? `<div class="person-notable">💡 ${linkify(d.notableInfo)}</div>` : ''}
                        ${(d.details || []).length ? `<div class="person-details">${d.details.slice(0, 3).map(det =>
                            `<div class="person-detail-item">${renderItemValue(det)}</div>`
                        ).join('')}</div>` : ''}
                    </div>`;
                }

                case 'product_card': {
                    const features = (d.features || []).map(normalizeFeature).slice(0, 5);
                    const warnings = (d.warnings || []).map(normalizeFeature).slice(0, 3);
                    const hasRating = d.rating && d.rating !== 'Not visible' && d.rating !== 'N/A';
                    const hasPrice = d.price && d.price !== 'Not visible' && d.price !== 'N/A';

                    return `<div class="card-inner">
                        ${getCardTypeLabel('product_card')}
                        <div class="product-header">
                            ${d.imageUrl ? `<div class="product-image"><img src="${esc(d.imageUrl)}" alt="${esc(d.name)}" onerror="this.parentElement.innerHTML='<span class=\\'material-symbols-rounded\\'>inventory_2</span>'"></div>` :
                              d.emoji ? `<span class="product-emoji">${esc(d.emoji)}</span>` : ''}
                            <div>
                                <div class="product-name">${esc(d.name || 'Product')}</div>
                                ${hasPrice ? `<div class="product-price">${esc(d.price)}</div>` : ''}
                                ${hasRating ? `<div class="product-rating">
                                    <span class="material-symbols-rounded" style="font-size:13px;font-variation-settings:'FILL' 1">star</span>
                                    ${esc(d.rating)}
                                </div>` : ''}
                            </div>
                        </div>
                        ${features.length ? `<ul class="product-features">${features.map(f =>
                            `<li>${esc(f)}</li>`
                        ).join('')}</ul>` : ''}
                        ${d.verdict ? `<div class="product-verdict">${linkify(d.verdict)}</div>` : ''}
                        ${warnings.length ? `<ul class="product-warnings">${warnings.map(w =>
                            `<li>${esc(w)}</li>`
                        ).join('')}</ul>` : ''}
                        ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer" class="product-link"><span class="material-symbols-rounded" style="font-size:13px">open_in_new</span> View</a>` : ''}
                    </div>`;
                }

                case 'timeline_card':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('timeline_card')}
                        <div class="timeline-title">${esc(d.title || 'Timeline')}</div>
                        ${(d.events || []).map(ev => {
                            const evObj = typeof ev === 'object' ? ev : { event: String(ev) };
                            const evText = evObj.event || evObj.text || evObj.description || '';
                            return `<div class="timeline-event${evObj.highlight ? ' highlight' : ''}">
                                <div class="timeline-date">${esc(evObj.date || '')}</div>
                                <div class="timeline-dot"></div>
                                <div class="timeline-text">${evObj.url ? renderLink(evObj.url, evText) : linkify(evText)}</div>
                            </div>`;
                        }).join('')}
                    </div>`;

                case 'quote_card': {
                    const hasQuotePhoto = d.photoUrl && typeof d.photoUrl === 'string' && d.photoUrl.startsWith('http');
                    return `<div class="card-inner">
                        ${getCardTypeLabel('quote_card')}
                        <div class="quote-mark">\u201C</div>
                        <div class="quote-text">${linkify(d.quote || '')}</div>
                        ${d.attribution ? `<div class="quote-attribution-wrap">
                            ${hasQuotePhoto ? `<img class="quote-photo" src="${esc(d.photoUrl)}" alt="${esc(d.attribution)}" onerror="this.style.display='none'">` : ''}
                            <div class="quote-attribution">\u2014 ${d.sourceUrl ? renderLink(d.sourceUrl, d.attribution) : esc(d.attribution)}</div>
                        </div>` : ''}
                        ${d.context ? `<div class="quote-context">${linkify(d.context)}</div>` : ''}
                    </div>`;
                }

                case 'comparison_card':
                    if (!d.columns || !d.columns.length) {
                        return `<div class="card-inner">${getCardTypeLabel('comparison_card')}<div class="comparison-title">${esc(d.title || 'Comparison')}</div><div style="color:var(--text-muted);font-size:0.72rem">No data available</div></div>`;
                    }
                    const cols = Array.isArray(d.columns) ? d.columns : [];
                    const maxRows = Math.max(...cols.map(c => (Array.isArray(c.values) ? c.values : []).length), 0);
                    return `<div class="card-inner">
                        ${getCardTypeLabel('comparison_card')}
                        <div class="comparison-title">${esc(d.title || 'Comparison')}</div>
                        <table>
                            <thead><tr>
                                ${d.rows ? '<th></th>' : ''}
                                ${cols.map(c => `<th>${esc(typeof c === 'object' ? (c.header || c.name || '') : c)}</th>`).join('')}
                            </tr></thead>
                            <tbody>${Array.from({ length: maxRows }, (_, i) => `<tr>
                                ${d.rows ? `<td style="color:var(--text-secondary);font-weight:500">${esc(Array.isArray(d.rows) ? d.rows[i] || '' : '')}</td>` : ''}
                                ${cols.map(c => {
                                    const vals = Array.isArray(c.values) ? c.values : [];

                case 'action_card':

                            return `<div class="action-item">
                                <span class="action-bullet">${i + 1}</span>

                case 'location_card': {
                    const locEmoji = d.emoji || '';
                    const hasLocImage = d.imageUrl && typeof d.imageUrl === 'string' && d.imageUrl.startsWith('http');
                    return `${hasLocImage ? `<div class="location-image-wrap">

                        ${!hasLocImage ? getCardTypeLabel('location_card') : ''}

                            <div class="location-pin">
                                ${locEmoji ? `<span class="location-emoji">${esc(locEmoji)}</span>` : `<span class="material-symbols-rounded">location_on</span>`}

                                <div class="location-name">${esc(d.name || 'Location')}</div>
                                ${d.address ? `<div class="location-address">

                                </div>` : ''}
                            </div>
                        </div>

                        ${(d.details || []).length ? `<div class="location-details">${d.details.slice(0, 3).map(det =>
                            `<div class="location-detail-item">${renderItemValue(det)}</div>`

                    </div>`;
                }

                case 'link_card':
                    return `<div class="card-inner">
                        ${getCardTypeLabel('link_card')}
                        <div class="links-title">${esc(d.title || 'Links')}</div>
                        ${(d.links || []).map(link => {
                            const lObj = typeof link === 'object' ? link : { label: String(link), url: '' };
                            return `<div class="link-item">
                                <div class="link-icon"><span class="material-symbols-rounded">link</span></div>
                                <div>
                                    <div class="link-label">${lObj.url ? renderLink(lObj.url, lObj.label || lObj.url) : esc(lObj.label || '')}</div>
                                    ${lObj.description ? `<div class="link-desc">${esc(lObj.description)}</div>` : ''}
                                </div>
                            </div>`;

                    </div>`;

                case 'news_card': {
                    const hasNewsImage = d.imageUrl && typeof d.imageUrl === 'string' && d.imageUrl.startsWith('http');
                    return `${hasNewsImage ? `<div class="news-image-wrap">
                        <img class="news-image" src="${esc(d.imageUrl)}" alt="" onerror="this.parentElement.style.display='none'">
                        <div class="news-image-overlay"></div>

                    </div>` : ''}
                    <div class="card-inner">
                        ${!hasNewsImage ? getCardTypeLabel('news_card') : ''}
