            setTimeout(() => captureRenderedCards().catch(e => console.warn('[RenderCapture] Fatal:', e.message)), 500);
        }

        const CAPTURE_STYLE_PROPS = [
            'color', 'backgroundColor', 'backgroundImage',
            'borderTopColor', 'borderRightColor', 'borderBottomColor', 'borderLeftColor',
            'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth',
            'borderTopStyle', 'borderRightStyle', 'borderBottomStyle', 'borderLeftStyle',
            'borderTopLeftRadius', 'borderTopRightRadius', 'borderBottomLeftRadius', 'borderBottomRightRadius',
            'boxShadow', 'textShadow',
            'fontSize', 'fontFamily', 'fontWeight', 'fontStyle', 'lineHeight', 'letterSpacing',
            'textAlign', 'textTransform', 'textDecoration',
            'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
            'marginTop', 'marginRight', 'marginBottom', 'marginLeft',
            'display', 'flexDirection', 'alignItems', 'justifyContent', 'gap', 'flexWrap',
            'gridTemplateColumns', 'gridTemplateRows',
            'width', 'maxWidth', 'minWidth', 'height', 'maxHeight', 'minHeight',
            'overflowX', 'overflowY',
            'opacity', 'visibility',
            'position', 'top', 'right', 'bottom', 'left', 'zIndex',
            'whiteSpace', 'wordBreak', 'wordWrap',
            'listStyleType',
        ];

        function inlineComputedStyles(origElements, clonedElements) {
            for (let i = 0; i < origElements.length && i < clonedElements.length; i++) {
                const cs = getComputedStyle(origElements[i]);
                const el = clonedElements[i];
                CAPTURE_STYLE_PROPS.forEach(p => {
                    const v = cs[p];
                    if (v !== undefined && v !== '') el.style[p] = v;
                });
            }
        }

        function prepareCloneForCapture(target) {
            const clone = target.cloneNode(true);
            clone.querySelectorAll('script, style, link[rel="stylesheet"]').forEach(s => s.remove());
            const origElements = [target, ...target.querySelectorAll('*')];
            const clonedElements = [clone, ...clone.querySelectorAll('*')];
            inlineComputedStyles(origElements, clonedElements);
            clone.style.opacity = '1';
            clone.style.transform = 'none';
            clone.style.position = 'relative';
            return clone;
        }

        function sendRenderCapture(rid, image, domSnapshot, clientState, method) {
            const payload = { requestId: rid, domSnapshot, clientState };
            if (image) payload.image = image;
            else payload.fallback = true;
            fetch('/api/hub/v2/render-capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            }).then(r => {
                if (!r.ok) console.warn('[RenderCapture] Server rejected:', r.status);
                else console.log('[RenderCapture] Saved via', method);
            }).catch(e => console.warn('[RenderCapture] POST failed:', e.message));
        }

        function captureViaForeignObject(target) {
            const w = target.scrollWidth;
            const h = Math.min(target.scrollHeight, 4096);
            const scale = Math.min(window.devicePixelRatio || 2, 2);
            const clone = prepareCloneForCapture(target);
            clone.style.width = w + 'px';
            clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
            const xhtml = new XMLSerializer().serializeToString(clone);
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">'
                + '<foreignObject width="100%" height="100%">' + xhtml + '</foreignObject></svg>';
            const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(w * scale);
                        canvas.height = Math.round(h * scale);
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#0a0d12';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.scale(scale, scale);
                        ctx.drawImage(img, 0, 0, w, h);
                        URL.revokeObjectURL(url);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                        resolve(dataUrl);
                    } catch (e) {
                        URL.revokeObjectURL(url);
                        reject(e);
                    }
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('SVG load failed')); };
                img.src = url;
            });
        }

        function captureViaHtml2Canvas(target) {
            if (typeof html2canvas === 'undefined') return Promise.reject(new Error('not loaded'));
            const origElements = [target, ...target.querySelectorAll('*')];
            const styleCache = origElements.map(el => {
                const cs = getComputedStyle(el);
                const s = {};
                CAPTURE_STYLE_PROPS.forEach(p => { s[p] = cs[p]; });
                return s;
            });
            return html2canvas(target, {
                backgroundColor: '#0a0d12',
                scale: Math.min(window.devicePixelRatio || 2, 2),
                logging: false,
                useCORS: true,
                allowTaint: true,
                width: target.scrollWidth,
                height: Math.min(target.scrollHeight, 4096),
                windowWidth: target.scrollWidth,
                windowHeight: target.scrollHeight,
                onclone: (clonedDoc) => {
                    clonedDoc.querySelectorAll('style, link[rel="stylesheet"]').forEach(s => s.remove());
                    const ct = clonedDoc.getElementById('resultsOverlay');
                    if (!ct) return;
                    ct.style.opacity = '1';
                    ct.style.transform = 'none';
                    const clonedEls = [ct, ...ct.querySelectorAll('*')];
                    for (let i = 0; i < clonedEls.length && i < styleCache.length; i++) {
                        const s = styleCache[i];
                        CAPTURE_STYLE_PROPS.forEach(p => { if (s[p] !== undefined && s[p] !== '') clonedEls[i].style[p] = s[p]; });
                    }
                },
            }).then(canvas => canvas.toDataURL('image/jpeg', 0.82));
        }

        async function captureRenderedCards() {
            const rid = telemetry.requestId;
            if (!rid) {
                console.warn('[RenderCapture] No requestId, skipping');
                return;
            }

            let clientState = null;
            let domSnapshot = null;

            try {
                await waitForCardsToSettle();
            } catch (e) {
                console.warn('[RenderCapture] waitForCardsToSettle error:', e.message);
            }

            const target = resultsOverlay;
            if (!target || !cardGrid.children.length) {
                console.warn('[RenderCapture] No target or empty card grid');
                return;
            }

            try { clientState = collectClientState(); } catch (e) { console.warn('[RenderCapture] collectClientState error:', e.message); }
            try { domSnapshot = serializeDomSnapshot(target); } catch (e) { console.warn('[RenderCapture] serializeDomSnapshot error:', e.message); }

            // Method 1: SVG foreignObject — browser's own renderer, no dependencies
            try {
                const dataUrl = await captureViaForeignObject(target);
                if (dataUrl && dataUrl.length > 1000) {
                    console.log('[RenderCapture] foreignObject succeeded, size:', Math.round(dataUrl.length / 1024), 'KB');
                    sendRenderCapture(rid, dataUrl, domSnapshot, clientState, 'foreignObject');
                    return;
                }
            } catch (e) {
                console.warn('[RenderCapture] foreignObject failed:', e.message);
            }

            // Method 2: html2canvas with aggressive style inlining (strip stylesheets, inline all)
            try {
                const dataUrl = await captureViaHtml2Canvas(target);
                if (dataUrl && dataUrl.length > 1000) {
                    console.log('[RenderCapture] html2canvas succeeded, size:', Math.round(dataUrl.length / 1024), 'KB');
                    sendRenderCapture(rid, dataUrl, domSnapshot, clientState, 'html2canvas');
                    return;
                }
            } catch (e) {
                console.warn('[RenderCapture] html2canvas failed:', e.message);
            }

            // Method 3: DOM snapshot only — always works, server renders as iframe in report
            console.warn('[RenderCapture] All image captures failed, sending DOM snapshot only');
            if (domSnapshot || clientState) {
                sendRenderCapture(rid, null, domSnapshot, clientState, 'dom-only');
            }
        }

        function waitForCardsToSettle() {
            return new Promise(resolve => {
                let checks = 0;
                const maxChecks = 20;
                const interval = setInterval(() => {
                    checks++;
                    const stillLoading = cardGrid.querySelectorAll('.card.loading').length;
                    const stillAnimating = cardGrid.querySelectorAll('.card:not(.populated)').length;
                    if ((stillLoading === 0 && stillAnimating === 0) || checks >= maxChecks) {
                        clearInterval(interval);
                        setTimeout(resolve, 800);
                    }
                }, 250);
            });
        }

        function collectClientState() {
            const state = {
                viewport: {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    devicePixelRatio: window.devicePixelRatio || 1,
                    scrollX: window.scrollX,
                    scrollY: window.scrollY,
                    orientation: screen.orientation?.type || (window.innerWidth > window.innerHeight ? 'landscape' : 'portrait'),
                },
                screen: {
                    width: screen.width,
                    height: screen.height,
                    colorDepth: screen.colorDepth,
                },
                cards: {
                    total: cardGrid.children.length,
                    populated: cardGrid.querySelectorAll('.card.populated').length,
                    loading: cardGrid.querySelectorAll('.card.loading').length,
                    errored: cardGrid.querySelectorAll('.card.error').length,
                    types: Array.from(cardGrid.querySelectorAll('.card')).map(c => ({
                        id: c.id,
                        type: c.dataset.cardType,
                        classes: c.className,
                        rect: { w: c.offsetWidth, h: c.offsetHeight },
                        overflowing: c.scrollHeight > c.clientHeight || c.scrollWidth > c.clientWidth,
                    })),
                },
                layout: {
                    gridComputedCols: getComputedStyle(cardGrid).gridTemplateColumns,
                    gridComputedRows: getComputedStyle(cardGrid).gridTemplateRows,
                    gridGap: getComputedStyle(cardGrid).gap,
                    overlayRect: { w: resultsOverlay.offsetWidth, h: resultsOverlay.offsetHeight },
                },
                performance: {},
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString(),
            };

            try {
                const entries = performance.getEntriesByType('layout-shift');
                if (entries.length) {
                    state.performance.cumulativeLayoutShift = entries.reduce((sum, e) => sum + e.value, 0);
                }
                const paintEntries = performance.getEntriesByType('paint');
                paintEntries.forEach(p => {
                    state.performance[p.name.replace(/-/g, '_')] = Math.round(p.startTime);
                });
                const lcpEntries = performance.getEntriesByType('largest-contentful-paint');
                if (lcpEntries.length) {
                    state.performance.lcp = Math.round(lcpEntries[lcpEntries.length - 1].startTime);
                }
            } catch (e) { /* performance API may not be fully available */ }

            return state;
        }

        function serializeDomSnapshot(target) {
            try {
                const clone = prepareCloneForCapture(target);
                const html = '<!DOCTYPE html><html><head><meta charset="UTF-8">'
                    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
                    + '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">'
                    + '<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">'
                    + '<style>*{box-sizing:border-box}body{background:#0a0d12;overflow-x:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;color:#e8eaf0;-webkit-font-smoothing:antialiased}'
                    + '.material-symbols-rounded{font-family:"Material Symbols Rounded";font-style:normal;font-weight:400;display:inline-block;line-height:1;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga"}</style>'
                    + '</head><body>' + clone.outerHTML + '</body></html>';
                if (html.length > 1024 * 1024) return html.substring(0, 1024 * 1024);
                return html;
            } catch (e) {
                console.warn('[RenderCapture] DOM snapshot failed:', e.message);
                return null;
            }
        }

        // === Card Rendering ===
        function createCardElement(card) {
            const el = document.createElement('div');
            el.id = `card-${card.id}`;

            const cssClassMap = { link_card: 'links', did_you_know_card: 'did-you-know', verification_card: 'verification' };
            const cssClass = cssClassMap[card.cardType] || card.cardType.replace(/_/g, '-');
            el.className = `card card-${cssClass} bg-base-200 border border-base-300 rounded-2xl overflow-hidden loading`;
            // Inline style fallback for dark background in case DaisyUI theme hasn't loaded
            el.style.cssText = 'background:#12151c;border-color:#1a1f2e;border-radius:16px;overflow:hidden';
            el.dataset.cardType = card.cardType;

            const span = card.gridPosition?.columnSpan || 1;
            const fullWidthTypes = ['hero_summary', 'comparison_card', 'verification_card', 'map_card', 'stats_grid_card', 'gallery_card', 'chat_card'];
            const twoColTypes = ['timeline_card', 'info_list', 'action_card', 'text_extract', 'link_card', 'news_card', 'order_card'];

            if (span >= 3 || fullWidthTypes.includes(card.cardType)) {
                el.classList.add('span-full');
            } else if (span === 2 || twoColTypes.includes(card.cardType)) {
                el.classList.add('span-2');
            }

            if (card.cardType === 'warning_card') {
                const level = card.placeholderData?.level || card.populatedData?.level || 'warning';
                el.classList.add(`level-${level}`);
            }

            if (card.cardType === 'fact_check') {
                const verdict = card.populatedData?.verdict || card.placeholderData?.verdict || 'unverified';
                el.classList.add(`verdict-${verdict}`);
            }

            if (card.cardType === 'hero_summary') {
                const hasImage = card.populatedData?.imageUrl || card.placeholderData?.imageUrl;
                if (hasImage) el.classList.add('has-image');
            }

            el.innerHTML = renderPlaceholder(card);
            return el;
        }

                case 'gallery_card':
                    return `<div class="p-4">
                        <h3 class="font-bold text-sm text-white mb-3">${esc(d.title || 'Gallery')}</h3>
                        <div class="grid grid-cols-2 gap-2">
                        ${(d.images || []).slice(0, 6).map(img => {
                            const iObj = typeof img === 'object' ? img : { url: String(img) };
                            return `<figure class="rounded-xl overflow-hidden aspect-video bg-base-300">
                                <img src="${esc(iObj.url || '')}" alt="${esc(iObj.caption || '')}" class="w-full h-full object-cover" loading="lazy" onerror="this.style.display='none'">
                            </figure>`;
                        }).join('')}
                        </div>
                    </div>`;

                case 'source_card': {
                    const credColors = { high: 'badge-success', medium: 'badge-warning', low: 'badge-error', unknown: 'badge-ghost' };
                    const hasSourceImg = d.imageUrl && typeof d.imageUrl === 'string' && d.imageUrl.startsWith('http');
                    return `<div class="p-4">
                        <div class="flex items-center gap-3">
                            ${hasSourceImg ? `<div class="avatar"><div class="w-10 h-10 rounded-full"><img src="${esc(d.imageUrl)}" alt="" loading="lazy"></div></div>` : `<div class="w-10 h-10 rounded-full bg-base-300 flex items-center justify-center"><span class="material-symbols-rounded text-base-content/40" style="font-size:20px">source</span></div>`}
                            <div class="min-w-0 flex-1">
                                <div class="font-bold text-sm">${d.profileUrl ? renderLink(d.profileUrl, d.name || 'Source') : esc(d.name || 'Source')}</div>
                                ${d.type ? `<div class="text-xs text-base-content/40">${esc(d.type)}</div>` : ''}
                            </div>
                            ${d.credibility ? `<span class="badge badge-sm ${credColors[d.credibility] || 'badge-ghost'}">${esc(d.credibility)}</span>` : ''}
                        </div>
                        ${d.context ? `<p class="text-sm text-base-content/60 mt-2">${linkify(d.context)}</p>` : ''}
                        ${d.followers ? `<div class="text-xs text-base-content/40 mt-1">${esc(d.followers)} followers</div>` : ''}
                    </div>`;
                }

                default:
                    return `<div class="p-4">
                        <div class="text-xs font-bold uppercase tracking-wider text-base-content/30 mb-2">${esc(cardType.replace(/_/g, ' '))}</div>
                        ${Object.entries(d).filter(([k]) => !k.startsWith('_')).map(([key, val]) => {
                            if (val === null || val === undefined) return '';
                            if (Array.isArray(val)) {
                                return `<div class="mb-2">
                                    <div class="text-xs font-bold text-base-content/40 uppercase tracking-wider mb-1">${esc(key.replace(/_/g, ' '))}</div>
                                    ${val.slice(0, 5).map(v => `<div class="text-sm pl-3 border-l-2 border-base-300 py-0.5">${renderItemValue(v)}</div>`).join('')}
                                </div>`;
                            }
                            if (typeof val === 'object') {
                                return `<div class="mb-2">
                                    <div class="text-xs font-bold text-base-content/40 uppercase tracking-wider mb-1">${esc(key.replace(/_/g, ' '))}</div>
                                    <div class="text-sm">${renderItemValue(val)}</div>
                                </div>`;
                            }
                            return `<div class="mb-2">
                                <div class="text-xs font-bold text-base-content/40 uppercase tracking-wider mb-1">${esc(key.replace(/_/g, ' '))}</div>
                                <div class="text-sm">${linkify(val)}</div>
                            </div>`;
                        }).join('')}
                    </div>`;
            }
        }

        // === Error & Reset ===
        function showError(message) {
            errorText.textContent = message;
            errorState.classList.add('active');
            progressOverlay.classList.remove('active');
        }

        function reset() {
            if (currentImageUrl) {
                URL.revokeObjectURL(currentImageUrl);
                currentImageUrl = null;
            }
            currentImageBase64 = null;
            totalCards = 0;
            completedCards = 0;
            blueprintReceived = false;
            pipelineComplete = false;
            firstCardShown = false;
            pendingBlueprint = null;
            populatedCardIds.clear();
            retryCount = 0;
            if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
            if (completionTimeout) { clearTimeout(completionTimeout); completionTimeout = null; }
            if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
            if (enhanceMsgInterval) { clearInterval(enhanceMsgInterval); enhanceMsgInterval = null; }
            if (uploadProgressInterval) { clearInterval(uploadProgressInterval); uploadProgressInterval = null; }
            stopAnalysisProgressTick();
            if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

            pasteState.classList.remove('hidden');
            mainCanvas.classList.remove('active');
            screenshotLayer.className = 'screenshot-layer';
            progressOverlay.classList.remove('active', 'uploading', 'analyzing', 'ready', 'hiding');
            progressRing.classList.remove('complete');
            updateProgress(0, 'UPLOADING', 'Sending screenshot...');
            resultsOverlay.classList.remove('visible');
            errorState.classList.remove('active');
            cardGrid.innerHTML = '';
            cardGrid.classList.remove('single-card');
            /* removed: intent line */ /* contentAnalysisEl.style.display = 'none'; */
            followUpSection.style.display = 'none';
            followUpList.innerHTML = '';
            layoutProgress.style.display = '';
            layoutProgressFill.style.width = '0%';
            document.getElementById('demoBtn')?.classList.remove('loading');
        }

        // === Event Listeners ===
        pasteZone.addEventListener('click', readClipboard);
        retryBtn.addEventListener('click', reset);
        layoutBack.addEventListener('click', reset);

        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    handleImage(item.getAsFile());
                    return;
                }
            }
        });

        document.addEventListener('dragover', (e) => { e.preventDefault(); });
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer?.files?.[0];
            if (file && file.type.startsWith('image/')) {
                handleImage(file);
            }
        });

        if (navigator.clipboard?.read) {
            navigator.permissions?.query?.({ name: 'clipboard-read' })
                .then(r => { if (r.state === 'granted') readClipboard(); })
                .catch(() => {});
        }

        // === Demo & Upload ===
        const DEMO_IMAGE_URL = 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Image_in_a_spanish_whatsapp_chat.jpg/640px-Image_in_a_spanish_whatsapp_chat.jpg';

        const demoBtn = document.getElementById('demoBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const photoInput = document.getElementById('photoInput');

        demoBtn.addEventListener('click', async () => {
            demoBtn.classList.add('loading');
            try {
                const proxyUrl = '/api/example-image?url=' + encodeURIComponent(DEMO_IMAGE_URL);
                const resp = await fetch(proxyUrl);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const blob = await resp.blob();
                if (!blob.type.startsWith('image/')) throw new Error('Not an image');
                handleImage(blob);
            } catch (err) {
                demoBtn.classList.remove('loading');
                showError('Could not load demo image. Please paste a screenshot instead.');
            }
        });

        uploadBtn.addEventListener('click', () => photoInput.click());

        photoInput.addEventListener('change', (e) => {
            const file = e.target.files?.[0];
            if (file && file.type.startsWith('image/')) {
                handleImage(file);
            }
            photoInput.value = '';
        });
    </script>
</body>
</html>
