<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>thinx.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <!-- Pre-built Tailwind CSS 4 + DaisyUI 5 (static, no runtime JIT) -->
    <link href="/styles/output.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <!--
        LANDING PAGE THEME CONTRACT (for cloud agents / improvement agents):
        - The landing page MUST use data-theme="night" (set on <html>)
        - All colors come from DaisyUI night theme: bg-base-100, bg-base-200, border-base-300, text-primary, etc.
        - Do NOT add inline style attributes — the hub-ui-contract test forbids them
        - Do NOT add <style> blocks in <head> — the test forbids them
        - The reset() function already restores data-theme to DEFAULT_THEME ("night") on back navigation
    -->

    <!-- Paste State -->
    <div id="pasteState" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-base-100 p-5">
        <div class="w-full max-w-sm flex flex-col items-center gap-6">

            <!-- Branding -->
            <div class="text-center">
                <h1 class="text-2xl font-bold tracking-tight text-base-content">
                    thinx<span class="text-primary font-extrabold">.fun</span>
                </h1>
                <p class="text-sm mt-1 text-base-content/50">Paste a screenshot. Get the truth.</p>
            </div>

            <!-- Paste Zone -->
            <div id="pasteZone" class="card bg-base-200 border border-base-300 shadow-xl w-full cursor-pointer transition-all duration-200 hover:border-primary hover:shadow-primary/10 hover:shadow-2xl">
                <div class="card-body items-center py-10">
                    <div class="relative w-16 h-16">
                        <div class="absolute inset-0 rounded-full bg-primary/10 animate-ping"></div>
                        <div class="absolute inset-0 rounded-full bg-primary/15 flex items-center justify-center">
                            <span class="material-symbols-rounded text-3xl text-primary">content_paste</span>
                        </div>
                    </div>
                    <h2 class="card-title text-base mt-2">Tap to paste screenshot</h2>
                    <p class="text-xs text-base-content/50">or press Ctrl+V / Cmd+V</p>
                </div>
            </div>

            <!-- Actions -->
            <div class="w-full flex flex-col gap-2.5">
                <button class="btn btn-primary w-full gap-2 text-sm h-12 rounded-xl" id="demoBtn">
                    <span class="material-symbols-rounded text-lg">play_circle</span>
                    Try Demo
                </button>
                <button class="btn btn-outline btn-ghost w-full gap-2 text-sm h-12 rounded-xl border-base-300 text-base-content/60 hover:border-primary hover:text-primary hover:bg-transparent" id="uploadBtn">
                    <span class="material-symbols-rounded text-lg">photo_library</span>
                    Upload Photo
                </button>
            </div>

            <!-- Feature hints -->
            <div class="flex items-center justify-center gap-4 text-xs text-base-content/40">
                <span class="flex items-center gap-1">
                    <span class="material-symbols-rounded text-sm text-primary">fact_check</span>
                    Fact-check
                </span>
                <span class="text-base-300">|</span>
                <span class="flex items-center gap-1">
                    <span class="material-symbols-rounded text-sm text-primary">travel_explore</span>
                    Web-verified
                </span>
                <span class="text-base-300">|</span>
                <span class="flex items-center gap-1">
                    <span class="material-symbols-rounded text-sm text-primary">phone_iphone</span>
                    Mobile-first
                </span>
            </div>

            <input type="file" id="photoInput" accept="image/*" class="hidden">
        </div>
    </div>

    <!-- Analysis View -->
    <div id="analysisView" class="hidden min-h-screen bg-base-100">

        <!-- Top bar -->
        <div class="navbar sticky top-0 z-20 bg-base-100/90 border-b border-base-300 backdrop-blur px-4">
            <div class="flex-1">
                <button class="btn btn-ghost btn-sm gap-1" id="backBtn">
                    <span class="material-symbols-rounded text-base">arrow_back</span>
                    New
                </button>
            </div>
            <div class="flex-none">
                <span class="text-xs text-base-content/40" id="statusLabel">Connecting...</span>
            </div>
        </div>

        <!-- Loading indicator (shows before verdict) -->
        <div id="loadingState" class="p-6 flex flex-col items-center gap-4 mt-8">
            <span class="loading loading-ring loading-lg text-primary"></span>
            <p class="text-sm text-base-content/60" id="loadingMessage">Analyzing screenshot...</p>
        </div>

        <!-- Verdict Banner -->
        <div id="verdictBanner" class="hidden mx-4 mt-4 rounded-2xl p-5">
            <div class="flex items-center gap-3 mb-2">
                <span class="material-symbols-rounded text-3xl" id="verdictIcon">pending</span>
                <span class="text-2xl font-extrabold tracking-tight" id="verdictLabel">Checking...</span>
            </div>
            <p class="text-sm leading-relaxed opacity-80" id="verdictExplanation"></p>
        </div>

        <!-- Streaming text content -->
        <div id="contentArea" class="hidden px-4 pb-24">
            <!-- Summary section -->
            <div id="summarySection" class="hidden mt-6">
                <div class="text-xs font-bold uppercase tracking-widest text-base-content/30 mb-3">Summary</div>
                <div id="summaryText" class="text-base-content/80 text-sm leading-relaxed whitespace-pre-wrap" dir="auto"></div>
            </div>

            <!-- Deep dive angles (dynamically added) -->
            <div id="anglesContainer" class="mt-6 space-y-6"></div>

            <!-- Sources section -->
            <div id="sourcesSection" class="hidden mt-8 mb-6">
                <div class="text-xs font-bold uppercase tracking-widest text-base-content/30 mb-3">Sources</div>
                <div id="sourcesText" class="text-sm text-base-content/60 leading-relaxed whitespace-pre-wrap" dir="auto"></div>
                <div id="groundingSources" class="mt-3 space-y-1.5"></div>
            </div>

            <!-- Completion meta -->
            <div id="completionMeta" class="hidden mt-6 pt-4 border-t border-base-300">
                <div class="flex items-center justify-between text-xs text-base-content/30">
                    <span id="metaModel"></span>
                    <span id="metaDuration"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Error State -->
    <div id="errorState" class="fixed inset-0 z-50 hidden place-items-center bg-base-100 p-6">
        <div class="card bg-base-200 border border-error/30 shadow-xl w-full max-w-sm">
            <div class="card-body items-center text-center">
                <div class="avatar placeholder">
                    <div class="bg-error/20 text-error rounded-full w-16">
                        <span class="material-symbols-rounded text-3xl">error</span>
                    </div>
                </div>
                <p id="errorText" class="text-sm text-error">Something went wrong</p>
                <button class="btn btn-error btn-outline" id="retryBtn">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        const pasteState = document.getElementById('pasteState');
        const analysisView = document.getElementById('analysisView');
        const loadingState = document.getElementById('loadingState');
        const loadingMessage = document.getElementById('loadingMessage');
        const verdictBanner = document.getElementById('verdictBanner');
        const verdictIcon = document.getElementById('verdictIcon');
        const verdictLabel = document.getElementById('verdictLabel');
        const verdictExplanation = document.getElementById('verdictExplanation');
        const contentArea = document.getElementById('contentArea');
        const summarySection = document.getElementById('summarySection');
        const summaryText = document.getElementById('summaryText');
        const anglesContainer = document.getElementById('anglesContainer');
        const sourcesSection = document.getElementById('sourcesSection');
        const sourcesText = document.getElementById('sourcesText');
        const groundingSources = document.getElementById('groundingSources');
        const completionMeta = document.getElementById('completionMeta');
        const metaModel = document.getElementById('metaModel');
        const metaDuration = document.getElementById('metaDuration');
        const statusLabel = document.getElementById('statusLabel');
        const backBtn = document.getElementById('backBtn');
        const errorState = document.getElementById('errorState');
        const errorText = document.getElementById('errorText');
        const retryBtn = document.getElementById('retryBtn');
        const pasteZone = document.getElementById('pasteZone');

        const DEFAULT_THEME = 'night';
        const LAYOUT_THEME_MAP = {
            simple: 'night',
            editorial: 'business',
            dashboard: 'dim',
            product_showcase: 'synthwave',
            social_feed: 'dracula',
            breaking_news: 'coffee',
            investigation: 'coffee',
            food_order: 'autumn',
            messaging: 'emerald',
            location_explorer: 'forest',
            media_analysis: 'abyss',
            encyclopedia: 'nord',
            travel_planner: 'sunset',
        };

        function applyLayoutTheme(layoutType) {
            const theme = LAYOUT_THEME_MAP[layoutType] || DEFAULT_THEME;
            document.documentElement.setAttribute('data-theme', theme);
            return theme;
        }

        let currentImageUrl = null;
        let currentImageBase64 = null;
        let currentThumbBase64 = null;
        let currentEventSource = null;
        let retryCount = 0;
        let pipelineComplete = false;

        // Verdict color mapping
        const VERDICT_STYLES = {
            'TRUE': { bg: 'bg-success/15', text: 'text-success', icon: 'check_circle', border: 'border-success/30' },
            'FALSE': { bg: 'bg-error/15', text: 'text-error', icon: 'cancel', border: 'border-error/30' },
            'MISLEADING': { bg: 'bg-warning/15', text: 'text-warning', icon: 'warning', border: 'border-warning/30' },
            'PARTLY TRUE': { bg: 'bg-warning/15', text: 'text-warning', icon: 'help', border: 'border-warning/30' },
            'UNVERIFIED': { bg: 'bg-info/15', text: 'text-info', icon: 'question_mark', border: 'border-info/30' },
        };

        // Streaming state
        let fullText = '';
        let currentParseSection = 'preamble';
        let currentAngleEl = null;
        let angleCount = 0;
        let verdictReceived = false;
        let lastParsedOffset = 0;
        let detectedSections = [];

        // === Utilities ===
        function esc(val) {
            if (val === null || val === undefined) return '';
            const d = document.createElement('div');
            d.textContent = String(val);
            return d.innerHTML;
        }

        function linkify(text) {
            if (!text) return '';
            return esc(text).replace(
                /(https?:\/\/[^\s<>"']+)/gi,
                '<a href="$1" target="_blank" rel="noopener noreferrer" class="link link-primary break-all">$1</a>'
            );
        }

        // === Image Handling ===
        const UPLOAD_TARGET_SIZE = 1.5 * 1024 * 1024;
        const VERCEL_BODY_HARD_LIMIT = 3.5 * 1024 * 1024;

        function loadImageEl(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        async function generateThumbnail(blob, maxWidth = 360) {
            try {
                const url = URL.createObjectURL(blob);
                try {
                    const img = await loadImageEl(url);
                    const scale = Math.min(maxWidth / img.naturalWidth, 1);
                    const w = Math.round(img.naturalWidth * scale);
                    const h = Math.round(img.naturalHeight * scale);
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    return dataUrl.replace(/^data:image\/\w+;base64,/, '');
                } finally {
                    URL.revokeObjectURL(url);
                }
            } catch (e) {
                console.warn('Thumbnail generation failed:', e);
                return null;
            }
        }

        async function compressImage(blob) {
            if (blob.size <= UPLOAD_TARGET_SIZE) return blob;
            const url = URL.createObjectURL(blob);
            try {
                const img = await loadImageEl(url);
                const MAX_DIM = 1568;
                let w = img.naturalWidth, h = img.naturalHeight;
                const s = Math.min(MAX_DIM / w, MAX_DIM / h, 1);
                w = Math.round(w * s);
                h = Math.round(h * s);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const tryCompress = (tw, th, quality) => {
                    canvas.width = tw;
                    canvas.height = th;
                    ctx.drawImage(img, 0, 0, tw, th);
                    return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
                };
                let result = await tryCompress(w, h, 0.85);
                if (result && result.size > UPLOAD_TARGET_SIZE) result = await tryCompress(w, h, 0.6);
                if (result && result.size > UPLOAD_TARGET_SIZE) {
                    const s2 = Math.sqrt(UPLOAD_TARGET_SIZE / result.size) * 0.9;
                    result = await tryCompress(Math.round(w * s2), Math.round(h * s2), 0.6);
                }
                return result || blob;
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        async function emergencyCompress(blob) {
            const url = URL.createObjectURL(blob);
            try {
                const img = await loadImageEl(url);
                const canvas = document.createElement('canvas');
                const maxDim = 800;
                let w = img.naturalWidth, h = img.naturalHeight;
                const s = Math.min(maxDim / w, maxDim / h, 1);
                canvas.width = Math.round(w * s);
                canvas.height = Math.round(h * s);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                return new Promise((resolve, reject) =>
                    canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', 0.3)
                );
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        // === Telemetry ===
        const telemetry = {
            pipelineStart: null,
            uploadStart: null,
            uploadEnd: null,
            firstEventAt: null,
            eventsReceived: [],
            requestId: null,

            reset() {
                this.pipelineStart = Date.now();
                this.uploadStart = null;
                this.uploadEnd = null;
                this.firstEventAt = null;
                this.eventsReceived = [];
                this.requestId = null;
            },

            markUploadStart() { this.uploadStart = Date.now(); },
            markUploadEnd() { this.uploadEnd = Date.now(); },

            trackEvent(event) {
                const now = Date.now();
                if (!this.firstEventAt) this.firstEventAt = now;
                const elapsed = now - (this.pipelineStart || now);
                this.eventsReceived.push({ event, elapsed });
            },

            _buildPayload(extra = {}) {
                const now = Date.now();
                return {
                    requestId: this.requestId,
                    url: location.href,
                    userAgent: navigator.userAgent,
                    screen: `${screen.width}x${screen.height}`,
                    connection: navigator.connection ? {
                        type: navigator.connection.effectiveType,
                        downlink: navigator.connection.downlink,
                        rtt: navigator.connection.rtt,
                    } : null,
                    totalDuration: this.pipelineStart ? now - this.pipelineStart : null,
                    uploadDuration: (this.uploadStart && this.uploadEnd) ? this.uploadEnd - this.uploadStart : null,
                    firstEventDelay: (this.pipelineStart && this.firstEventAt) ? this.firstEventAt - this.pipelineStart : null,
                    eventsReceived: this.eventsReceived,
                    retries: retryCount,
                    ...extra,
                };
            },

            reportError(message, extra = {}) {
                const payload = { ...this._buildPayload(extra), message, outcome: 'error' };
                fetch('/api/debug/client-error', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportSuccess() {
                const payload = { ...this._buildPayload(), outcome: 'success' };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportOutcome(outcome, error = null) {
                const payload = { ...this._buildPayload(), outcome, error };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },
        };

        // === Clipboard ===
        async function readClipboard() {
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    const imageType = item.types.find(t => t.startsWith('image/'));
                    if (imageType) {
                        const blob = await item.getType(imageType);
                        handleImage(blob);
                        return;
                    }
                }
            } catch {}
        }

        // === Image Handling ===
        async function handleImage(blob) {
            currentImageUrl = URL.createObjectURL(blob);
            pasteState.classList.add('hidden');
            analysisView.classList.remove('hidden');
            loadingState.classList.remove('hidden');
            loadingMessage.textContent = 'Optimizing image...';

            if (blob.size > UPLOAD_TARGET_SIZE) {
                try {
                    blob = await compressImage(blob);
                } catch (e) {
                    console.warn('Compression failed, trying fallback:', e);
                    try {
                        blob = await emergencyCompress(blob);
                    } catch (e2) {
                        console.warn('Emergency compression also failed:', e2);
                    }
                }
            }

            if (blob.size > VERCEL_BODY_HARD_LIMIT) {
                showError('Image is too large (' + Math.round(blob.size / 1024 / 1024) + 'MB). Try a smaller screenshot.');
                return;
            }

            currentThumbBase64 = await generateThumbnail(blob);
            loadingMessage.textContent = 'Uploading...';

            const reader = new FileReader();
            reader.onloadend = () => {
                currentImageBase64 = reader.result;
                startPipeline(currentImageBase64);
            };
            reader.readAsDataURL(blob);
        }

        // === Pipeline ===
        function getRequestedPipeline() {
            const pipeline = new URLSearchParams(location.search).get('pipeline');
            if (['factcheck', 'gemini', 'llm2', 'legacy'].includes(pipeline)) return pipeline;
            return null;
        }

        async function startPipeline(imageDataUrl) {
            retryCount = 0;
            pipelineComplete = false;
            verdictReceived = false;
            fullText = '';
            currentParseSection = 'preamble';
            currentAngleEl = null;
            angleCount = 0;
            lastParsedOffset = 0;
            detectedSections = [];
            telemetry.reset();

            if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

            try {
                telemetry.markUploadStart();
                loadingMessage.textContent = 'Sending screenshot...';
                statusLabel.textContent = 'Uploading...';

                const body = { image: imageDataUrl };
                const requestedPipeline = getRequestedPipeline();
                if (requestedPipeline) body.pipeline = requestedPipeline;
                if (currentThumbBase64) body.thumb = currentThumbBase64;

                const resp = await fetch('/api/hub/v2/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                telemetry.markUploadEnd();

                if (!resp.ok) throw new Error('Upload failed');
                const { requestId } = await resp.json();
                telemetry.requestId = requestId;

                loadingMessage.textContent = 'Analyzing and searching the web...';
                statusLabel.textContent = 'Searching...';

                await connectToStream(requestId);
            } catch (err) {
                telemetry.reportError(err.message || 'connection failed', { type: 'pipeline_error' });
                showError(err.message || 'Connection failed');
            }
        }

        async function connectToStream(requestId) {
            return new Promise((resolve, reject) => {
                const es = new EventSource(`/api/hub/v2/stream/${requestId}`);
                currentEventSource = es;

                const timeout = setTimeout(() => {
                    if (!verdictReceived) {
                        es.close();
                        telemetry.reportError('No response from server (45s)', { type: 'timeout' });
                        reject(new Error('Analysis timed out. Please try again.'));
                    }
                }, 45000);

                es.addEventListener('message', (e) => {
                    try {
                        const evt = e.type || 'message';
                        const data = JSON.parse(e.data);
                        const eventType = data._event || evt;
                        telemetry.trackEvent(eventType);
                    } catch {}
                });

                const eventTypes = ['connected', 'token', 'verdict', 'section', 'sources', 'progress', 'complete', 'error'];
                eventTypes.forEach(evt => {
                    es.addEventListener(evt, (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent(evt);
                            handleEvent(evt, data);

                            if (evt === 'complete') {
                                clearTimeout(timeout);
                                es.close();
                                currentEventSource = null;
                                telemetry.reportSuccess();
                                resolve();
                            }
                        } catch {}
                    });
                });

                es.addEventListener('error', () => {
                    if (es.readyState === EventSource.CLOSED) {
                        if (!pipelineComplete) {
                            clearTimeout(timeout);
                            reject(new Error(verdictReceived ? 'Connection lost during analysis' : 'Connection lost'));
                        }
                        return;
                    }
                    es.close();
                    currentEventSource = null;
                    clearTimeout(timeout);
                    if (!pipelineComplete) {
                        reject(new Error('Connection to server lost'));
                    }
                });
            });
        }

        // === Event Handling ===
        function handleEvent(type, data) {
            switch (type) {
                case 'connected':
                    statusLabel.textContent = 'Connected';
                    break;

                case 'progress':
                    if (data.message) {
                        loadingMessage.textContent = data.message;
                        statusLabel.textContent = data.message;
                    }
                    break;

                case 'verdict':
                    showVerdict(data);
                    break;

                case 'token':
                    appendToken(data.text);
                    break;

                case 'section':
                    handleSection(data);
                    break;

                case 'sources':
                    handleSources(data);
                    break;

                case 'complete':
                    handleComplete(data);
                    break;

                case 'error':
                    telemetry.reportError(data.message || 'analysis failed', { type: 'sse_error' });
                    showError(data.message || 'Analysis failed');
                    break;

                // Handle card-based pipeline events for backward compat
                case 'blueprint':
                case 'layout_update':
                case 'card':
                case 'card_update':
                case 'card_add':
                case 'phase':
                case 'settled':
                    break;
            }
        }

        function showVerdict(data) {
            verdictReceived = true;
            loadingState.classList.add('hidden');
            verdictBanner.classList.remove('hidden');
            contentArea.classList.remove('hidden');

            const style = VERDICT_STYLES[data.verdict] || VERDICT_STYLES['UNVERIFIED'];
            verdictBanner.className = `mx-4 mt-4 rounded-2xl p-5 border ${style.bg} ${style.border}`;
            verdictIcon.textContent = style.icon;
            verdictIcon.className = `material-symbols-rounded text-3xl ${style.text}`;
            verdictLabel.textContent = data.verdict;
            verdictLabel.className = `text-2xl font-extrabold tracking-tight ${style.text}`;
            verdictExplanation.textContent = data.explanation || '';

            statusLabel.textContent = 'Analyzing...';
        }

        function appendToken(text) {
            fullText += text;
            parseAccumulatedText();
        }

        function parseAccumulatedText() {
            const text = fullText;

            const markers = [];
            let idx;

            idx = text.indexOf('---SUMMARY');
            if (idx !== -1) markers.push({ pos: idx, type: 'summary', len: '---SUMMARY'.length, title: 'Summary' });

            idx = text.indexOf('---SOURCES');
            if (idx !== -1) markers.push({ pos: idx, type: 'sources', len: '---SOURCES'.length, title: 'Sources' });

            let searchFrom = 0;
            while ((idx = text.indexOf('---ANGLE:', searchFrom)) !== -1) {
                const lineEnd = text.indexOf('\n', idx);
                const titleEnd = lineEnd === -1 ? text.length : lineEnd;
                const title = text.slice(idx + '---ANGLE:'.length, titleEnd).trim();
                if (title) {
                    markers.push({ pos: idx, type: 'angle', len: titleEnd - idx, title });
                }
                searchFrom = titleEnd + 1;
            }

            markers.sort((a, b) => a.pos - b.pos);

            const newMarkers = markers.filter(m => !detectedSections.some(d => d.pos === m.pos && d.type === m.type));

            for (const marker of newMarkers) {
                detectedSections.push(marker);

                if (marker.type === 'summary') {
                    currentParseSection = 'summary';
                    summarySection.classList.remove('hidden');
                } else if (marker.type === 'angle') {
                    currentParseSection = 'angle';
                    createAngleSection(marker.title);
                } else if (marker.type === 'sources') {
                    currentParseSection = 'sources';
                    sourcesSection.classList.remove('hidden');
                }
            }

            renderFromOffset();
        }

        function renderFromOffset() {
            const text = fullText;
            const allMarkers = [...detectedSections].sort((a, b) => a.pos - b.pos);

            if (allMarkers.length === 0) {
                return;
            }

            const regions = [];
            for (let i = 0; i < allMarkers.length; i++) {
                const m = allMarkers[i];
                const contentStart = m.pos + m.len;
                const contentEnd = i + 1 < allMarkers.length ? allMarkers[i + 1].pos : text.length;
                regions.push({ type: m.type, title: m.title, start: contentStart, end: contentEnd });
            }

            for (const region of regions) {
                const regionText = text.slice(region.start, region.end);
                const safeText = regionText.replace(/</g, '&lt;').replace(/>/g, '&gt;');

                switch (region.type) {
                    case 'summary':
                        summaryText.innerHTML = safeText;
                        break;
                    case 'sources':
                        sourcesText.innerHTML = safeText;
                        break;
                    case 'angle': {
                        const angleEl = anglesContainer.querySelector(`[data-angle-title="${CSS.escape(region.title)}"]`);
                        if (angleEl) {
                            const body = angleEl.querySelector('.angle-body');
                            if (body) body.innerHTML = safeText;
                        }
                        break;
                    }
                }
            }
        }

        function appendToSection(section, text) {
            const safeText = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            switch (section) {
                case 'summary':
                    summaryText.innerHTML += safeText;
                    break;
                case 'angle':
                    if (currentAngleEl) {
                        const body = currentAngleEl.querySelector('.angle-body');
                        if (body) body.innerHTML += safeText;
                    }
                    break;
                case 'sources':
                    sourcesText.innerHTML += safeText;
                    break;
            }
        }

        function createAngleSection(title) {
            angleCount++;
            const section = document.createElement('div');
            section.className = 'border border-base-300 rounded-xl overflow-hidden';
            section.setAttribute('data-angle-title', title);
            section.innerHTML =
                '<div class="px-4 py-3 bg-base-200 border-b border-base-300 flex items-center gap-2">' +
                    '<span class="material-symbols-rounded text-primary text-base">search</span>' +
                    '<span class="text-sm font-semibold text-base-content">' + esc(title) + '</span>' +
                '</div>' +
                '<div class="angle-body px-4 py-3 text-sm text-base-content/80 leading-relaxed whitespace-pre-wrap" dir="auto"></div>';
            anglesContainer.appendChild(section);
            currentAngleEl = section;
        }

        function handleSection(data) {
            // Section events are purely structural markers
            // The actual content routing happens via token parsing
        }

        function handleSources(data) {
            if (!data.citations || !data.citations.length) return;
            sourcesSection.classList.remove('hidden');
            groundingSources.innerHTML = '';
            data.citations.forEach(url => {
                try {
                    const hostname = new URL(url).hostname.replace('www.', '');
                    const el = document.createElement('a');
                    el.href = url;
                    el.target = '_blank';
                    el.rel = 'noopener noreferrer';
                    el.className = 'flex items-center gap-2 px-3 py-2 rounded-lg bg-base-200 border border-base-300 text-xs hover:border-primary transition-colors';
                    el.innerHTML =
                        '<span class="material-symbols-rounded text-primary text-sm">link</span>' +
                        '<span class="text-base-content/60 truncate">' + esc(hostname) + '</span>';
                    groundingSources.appendChild(el);
                } catch {}
            });
        }

        function handleComplete(data) {
            pipelineComplete = true;
            statusLabel.textContent = 'Complete';
            loadingState.classList.add('hidden');

            // If no verdict was ever received but we have accumulated text,
            // try to parse it now (handles non-streaming fallback or missed events)
            if (!verdictReceived && fullText.length > 0) {
                tryParseFullText(fullText);
            }

            // If still nothing rendered, show a fallback message
            if (!verdictReceived && fullText.length === 0) {
                verdictBanner.classList.remove('hidden');
                contentArea.classList.remove('hidden');
                const style = VERDICT_STYLES['UNVERIFIED'];
                verdictBanner.className = `mx-4 mt-4 rounded-2xl p-5 border ${style.bg} ${style.border}`;
                verdictIcon.textContent = 'info';
                verdictIcon.className = `material-symbols-rounded text-3xl ${style.text}`;
                verdictLabel.textContent = 'Analysis Complete';
                verdictLabel.className = `text-2xl font-extrabold tracking-tight ${style.text}`;
                verdictExplanation.textContent = 'The analysis completed but no structured result was returned. Try again.';
            }

            if (data.duration) {
                completionMeta.classList.remove('hidden');
                metaDuration.textContent = (data.duration / 1000).toFixed(1) + 's';
                if (data.model) metaModel.textContent = data.model;
            }

            postProcessText();
        }

        function tryParseFullText(text) {
            // Try to extract verdict from accumulated text
            const verdictMatch = text.match(/(?:^|\n)VERDICT:\s*(TRUE|FALSE|MISLEADING|PARTLY TRUE|UNVERIFIED)\s*\n(.+)\n/);
            if (verdictMatch) {
                showVerdict({ verdict: verdictMatch[1], explanation: verdictMatch[2].trim() });
            } else {
                // No structured verdict — show text as-is with a neutral verdict
                showVerdict({ verdict: 'UNVERIFIED', explanation: 'Analysis complete' });
            }

            // Re-parse sections from full text
            parseAccumulatedText();
            
            // If no sections were detected, show the full text as summary
            if (detectedSections.length === 0 && text.length > 0) {
                summarySection.classList.remove('hidden');
                const cleanText = text.replace(/^VERDICT:.*\n.*\n?/, '').trim();
                summaryText.innerHTML = cleanText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }
        }

        function postProcessText() {
            linkifySection(summaryText);
            anglesContainer.querySelectorAll('.angle-body').forEach(el => linkifySection(el));
            linkifySection(sourcesText);
        }

        function linkifySection(el) {
            if (!el || !el.innerHTML) return;
            el.innerHTML = el.innerHTML.replace(
                /(https?:\/\/[^\s<>"'&]+)/gi,
                '<a href="$1" target="_blank" rel="noopener noreferrer" class="link link-primary break-all">$1</a>'
            );
        }

        // === Error & Reset ===
        function showError(message) {
            errorText.textContent = message;
            errorState.classList.remove('hidden');
            errorState.classList.add('grid');
            loadingState.classList.add('hidden');
        }

        function reset() {
            if (currentImageUrl) {
                URL.revokeObjectURL(currentImageUrl);
                currentImageUrl = null;
            }
            currentImageBase64 = null;
            currentThumbBase64 = null;
            retryCount = 0;
            pipelineComplete = false;
            verdictReceived = false;
            fullText = '';
            currentParseSection = 'preamble';
            currentAngleEl = null;
            angleCount = 0;
            lastParsedOffset = 0;
            detectedSections = [];

            if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

            pasteState.classList.remove('hidden');
            analysisView.classList.add('hidden');
            loadingState.classList.add('hidden');
            verdictBanner.classList.add('hidden');
            contentArea.classList.add('hidden');
            summarySection.classList.add('hidden');
            sourcesSection.classList.add('hidden');
            completionMeta.classList.add('hidden');
            errorState.classList.add('hidden');
            errorState.classList.remove('grid');

            summaryText.innerHTML = '';
            sourcesText.innerHTML = '';
            groundingSources.innerHTML = '';
            anglesContainer.innerHTML = '';
            verdictExplanation.textContent = '';

            statusLabel.textContent = 'Connecting...';
            loadingMessage.textContent = 'Analyzing screenshot...';

            applyLayoutTheme(DEFAULT_THEME);
            document.getElementById('demoBtn')?.classList.remove('loading');
        }

        // === Event Listeners ===
        pasteZone.addEventListener('click', readClipboard);
        retryBtn.addEventListener('click', reset);
        backBtn.addEventListener('click', reset);

        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    handleImage(item.getAsFile());
                    return;
                }
            }
        });

        document.addEventListener('dragover', (e) => { e.preventDefault(); });
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer?.files?.[0];
            if (file && file.type.startsWith('image/')) {
                handleImage(file);
            }
        });

        if (navigator.clipboard?.read) {
            navigator.permissions?.query?.({ name: 'clipboard-read' })
                .then(r => { if (r.state === 'granted') readClipboard(); })
                .catch(() => {});
        }

        // === Demo & Upload ===
        const DEMO_IMAGE_PATH = '/IMG_1699.png';
        const demoBtn = document.getElementById('demoBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const photoInput = document.getElementById('photoInput');

        demoBtn.addEventListener('click', async () => {
            demoBtn.classList.add('loading');
            try {
                const resp = await fetch(DEMO_IMAGE_PATH);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const blob = await resp.blob();
                if (!blob.type.startsWith('image/')) throw new Error('Not an image');
                handleImage(blob);
            } catch (err) {
                demoBtn.classList.remove('loading');
                showError('Could not load demo image. Please paste a screenshot instead.');
            }
        });

        uploadBtn.addEventListener('click', () => photoInput.click());

        photoInput.addEventListener('change', (e) => {
            const file = e.target.files?.[0];
            if (file && file.type.startsWith('image/')) {
                handleImage(file);
            }
            photoInput.value = '';
        });

        // === Capture (kept for test contract) ===
        function loadDomToImage() {
            if (typeof domtoimage !== 'undefined') return Promise.resolve();
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js';
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
    </script>
</body>
</html>
