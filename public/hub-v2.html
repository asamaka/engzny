<!DOCTYPE html>
<html lang="en" data-theme="thinx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>thinx.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <!-- DaisyUI 5 + Tailwind CSS 4 (CDN, no build step) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
    <style>
      /* Custom thinx dark theme — overrides DaisyUI dark theme with our palette */
      [data-theme="thinx"] {
        color-scheme: dark;
        --color-base-100: oklch(7% 0.01 260);
        --color-base-200: oklch(13% 0.015 260);
        --color-base-300: oklch(18% 0.02 260);
        --color-base-content: oklch(93% 0.01 260);
        --color-primary: oklch(64% 0.17 260);
        --color-primary-content: oklch(100% 0 0);
        --color-secondary: oklch(64% 0.19 300);
        --color-secondary-content: oklch(100% 0 0);
        --color-accent: oklch(78% 0.17 160);
        --color-accent-content: oklch(0% 0 0);
        --color-neutral: oklch(15% 0.015 260);
        --color-neutral-content: oklch(63% 0.03 260);
        --color-info: oklch(64% 0.17 260);
        --color-info-content: oklch(100% 0 0);
        --color-success: oklch(78% 0.17 160);
        --color-success-content: oklch(0% 0 0);
        --color-warning: oklch(84% 0.16 85);
        --color-warning-content: oklch(0% 0 0);
        --color-error: oklch(67% 0.19 20);
        --color-error-content: oklch(100% 0 0);
        --radius-selector: 0.5rem;
        --radius-field: 0.5rem;
        --radius-box: 1rem;
        --size-selector: 0.25rem;
        --size-field: 0.25rem;
        --border: 1px;
        --depth: 1;
        --noise: 0;
      }
    </style>
    <style>
        /* Reset must be in @layer base so it doesn't override DaisyUI/Tailwind
           layered styles. Unlayered * { padding: 0 } beats @layer components
           and @layer utilities, which strips all DaisyUI component padding. */
        @layer base {
            *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        }

        :root {
            --bg: #08090d;
            --bg-raised: #0d0f14;
            --surface: #12151c;
            --surface-2: #181c26;
            --surface-3: #1f2533;
            --surface-bright: #283040;
            --border: #1a1f2e;
            --border-bright: #252d40;
            --text: #e4e8f0;
            --text-secondary: #8892a6;
            --text-muted: #545e72;
            --accent: #5b8af5;
            --accent-dim: #3b6ad5;
            --accent-bg: rgba(91,138,245,0.10);
            --accent-bg-strong: rgba(91,138,245,0.18);
            --green: #4cd68a;
            --green-bg: rgba(76,214,138,0.12);
            --green-dim: #2a8a50;
            --red: #f06060;
            --red-bg: rgba(240,96,96,0.12);
            --yellow: #f0c040;
            --yellow-bg: rgba(240,192,64,0.10);
            --purple: #a07ef0;
            --purple-bg: rgba(160,126,240,0.10);
            --orange: #f09040;
            --orange-bg: rgba(240,144,64,0.10);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --radius-pill: 100px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
            --glass: rgba(18,21,28,0.75);
            --glass-border: rgba(255,255,255,0.06);
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* === PASTE STATE === */
        #pasteState {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
            background: var(--bg);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #pasteState.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .paste-zone {
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            border: 2px dashed var(--border-bright);
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--surface);
        }

        .paste-zone:hover, .paste-zone:active {
            border-color: var(--accent);
            background: var(--accent-bg);
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(91,138,245,0.12);
        }

        .paste-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-bg-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .paste-icon .material-symbols-rounded {
            font-size: 30px;
            color: var(--accent);
        }

        .paste-zone:hover .paste-icon {
            background: var(--accent);
        }

        .paste-zone:hover .paste-icon .material-symbols-rounded {
            color: #fff;
        }

        .paste-text {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text);
        }

        .paste-hint {
            margin-top: 1.5rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* === ACTION BUTTONS === */
        .action-buttons {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 260px;
        }

        .action-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            -webkit-tap-highlight-color: transparent;
        }

        .action-btn .material-symbols-rounded { font-size: 20px; }

        .action-btn--demo {
            background: var(--surface);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .action-btn--demo:hover, .action-btn--demo:active {
            border-color: var(--accent-dim);
            background: var(--accent-bg);
            color: var(--accent);
        }

        .action-btn--demo:active { transform: scale(0.97); }

        .action-btn--demo.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .action-btn--upload {
            background: transparent;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.82rem;
        }

        .action-btn--upload:hover, .action-btn--upload:active {
            color: var(--accent);
        }

        .action-btn--upload:active { transform: scale(0.97); }

        #photoInput { display: none; }

        /* === MAIN CANVAS === */
        #mainCanvas {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: none;
        }

        #mainCanvas.active { display: block; }

        .screenshot-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screenshot-layer img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screenshot-layer.scanning img {
            opacity: 0.35;
            filter: brightness(0.7) blur(2px);
        }

        .screenshot-layer.fading { opacity: 0.06; }
        .screenshot-layer.gone { opacity: 0; pointer-events: none; }

        /* Progress overlay */
        .progress-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .progress-overlay.active { opacity: 1; }

        .progress-ring {
            width: 96px;
            height: 96px;
            position: relative;
            margin-bottom: 20px;
        }

        .progress-ring svg {
            width: 96px;
            height: 96px;
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            fill: none;
            stroke: var(--surface-3);
            stroke-width: 3;
        }

        .progress-ring-fill {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-pct {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .progress-ring.complete .progress-ring-fill {
            stroke: var(--green);
            transition: stroke-dashoffset 0.3s ease-out, stroke 0.3s;
        }

        .progress-ring.complete .progress-pct { color: var(--green); }

        .progress-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            max-width: 240px;
            line-height: 1.4;
        }

        .progress-phase {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .progress-overlay.uploading .progress-phase { color: var(--accent); }
        .progress-overlay.analyzing .progress-phase { color: var(--yellow); }
        .progress-overlay.ready .progress-phase { color: var(--green); }

        .progress-overlay.hiding {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.4s, transform 0.4s;
        }

        /* === RESULTS OVERLAY === */
        .results-overlay {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding-bottom: 80px;
        }

        .results-overlay.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* === HEADER === */
        .layout-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 9, 13, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .layout-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .layout-back {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .layout-back:hover {
            color: var(--accent);
            background: var(--accent-bg);
        }

        .layout-badge {
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: var(--accent-bg-strong);
            color: var(--accent);
        }

        .layout-progress {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .layout-progress-bar {
            width: 80px;
            height: 3px;
            background: var(--surface-3);
            border-radius: 4px;
            overflow: hidden;
        }

        .layout-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .layout-progress-text {
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* === CONTENT ANALYSIS === */
        .content-analysis {
            padding: 10px 16px 4px;
        }

        .content-analysis-intent {
            font-size: 0.78rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 6px;
            line-height: 1.45;
        }

        .content-analysis-intent:empty { display: none; }

        /* top-questions moved to follow-up section at bottom */

        /* === CARD GRID === */
        .card-grid {
            padding: 16px;
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(2, 1fr);
        }

        @media (min-width: 768px) {
            .card-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 20px; }
        }

        @media (min-width: 1200px) {
            .card-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
        }

        .card-grid .span-full { grid-column: 1 / -1; }
        .card-grid .span-2 { grid-column: span 2; }
        @media (max-width: 480px) {
            .card-grid .span-2 { grid-column: 1 / -1; }
        }

        .card-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .card-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

        .card-grid.single-card {
            grid-template-columns: 1fr;
            max-width: 520px;
            margin: 0 auto;
        }

        /* === CARD BASE === */
        .card {
            border-radius: var(--radius-lg);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(10px) scale(0.98);
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card:hover {
            border-color: rgba(255,255,255,0.10);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .card.loading { min-height: 72px; }

        .card.loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(91,138,245,0.04) 30%, rgba(91,138,245,0.08) 50%, rgba(91,138,245,0.04) 70%, transparent 100%);
            animation: shimmer 1.8s ease-in-out infinite;
        }

        .card.loading .placeholder-line {
            animation: placeholderPulse 2s ease-in-out infinite;
        }
        .card.loading .placeholder-line:nth-child(2) { animation-delay: 0.15s; }
        .card.loading .placeholder-line:nth-child(3) { animation-delay: 0.3s; }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes placeholderPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        .card.loading.researching {
            border-color: rgba(91,138,245,0.15);
        }

        .card.loading.researching::before {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: researchDot 1s ease-in-out infinite;
        }

        @keyframes researchDot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .skeleton-status {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.4s;
            font-style: italic;
        }

        .card.loading.researching .skeleton-status { opacity: 1; }

        .web-citations {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .web-citations-label {
            font-size: 0.56rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .web-citation-link {
            font-size: 0.56rem;
            color: var(--accent-dim);
            text-decoration: none;
            padding: 1px 5px;
            border-radius: 4px;
            background: var(--accent-bg);
        }

        .web-citation-link:hover {
            color: var(--accent);
            background: var(--accent-bg-strong);
        }

        .card.populated { animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

        @keyframes cardPop {
            from { transform: scale(0.96); opacity: 0.7; }
            60% { transform: scale(1.01); }
            to { transform: scale(1); opacity: 1; }
        }

        .card.just-populated {
            border-color: rgba(91,138,245,0.25);
            box-shadow: 0 0 24px rgba(91,138,245,0.1);
        }

        .card.card-updating {
            animation: cardUpdate 0.5s ease-out;
            border-color: rgba(240,192,64,0.3);
            box-shadow: 0 0 16px rgba(240,192,64,0.1);
        }

        @keyframes cardUpdate {
            0% { transform: scale(1); }
            30% { transform: scale(0.98); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card.just-added {
            animation: cardSlideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-color: rgba(76,214,138,0.3);
            box-shadow: 0 0 16px rgba(76,214,138,0.1);
        }

        @keyframes cardSlideIn {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            60% { transform: translateY(-4px) scale(1.01); }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .card-update-badge, .card-add-badge {
            font-size: 0.52rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 6px;
            display: inline-block;
            animation: badgeFadeIn 0.3s ease-out;
        }

        .card-update-badge { color: var(--yellow); background: var(--yellow-bg); }
        .card-add-badge { color: var(--green); background: var(--green-bg); }

        @keyframes badgeFadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card.entering {
            animation: cardEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(14px) scale(0.95); }
            60% { transform: translateY(-2px) scale(1.01); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card .card-source-tag {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.48rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 2;
            opacity: 0.7;
            transition: opacity 0.5s;
        }

        .card .card-source-tag.source-haiku { background: var(--accent-bg); color: var(--accent); }
        .card .card-source-tag.source-sonnet { background: var(--yellow-bg); color: var(--yellow); }
        .card .card-source-tag.source-sonar { background: var(--green-bg); color: var(--green); }
        .card .card-source-tag.source-review { background: var(--purple-bg); color: var(--purple); }

        /* === CARD TYPES: now handled by DaisyUI/Tailwind inline classes === */

        /* === FOLLOW-UP QUESTIONS — Interactive at bottom === */
        .follow-up-section {
            padding: 20px 16px 24px;
        }

        .follow-up-header {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .follow-up-header .material-symbols-rounded {
            font-size: 14px;
            color: var(--accent);
        }

        .follow-up-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .follow-up-item {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .follow-up-item:hover {
            border-color: rgba(255,255,255,0.10);
        }

        .follow-up-question {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .follow-up-question:hover {
            background: var(--surface-2);
        }

        .follow-up-question .fq-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.3s;
        }

        .follow-up-item.open .follow-up-question .fq-icon {
            transform: rotate(45deg);
            background: var(--accent-bg-strong);
        }

        .follow-up-question .fq-icon .material-symbols-rounded {
            font-size: 14px;
            color: var(--accent);
        }

        .follow-up-question .fq-text {
            font-size: 0.78rem;
            color: var(--text);
            font-weight: 500;
            line-height: 1.4;
        }

        .follow-up-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), padding 0.35s;
            padding: 0 14px;
        }

        .follow-up-item.open .follow-up-answer {
            max-height: 300px;
            padding: 0 14px 14px;
        }

        .follow-up-answer-text {
            font-size: 0.74rem;
            color: var(--text-secondary);
            line-height: 1.6;
            padding: 10px 12px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--accent);
        }

        /* === ERROR STATE === */
        #errorState {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
            background: var(--bg);
            padding: 2rem;
            text-align: center;
        }

        #errorState.active { display: flex; }

        .error-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--red-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .error-icon .material-symbols-rounded { font-size: 28px; color: var(--red); }

        .error-text {
            color: var(--red);
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .retry-btn {
            padding: 12px 32px;
            background: var(--surface);
            border: 1px solid var(--border-bright);
            border-radius: var(--radius-pill);
            color: var(--text);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .retry-btn:hover {
            background: var(--accent-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* === PLACEHOLDERS === */
        .placeholder-line {
            height: 10px;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
        }
        .placeholder-line.short { width: 55%; }
        .placeholder-line.medium { width: 78%; }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .auto-link {
            color: var(--accent);
            text-decoration: none;
            word-break: break-all;
        }
        .auto-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Paste State -->
    <div id="pasteState">
        <div class="paste-zone" id="pasteZone">
            <div class="paste-icon">
                <span class="material-symbols-rounded">content_paste</span>
            </div>
            <span class="paste-text">Tap to paste screenshot</span>
        </div>
        <p class="paste-hint">or press Ctrl+V / Cmd+V</p>

        <div class="action-buttons">
            <button class="action-btn action-btn--demo" id="demoBtn">
                <span class="material-symbols-rounded">play_circle</span>
                Try Demo
            </button>
            <button class="action-btn action-btn--upload" id="uploadBtn">
                <span class="material-symbols-rounded">photo_library</span>
                Upload Photo
            </button>
            <input type="file" id="photoInput" accept="image/*">
        </div>
    </div>

    <!-- Main Canvas -->
    <div id="mainCanvas">
        <div class="screenshot-layer" id="screenshotLayer">
            <img id="screenshotImg" alt="">
        </div>

        <div class="progress-overlay" id="progressOverlay">
            <div class="progress-ring" id="progressRing">
                <svg viewBox="0 0 100 100">
                    <defs><linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--accent)"/>
                        <stop offset="100%" stop-color="var(--purple)"/>
                    </linearGradient></defs>
                    <circle class="progress-ring-bg" cx="50" cy="50" r="45"/>
                    <circle class="progress-ring-fill" id="progressRingFill" cx="50" cy="50" r="45"/>
                </svg>
                <div class="progress-pct" id="progressPct">0%</div>
            </div>
            <div class="progress-phase" id="progressPhase">UPLOADING</div>
            <div class="progress-label" id="progressLabel">Sending screenshot...</div>
        </div>

        <div class="results-overlay" id="resultsOverlay">
            <div class="layout-header">
                <div class="layout-header-left">
                    <button class="layout-back" id="layoutBack">
                        <span class="material-symbols-rounded" style="font-size:18px">arrow_back</span>
                        New
                    </button>
                    <span class="layout-badge" id="layoutBadge"></span>
                </div>
                <div class="layout-progress" id="layoutProgress">
                    <div class="layout-progress-bar">
                        <div class="layout-progress-fill" id="layoutProgressFill"></div>
                    </div>
                    <span class="layout-progress-text" id="layoutProgressText"></span>
                </div>
            </div>
            <!-- content-analysis removed from user UI (still in report data) -->
            <div class="card-grid" id="cardGrid"></div>
            <div class="follow-up-section" id="followUpSection" style="display:none;">
                <div class="follow-up-header">
                    <span class="material-symbols-rounded">forum</span>
                    Questions you might have
                </div>
                <div class="follow-up-list" id="followUpList"></div>
            </div>
        </div>
    </div>

    <!-- Error State -->
    <div id="errorState">
        <div class="error-icon">
            <span class="material-symbols-rounded">error</span>
        </div>
        <p class="error-text" id="errorText">something went wrong</p>
        <button class="retry-btn" id="retryBtn">Try Again</button>
    </div>

    <script>
        const pasteState = document.getElementById('pasteState');
        const mainCanvas = document.getElementById('mainCanvas');
        const screenshotLayer = document.getElementById('screenshotLayer');
        const screenshotImg = document.getElementById('screenshotImg');
        const progressOverlay = document.getElementById('progressOverlay');
        const progressRingFill = document.getElementById('progressRingFill');
        const progressPct = document.getElementById('progressPct');
        const progressPhase = document.getElementById('progressPhase');
        const progressLabel = document.getElementById('progressLabel');
        const progressRing = document.getElementById('progressRing');
        const RING_CIRCUMFERENCE = 2 * Math.PI * 45;

        function updateProgress(pct, phase, label) {
            const offset = RING_CIRCUMFERENCE - (pct / 100) * RING_CIRCUMFERENCE;
            progressRingFill.style.strokeDashoffset = offset;
            progressPct.textContent = Math.round(pct) + '%';
            if (phase) progressPhase.textContent = phase;
            if (label) progressLabel.textContent = label;
            if (pct >= 100) {
                progressRing.classList.add('complete');
            } else {
                progressRing.classList.remove('complete');
            }
        }
        const resultsOverlay = document.getElementById('resultsOverlay');
        const layoutBadge = document.getElementById('layoutBadge');
        const layoutProgressFill = document.getElementById('layoutProgressFill');
        const layoutProgressText = document.getElementById('layoutProgressText');
        const contentAnalysisEl = document.getElementById('contentAnalysis');
        const analysisIntent = document.getElementById('analysisIntent');
        const followUpSection = document.getElementById('followUpSection');
        const followUpList = document.getElementById('followUpList');
        const cardGrid = document.getElementById('cardGrid');
        const errorText = document.getElementById('errorText');
        const retryBtn = document.getElementById('retryBtn');
        const layoutBack = document.getElementById('layoutBack');
        const layoutProgress = document.getElementById('layoutProgress');
        const errorState = document.getElementById('errorState');
        const pasteZone = document.getElementById('pasteZone');

        let currentImageUrl = null;
        let currentImageBase64 = null;
        let totalCards = 0;
        let completedCards = 0;

        // === Utilities ===
        function esc(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'object') {
                if (Array.isArray(val)) return val.map(v => esc(v)).join(', ');
                const meaningful = val.label || val.name || val.value || val.text || val.title || val.header || val.event || val.description;
                if (meaningful) return esc(meaningful);
                return esc(JSON.stringify(val));
            }
            const d = document.createElement('div');
            d.textContent = String(val);
            return d.innerHTML;
        }

        function linkify(text) {
            if (!text) return '';
            const escaped = esc(text);
            return escaped.replace(
                /(https?:\/\/[^\s<>"']+)/gi,
                '<a href="$1" target="_blank" rel="noopener noreferrer" class="auto-link">$1</a>'
            );
        }

        function normalizeFeature(item) {
            if (typeof item === 'string') return item;
            if (typeof item === 'object' && item !== null) {
                return item.label || item.name || item.value || item.text ||
                       item.description || item.type || item.feature ||
                       JSON.stringify(item);
            }
            return String(item);
        }

        function renderItemValue(item) {
            if (typeof item === 'string') return linkify(item);
            if (typeof item === 'object' && item !== null) {
                const parts = [];
                if (item.label || item.name) parts.push(`<strong>${esc(item.label || item.name)}</strong>`);
                if (item.value) parts.push(linkify(item.value));
                if (item.description) parts.push(`<span style="color:var(--text-secondary)">${linkify(item.description)}</span>`);
                if (parts.length) return parts.join(': ');
                return linkify(normalizeFeature(item));
            }
            return esc(item);
        }

        function renderLink(url, label, extraClass) {
            if (!url || typeof url !== 'string' || !url.startsWith('http')) return '';
            const cls = extraClass ? ` class="${extraClass}"` : ' class="auto-link"';
            return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer"${cls}>${esc(label || url)}</a>`;
        }

        const CARD_ICONS = {
            hero_summary: { icon: 'auto_awesome', bg: 'var(--accent-bg-strong)', color: 'var(--accent)' },
            key_metric: { icon: 'monitoring', bg: 'var(--accent-bg)', color: 'var(--accent)' },
            info_list: { icon: 'list_alt', bg: 'var(--surface-3)', color: 'var(--text-secondary)' },
            fact_check: { icon: 'fact_check', bg: 'var(--yellow-bg)', color: 'var(--yellow)' },
            person_card: { icon: 'person', bg: 'var(--purple-bg)', color: 'var(--purple)' },
            product_card: { icon: 'shopping_bag', bg: 'var(--green-bg)', color: 'var(--green)' },
            timeline_card: { icon: 'timeline', bg: 'var(--accent-bg)', color: 'var(--accent)' },
            quote_card: { icon: 'format_quote', bg: 'var(--purple-bg)', color: 'var(--purple)' },
            comparison_card: { icon: 'compare', bg: 'var(--surface-3)', color: 'var(--text-secondary)' },
            warning_card: { icon: 'warning', bg: 'var(--yellow-bg)', color: 'var(--yellow)' },
            action_card: { icon: 'bolt', bg: 'var(--accent-bg-strong)', color: 'var(--accent)' },
            text_extract: { icon: 'description', bg: 'var(--surface-3)', color: 'var(--text-secondary)' },
            location_card: { icon: 'location_on', bg: 'var(--accent-bg)', color: 'var(--accent)' },
            link_card: { icon: 'link', bg: 'var(--accent-bg)', color: 'var(--accent)' },
            news_card: { icon: 'newspaper', bg: 'var(--red-bg)', color: 'var(--red)' },
            chart_card: { icon: 'bar_chart', bg: 'var(--accent-bg-strong)', color: 'var(--accent)' },
            did_you_know_card: { icon: 'lightbulb', bg: 'var(--yellow-bg)', color: 'var(--yellow)' },
            verification_card: { icon: 'verified', bg: 'var(--accent-bg-strong)', color: 'var(--accent)' },
        };

        const CHART_COLORS = ['#5b8af5', '#4cd68a', '#f0c040', '#f06060', '#a07ef0', '#f09040', '#60d0f0', '#f060a0'];

        function renderFollowUpQuestions(contentAnalysis) {
            const questions = contentAnalysis.followUpQuestions || [];
            const topQ = contentAnalysis.topQuestions || [];

            const allQuestions = [];

            questions.forEach(q => {
                if (typeof q === 'object' && q.question) {
                    allQuestions.push({ question: q.question, answer: q.answer || '' });
                } else if (typeof q === 'string') {
                    allQuestions.push({ question: q, answer: '' });
                }
            });

            topQ.forEach(q => {
                if (!allQuestions.some(aq => aq.question === q)) {
                    allQuestions.push({ question: q, answer: '' });
                }
            });

            if (allQuestions.length === 0) return;

            followUpSection.style.display = '';
            followUpList.innerHTML = '';

            allQuestions.slice(0, 5).forEach((q, i) => {
                const item = document.createElement('div');
                item.className = 'follow-up-item';
                item.innerHTML = `
                    <div class="follow-up-question" data-idx="${i}">
                        <div class="fq-icon"><span class="material-symbols-rounded">add</span></div>
                        <div class="fq-text">${esc(q.question)}</div>
                    </div>
                    <div class="follow-up-answer">
                        <div class="follow-up-answer-text">${q.answer ? linkify(q.answer) : '<span style="color:var(--text-muted);font-style:italic">Tap to expand...</span>'}</div>
                    </div>
                `;

                item.querySelector('.follow-up-question').addEventListener('click', () => {
                    item.classList.toggle('open');
                });

                followUpList.appendChild(item);
            });
        }

        function renderSparkline(data) {
            if (!Array.isArray(data) || data.length < 2) return '';
            const max = Math.max(...data);
            const min = Math.min(...data);
            const range = max - min || 1;
            const w = 100;
            const h = 24;
            const step = w / (data.length - 1);

            const points = data.map((v, i) => {
                const x = i * step;
                const y = h - ((v - min) / range) * (h - 4) - 2;
                return `${x},${y}`;
            }).join(' ');

            const areaPoints = points + ` ${w},${h} 0,${h}`;

            return `<svg class="metric-sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
                <polygon class="sparkline-area" points="${areaPoints}"/>
                <polyline points="${points}"/>
            </svg>`;
        }

        const CONTENT_TYPE_LABELS = {
            breaking_news: 'Breaking News',
            news: 'News',
            product: 'Product',
            social_media: 'Social Media',
            social: 'Social',
            tech: 'Tech',
            sports: 'Sports',
            data: 'Data',
            analytics: 'Analytics',
            general: 'Analysis',
            article: 'Article',
            report_significant_event: 'Breaking News',
            significant_event: 'Breaking News',
            messaging: 'Messaging',
            chat: 'Chat',
            settings: 'Settings',
            finance: 'Finance',
            health: 'Health',
            science: 'Science',
            entertainment: 'Entertainment',
            analyzing: 'Analyzing...',
        };

        function humanizeContentType(ct) {
            if (!ct) return 'Analysis';
            if (CONTENT_TYPE_LABELS[ct]) return CONTENT_TYPE_LABELS[ct];
            return ct.replace(/[_-]/g, ' ').replace(/\b\w/g, l => l.toUpperCase()).substring(0, 20);
        }

        const CARDS_WITHOUT_LABEL = new Set([
            'hero_summary', 'verification_card', 'did_you_know_card', 'news_card', 'chart_card', 'warning_card',
        ]);

        function getCardTypeLabel(cardType) {
            if (CARDS_WITHOUT_LABEL.has(cardType)) return '';
            const info = CARD_ICONS[cardType] || { icon: 'info', bg: 'var(--surface-3)', color: 'var(--text-secondary)' };
            return `<div class="card-type-label">
                <div class="card-type-icon" style="background:${info.bg}">
                    <span class="material-symbols-rounded" style="color:${info.color}">${info.icon}</span>
                </div>
                ${cardType.replace(/_/g, ' ')}
            </div>`;
        }

        // === Image Handling ===

        // Vercel serverless has a 4.5MB body limit. Target 1.5MB binary
        // (~2MB base64) for fast mobile uploads and safe headroom.
        // Claude vision processes at 1568px max anyway — no quality loss.
        const UPLOAD_TARGET_SIZE = 1.5 * 1024 * 1024;

        function loadImageEl(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        async function generateThumbnail(blob, maxWidth = 360) {
            try {
                const url = URL.createObjectURL(blob);
                try {
                    const img = await loadImageEl(url);
                    const scale = Math.min(maxWidth / img.naturalWidth, 1);
                    const w = Math.round(img.naturalWidth * scale);
                    const h = Math.round(img.naturalHeight * scale);
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    return dataUrl.replace(/^data:image\/\w+;base64,/, '');
                } finally {
                    URL.revokeObjectURL(url);
                }
            } catch (e) {
                console.warn('Thumbnail generation failed:', e);
                return null;
            }
        }

        let currentThumbBase64 = null;

        async function compressImage(blob) {
            if (blob.size <= UPLOAD_TARGET_SIZE) return blob;

            const url = URL.createObjectURL(blob);
            try {
                const img = await loadImageEl(url);
                const MAX_DIM = 1568;
                let w = img.naturalWidth, h = img.naturalHeight;
                const s = Math.min(MAX_DIM / w, MAX_DIM / h, 1);
                w = Math.round(w * s);
                h = Math.round(h * s);

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const tryCompress = (tw, th, quality) => {
                    canvas.width = tw;
                    canvas.height = th;
                    ctx.drawImage(img, 0, 0, tw, th);
                    return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
                };

                for (const q of [0.85, 0.7, 0.55, 0.4]) {
                    const result = await tryCompress(w, h, q);
                    if (result && result.size <= UPLOAD_TARGET_SIZE) return result;
                }
                for (const ds of [0.75, 0.5, 0.35]) {
                    const result = await tryCompress(Math.round(w * ds), Math.round(h * ds), 0.7);
                    if (result && result.size <= UPLOAD_TARGET_SIZE) return result;
                }
                return await tryCompress(Math.round(w * 0.3), Math.round(h * 0.3), 0.5);
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        async function readClipboard() {
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    const imageType = item.types.find(t => t.startsWith('image/'));
                    if (imageType) {
                        const blob = await item.getType(imageType);
                        handleImage(blob);
                        return;
                    }
                }
                showError('No image found in clipboard');
            } catch (err) {
                if (err.name === 'NotAllowedError') {
                    showError('Clipboard access denied');
                } else {
                    showError('Could not read clipboard');
                }
            }
        }

        let uploadProgressInterval = null;
        let analysisProgressInterval = null;
        let currentContinuousPct = 0;

        function startAnalysisProgressTick(fromPct) {
            if (analysisProgressInterval) clearInterval(analysisProgressInterval);
            currentContinuousPct = fromPct;
            analysisProgressInterval = setInterval(() => {
                if (currentContinuousPct < 88) {
                    currentContinuousPct += (88 - currentContinuousPct) * 0.02;
                    updateProgress(currentContinuousPct, null, null);
                }
            }, 300);
        }

        function stopAnalysisProgressTick() {
            if (analysisProgressInterval) {
                clearInterval(analysisProgressInterval);
                analysisProgressInterval = null;
            }
        }

        async function handleImage(blob) {
            currentImageUrl = URL.createObjectURL(blob);
            screenshotImg.src = currentImageUrl;
            pasteState.classList.add('hidden');
            mainCanvas.classList.add('active');
            screenshotLayer.className = 'screenshot-layer scanning';
            progressOverlay.classList.add('active');
            progressOverlay.classList.add('uploading');
            progressOverlay.classList.remove('analyzing', 'ready', 'hiding');
            updateProgress(0, 'UPLOADING', 'Compressing...');

            try {
                blob = await compressImage(blob);
            } catch (e) {
                console.warn('Compression failed, using original:', e);
            }

            currentThumbBase64 = await generateThumbnail(blob);

            updateProgress(5, 'UPLOADING', 'Sending screenshot...');

            const reader = new FileReader();
            reader.onloadend = () => {
                currentImageBase64 = reader.result;
                startPipeline(currentImageBase64);
            };
            reader.readAsDataURL(blob);
        }

        // === Telemetry ===
        const telemetry = {
            pipelineStart: null,
            uploadStart: null,
            uploadEnd: null,
            firstEventAt: null,
            eventsReceived: [],
            requestId: null,

            reset() {
                this.pipelineStart = Date.now();
                this.uploadStart = null;
                this.uploadEnd = null;
                this.firstEventAt = null;
                this.eventsReceived = [];
                this.requestId = null;
            },

            markUploadStart() { this.uploadStart = Date.now(); },
            markUploadEnd() { this.uploadEnd = Date.now(); },

            trackEvent(event) {
                const now = Date.now();
                if (!this.firstEventAt) this.firstEventAt = now;
                const elapsed = now - (this.pipelineStart || now);
                this.eventsReceived.push({ event, elapsed });
            },

            _buildPayload(extra = {}) {
                const now = Date.now();
                return {
                    requestId: this.requestId,
                    url: location.href,
                    userAgent: navigator.userAgent,
                    screen: `${screen.width}x${screen.height}`,
                    connection: navigator.connection ? {
                        type: navigator.connection.effectiveType,
                        downlink: navigator.connection.downlink,
                        rtt: navigator.connection.rtt,
                    } : null,
                    totalDuration: this.pipelineStart ? now - this.pipelineStart : null,
                    uploadDuration: (this.uploadStart && this.uploadEnd) ? this.uploadEnd - this.uploadStart : null,
                    firstEventDelay: (this.pipelineStart && this.firstEventAt) ? this.firstEventAt - this.pipelineStart : null,
                    eventsReceived: this.eventsReceived,
                    retries: retryCount,
                    state: {
                        blueprintReceived,
                        pipelineComplete,
                        totalCards,
                        completedCards,
                    },
                    ...extra,
                };
            },

            reportError(message, extra = {}) {
                const payload = { ...this._buildPayload(extra), message, outcome: 'error' };
                fetch('/api/debug/client-error', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportSuccess() {
                const payload = { ...this._buildPayload(), outcome: 'success' };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },

            reportOutcome(outcome, error = null) {
                const payload = { ...this._buildPayload(), outcome, error };
                fetch('/api/debug/client-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                }).catch(() => {});
            },
        };

        // === Pipeline ===
        let blueprintReceived = false;
        let pipelineComplete = false;
        let pipelineTimeout = null;
        let completionTimeout = null;
        let stallTimer = null;
        let lastEventTime = 0;
        let retryCount = 0;
        const MAX_RETRIES = 2;

        function resetStallTimer() {
            lastEventTime = Date.now();
            if (stallTimer) clearTimeout(stallTimer);
            if (pipelineComplete) return;
            stallTimer = setTimeout(() => {
                if (!pipelineComplete && blueprintReceived) {
                    const stallDuration = Date.now() - lastEventTime;
                    telemetry.reportError(`SSE stall detected (${Math.round(stallDuration/1000)}s)`, {
                        type: 'sse_stall',
                        completedCards,
                        totalCards,
                        retryCount,
                    });
                    if (retryCount < MAX_RETRIES && currentImageBase64) {
                        retryCount++;
                        progressLabel.textContent = `Reconnecting (attempt ${retryCount})...`;
                        startPipelineInner(currentImageBase64);
                    } else {
                        showError('Connection to server lost. Please try again.');
                    }
                }
            }, 20000);
        }

        async function startPipeline(imageDataUrl) {
            retryCount = 0;
            await startPipelineInner(imageDataUrl);
        }

        let currentEventSource = null;

        async function startPipelineInner(imageDataUrl) {
            blueprintReceived = false;
            pipelineComplete = false;
            lastEventTime = Date.now();
            telemetry.reset();

            if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
            if (uploadProgressInterval) { clearInterval(uploadProgressInterval); uploadProgressInterval = null; }
            stopAnalysisProgressTick();
            if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }

            try {
                telemetry.markUploadStart();

                const { requestId, status } = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/api/hub/v2/start');
                    xhr.setRequestHeader('Content-Type', 'application/json');

                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const uploadPct = (e.loaded / e.total) * 30;
                            updateProgress(uploadPct, 'UPLOADING', 'Sending screenshot...');
                        }
                    });

                    xhr.addEventListener('load', () => {
                        telemetry.markUploadEnd();
                        if (xhr.status >= 200 && xhr.status < 300) {
                            try {
                                resolve(JSON.parse(xhr.responseText));
                            } catch {
                                reject(new Error('Invalid server response'));
                            }
                        } else {
                            try {
                                const err = JSON.parse(xhr.responseText);
                                reject(new Error(err.error || `Upload failed (HTTP ${xhr.status})`));
                            } catch {
                                reject(new Error(`Upload failed (HTTP ${xhr.status})`));
                            }
                        }
                    });

                    xhr.addEventListener('error', () => {
                        telemetry.markUploadEnd();
                        reject(new Error('Upload failed — network error'));
                    });

                    const payload = { image: imageDataUrl };
                    if (currentThumbBase64) payload.thumb = currentThumbBase64;
                    xhr.send(JSON.stringify(payload));
                });

                telemetry.requestId = requestId;

                progressOverlay.classList.remove('uploading');
                progressOverlay.classList.add('analyzing');
                updateProgress(32, 'ANALYZING', 'Quick analysis starting...');
                startAnalysisProgressTick(32);

                await new Promise((resolve, reject) => {
                    const es = new EventSource(`/api/hub/v2/stream/${requestId}`);
                    currentEventSource = es;

                    pipelineTimeout = setTimeout(() => {
                        if (!blueprintReceived) {
                            es.close();
                            telemetry.reportError('No response from server (30s)', { type: 'timeout_no_skeleton' });
                            reject(new Error('Could not connect to analysis server. Please try again.'));
                        }
                    }, 30000);

                    const events = ['connected', 'progress', 'blueprint', 'layout_preview', 'layout_update', 'card', 'card_update', 'card_add', 'phase', 'complete'];
                    events.forEach(evt => {
                        es.addEventListener(evt, (e) => {
                            try {
                                const data = JSON.parse(e.data);
                                telemetry.trackEvent(evt);
                                handleSSEEvent(evt, data);
                                if (evt !== 'complete') resetStallTimer();
                                if (evt === 'complete') {
                                    es.close();
                                    currentEventSource = null;
                                    telemetry.reportSuccess();
                                    resolve();
                                }
                            } catch {}
                        });
                    });

                    es.addEventListener('error', (e) => {
                        if (es.readyState === EventSource.CLOSED) {
                            if (!pipelineComplete) {
                                reject(new Error(blueprintReceived ? 'Connection lost during analysis' : 'Connection lost before analysis started'));
                            }
                            return;
                        }
                        try {
                            const data = JSON.parse(e.data);
                            telemetry.trackEvent('error');
                            es.close();
                            currentEventSource = null;
                            reject(new Error(data.message || 'Analysis failed'));
                        } catch {
                            es.close();
                            currentEventSource = null;
                            if (!pipelineComplete) {
                                reject(new Error('Connection to server lost'));
                            }
                        }
                    });
                });

            } catch (err) {
                if (retryCount < MAX_RETRIES && currentImageBase64 && !pipelineComplete) {
                    retryCount++;
                    progressLabel.textContent = `Reconnecting (attempt ${retryCount})...`;
                    startPipelineInner(currentImageBase64);
                    return;
                }
                telemetry.reportError(err.message || 'connection failed', { type: 'pipeline_error' });
                telemetry.reportOutcome('error', err.message);
                showError(err.message || 'Connection failed');
            } finally {
                if (pipelineTimeout) { clearTimeout(pipelineTimeout); pipelineTimeout = null; }
                if (completionTimeout) { clearTimeout(completionTimeout); completionTimeout = null; }
            }
        }

        function handleSSEEvent(event, data) {
            switch (event) {
                case 'connected':
                    currentContinuousPct = Math.max(currentContinuousPct, 35);
                    updateProgress(currentContinuousPct, 'ANALYZING', 'Quick analysis starting...');
                    break;

                case 'progress': {
                    const phaseLabels = {
                        classifying: 'ANALYZING',
                        designing: 'DESIGNING',
                        researching: 'RESEARCHING',
                        enhancing: 'ENHANCING',
                        reviewing: 'REVIEWING',
                    };
                    const phaseLabel = phaseLabels[data.phase] || 'ANALYZING';
                    const mappedPct = 30 + Math.min(data.progress, 95) * 0.6;
                    currentContinuousPct = Math.max(currentContinuousPct, mappedPct);
                    updateProgress(currentContinuousPct, phaseLabel, data.message || 'Processing...');
                    if (data.phase === 'enhancing' || data.phase === 'researching' || data.phase === 'reviewing') {
                        layoutProgressFill.style.width = data.progress + '%';
                        layoutProgressText.textContent = data.phase === 'enhancing' ? 'enhancing' : data.phase === 'reviewing' ? 'reviewing' : `${completedCards}/${totalCards}`;
                    }
                    break;
                }

                case 'blueprint':
                    onBlueprintReceived(data);
                    break;

                case 'layout_preview':
                    onLayoutPreview(data);
                    break;

                case 'layout_update':
                    onLayoutUpdate(data);
                    break;

                case 'card':
                    onCardReceived(data);
                    break;

                case 'card_update':
                    onCardUpdated(data);
                    break;

                case 'card_add':
                    onCardAdded(data);
                    break;

                case 'phase':
                    onPhaseChange(data);
                    break;

                case 'complete':
                    onPipelineComplete(data);
                    break;

                case 'error':
                    telemetry.reportError(data.message || 'analysis failed', { type: 'sse_error' });
                    showError(data.message || 'Analysis failed');
                    break;
            }
        }

        let pendingBlueprint = null;
        let firstCardShown = false;
        const populatedCardIds = new Set();

        function onBlueprintReceived(blueprint) {
            blueprintReceived = true;
            if (pipelineTimeout) {
                clearTimeout(pipelineTimeout);
                pipelineTimeout = null;
            }

            if (completionTimeout) clearTimeout(completionTimeout);
            completionTimeout = setTimeout(() => {
                if (!pipelineComplete) {
                    telemetry.reportError('Analysis timed out after skeleton (90s)', {
                        type: 'timeout_post_skeleton',
                        completedCards,
                        totalCards,
                    });
                    showError('Analysis is taking too long. Please try again.');
                }
            }, 90000);

            pendingBlueprint = blueprint;
            totalCards = (blueprint.cards || []).length;
            completedCards = 0;

            const ct = blueprint.contentAnalysis?.contentType || 'analyzing';
            layoutBadge.textContent = humanizeContentType(ct);

            currentContinuousPct = Math.max(currentContinuousPct, 40);
            updateProgress(currentContinuousPct, 'ANALYZING', 'Reading your screenshot...');
            layoutProgressFill.style.width = '10%';
            layoutProgressText.textContent = 'analyzing';
        }

        function onLayoutPreview(blueprint) {
            totalCards = (blueprint.cards || []).length;

            const ct = blueprint.contentAnalysis?.contentType || 'general';
            layoutBadge.textContent = humanizeContentType(ct);

            if (blueprint.contentAnalysis) {
                /* removed: intent line no longer shown in user UI */
                renderFollowUpQuestions(blueprint.contentAnalysis);
            }

            currentContinuousPct = Math.max(currentContinuousPct, 55);
            updateProgress(currentContinuousPct, 'DESIGNING', `${ct} detected — designing layout...`);
            layoutProgressFill.style.width = '15%';
            layoutProgressText.textContent = 'designing';
        }

        const enhanceStatusMessages = [
            'Sonnet analyzing deeper...',
            'Enriching card content...',
            'Searching for more context...',
            'Verifying information...',
            'Cross-referencing sources...',
            'Adding insights...',
            'Compiling research...',
        ];
        let enhanceMsgInterval = null;

        function onLayoutUpdate(blueprint) {
            totalCards = (blueprint.cards || []).length;

            const ct = blueprint.contentAnalysis?.contentType || 'general';
            layoutBadge.textContent = humanizeContentType(ct);

            if (blueprint.contentAnalysis) {
                /* removed: intent line no longer shown in user UI */
                renderFollowUpQuestions(blueprint.contentAnalysis);
            }

            cardGrid.innerHTML = '';

            const populatedCards = (blueprint.cards || []).filter(c =>
                c.populatedData && Object.keys(c.populatedData).length > 0
            );
            const unpopulatedCards = (blueprint.cards || []).filter(c =>
                !c.populatedData || Object.keys(c.populatedData).length === 0
            );

            if (!firstCardShown && populatedCards.length > 0) {
                firstCardShown = true;
                stopAnalysisProgressTick();
                updateProgress(95, 'READY', 'Cards ready');
                progressOverlay.classList.add('hiding');
                setTimeout(() => {
                    progressOverlay.classList.remove('active', 'uploading', 'analyzing', 'ready', 'hiding');
                }, 400);
                screenshotLayer.className = 'screenshot-layer fading';
                setTimeout(() => resultsOverlay.classList.add('visible'), 100);
            }

            const allCards = [...populatedCards, ...unpopulatedCards];
            const populatedCount = populatedCards.length;

            if (populatedCount <= 1) {
                cardGrid.classList.add('single-card');
            } else {
                cardGrid.classList.remove('single-card');
            }

            allCards.forEach((card, index) => {
                const hasData = card.populatedData && Object.keys(card.populatedData).length > 0;
                const el = createCardElement(card);

                if (hasData) {
                    completedCards++;
                    populatedCardIds.add(card.id);
                    el.classList.remove('loading');
                    el.classList.add('populated');
                    el.innerHTML = renderCardContent(card.cardType, card.populatedData);
                    el._cardData = card.populatedData;
                    appendCitations(el, card.populatedData);
                }

                cardGrid.appendChild(el);
                setTimeout(() => {
                    el.classList.add('visible');
                    if (hasData) {
                        el.classList.add('entering');
                    } else {
                        setTimeout(() => el.classList.add('researching'), 200);
                    }
                }, 60 + index * 80);
            });

            if (!firstCardShown && populatedCards.length === 0) {
                stopAnalysisProgressTick();
                updateProgress(90, 'ANALYZING', 'Preparing cards...');
                progressOverlay.classList.add('hiding');
                setTimeout(() => {
                    progressOverlay.classList.remove('active', 'uploading', 'analyzing', 'ready', 'hiding');
                }, 400);
                screenshotLayer.className = 'screenshot-layer fading';
                setTimeout(() => resultsOverlay.classList.add('visible'), 100);
                firstCardShown = true;
            }

            layoutProgressFill.style.width = '25%';
            layoutProgressText.textContent = 'enhancing';

            startEnhanceStatusRotation();
        }

        function startEnhanceStatusRotation() {
            if (enhanceMsgInterval) clearInterval(enhanceMsgInterval);
            let msgIdx = 0;
            enhanceMsgInterval = setInterval(() => {
                const loadingCards = document.querySelectorAll('.card.loading.researching');
                if (loadingCards.length === 0 && pipelineComplete) {
                    clearInterval(enhanceMsgInterval);
                    enhanceMsgInterval = null;
                    return;
                }
                msgIdx = (msgIdx + 1) % enhanceStatusMessages.length;
                loadingCards.forEach(card => {
                    const statusEl = card.querySelector('.skeleton-status');
                    if (statusEl) {
                        statusEl.textContent = enhanceStatusMessages[msgIdx];
                    }
                });
            }, 3000);
        }

        function onCardReceived(data) {
            if (populatedCardIds.has(data.cardId)) {
                return;
            }
            populatedCardIds.add(data.cardId);
            completedCards++;

            if (!firstCardShown) {
                firstCardShown = true;
                stopAnalysisProgressTick();
                updateProgress(95, 'READY', 'Cards ready');
                progressOverlay.classList.add('hiding');
                setTimeout(() => {
                    progressOverlay.classList.remove('active', 'uploading', 'analyzing', 'ready', 'hiding');
                }, 400);
                screenshotLayer.className = 'screenshot-layer fading';
                setTimeout(() => resultsOverlay.classList.add('visible'), 100);
            }

            if (completedCards > 1) {
                cardGrid.classList.remove('single-card');
            }

            const el = document.getElementById(`card-${data.cardId}`);
            if (!el) return;

            el.classList.remove('loading', 'researching');
            el.classList.add('populated', 'just-populated', 'entering');
            el.innerHTML = renderCardContent(data.cardType, data.data);
            el._cardData = data.data;

            appendCitations(el, data.data);

            setTimeout(() => {
                el.classList.remove('just-populated');
            }, 1500);

            const pct = 60 + Math.round((completedCards / totalCards) * 35);
            layoutProgressFill.style.width = pct + '%';
            layoutProgressText.textContent = `${completedCards}/${totalCards}`;
        }

        function onCardUpdated(data) {
            const el = document.getElementById(`card-${data.cardId}`);
            if (!el) return;

            const isNewlyPopulated = !populatedCardIds.has(data.cardId);
            if (isNewlyPopulated) {
                populatedCardIds.add(data.cardId);
                completedCards++;

                if (!firstCardShown) {
                    firstCardShown = true;
                    stopAnalysisProgressTick();
                    updateProgress(95, 'READY', 'Cards ready');
                    progressOverlay.classList.add('hiding');
                    setTimeout(() => {
                        progressOverlay.classList.remove('active', 'uploading', 'analyzing', 'ready', 'hiding');
                    }, 400);
                    screenshotLayer.className = 'screenshot-layer fading';
                    setTimeout(() => resultsOverlay.classList.add('visible'), 100);
                }

                if (completedCards > 1) {
                    cardGrid.classList.remove('single-card');
                }
            }

            const existingData = el._cardData || {};
            const mergedData = { ...existingData, ...data.data };
            el._cardData = mergedData;

            el.classList.remove('loading', 'researching');
            el.classList.add('populated');
            if (isNewlyPopulated) el.classList.add('entering');
            el.innerHTML = renderCardContent(data.cardType, mergedData);

            el.classList.add('card-updating');
            setTimeout(() => el.classList.remove('card-updating'), 800);

            appendCitations(el, mergedData);

            if (isNewlyPopulated) {
                const pct = 60 + Math.round((completedCards / totalCards) * 35);
                layoutProgressFill.style.width = pct + '%';
                layoutProgressText.textContent = `${completedCards}/${totalCards}`;
            }

            const sourceClass = data.source === 'review' ? 'source-sonar' : 'source-sonnet';
            const sourceLabel = data.source === 'review' ? 'researched' : 'enhanced';
            const sourceTag = document.createElement('span');
            sourceTag.className = `card-source-tag ${sourceClass}`;
            sourceTag.textContent = sourceLabel;
            el.appendChild(sourceTag);
            setTimeout(() => sourceTag.remove(), 4000);
        }

        function onCardAdded(data) {
            totalCards++;
            completedCards++;
            const cardId = data.cardId;
            const card = {
                id: cardId,
                cardType: data.cardType,
                gridPosition: data.gridPosition || { row: totalCards, column: 1, columnSpan: 1, rowSpan: 1 },
                placeholderData: data.data,
            };

            cardGrid.classList.remove('single-card');

            const el = createCardElement(card);
            el.classList.remove('loading');
            el.classList.add('populated');
            el.innerHTML = renderCardContent(data.cardType, data.data);
            el._cardData = data.data;

            const sourceClass = data.source === 'review' ? 'source-sonar' : data.source === 'sonnet' ? 'source-sonnet' : 'source-haiku';
            const sourceLabel = data.source === 'review' ? 'research' : data.source === 'sonnet' ? 'enhanced' : 'new';
            const sourceTag = document.createElement('span');
            sourceTag.className = `card-source-tag ${sourceClass}`;
            sourceTag.textContent = sourceLabel;
            el.appendChild(sourceTag);
            setTimeout(() => sourceTag.remove(), 5000);

            cardGrid.appendChild(el);
            setTimeout(() => {
                el.classList.add('visible', 'just-added', 'entering');
                setTimeout(() => el.classList.remove('just-added'), 1500);
            }, 50);

            appendCitations(el, data.data);

            const pct = 60 + Math.round((completedCards / totalCards) * 35);
            layoutProgressFill.style.width = pct + '%';
            layoutProgressText.textContent = `${completedCards}/${totalCards}`;
        }

        function onPhaseChange(data) {
            const phaseMessages = {
                haiku: 'Quick analysis...',
                enhancing: 'Enhancing with Sonnet...',
                reviewing: 'Incorporating research...',
            };
            const msg = phaseMessages[data.phase] || data.message || '';
            if (msg) {
                progressLabel.textContent = msg;
            }
        }

        function appendCitations(el, data) {
            const citations = data?._researchMeta?.citations || data?._webCitations || [];
            if (citations.length > 0) {
                const inner = el.querySelector('.card-inner');
                if (inner) {
                    const citHtml = `<div class="web-citations">
                        <span class="web-citations-label">Sources</span>
                        ${citations.slice(0, 3).map((c, i) => {
                            const url = typeof c === 'string' ? c : (c.url || c.cited_url || '');
                            if (!url) return '';
                            const domain = url.replace(/^https?:\/\//, '').split('/')[0];
                            return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="web-citation-link">${esc(domain)}</a>`;
                        }).join('')}
                    </div>`;
                    inner.insertAdjacentHTML('beforeend', citHtml);
                }
            }
        }

        function onPipelineComplete(data) {
            pipelineComplete = true;
            stopAnalysisProgressTick();
            if (completionTimeout) {
                clearTimeout(completionTimeout);
                completionTimeout = null;
            }
            if (stallTimer) {
                clearTimeout(stallTimer);
                stallTimer = null;
            }
            if (enhanceMsgInterval) {
                clearInterval(enhanceMsgInterval);
                enhanceMsgInterval = null;
            }
            if (uploadProgressInterval) {
                clearInterval(uploadProgressInterval);
                uploadProgressInterval = null;
            }

            screenshotLayer.className = 'screenshot-layer gone';
            progressOverlay.classList.remove('active', 'uploading', 'analyzing', 'ready', 'hiding');
            cardGrid.classList.remove('single-card');

            document.querySelectorAll('.card-source-tag').forEach(t => t.remove());

            layoutProgress.style.display = 'none';

            if (!firstCardShown) {
                firstCardShown = true;
                setTimeout(() => resultsOverlay.classList.add('visible'), 100);
            }

            if (data?.contentAnalysis) {
                const ca = data.contentAnalysis;
                if (ca.additionalQuestions?.length) {
                    ca.followUpQuestions = [
                        ...(ca.followUpQuestions || []),
                        ...ca.additionalQuestions.map(q => ({ question: q })),
                    ];
                }
                renderFollowUpQuestions(ca);
            }

            // Immediately fire-and-forget the rendered card HTML to the server.
            // sendBeacon is guaranteed to deliver even if the user navigates away.
            try {
                const rid = telemetry.requestId;
                if (rid && cardGrid.children.length) {
                    const payload = JSON.stringify({
                        requestId: rid,
                        cardHtml: cardGrid.outerHTML,
                        clientState: {
                            viewport: { width: innerWidth, height: innerHeight, devicePixelRatio: devicePixelRatio || 2 },
                            screen: { width: screen.width, height: screen.height },
                            cards: { total: cardGrid.children.length, populated: cardGrid.querySelectorAll('.card.populated').length },
                            userAgent: navigator.userAgent,
                        },
                    });
                    navigator.sendBeacon('/api/hub/v2/render-capture', new Blob([payload], { type: 'application/json' }));
                }
            } catch (e) { /* sendBeacon is best-effort */ }

            // Also try the full async capture as a bonus (image + inlined DOM snapshot)
