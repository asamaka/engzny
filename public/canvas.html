<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas - thinx.fun</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-100">
    <!-- Upload State -->
    <div class="min-h-screen grid place-items-center p-4" id="uploadState">
        <div class="card bg-base-200 border border-base-300 shadow-xl w-full max-w-xl">
            <div class="card-body">
                <h1 class="card-title text-primary">thinx.fun</h1>
                <p class="text-sm text-base-content/60 mb-2">transform screenshots into explorable canvases</p>

                <div class="border-2 border-dashed border-base-300 rounded-box p-6 text-center cursor-pointer hover:border-primary transition" id="uploadZone">
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                    <div class="space-y-2" id="uploadContent">
                        <p class="text-sm font-medium">drop screenshot or click to upload</p>
                        <p class="text-xs text-base-content/60">png, jpg, webp · max 20mb</p>
                    </div>
                    <img id="uploadPreview" class="hidden max-h-80 mx-auto rounded-box" alt="Preview">
                </div>

                <div class="card-actions justify-end">
                    <button class="btn btn-primary hidden" id="generateBtn">generate canvas →</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div class="min-h-screen grid place-items-center p-4 hidden" id="loadingState">
        <div class="card bg-base-200 border border-base-300 shadow-xl w-full max-w-md">
            <div class="card-body items-center text-center gap-4">
                <img id="loadingPreview" class="max-h-44 rounded-box opacity-70" alt="">
                <span class="loading loading-ring loading-lg text-primary"></span>
                <progress class="progress progress-primary w-full" value="0" max="100" id="progressBar"></progress>
                <p class="text-sm text-base-content/70" id="loadingStatus">analyzing screenshot...</p>
            </div>
        </div>
    </div>

    <!-- Canvas State -->
    <div class="min-h-screen hidden" id="canvasState">
        <iframe id="canvasFrame" class="w-full h-screen border-0 bg-base-100" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>

    <!-- Error State -->
    <div class="min-h-screen grid place-items-center p-4 hidden" id="errorState">
        <div class="alert alert-error max-w-lg">
            <span id="errorMessage">something went wrong</span>
            <button class="btn btn-sm btn-outline btn-error" id="retryBtn">try again</button>
        </div>
    </div>

    <script>
        const states = {
            upload: document.getElementById('uploadState'),
            loading: document.getElementById('loadingState'),
            canvas: document.getElementById('canvasState'),
            error: document.getElementById('errorState'),
        };

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const uploadPreview = document.getElementById('uploadPreview');
        const generateBtn = document.getElementById('generateBtn');
        const loadingPreview = document.getElementById('loadingPreview');
        const progressBar = document.getElementById('progressBar');
        const loadingStatus = document.getElementById('loadingStatus');
        const canvasFrame = document.getElementById('canvasFrame');
        const errorMessage = document.getElementById('errorMessage');
        const retryBtn = document.getElementById('retryBtn');
        const uploadContent = document.getElementById('uploadContent');

        let selectedFile = null;
        let currentJobId = null;
        let htmlBuffer = '';

        function showState(name) {
            Object.entries(states).forEach(([key, el]) => {
                if (key === name) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }

        function checkUrlForJob() {
            const params = new URLSearchParams(window.location.search);
            const jobId = params.get('job');
            if (jobId && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(jobId)) {
                currentJobId = jobId;
                showState('loading');
                loadingStatus.textContent = 'loading canvas...';
                startStream(jobId);
                return true;
            }
            return false;
        }

        function handleFile(file) {
            if (!file.type.startsWith('image/')) return showError('please upload an image file');
            if (file.size > 20 * 1024 * 1024) return showError('file too large (max 20mb)');

            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadPreview.src = e.target.result;
                uploadPreview.classList.remove('hidden');
                uploadContent.classList.add('hidden');
                generateBtn.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function uploadAndGenerate() {
            if (!selectedFile) return;

            loadingPreview.src = uploadPreview.src;
            showState('loading');
            progressBar.value = 5;
            loadingStatus.textContent = 'uploading screenshot...';

            try {
                const formData = new FormData();
                formData.append('image', selectedFile);

                const response = await fetch('/api/generate', { method: 'POST', body: formData });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || data.error || 'upload failed');

                currentJobId = data.jobId;
                window.history.pushState({}, '', `/canvas?job=${data.jobId}`);

                progressBar.value = 10;
                loadingStatus.textContent = 'analyzing screenshot...';
                startStream(data.jobId);
            } catch (err) {
                showError(err.message || 'upload failed');
            }
        }

        function startStream(jobId) {
            htmlBuffer = '';
            let receivedAnyHtml = false;

            const eventSource = new EventSource(`/api/job/${jobId}/canvas`);

            eventSource.addEventListener('status', (e) => {
                const data = JSON.parse(e.data);
                progressBar.value = data.progress || 10;
                loadingStatus.textContent = data.message || 'processing...';
            });

            eventSource.addEventListener('html', (e) => {
                const data = JSON.parse(e.data);
                htmlBuffer += data.chunk;
                receivedAnyHtml = true;
                progressBar.value = Math.min(90, 20 + (htmlBuffer.length / 100));
                loadingStatus.textContent = 'generating interface...';
            });

            eventSource.addEventListener('complete', () => {
                progressBar.value = 100;
                loadingStatus.textContent = 'done!';
                setTimeout(() => {
                    if (htmlBuffer.trim()) renderCanvas(htmlBuffer);
                    else showError('No content generated');
                }, 200);
                eventSource.close();
            });

            eventSource.addEventListener('error', (e) => {
                try {
                    const data = JSON.parse(e.data);
                    showError(data.message || 'generation failed');
                } catch {
                    if (!receivedAnyHtml) showError('connection lost');
                }
                eventSource.close();
            });

            eventSource.onerror = () => {
                if (!receivedAnyHtml) showError('connection lost - please try again');
                eventSource.close();
            };
        }

        function renderCanvas(html) {
            showState('canvas');
            let cleanHtml = html.trim();
            if (cleanHtml.startsWith('```html')) cleanHtml = cleanHtml.slice(7);
            else if (cleanHtml.startsWith('```')) cleanHtml = cleanHtml.slice(3);
            if (cleanHtml.endsWith('```')) cleanHtml = cleanHtml.slice(0, -3);
            cleanHtml = cleanHtml.trim();

            const doc = canvasFrame.contentDocument || canvasFrame.contentWindow.document;
            doc.open();
            doc.write(cleanHtml);
            doc.close();

            canvasFrame.contentWindow.addEventListener('giue:investigate', (e) => {
                console.log('Investigate triggered:', e.detail);
            });
        }

        function showError(message) {
            errorMessage.textContent = message;
            showState('error');
        }

        function reset() {
            selectedFile = null;
            currentJobId = null;
            htmlBuffer = '';
            uploadPreview.src = '';
            uploadPreview.classList.add('hidden');
            uploadContent.classList.remove('hidden');
            generateBtn.classList.add('hidden');
            progressBar.value = 0;
            window.history.pushState({}, '', '/canvas');
            showState('upload');
        }

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('border-primary');
        });

        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('border-primary'));

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('border-primary');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        generateBtn.addEventListener('click', uploadAndGenerate);
        retryBtn.addEventListener('click', reset);

        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    handleFile(item.getAsFile());
                    return;
                }
            }
        });

        if (!checkUrlForJob()) showState('upload');
    </script>
</body>
</html>
