<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>analyzing - thinx.fun</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="/styles/output.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-100">
    <div class="navbar bg-base-200 border-b border-base-300 sticky top-0 z-20">
        <div class="flex-1">
            <a href="/" class="btn btn-ghost btn-sm">← thinx.fun</a>
        </div>
    </div>

    <main class="max-w-2xl mx-auto p-4 pb-12 space-y-4">
        <section class="card bg-base-200 border border-base-300 shadow-sm" id="imageSection">
            <div class="card-body">
                <div class="collapse collapse-arrow bg-base-100 border border-base-300">
                    <input type="checkbox" checked id="imageToggleInput" />
                    <div class="collapse-title text-sm font-medium">image</div>
                    <div class="collapse-content">
                        <div class="rounded-box overflow-hidden bg-base-300 p-2 grid place-items-center">
                            <div class="grid place-items-center py-6 gap-2" id="imagePlaceholder">
                                <span class="loading loading-spinner loading-md text-primary"></span>
                            </div>
                            <img id="uploadedImage" class="hidden max-h-80 rounded-box" alt="uploaded">
                        </div>
                        <div class="mt-2 text-xs text-base-content/60 hidden" id="questionDisplay">
                            <strong>q:</strong> <span id="questionText"></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="card bg-base-200 border border-base-300 shadow-sm" id="progressSection">
            <div class="card-body gap-3">
                <div class="flex justify-between items-center text-sm">
                    <div class="flex items-center gap-2">
                        <span class="badge badge-outline" id="statusText">connecting</span>
                    </div>
                    <span class="text-xs text-base-content/60" id="progressPercent">0%</span>
                </div>
                <progress class="progress progress-primary w-full" id="progressBar" value="0" max="100"></progress>
                <p class="text-xs text-base-content/60" id="progressMessage">connecting to server...</p>
            </div>
        </section>

        <section id="analysisSection" class="hidden">
            <div class="card bg-base-200 border border-base-300 shadow-sm">
                <div class="card-body">
                    <div class="prose prose-invert max-w-none text-sm leading-relaxed" id="analysisContent"></div>
                    <span class="loading loading-dots loading-xs text-primary" id="typingCursor"></span>
                </div>
            </div>

            <div class="flex gap-2 mt-3 opacity-0 transition-opacity" id="actionsSection">
                <button class="btn btn-primary btn-sm" id="copyBtn">copy</button>
                <a href="/" class="btn btn-outline btn-sm">new</a>
                <button class="btn btn-outline btn-sm" id="shareBtn">share</button>
            </div>
        </section>

        <section id="errorSection" class="hidden">
            <div class="alert alert-error">
                <span id="errorMessage">something went wrong</span>
            </div>
            <div class="mt-3">
                <a href="/" class="btn btn-error btn-outline btn-sm">try again</a>
            </div>
        </section>
    </main>

    <script>
        const jobId = window.location.pathname.substring(1);

        const uploadedImage = document.getElementById('uploadedImage');
        const imagePlaceholder = document.getElementById('imagePlaceholder');
        const questionDisplay = document.getElementById('questionDisplay');
        const questionText = document.getElementById('questionText');
        const progressSection = document.getElementById('progressSection');
        const statusText = document.getElementById('statusText');
        const progressPercent = document.getElementById('progressPercent');
        const progressBar = document.getElementById('progressBar');
        const progressMessage = document.getElementById('progressMessage');
        const analysisSection = document.getElementById('analysisSection');
        const analysisContent = document.getElementById('analysisContent');
        const typingCursor = document.getElementById('typingCursor');
        const actionsSection = document.getElementById('actionsSection');
        const errorSection = document.getElementById('errorSection');
        const errorMessageEl = document.getElementById('errorMessage');
        const copyBtn = document.getElementById('copyBtn');
        const shareBtn = document.getElementById('shareBtn');

        let fullText = '';

        const STATUS_NAMES = {
            queued: 'queued',
            compressing: 'optimizing image',
            compressed: 'image ready',
            processing: 'processing',
            waiting_llm: 'waiting for ai',
            streaming: 'analyzing',
            completed: 'done',
            failed: 'failed'
        };

        function init() {
            if (!jobId || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(jobId)) {
                showError('invalid job id');
                return;
            }
            connectToStream();
        }

        function connectToStream() {
            const eventSource = new EventSource(`/api/job/${jobId}/stream`);

            eventSource.addEventListener('connected', () => {
                updateProgress({ status: 'queued', progress: 2, message: 'Connected, loading job...' });
            });

            eventSource.addEventListener('init', (e) => handleInit(JSON.parse(e.data)));
            eventSource.addEventListener('status', (e) => updateProgress(JSON.parse(e.data)));
            eventSource.addEventListener('token', (e) => appendToken(JSON.parse(e.data).text));

            eventSource.addEventListener('complete', (e) => {
                handleComplete(JSON.parse(e.data));
                eventSource.close();
            });

            eventSource.addEventListener('error', (e) => {
                try { showError(JSON.parse(e.data).message); }
                catch { fallbackToPoll(); }
                eventSource.close();
            });

            eventSource.onerror = () => {
                fallbackToPoll();
                eventSource.close();
            };
        }

        function handleInit(data) {
            if (data.imageData && data.mediaType) {
                uploadedImage.src = `data:${data.mediaType};base64,${data.imageData}`;
                uploadedImage.classList.remove('hidden');
                imagePlaceholder.classList.add('hidden');
            }

            if (data.question) {
                questionText.textContent = data.question;
                questionDisplay.classList.remove('hidden');
            }

            updateProgress({
                status: data.status,
                progress: data.progress || 0,
                message: data.progressMessage
            });
        }

        function updateProgress(data) {
            const status = data.status || 'processing';
            const progress = data.progress || 0;
            const message = data.message || data.progressMessage || 'processing...';

            statusText.textContent = STATUS_NAMES[status] || status;
            progressBar.value = progress;
            progressPercent.textContent = `${progress}%`;
            progressMessage.textContent = message.toLowerCase();

            if (status === 'streaming' && analysisSection.classList.contains('hidden')) {
                analysisSection.classList.remove('hidden');
            }
        }

        function appendToken(text) {
            fullText += text;
            analysisContent.innerHTML = marked.parse(fullText);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function handleComplete(data) {
            if (analysisSection.classList.contains('hidden')) analysisSection.classList.remove('hidden');
            if (data.analysis && data.analysis.length > fullText.length) {
                fullText = data.analysis;
                analysisContent.innerHTML = marked.parse(fullText);
            }
            typingCursor.classList.add('hidden');
            progressSection.classList.add('hidden');
            actionsSection.classList.remove('opacity-0');
            document.title = 'done - thinx.fun';
        }

        async function fallbackToPoll() {
            try {
                const response = await fetch(`/api/job/${jobId}/status?includeImage=true`);
                const data = await response.json();
                if (data.error) {
                    showError(data.message || data.error);
                    return;
                }

                if (data.imageData && data.mediaType) {
                    uploadedImage.src = `data:${data.mediaType};base64,${data.imageData}`;
                    uploadedImage.classList.remove('hidden');
                    imagePlaceholder.classList.add('hidden');
                }
                if (data.question) {
                    questionText.textContent = data.question;
                    questionDisplay.classList.remove('hidden');
                }

                updateProgress({ status: data.status, progress: data.progress, message: data.progressMessage });

                if (data.status === 'completed' && data.result) {
                    fullText = data.result.analysis;
                    analysisSection.classList.remove('hidden');
                    analysisContent.innerHTML = marked.parse(fullText);
                    handleComplete(data.result);
                } else if (data.status === 'failed') {
                    showError(data.error || 'analysis failed');
                } else {
                    setTimeout(connectToStream, 2000);
                }
            } catch {
                showError('failed to load. refresh the page.');
            }
        }

        function showError(message) {
            progressSection.classList.add('hidden');
            analysisSection.classList.add('hidden');
            errorSection.classList.remove('hidden');
            errorMessageEl.textContent = message;
        }

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(fullText);
                copyBtn.textContent = 'copied';
                setTimeout(() => { copyBtn.textContent = 'copy'; }, 2000);
            } catch {}
        });

        shareBtn.addEventListener('click', async () => {
            const url = window.location.href;
            if (navigator.share) {
                try { await navigator.share({ title: 'thinx.fun', url }); } catch {}
            } else {
                try {
                    await navigator.clipboard.writeText(url);
                    shareBtn.textContent = 'copied';
                    setTimeout(() => { shareBtn.textContent = 'share'; }, 2000);
                } catch {}
            }
        });

        marked.setOptions({ breaks: true, gfm: true });
        init();
    </script>
</body>
</html>
