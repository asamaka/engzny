<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thinx.fun – Analysis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #14141a;
      --bg-tertiary: #1e1e26;
      --border: rgba(255, 255, 255, 0.1);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-tertiary: rgba(255, 255, 255, 0.5);
      --accent: #0A84FF;
      --accent-hover: #0066CC;
      --success: #30D158;
      --warning: #FFD60A;
      --error: #FF453A;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 500px;
      height: 100vh;
      gap: 0;
    }

    /* Left Panel - Image */
    .image-panel {
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .image-container {
      max-width: 100%;
      max-height: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Right Panel - Chat */
    .chat-panel {
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .chat-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-tertiary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .message-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-tertiary);
    }

    .quick-answer {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.2s ease;
    }

    .quick-answer:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .answer-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .answer-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.125rem;
    }

    .answer-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .answer-content {
      color: var(--text-secondary);
      font-size: 0.9375rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .answer-actions {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.625rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    /* Chat Input */
    .chat-input-container {
      padding: 1.5rem 2rem;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    .input-wrapper {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      color: var(--text-primary);
      font-size: 0.9375rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.1);
    }

    .chat-input::placeholder {
      color: var(--text-tertiary);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .send-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Loading State */
    .loading-message {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error State */
    .error-message {
      background: rgba(255, 69, 58, 0.1);
      border: 1px solid rgba(255, 69, 58, 0.3);
      border-radius: 12px;
      padding: 1.25rem;
      color: var(--error);
    }

    .error-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .error-hint {
      font-size: 0.875rem;
      opacity: 0.8;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
        grid-template-rows: 400px 1fr;
      }

      .image-panel {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }

    /* Scrollbar */
    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left Panel: Image -->
    <div class="image-panel">
      <div class="image-container">
        <img id="analysisImage" alt="Screenshot being analyzed">
      </div>
    </div>

    <!-- Right Panel: Chat -->
    <div class="chat-panel">
      <div class="chat-header">
        <h1 class="chat-title">Analysis</h1>
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span id="statusText">AI Ready</span>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <!-- Messages will be added here dynamically -->
      </div>

      <div class="chat-input-container">
        <div class="input-wrapper">
          <input
            type="text"
            class="chat-input"
            id="chatInput"
            placeholder="Ask a question about this image..."
          >
          <button class="send-btn" id="sendBtn">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 2L9 11M18 2L12 18L9 11M18 2L2 8L9 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Get elements
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const analysisImage = document.getElementById('analysisImage');
    const statusText = document.getElementById('statusText');

    // State
    let currentImageData = null;
    let conversationHistory = [];

    // Parse image from URL
    function loadImageFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const imageData = params.get('image');

      if (imageData) {
        try {
          const decoded = decodeURIComponent(imageData);
          currentImageData = decoded;
          analysisImage.src = decoded;
          performInitialAnalysis();
        } catch (error) {
          showError('Failed to load image', error.message);
        }
      } else {
        showError('No image provided', 'Please provide an image in the URL');
      }
    }

    // Perform initial analysis
    async function performInitialAnalysis() {
      statusText.textContent = 'Analyzing...';
      addMessage('system', 'Analyzing your screenshot...');

      try {
        const response = await fetch('/api/hub/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: currentImageData }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Analysis failed');
        }

        statusText.textContent = 'Ready';
        displayAnalysisResults(data.toolCalls || []);
      } catch (error) {
        statusText.textContent = 'Error';
        showError('Analysis Failed', error.message);
      }
    }

    // Display analysis results as quick answers
    function displayAnalysisResults(toolCalls) {
      // Clear loading message
      chatMessages.innerHTML = '';

      if (!toolCalls || toolCalls.length === 0) {
        addMessage('assistant', 'No analysis results available.');
        return;
      }

      // Process tool calls and create quick answers
      toolCalls.forEach((toolCall, index) => {
        if (toolCall.tool === 'render_hero') {
          addQuickAnswer({
            icon: toolCall.args.icon || '🔍',
            title: toolCall.args.title || 'Overview',
            content: toolCall.args.subtitle || 'Analysis complete',
            category: toolCall.args.badge || 'General',
          });
        } else if (toolCall.tool === 'render_metric') {
          addQuickAnswer({
            icon: '📊',
            title: toolCall.args.label || 'Metric',
            content: `${toolCall.args.value} - ${toolCall.args.subtext || ''}`,
            category: toolCall.args.title || 'Insight',
          });
        } else if (toolCall.tool === 'render_list') {
          const items = toolCall.args.items || [];
          const content = items.map(item => `• ${item.label}: ${item.value}`).join('\n');
          addQuickAnswer({
            icon: '📋',
            title: toolCall.args.title || 'Details',
            content: content,
            category: 'Information',
          });
        }
      });
    }

    // Add a quick answer card
    function addQuickAnswer({ icon, title, content, category }) {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message';

      messageDiv.innerHTML = `
        <div class="message-label">${category}</div>
        <div class="quick-answer">
          <div class="answer-header">
            <div class="answer-icon">${icon}</div>
            <div class="answer-title">${title}</div>
          </div>
          <div class="answer-content">${content}</div>
          <div class="answer-actions">
            <button class="btn btn-primary" onclick="digDeeper('${title.replace(/'/g, "\\'")}')">
              🔎 Dig Deeper
            </button>
            <button class="btn btn-secondary" onclick="askRelated('${title.replace(/'/g, "\\'")}')">
              💬 Ask Related
            </button>
          </div>
        </div>
      `;

      chatMessages.appendChild(messageDiv);
      scrollToBottom();
    }

    // Dig deeper into a specific topic
    async function digDeeper(topic) {
      const question = `Tell me more about: ${topic}`;
      await askQuestion(question);
    }

    // Ask a related question
    function askRelated(topic) {
      chatInput.value = `More about ${topic}`;
      chatInput.focus();
    }

    // Add a message to the chat
    function addMessage(role, content) {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message';

      const label = role === 'user' ? 'You' : role === 'assistant' ? 'AI' : 'System';

      messageDiv.innerHTML = `
        <div class="message-label">${label}</div>
        <div class="${role === 'system' ? 'loading-message' : 'quick-answer'}">
          ${role === 'system' ? `<div class="spinner"></div>` : ''}
          <div class="answer-content">${content}</div>
        </div>
      `;

      chatMessages.appendChild(messageDiv);
      scrollToBottom();
    }

    // Show error
    function showError(title, message) {
      const errorDiv = document.createElement('div');
      errorDiv.className = 'message';

      errorDiv.innerHTML = `
        <div class="message-label">Error</div>
        <div class="error-message">
          <div class="error-title">${title}</div>
          <div class="error-hint">${message}</div>
        </div>
      `;

      chatMessages.appendChild(errorDiv);
      scrollToBottom();
    }

    // Ask a follow-up question
    async function askQuestion(question) {
      if (!question.trim()) return;

      // Add user message
      addMessage('user', question);

      // Add loading message
      const loadingId = Date.now();
      addMessage('system', 'Thinking...');

      statusText.textContent = 'Processing...';

      try {
        const response = await fetch('/api/hub/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: currentImageData,
            question: question,
          }),
        });

        const data = await response.json();

        // Remove loading message
        const messages = chatMessages.querySelectorAll('.message');
        messages[messages.length - 1].remove();

        if (!response.ok) {
          throw new Error(data.message || 'Failed to get response');
        }

        statusText.textContent = 'Ready';

        // Display the response
        if (data.toolCalls && data.toolCalls.length > 0) {
          displayAnalysisResults(data.toolCalls);
        } else {
          addMessage('assistant', 'I analyzed your question but couldn\'t generate a structured response.');
        }
      } catch (error) {
        // Remove loading message
        const messages = chatMessages.querySelectorAll('.message');
        if (messages.length > 0) {
          messages[messages.length - 1].remove();
        }

        statusText.textContent = 'Error';
        showError('Failed to process question', error.message);
      }
    }

    // Scroll to bottom
    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Event listeners
    sendBtn.addEventListener('click', () => {
      const question = chatInput.value.trim();
      if (question) {
        askQuestion(question);
        chatInput.value = '';
      }
    });

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    });

    // Initialize
    loadImageFromUrl();
  </script>
</body>
</html>
