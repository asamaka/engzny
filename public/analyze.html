<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>thinx</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #000000;
      --card-bg: #0a0a0a;
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-tertiary: rgba(255, 255, 255, 0.4);
      --accent: #00ff88;
      --accent-dim: rgba(0, 255, 136, 0.1);
      --error: #ff4444;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 80px; /* Space for chat input */
    }

    /* Image Section */
    .image-section {
      width: 100%;
      max-height: 50vh;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .image-section img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Analysis Results */
    .results-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-text {
      font-size: 12px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .logo {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }

    /* Quick Answer Card */
    .answer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .answer-header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .answer-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .answer-meta {
      flex: 1;
    }

    .answer-category {
      font-size: 10px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .answer-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .answer-content {
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }

    .answer-actions {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-primary:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.05);
    }

    /* Loading State */
    .loading-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error State */
    .error-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: 16px;
      padding: 20px;
    }

    .error-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--error);
      margin-bottom: 8px;
    }

    .error-message {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .error-hint {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    /* Chat Input (Fixed Bottom) */
    .chat-input-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      backdrop-filter: blur(20px);
      z-index: 100;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
    }

    .chat-input::placeholder {
      color: var(--text-tertiary);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      border: none;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .send-btn:active {
      transform: scale(0.9);
    }

    .send-btn:disabled {
      opacity: 0.3;
    }

    /* User Message */
    .user-message {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-left: 20%;
    }

    .user-label {
      font-size: 10px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .user-text {
      font-size: 14px;
      color: var(--text-primary);
    }

    /* Empty State */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-text {
      font-size: 14px;
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>
  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-left">
      <span class="status-dot"></span>
      <span class="status-text" id="statusText">analyzing</span>
    </div>
    <div class="logo">thinx</div>
  </div>

  <!-- Image Section -->
  <div class="image-section">
    <img id="analysisImage" alt="Screenshot">
  </div>

  <!-- Results Container -->
  <div class="results-container" id="resultsContainer">
    <!-- Results will be added here -->
  </div>

  <!-- Chat Input (Fixed Bottom) -->
  <div class="chat-input-container">
    <div class="input-wrapper">
      <input
        type="text"
        class="chat-input"
        id="chatInput"
        placeholder="Ask a question..."
      >
      <button class="send-btn" id="sendBtn">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 2L9 11M18 2L12 18L9 11M18 2L2 8L9 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const resultsContainer = document.getElementById('resultsContainer');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const analysisImage = document.getElementById('analysisImage');
    const statusText = document.getElementById('statusText');

    let currentImageData = null;

    // Load image from sessionStorage or URL (fallback for legacy links)
    function loadImageFromUrl() {
      // Try sessionStorage first (primary method)
      let imageData = sessionStorage.getItem('pendingAnalysisImage');

      // Fallback to URL parameter (for legacy links or direct access)
      if (!imageData) {
        const params = new URLSearchParams(window.location.search);
        imageData = params.get('image');
        if (imageData) {
          try {
            imageData = decodeURIComponent(imageData);
          } catch (error) {
            showError('Failed to decode image', error.message);
            return;
          }
        }
      }

      if (imageData) {
        try {
          currentImageData = imageData;
          analysisImage.src = imageData;
          // Clear sessionStorage after loading to free memory
          sessionStorage.removeItem('pendingAnalysisImage');
          performInitialAnalysis();
        } catch (error) {
          showError('Failed to load image', error.message);
        }
      } else {
        showError('No image provided', 'Please upload an image from the home page');
      }
    }

    // Perform initial analysis
    async function performInitialAnalysis() {
      statusText.textContent = 'analyzing';
      showLoading('Analyzing your screenshot...');

      try {
        const response = await fetch('/api/hub/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: currentImageData }),
        });

        const data = await response.json();

        // Remove loading
        resultsContainer.innerHTML = '';

        if (!response.ok) {
          statusText.textContent = 'error';
          throw new Error(data.hint || data.message || 'Analysis failed');
        }

        statusText.textContent = 'ready';
        displayResults(data.toolCalls || []);
      } catch (error) {
        statusText.textContent = 'error';
        showError('Analysis Failed', error.message);
      }
    }

    // Display analysis results
    function displayResults(toolCalls) {
      if (!toolCalls || toolCalls.length === 0) {
        showEmpty();
        return;
      }

      toolCalls.forEach((toolCall) => {
        if (toolCall.tool === 'render_hero') {
          addAnswerCard({
            icon: toolCall.args.icon || '🔍',
            title: toolCall.args.title || 'Overview',
            content: toolCall.args.subtitle || '',
            category: toolCall.args.badge || 'Analysis',
          });
        } else if (toolCall.tool === 'render_metric') {
          addAnswerCard({
            icon: '📊',
            title: toolCall.args.label || 'Metric',
            content: `${toolCall.args.value}\n${toolCall.args.subtext || ''}`,
            category: toolCall.args.title || 'Insight',
          });
        } else if (toolCall.tool === 'render_list') {
          const items = toolCall.args.items || [];
          const content = items.map(item =>
            `${item.icon || '•'} ${item.label}: ${item.value}`
          ).join('\n');
          addAnswerCard({
            icon: '📋',
            title: toolCall.args.title || 'Details',
            content: content,
            category: 'Information',
          });
        }
      });
    }

    // Add answer card
    function addAnswerCard({ icon, title, content, category }) {
      const card = document.createElement('div');
      card.className = 'answer-card';
      card.innerHTML = `
        <div class="answer-header">
          <div class="answer-icon">${icon}</div>
          <div class="answer-meta">
            <div class="answer-category">${category}</div>
            <div class="answer-title">${title}</div>
          </div>
        </div>
        <div class="answer-content">${content}</div>
        <div class="answer-actions">
          <button class="btn btn-primary" onclick="digDeeper('${title.replace(/'/g, "\\'")}')">
            🔎 Dig Deeper
          </button>
          <button class="btn btn-secondary" onclick="askRelated('${title.replace(/'/g, "\\'")}')">
            💬 Related
          </button>
        </div>
      `;
      resultsContainer.appendChild(card);
    }

    // Show loading
    function showLoading(message) {
      const loading = document.createElement('div');
      loading.className = 'loading-card';
      loading.innerHTML = `
        <div class="spinner"></div>
        <span style="color: var(--text-secondary); font-size: 14px;">${message}</span>
      `;
      resultsContainer.appendChild(loading);
    }

    // Show error
    function showError(title, message) {
      resultsContainer.innerHTML = '';
      const error = document.createElement('div');
      error.className = 'error-card';
      error.innerHTML = `
        <div class="error-title">${title}</div>
        <div class="error-message">${message}</div>
        ${message.includes('API') ? '<div class="error-hint">💡 Add your GEMINI_API_KEY to the .env file</div>' : ''}
      `;
      resultsContainer.appendChild(error);
    }

    // Show empty state
    function showEmpty() {
      resultsContainer.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🤔</div>
          <div class="empty-text">No analysis results available</div>
        </div>
      `;
    }

    // Add user message
    function addUserMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'user-message';
      msg.innerHTML = `
        <div class="user-label">You</div>
        <div class="user-text">${text}</div>
      `;
      resultsContainer.appendChild(msg);
      scrollToBottom();
    }

    // Dig deeper
    async function digDeeper(topic) {
      const question = `Tell me more details about: ${topic}`;
      await askQuestion(question);
    }

    // Ask related
    function askRelated(topic) {
      chatInput.value = `More about ${topic}`;
      chatInput.focus();
    }

    // Ask question
    async function askQuestion(question) {
      if (!question.trim()) return;

      addUserMessage(question);
      statusText.textContent = 'thinking';
      showLoading('Thinking...');

      try {
        const response = await fetch('/api/hub/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: currentImageData,
            question: question,
          }),
        });

        const data = await response.json();

        // Remove loading
        const loadingCards = resultsContainer.querySelectorAll('.loading-card');
        loadingCards[loadingCards.length - 1]?.remove();

        if (!response.ok) {
          statusText.textContent = 'error';
          throw new Error(data.hint || data.message || 'Failed to get response');
        }

        statusText.textContent = 'ready';
        displayResults(data.toolCalls || []);
      } catch (error) {
        const loadingCards = resultsContainer.querySelectorAll('.loading-card');
        loadingCards[loadingCards.length - 1]?.remove();
        statusText.textContent = 'error';
        showError('Failed to process question', error.message);
      }
    }

    // Scroll to bottom
    function scrollToBottom() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // Event listeners
    sendBtn.addEventListener('click', () => {
      const question = chatInput.value.trim();
      if (question) {
        askQuestion(question);
        chatInput.value = '';
      }
    });

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    });

    // Initialize
    loadImageFromUrl();
  </script>
</body>
</html>
