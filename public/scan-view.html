<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>thinx</title>
  <link href="/styles/output.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-100 p-4 grid place-items-center">
  <div class="card bg-base-200 border border-base-300 shadow-xl w-full max-w-sm">
    <div class="card-body p-3">
      <div id="loading" class="grid place-items-center py-8 gap-3">
        <span class="loading loading-spinner loading-lg text-primary"></span>
        <p class="text-sm text-base-content/60">Loading image...</p>
      </div>
      <div id="error" class="alert alert-error hidden">
        <span id="error-msg">Image not found</span>
      </div>
      <div class="relative rounded-box overflow-hidden bg-base-300">
        <img id="image" class="hidden w-full h-auto" alt="Screenshot">
        <div id="overlay" class="hidden absolute inset-0 bg-base-100/40 backdrop-blur-[1px] flex flex-col items-center justify-center gap-3">
          <span class="loading loading-ring loading-lg text-primary"></span>
          <div class="badge badge-primary badge-outline">ANALYZING</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const image = document.getElementById('image');
    const overlay = document.getElementById('overlay');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const errorMsg = document.getElementById('error-msg');

    function showError(msg) {
      loading.classList.add('hidden');
      error.classList.remove('hidden');
      errorMsg.textContent = msg;
    }

    function showImage(dataUrl) {
      image.onload = () => {
        loading.classList.add('hidden');
        image.classList.remove('hidden');
        overlay.classList.remove('hidden');
      };
      image.onerror = () => showError('Invalid image data');
      image.src = dataUrl;
    }

    async function loadImage() {
      const path = window.location.pathname;
      const match = path.match(/\/s\/([a-z0-9]+)/i);

      if (!match) {
        showError('No image code in URL');
        return;
      }

      const code = match[1];

      try {
        const response = await fetch(`/api/scan/${code}`);
        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Failed to load image');
          return;
        }

        showImage(data.dataUrl);
      } catch (e) {
        showError('Failed to fetch image: ' + e.message);
      }
    }

    loadImage();
  </script>
</body>
</html>
