import * as THREE from './three.module.min.js';
/* ============================================================
   SKY TOWER v2 — 3D bird's-eye canyon tower defense.
   Low-poly desert mesa, sunken sand path, red soldier hordes,
   wooden watchtowers, frontier fort. All procedural geometry,
   synthesized audio, vendored three.js — fully self-contained.
   ============================================================ */

// ---------- tiny helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const hyp = (dx, dy) => Math.sqrt(dx * dx + dy * dy);
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
const FONT = '-apple-system,Segoe UI,Roboto,sans-serif';

// ---------- synthesized audio ----------
const SFX = {
  ctx: null, master: null, noiseBuf: null, on: true, last: {},
  init() {
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try {
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      const n = Math.floor(this.ctx.sampleRate * 0.5);
      this.noiseBuf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok(name, gap) {
    if (!this.on || !this.ctx) return false;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const now = performance.now();
    if (this.last[name] && now - this.last[name] < (gap || 35)) return false;
    this.last[name] = now;
    return true;
  },
  tone(type, f0, f1, dur, vol) {
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), gn = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn); gn.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  burst(dur, vol, freq) {
    const c = this.ctx, t = c.currentTime;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const gn = c.createGain();
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(gn); gn.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  },
  arrow()   { if (this.ok('arrow'))   this.tone('triangle', rand(800, 980), 220, 0.09, 0.09); },
  cannon()  { if (this.ok('cannon'))  { this.burst(0.35, 0.45, 320); this.tone('sine', 120, 38, 0.3, 0.4); } },
  chain()   { if (this.ok('chain'))   { this.tone('square', 520, 140, 0.05, 0.1); this.tone('square', 700, 180, 0.08, 0.07); } },
  frost()   { if (this.ok('frost'))   this.tone('sine', 1100, 1900, 0.1, 0.07); },
  rifle()   { if (this.ok('rifle'))   { this.burst(0.13, 0.3, 2200); this.tone('square', 320, 70, 0.12, 0.18); } },
  enemyShot(){ if (this.ok('eshot', 60)) this.tone('square', 380, 120, 0.06, 0.06); },
  coin()    { if (this.ok('coin', 50)) { this.tone('square', 880, 880, 0.05, 0.07); this.tone('square', 1320, 1320, 0.06, 0.06); } },
  build()   { if (this.ok('build'))   { this.burst(0.12, 0.2, 900); this.tone('triangle', 220, 520, 0.16, 0.25); } },
  upgrade() { if (this.ok('up'))      { this.tone('triangle', 420, 940, 0.2, 0.22); this.tone('triangle', 640, 1280, 0.24, 0.15); } },
  sell()    { if (this.ok('sell'))    this.tone('triangle', 600, 200, 0.18, 0.2); },
  die()     { if (this.ok('die', 45)) this.tone('square', 210, 55, 0.14, 0.1); },
  fortHit() { if (this.ok('fhit', 90)) { this.burst(0.18, 0.35, 520); this.tone('sawtooth', 190, 60, 0.24, 0.28); } },
  horn()    { if (this.ok('horn'))    { this.tone('sawtooth', 170, 230, 0.5, 0.22); this.tone('sawtooth', 254, 345, 0.5, 0.12); } },
  boss()    { if (this.ok('boss'))    { this.tone('sawtooth', 90, 60, 0.9, 0.35); this.burst(0.6, 0.25, 200); } },
  over()    { if (this.ok('over'))    this.tone('sawtooth', 280, 45, 1.3, 0.35); },
  win()     { if (this.ok('win'))     { this.tone('triangle', 523, 523, 0.15, 0.2); this.tone('triangle', 659, 659, 0.18, 0.2); } },
};

// ---------- deterministic RNG (stable world layout across loads) ----------
let _rngS = 0x6d2b79f5;
function srnd() { _rngS = (_rngS * 1664525 + 1013904223) >>> 0; return _rngS / 4294967296; }
function srange(a, b) { return a + srnd() * (b - a); }

// ---------- mesa shape: a natural blobby plateau centred on the keep ----------
function plateauRadius(ang) {
  return 21.0 + 2.7 * Math.sin(ang * 3 + 0.6) + 1.6 * Math.sin(ang * 5 - 1.2)
    + 1.1 * Math.sin(ang * 2 + 2.3);
}
function edgeFactor(x, z) {           // <1 inside the mesa, ~1 at the rim
  const r = hyp(x, z);
  return r / plateauRadius(Math.atan2(z, x));
}

// ---------- paths: several natural trails from the rim to the centre keep ----------
function buildPath(pts, r) {
  const raw = [{ x: pts[0][0], z: pts[0][1] }];
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    let v1x = p1[0] - p0[0], v1z = p1[1] - p0[1];
    let v2x = p2[0] - p1[0], v2z = p2[1] - p1[1];
    const l1 = hyp(v1x, v1z), l2 = hyp(v2x, v2z);
    v1x /= l1; v1z /= l1; v2x /= l2; v2z /= l2;
    const rad = Math.min(r, l1 / 2.2, l2 / 2.2);
    const ax = p1[0] - v1x * rad, az = p1[1] - v1z * rad;
    const bx = p1[0] + v2x * rad, bz = p1[1] + v2z * rad;
    raw.push({ x: ax, z: az });
    for (let t = 0.1; t < 1; t += 0.1) {
      const u = 1 - t;
      raw.push({
        x: u * u * ax + 2 * u * t * p1[0] + t * t * bx,
        z: u * u * az + 2 * u * t * p1[1] + t * t * bz
      });
    }
    raw.push({ x: bx, z: bz });
  }
  raw.push({ x: pts[pts.length - 1][0], z: pts[pts.length - 1][1] });
  let len = 0;
  const out = [{ x: raw[0].x, z: raw[0].z, d: 0 }];
  for (let i = 1; i < raw.length; i++) {
    len += hyp(raw[i].x - raw[i - 1].x, raw[i].z - raw[i - 1].z);
    out.push({ x: raw[i].x, z: raw[i].z, d: len });
  }
  return { pts: out, length: len };
}
const NPATHS = 5;
const PATHS = [];
const PATH_ENTRIES = [];
function pathAt(pi, d, hint) {
  const PA = PATHS[pi];
  d = clamp(d, 0, PA.length);
  const P = PA.pts;
  let i = hint && hint.si ? hint.si : 0;
  if (i > P.length - 2) i = P.length - 2;
  while (i < P.length - 2 && P[i + 1].d < d) i++;
  while (i > 0 && P[i].d > d) i--;
  if (hint) hint.si = i;
  const a = P[i], b = P[i + 1];
  const t = (d - a.d) / Math.max(b.d - a.d, 1e-6);
  return { x: lerp(a.x, b.x, t), z: lerp(a.z, b.z, t), a: Math.atan2(b.z - a.z, b.x - a.x) };
}
(function genPaths() {
  for (let k = 0; k < NPATHS; k++) {
    const ang = k / NPATHS * TAU + srange(-0.32, 0.32);
    const startR = plateauRadius(ang) - 1.3;
    const bendSign = srnd() < 0.5 ? -1 : 1;
    const bendMag = srange(0.45, 1.15);
    const steps = 4 + Math.floor(srnd() * 3);   // 4..6 interior bends
    const pts = [[Math.cos(ang) * startR, Math.sin(ang) * startR]];
    for (let i = 1; i <= steps; i++) {
      const t = i / (steps + 1);
      const r = lerp(startR, 5.4, t);
      const a = ang + bendSign * bendMag * Math.sin(t * Math.PI) + srange(-0.16, 0.16) * (1 - t);
      pts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    pts.push([Math.cos(ang) * 4.6, Math.sin(ang) * 4.6]);   // arrive at the keep basin
    PATHS.push(buildPath(pts, 2.3));
    const ep = pathAt(k, 3.2);                              // marker sits a few units in
    PATH_ENTRIES.push({ x: ep.x, z: ep.z, a: ep.a });
  }
})();
function distToPathArr(x, z, P) {
  let best = 1e9;
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i], b = P[i + 1];
    const abx = b.x - a.x, abz = b.z - a.z;
    const t = clamp(((x - a.x) * abx + (z - a.z) * abz) / (abx * abx + abz * abz || 1e-6), 0, 1);
    const dd = hyp(x - (a.x + abx * t), z - (a.z + abz * t));
    if (dd < best) best = dd;
  }
  return best;
}
function distToPath(x, z) {
  let best = 1e9;
  for (let k = 0; k < PATHS.length; k++) {
    const d = distToPathArr(x, z, PATHS[k].pts);
    if (d < best) best = d;
  }
  return best;
}

// ---------- world layout (keep at the centre, slots ringing it) ----------
const FORT = { x: 0, z: 0, hpMax: 25, hp: 25 };
const BASIN = { x: 0, z: 0, r: 5.2 };
const STAND_SLOTS = [];
[[3.4, 8, 0], [4.8, 12, 0.26]].forEach(([r, n, off]) => {
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + off;
    STAND_SLOTS.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, used: false });
  }
});
const PAD_SPOTS = [];
(function genPads() {
  let tries = 0;
  while (PAD_SPOTS.length < 14 && tries++ < 5000) {
    const a = srange(0, TAU), r = srange(6.5, 18.5);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (edgeFactor(x, z) > 0.74) continue;
    const dp = distToPath(x, z);
    if (dp < 2.5 || dp > 5.2) continue;            // beside a trail, within tower range
    if (hyp(x, z) < BASIN.r + 1.8) continue;
    let ok = true;
    for (const p of PAD_SPOTS) if (hyp(p[0] - x, p[1] - z) < 4.0) { ok = false; break; }
    if (ok) PAD_SPOTS.push([+x.toFixed(2), +z.toFixed(2)]);
  }
})();

// ---------- tower / enemy definitions ----------

const ENEMIES = {

// ---------- wave generation ----------
function hpMul(n)   { return 1 + 0.20 * (n - 1) + 0.016 * (n - 1) * (n - 1); }
function spdMul(n)  { return Math.min(1 + 0.006 * (n - 1), 1.32); }
function goldMul(n) { return 1 + 0.03 * n; }
const LANES = [-0.95, -0.33, 0.33, 0.95];
function genWave(n) {
  const q = [];
  let t = 0.5;
  const pushSquad = (type, count, rowGap, pi) => {
    if (pi === undefined) pi = randi(0, NPATHS - 1);
    const cols = ENEMIES[type].squad || 1;
    for (let i = 0; i < count; i++) {
      const row = Math.floor(i / cols), col = i % cols;
      const lat = cols > 1 ? LANES[col + Math.floor((4 - cols) / 2)] : rand(-0.6, 0.6);
      q.push({ t: t + row * rowGap, type, lat, pi });
    }
    t += Math.ceil(count / cols) * rowGap + 1.4;
  };
  if (n % 8 === 0) {
    pushSquad('rifle', 8 + Math.floor(n / 3), 0.5);
    pushSquad('heavy', 2 + Math.floor(n / 8), 1.2);
    const bosses = 1 + Math.floor(n / 24);
    for (let i = 0; i < bosses; i++) { q.push({ t, type: 'boss', lat: 0, pi: randi(0, NPATHS - 1) }); t += 4; }
    pushSquad('medic', Math.max(1, Math.floor(n / 6)), 1.2);
    return q.sort((a, b) => a.t - b.t);
  }
  const unlocked = ['rifle'];
  if (n >= 3) unlocked.push('scout');
  if (n >= 5) unlocked.push('heavy');
  if (n >= 7) unlocked.push('medic');
  if (n >= 9) unlocked.push('commando');
  const costs = { rifle: 1, scout: 1.2, heavy: 4, medic: 3.5, commando: 4.5 };
  let budget = Math.round(8 + n * 3.1 + Math.pow(n, 1.22));
  let guard = 0;
  while (budget > 0.5 && guard++ < 40) {
    const weights = unlocked.map(u =>
      u === 'rifle' ? Math.max(2, 8 - n * 0.25) :
      u === 'scout' ? 4 : u === 'heavy' ? 3 : u === 'medic' ? 2 : 3);
    let r = Math.random() * weights.reduce((a, b) => a + b, 0), type = unlocked[0];
    for (let i = 0; i < unlocked.length; i++) { r -= weights[i]; if (r <= 0) { type = unlocked[i]; break; } }
    const isInf = type === 'rifle' || type === 'scout';
    const groupN = isInf ? randi(6, 10) : randi(1, 2);
    const afford = Math.max(1, Math.min(groupN, Math.floor(budget / costs[type]) || 1));
    pushSquad(type, afford, isInf ? 0.5 : 1.2);
    budget -= afford * costs[type];
  }
  return q.sort((a, b) => a.t - b.t);
}
function startWave() {
  game.wave++;
  game.spawnQueue = genWave(game.wave);
  game.spawnT = 0;
  game.waveActive = true;

  else { banner('WAVE ' + game.wave, null, '#ffd34d'); SFX.horn(); }
}

const cam = new THREE.PerspectiveCamera(40, 1, 1, 220);
// orbit camera: azimuth (rot), elevation (tilt), zoom and pan target are all
// user-controlled. The keep sits at the origin, so the default target is (0,0).
const TILT0 = Math.atan2(1.12, Math.hypot(0.30, 0.84));
const ROT0 = Math.atan2(0.30, 0.84);
const camCtl = { tx: 0, tz: 0, zoom: 1, tilt: TILT0, rot: ROT0 };
function resetCamera() { camCtl.tx = 0; camCtl.tz = 0; camCtl.zoom = 1; camCtl.tilt = TILT0; camCtl.rot = ROT0; }
const _camDir = new THREE.Vector3();
function fitCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  cam.aspect = aspect;
  const vF = cam.fov * Math.PI / 360;
  const hF = Math.atan(Math.tan(vF) * aspect);
  const halfW = 16.5, halfDproj = 22.0;
  const d = Math.max(halfW / Math.tan(hF), halfDproj / Math.tan(vF)) * camCtl.zoom;
  const cosE = Math.cos(camCtl.tilt);
  _camDir.set(Math.sin(camCtl.rot) * cosE, Math.sin(camCtl.tilt), Math.cos(camCtl.rot) * cosE);
  cam.position.copy(_camDir).multiplyScalar(d);
  cam.position.x += camCtl.tx; cam.position.z += camCtl.tz;
  cam.lookAt(camCtl.tx, 0, camCtl.tz);
  cam.updateProjectionMatrix();
}

// sun + sky light
const sun = new THREE.DirectionalLight(0xfff0d8, 2.1);

sun.castShadow = true;

// ---------- terrain heightfield ----------
const PLATEAU = 2.6;
function noise2(x, z) {
  return Math.sin(x * 2.13 + z * 1.71) * 0.5 + Math.sin(x * 0.83 - z * 2.47 + 1.7) * 0.3
    + Math.sin(x * 4.7 + z * 3.9 + 4.2) * 0.2;
}
function groundH(x, z) {
  const dPath = distToPath(x, z);
  const dBasin = hyp(x - BASIN.x, z - BASIN.z);
  const carve = Math.min(smooth((dPath - 1.8) / 1.45), smooth((dBasin - BASIN.r) / 1.5));
  let h = PLATEAU * carve;
  const e = edgeFactor(x, z);
  if (e > 0.86) h = Math.min(h, lerp(h, -7.8, smooth((e - 0.86) / 0.3)));
  if (carve > 0.95 && e < 0.8) h += noise2(x, z) * 0.16;        // plateau bumps
  else if (carve > 0.1 && carve < 0.95) h += noise2(x * 2, z * 2) * 0.12; // cliff facets
  // flatten a ledge under each build pad so pads sit on solid, level ground
  for (const ps of PAD_SPOTS) {
    const dd = hyp(x - ps[0], z - ps[1]);
    if (dd < 2.1) {
      h = lerp(h, PLATEAU + 0.04, smooth((2.1 - dd) / 0.85) * carve);
      break;
    }
  }
  return h;
}
const C_PATH = new THREE.Color('#eed9ac'), C_PATH2 = new THREE.Color('#dfc391');
const C_CLIFF_HI = new THREE.Color('#dd9152'), C_CLIFF_LO = new THREE.Color('#94501f');
const C_TOP = new THREE.Color('#d9b27a'), C_TOP2 = new THREE.Color('#c69a5c');
const C_DEEP = new THREE.Color('#74401d');
function groundColor(x, z, h) {
  const c = new THREE.Color();
  if (h < -2.5) { c.copy(C_DEEP).offsetHSL(0, 0, noise2(x, z) * 0.02); return c; }
  if (h < 0.3) {
    c.copy(C_PATH).lerp(C_PATH2, 0.5 + noise2(x * 3, z * 3) * 0.5);
    return c;
  }
  if (h < PLATEAU - 0.25) {
    const t = h / PLATEAU;
    c.copy(C_CLIFF_LO).lerp(C_CLIFF_HI, t);
    const band = Math.sin(h * 6 + noise2(x, z) * 2) * 0.06;
    c.offsetHSL(0, 0, band);
    return c;
  }
  c.copy(C_TOP).lerp(C_TOP2, 0.5 + noise2(x * 1.7, z * 1.7) * 0.5);
  return c;
}
function buildTerrain() {
  const SX = 156, SZ = 156;        // grid resolution
  const X0 = -27, X1 = 27, Z0 = -27, Z1 = 27;
  const pos = [], col = [], idx = [];
  for (let j = 0; j <= SZ; j++) {
    for (let i = 0; i <= SX; i++) {
      const x = lerp(X0, X1, i / SX), z = lerp(Z0, Z1, j / SZ);
      const h = groundH(x, z);
      pos.push(x, h, z);
      const c = groundColor(x, z, h);
      col.push(c.r, c.g, c.b);
    }
  }
  for (let j = 0; j < SZ; j++) {
    for (let i = 0; i < SX; i++) {
      const a = j * (SX + 1) + i, b = a + 1, c2 = a + SX + 1, d2 = c2 + 1;
      idx.push(a, c2, b, b, c2, d2);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);
  // deep floor far below so edges never show void
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    new THREE.MeshLambertMaterial({ color: 0x6e3b1e })

  floor.geometry.rotateX(-Math.PI / 2);
  floor.position.y = -7.6;
  scene.add(floor);
}

const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(),
      _v = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color();
const corpses = [];
function writeSoldierInstances() {
  let i = 0;
  const all = [];
  for (const e of game.enemies) all.push(e);
  for (const c of corpses) all.push(c);
  for (const e of all) {
    if (i >= MAXSOL) break;
    const def = e.def, z = def.size * 1.35;
    const dead = e.dead;
    const walkSwing = dead ? 0 : Math.sin(e.walk * 2) * (e.moving ? 1 : 0);
    const bob = dead ? 0 : Math.abs(walkSwing) * 0.05 * z;
    const sink = dead ? Math.max(0, (e.t - 2.2) / 0.9) * 0.6 : 0;
    const baseY = e.y + bob - sink;
    const yaw = -e.angle + Math.PI / 2; // model faces +z
    // body
    _e.set(dead ? -Math.PI / 2 : (e.moving ? 0.06 : 0), yaw, dead ? 0 : walkSwing * 0.07, 'YXZ');
    _q.setFromEuler(_e);
    _v.set(e.x, baseY + (dead ? 0.18 : 0.42 * z), e.z);
    _s.set(z, z, z);
    _m4.compose(_v, _q, _s);
    solParts.body.setMatrixAt(i, _m4);
    let bc = def.body;
    if (e.flashT > 0) bc = 0xffffff;
    else if (e.slowT > 0) bc = 0x7fb8d9;
    _c.setHex(bc);
    solParts.body.setColorAt(i, _c);
    // head + helmet
    _v.set(e.x, baseY + (dead ? 0.16 : 0.78 * z), e.z);
    if (dead) { _v.x += Math.cos(e.angle) * 0.35 * z; _v.z += Math.sin(e.angle) * 0.35 * z; }
    _m4.compose(_v, _q, _s);
    solParts.head.setMatrixAt(i, _m4);
    _v.y += dead ? 0.04 : 0.045 * z;
    _m4.compose(_v, _q, _s);
    solParts.helm.setMatrixAt(i, _m4);
    _c.setHex(e.flashT > 0 ? 0xffffff : def.helm);
    solParts.helm.setColorAt(i, _c);
    // gun (held across, pointing forward)
    const gx = Math.cos(e.angle), gz = Math.sin(e.angle);
    _v.set(e.x + gx * 0.18 * z - gz * 0.16 * z, baseY + (dead ? 0.1 : 0.52 * z), e.z + gz * 0.18 * z + gx * 0.16 * z);
    _m4.compose(_v, _q, _s);
    solParts.gun.setMatrixAt(i, _m4);
    // legs (slide back/forth)
    const st = walkSwing * 0.16 * z;
    for (const [part, side, step] of [[solParts.legL, -1, st], [solParts.legR, 1, -st]]) {
      _v.set(
        e.x - gz * side * 0.12 * z + gx * step,
        baseY + (dead ? 0.08 : 0.11 * z),
        e.z + gx * side * 0.12 * z + gz * step

      _e.set(0, yaw, 0); _q.setFromEuler(_e);

      part.setColorAt(i, _c);
    }
    i++;
  }
  for (const k in solParts) {
    solParts[k].count = i;
    solParts[k].instanceMatrix.needsUpdate = true;
    if (solParts[k].instanceColor) solParts[k].instanceColor.needsUpdate = true;
  }
}

  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: SOFT, transparent: true, depthWrite: false, opacity: 0 }));
  sp.visible = false;
  scene.add(sp);
  sprites.push({ sp, t: 0, dur: 0, s0: 1, s1: 1, o0: 1, rise: 0, active: false });
}
function puff(x, y, z, color, s0, s1, dur, opacity, rise) {
  for (const p of sprites) {
    if (p.active) continue;
    p.active = true; p.t = 0; p.dur = dur; p.s0 = s0; p.s1 = s1; p.o0 = opacity; p.rise = rise || 0;
    p.sp.visible = true;
    p.sp.position.set(x, y, z);
    p.sp.material.color.set(color);
    p.sp.material.opacity = opacity;
    p.sp.scale.setScalar(s0);
    return;
  }
}
const debris = [];
for (let i = 0; i < 36; i++) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.14),
    new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }));
  m.visible = false; m.castShadow = true;
  scene.add(m);
  debris.push({ m, vx: 0, vy: 0, vz: 0, t: 0, dur: 0, active: false });
}
function spray(x, y, z, color, n, pow) {
  let c = 0;
  for (const d of debris) {
    if (d.active || c >= n) continue;
    c++;
    d.active = true; d.t = 0; d.dur = rand(0.4, 0.8);
    d.m.visible = true;
    d.m.position.set(x, y, z);
    d.m.material.color.set(color);
    d.m.scale.setScalar(rand(0.5, 1.4));
    d.vx = rand(-pow, pow); d.vz = rand(-pow, pow); d.vy = rand(pow * 0.7, pow * 1.6);
  }
}
const beams = [];
for (let i = 0; i < 50; i++) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1, 4),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
  m.visible = false;
  scene.add(m);
  beams.push({ m, t: 0, dur: 0, active: false });
}
const _up = new THREE.Vector3(0, 1, 0), _dir = new THREE.Vector3();
function beam(x1, y1, z1, x2, y2, z2, color, radius, dur) {
  for (const b of beams) {
    if (b.active) continue;
    b.active = true; b.t = 0; b.dur = dur;
    b.m.visible = true;
    _dir.set(x2 - x1, y2 - y1, z2 - z1);
    const len = _dir.length();
    b.m.scale.set(radius / 0.045, len, radius / 0.045);
    b.m.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    b.m.quaternion.setFromUnitVectors(_up, _dir.normalize());
    b.m.material.color.set(color);
    b.m.material.opacity = 0.95;
    return;
  }
}
const rings = [];
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 26),
    new THREE.MeshBasicMaterial({ color: 0xffc070, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.visible = false;
  scene.add(m);
  rings.push({ m, t: 0, dur: 0, r1: 1, active: false });
}
function shockRing(x, y, z, r1, color, dur) {
  for (const r of rings) {
    if (r.active) continue;
    r.active = true; r.t = 0; r.dur = dur; r.r1 = r1;
    r.m.visible = true;
    r.m.position.set(x, y + 0.07, z);
    r.m.material.color.set(color);
    return;
  }
}
function updateEffects(dt) {
  for (const p of sprites) {
    if (!p.active) continue;
    p.t += dt;
    const k = p.t / p.dur;
    if (k >= 1) { p.active = false; p.sp.visible = false; continue; }
    p.sp.scale.setScalar(lerp(p.s0, p.s1, k));
    p.sp.material.opacity = p.o0 * (1 - k);
    p.sp.position.y += p.rise * dt;
  }
  for (const d of debris) {
    if (!d.active) continue;
    d.t += dt;
    if (d.t >= d.dur) { d.active = false; d.m.visible = false; continue; }
    d.vy -= 22 * dt;
    d.m.position.x += d.vx * dt;
    d.m.position.y += d.vy * dt;
    d.m.position.z += d.vz * dt;
    d.m.rotation.x += dt * 9; d.m.rotation.z += dt * 7;
    if (d.m.position.y < 0.06) { d.m.position.y = 0.06; d.vy *= -0.3; d.vx *= 0.6; d.vz *= 0.6; }
  }
  for (const b of beams) {
    if (!b.active) continue;
    b.t += dt;
    if (b.t >= b.dur) { b.active = false; b.m.visible = false; continue; }
    b.m.material.opacity = 0.95 * (1 - b.t / b.dur);
  }
  for (const r of rings) {
    if (!r.active) continue;
    r.t += dt;
    const k = r.t / r.dur;
    if (k >= 1) { r.active = false; r.m.visible = false; continue; }
    const s = lerp(0.5, r.r1, k);
    r.m.scale.setScalar(s);
    r.m.material.opacity = 0.7 * (1 - k);
  }
}
function explosionFx(x, y, z, r) {
  puff(x, y + 0.4, z, 0xffd890, 0.8, r * 1.4, 0.28, 0.95, 1.5);
  puff(x, y + 0.7, z, 0xff9540, 0.5, r, 0.35, 0.8, 2);
  for (let i = 0; i < 3; i++) puff(x + rand(-1, 1), y + rand(0.3, 1), z + rand(-1, 1), 0x9a8470, 0.7, 2.4, rand(0.7, 1.1), 0.5, 1.2);
  spray(x, y + 0.3, z, 0x6e4426, 8, 6);
  shockRing(x, y, z, r * 1.3, 0xffc070, 0.4);
  game.shake = Math.min(game.shake + 5, 14);
}

function miniFigure(bodyMat) {
  const f = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.2, 7, 6), bodyMat);
  body.scale.set(1, 1.3, 0.85);
  body.position.y = 0.34;
  f.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 7, 6), M.skin);
  head.position.y = 0.62;
  f.add(head);
  const hat = new THREE.Mesh(new THREE.SphereGeometry(0.14, 7, 6), M.blueDark);
  hat.scale.y = 0.7;
  hat.position.y = 0.66;
  f.add(hat);
  f.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return f;
}
function pennant(h) {
  const g2 = new THREE.Group();
  g2.add(cyl(0.025, 0.025, h, M.woodDark, 0, h / 2, 0, 5));
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.3),
    new THREE.MeshLambertMaterial({ color: 0x3e6fd9, side: THREE.DoubleSide }));
  fl.position.set(0.3, h - 0.18, 0);
  g2.add(fl);
  g2.flag = fl;
  return g2;
}
function buildTowerMesh(type, lvl) {
  const G = new THREE.Group();
  const head = new THREE.Group(); // the part that yaws toward the target
  const sc = 1 + (lvl - 1) * 0.09;
  if (type === 'archer') {
    const H = 1.7 * sc;
    for (const [sx, sz] of [[-0.52, -0.52], [0.52, -0.52], [-0.52, 0.52], [0.52, 0.52]]) {
      const leg = cyl(0.09, 0.11, H, M.wood, sx * 0.82, H / 2, sz * 0.82, 6);
      leg.rotation.x = -sz * 0.13; leg.rotation.z = sx * 0.13;
      G.add(leg);
    }
    G.add(box(1.15, 0.07, 0.1, M.woodDark, 0, H * 0.45, -0.62));
    G.add(box(0.1, 0.07, 1.15, M.woodDark, 0.62, H * 0.45, 0));
    G.add(box(1.4, 0.14, 1.4, M.woodLight, 0, H, 0));
    for (const [sx, sz] of [[-0.62, 0], [0.62, 0], [0, -0.62], [0, 0.62]]) {
      G.add(box(sx === 0 ? 1.32 : 0.07, 0.3, sz === 0 ? 1.32 : 0.07, M.wood, sx, H + 0.22, sz));
    }
    const fig = miniFigure(M.blue);
    fig.position.y = H + 0.07;
    head.add(fig);
    const bow = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.025, 5, 10, Math.PI), M.woodDark);
    bow.position.set(0, H + 0.55, 0.25);
    bow.rotation.y = Math.PI / 2;
    head.add(bow);
    const pn = pennant(0.9);
    pn.position.set(-0.62, H + 0.07, -0.62);
    G.add(pn);
    G.pennant = pn;
    G.muzzleY = H + 0.6;
  } else if (type === 'cannon') {
    G.add(cyl(0.95, 1.1, 0.55, M.stoneDark, 0, 0.28, 0, 10));
    G.add(cyl(0.8, 0.95, 0.35, M.stone, 0, 0.72, 0, 10));
    const barrel = cyl(0.15, 0.21, 1.55, M.iron, 0, 0, 0, 8);
    barrel.geometry.translate(0, 0.62, 0);
    barrel.rotation.x = Math.PI / 2 - 0.2;
    barrel.position.set(0, 1.15, 0);
    head.add(barrel);
    head.barrel = barrel;
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.34, 8, 7), M.iron);
    body.position.y = 1.05;
    head.add(body);
    for (const s of [-1, 1]) head.add(box(0.1, 0.4, 0.5, M.woodDark, s * 0.38, 0.95, 0));
    G.muzzleY = 1.35;
  } else if (type === 'frost') {
    const ped = new THREE.Mesh(new THREE.DodecahedronGeometry(0.75, 0), M.stoneDark);
    ped.position.y = 0.35; ped.scale.y = 0.6;
    G.add(ped);
    const cr = new THREE.Mesh(new THREE.OctahedronGeometry(0.52, 0), M.ice);
    cr.position.y = 1.35; cr.scale.y = 1.6;
    G.add(cr);
    G.crystal = cr;
    for (let i = 0; i < 2 + lvl; i++) {
      const a = i / (2 + lvl) * TAU;
      const c2 = new THREE.Mesh(new THREE.OctahedronGeometry(0.16, 0), M.ice);
      c2.position.set(Math.cos(a) * 0.62, 0.72, Math.sin(a) * 0.62);
      c2.scale.y = 1.7;
      G.add(c2);
    }
    G.muzzleY = 1.4;
  } else if (type === 'gunslinger') {
    G.add(cyl(0.16, 0.22, 2.0 * sc, M.wood, 0, sc, 0, 7));
    G.add(cyl(0.62, 0.55, 0.3, M.woodDark, 0, 2.0 * sc, 0, 8));
    G.add(cyl(0.6, 0.6, 0.05, M.woodLight, 0, 2.16 * sc, 0, 8));
    const fig = miniFigure(M.blue);
    fig.position.y = 2.16 * sc;
    head.add(fig);
    const rifle = box(0.05, 0.05, 0.7, M.iron, 0.12, 2.7 * sc, 0.2);
    head.add(rifle);
    G.muzzleY = 2.7 * sc;
  } else { // longrifle
    const H = 2.6 * sc;
    for (const [sx, sz] of [[-0.42, -0.42], [0.42, -0.42], [-0.42, 0.42], [0.42, 0.42]]) {
      const leg = cyl(0.07, 0.1, H, M.wood, sx * 0.85, H / 2, sz * 0.85, 6);
      leg.rotation.x = -sz * 0.1; leg.rotation.z = sx * 0.1;
      G.add(leg);
    }
    G.add(box(1.05, 0.12, 1.05, M.woodLight, 0, H, 0));
    G.add(box(1.15, 0.5, 0.08, M.wood, 0, H + 0.28, -0.5));
    const fig = miniFigure(M.blueDark);
    fig.position.y = H + 0.06;
    head.add(fig);
    const rifle = box(0.05, 0.05, 1.05, M.iron, 0.1, H + 0.55, 0.35);
    head.add(rifle);
    const pn = pennant(0.8);
    pn.position.set(0.5, H + 0.06, 0.5);
    G.add(pn);
    G.pennant = pn;
    G.muzzleY = H + 0.55;
  }
  // level trim
  if (lvl >= 2) {
    const trim = cyl(0.5, 0.5, 0.07, M.gold, 0, 0.12, 0, 10);
    trim.scale.set(2.2, 1, 2.2);
    G.add(trim);
  }
  if (lvl >= 3 && !G.pennant) {
    const pn = pennant(1.1);
    pn.position.set(0.7, 0.1, 0.7);
    G.add(pn);
    G.pennant = pn;
  }
  G.add(head);
  G.head = head;
  G.scale.setScalar(1.45);
  G.muzzleY = (G.muzzleY || 1.5) * 1.45;
  G.muzzleF = { archer: 0.5, cannon: 2.0, frost: 0, gunslinger: 0.95, longrifle: 1.7 }[type];
  G.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return G;
}

function resetGame() {
  game.gold = 110; game.wave = 0; game.kills = 0;
  game.enemies = [];
  for (const t of game.towers) scene.remove(t.mesh);
  game.towers = [];
  for (const s of game.shots) if (s.mesh) scene.remove(s.mesh);
  game.shots = [];
  game.floats = [];
  corpses.length = 0;
  game.pads.forEach(p => p.tower = null);
  game.spawnQueue = []; game.waveActive = false; game.nextWaveT = 11; game.spawnT = 0;
  game.selPad = null; game.selTower = null;
  game.shake = 0; game.overT = 0; game.builtAny = false;
  game.paused = false; game.speed = 1;
  FORT.hp = FORT.hpMax;
  STAND_SLOTS.forEach(s => s.used = false);
  banners = [];
  hideRange();
  resetCamera();
  updateWaveMarker();
  banner('WAVE 1', 'INCOMING — BUILD YOUR DEFENSES', '#ffd34d');
}

function spawnEnemy(type, lat, pi) {
  const def = ENEMIES[type];
  const m = hpMul(game.wave);
  if (pi === undefined) pi = randi(0, NPATHS - 1);
  const start = pathAt(pi, 0);
  lat = lat === undefined ? rand(-0.6, 0.6) : lat;
  const e = {
    type, def, dead: false, pi,
    hp: Math.round(def.hp * m), hpMax: Math.round(def.hp * m),
    speed: def.speed * spdMul(game.wave),
    gold: Math.round(def.gold * goldMul(game.wave)),
    d: 0, si: 0, lat,
    x: start.x - Math.sin(start.a) * lat, y: 0, z: start.z + Math.cos(start.a) * lat,
    angle: start.a, state: 'walk', moving: true,
    walk: rand(0, TAU), flashT: 0, slowT: 0, slowF: 1,
    shotT: rand(0.3, 1), healT: 1.2, slot: -1
  };
  game.enemies.push(e);
  puff(e.x, 0.3, e.z, 0xd9bd8e, 0.5, 1.4, 0.5, 0.6, 0.5);
}
function hitEnemy(e, dmg, opts) {
  opts = opts || {};
  if (e.hp <= 0) return;
  let final = dmg;
  if (!opts.pierce && e.def.armor) final = Math.max(1, dmg - e.def.armor);
  e.hp -= final;
  e.flashT = 0.08;
  if (game.floats.length < 40) {
    game.floats.push({ wx: e.x, wy: e.y + 1.1 * e.def.size, wz: e.z, txt: String(Math.round(final)),
      col: opts.pierce ? '#ffd34d' : '#fff', t: 0, dur: 0.7, vy: 46, size: 15 });
  }
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  game.kills++;
  game.gold += e.gold;
  SFX.die(); SFX.coin();
  if (e.slot >= 0) STAND_SLOTS[e.slot].used = false;
  game.floats.push({ wx: e.x, wy: e.y + 1.2, wz: e.z, txt: '+' + e.gold, col: '#ffd34d', t: 0, dur: 1, vy: 40, size: 17, coin: true });
  spray(e.x, e.y + 0.4, e.z, e.def.body, 4, 3);
  puff(e.x, e.y + 0.3, e.z, 0xc9a070, 0.4, 1.3, 0.45, 0.6, 0.6);
  if (corpses.length < 40) {
    corpses.push({ def: e.def, x: e.x, y: e.y, z: e.z, angle: e.angle, walk: 0, flashT: 0, slowT: 0,
      dead: true, moving: false, t: 0 });
  }
  if (e.def.boss) { game.shake = Math.min(game.shake + 10, 16); explosionFx(e.x, e.y, e.z, 2.5); }
}
function groundAt(x, z) { return Math.max(groundH(x, z), 0); }
function updateEnemy(e, dt) {
  e.flashT = Math.max(0, e.flashT - dt);
  if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowF = 1; }
  const spd = e.speed * e.slowF;
  if (e.state === 'walk') {
    e.walk += dt * spd * 2.1;
    e.moving = true;
    e.d += spd * dt;
    const p = pathAt(e.pi, e.d, e);
    e.x = p.x - Math.sin(p.a) * e.lat;
    e.z = p.z + Math.cos(p.a) * e.lat;
    e.y = 0;
    e.angle += angDiff(e.angle, p.a) * Math.min(1, dt * 10);
    if (e.d >= PATHS[e.pi].length - 0.6) {
      let si = -1, best = 1e9;
      for (let i = 0; i < STAND_SLOTS.length; i++) {
        if (STAND_SLOTS[i].used) continue;
        const dd = hyp(STAND_SLOTS[i].x - e.x, STAND_SLOTS[i].z - e.z);
        if (dd < best) { best = dd; si = i; }
      }
      if (si >= 0) { STAND_SLOTS[si].used = true; e.slot = si; e.tx = STAND_SLOTS[si].x; e.tz = STAND_SLOTS[si].z; }
      else { e.tx = BASIN.x + rand(-4, 4); e.tz = BASIN.z - rand(2.4, 5); }
      e.state = 'deploy';
    }
    return;
  }
  if (e.state === 'deploy') {
    e.walk += dt * spd * 2.1;
    e.moving = true;
    const dx = e.tx - e.x, dz = e.tz - e.z, dd = hyp(dx, dz);
    e.angle += angDiff(e.angle, Math.atan2(dz, dx)) * Math.min(1, dt * 10);
    if (dd < 0.2) { e.state = 'attack'; e.moving = false; }
    else { e.x += dx / dd * spd * dt; e.z += dz / dd * spd * dt; }
    return;
  }
  // attack the fort
  e.moving = false;
  e.angle += angDiff(e.angle, Math.atan2(FORT.z - e.z, FORT.x - e.x)) * Math.min(1, dt * 8);
  e.shotT -= dt;
  if (e.shotT <= 0) {
    e.shotT = e.def.atkRate * rand(0.85, 1.15);
    FORT.hp -= e.def.dmg;
    SFX.enemyShot(); SFX.fortHit();
    game.shake = Math.min(game.shake + 1.5, 10);
    const fy = groundH(FORT.x, FORT.z);
    puff(e.x + Math.cos(e.angle) * 0.5, e.y + 0.55 * e.def.size, e.z + Math.sin(e.angle) * 0.5, 0xffe27a, 0.25, 0.6, 0.1, 0.95, 0);
    beam(e.x, e.y + 0.55 * e.def.size, e.z, FORT.x + rand(-1, 1), fy + rand(1, 2.4), FORT.z + rand(-0.8, 0.2), 0xffd9a0, 0.03, 0.09);
    puff(FORT.x + rand(-1, 1), fy + rand(0.8, 2.2), FORT.z - 1, 0xffb84d, 0.2, 0.7, 0.25, 0.9, 0.6);
    if (navigator.vibrate) try { navigator.vibrate(25); } catch (err) {}
    if (FORT.hp <= 0) { FORT.hp = 0; gameOver(); }
  }
}
function healPulse(e, dt) {
  e.healT -= dt;
  if (e.healT > 0) return;
  e.healT = 1.5;
  let target = null, worst = 1;
  for (const o of game.enemies) {
    if (o === e || o.hp <= 0) continue;
    if (hyp(o.x - e.x, o.z - e.z) > 5.1) continue;
    const frac = o.hp / o.hpMax;
    if (frac < worst) { worst = frac; target = o; }
  }
  if (target && worst < 1) {
    const amt = Math.round(target.hpMax * 0.05) + 4;
    target.hp = Math.min(target.hpMax, target.hp + amt);
    puff(target.x, target.y + 1, target.z, 0x6ee06e, 0.3, 1.1, 0.5, 0.85, 1.2);
  }
}

// ---- towers ----
function buildTower(pad, type) {
  const def = TOWERS[type];
  if (game.gold < def.cost) return false;
  game.gold -= def.cost;
  const mesh = buildTowerMesh(type, 1);
  mesh.position.set(pad.x, pad.y + 0.2, pad.z);
  scene.add(mesh);
  const t = { type, def, lvl: 1, x: pad.x, y: pad.y + 0.2, z: pad.z, aim: Math.PI / 2,
    cd: 0.3, fireT: 0, invested: def.cost, pad, target: null, mesh };
  pad.tower = t;
  game.towers.push(t);
  game.builtAny = true;
  SFX.build();
  puff(pad.x, pad.y + 0.5, pad.z, 0xd9bd8e, 0.8, 2.6, 0.5, 0.8, 1);
  spray(pad.x, pad.y + 0.4, pad.z, 0xb09a72, 7, 4);
  shockRing(pad.x, pad.y, pad.z, 2.2, 0xffffff, 0.4);
  return true;
}
function upgradeTower(t) {
  if (t.lvl >= 3) return;
  const cost = t.def.up[t.lvl - 1];
  if (game.gold < cost) return;
  game.gold -= cost;
  t.invested += cost;
  t.lvl++;
  scene.remove(t.mesh);
  t.mesh = buildTowerMesh(t.type, t.lvl);
  t.mesh.position.set(t.x, t.y, t.z);
  scene.add(t.mesh);
  SFX.upgrade();
  shockRing(t.x, t.y, t.z, 2.6, 0xffd34d, 0.5);
  puff(t.x, t.y + 1.2, t.z, 0xffd34d, 0.5, 2, 0.5, 0.9, 1.6);
}
function sellTower(t) {
  const refund = Math.round(t.invested * 0.7);
  game.gold += refund;
  t.pad.tower = null;
  scene.remove(t.mesh);
  game.towers = game.towers.filter(x => x !== t);
  game.selTower = null;
  hideRange();
  SFX.sell();
  game.floats.push({ wx: t.x, wy: t.y + 1.5, wz: t.z, txt: '+' + refund, col: '#ffd34d', t: 0, dur: 1, vy: 40, size: 17, coin: true });
  puff(t.x, t.y + 0.8, t.z, 0xb09a72, 1, 2.6, 0.45, 0.7, 0.8);
}
function towerStats(t) { return t.def.lv[t.lvl - 1]; }
function acquireTarget(t, st) {
  let best = null, bestScore = -Infinity;
  for (const e of game.enemies) {
    if (e.hp <= 0) continue;
    if (hyp(e.x - t.x, e.z - t.z) > st.range) continue;
    // default priority: closest to the keep (smallest distance to centre)
    const score = t.def.targetStrong ? e.hp : -hyp(e.x, e.z);
    if (score > bestScore) { bestScore = score; best = e; }
  }
  return best;
}
function updateTower(t, dt) {
  const st = towerStats(t);
  t.fireT = Math.max(0, t.fireT - dt);
  t.cd -= dt;
  if (!t.target || t.target.hp <= 0 || hyp(t.target.x - t.x, t.target.z - t.z) > st.range + 0.5) {
    t.target = acquireTarget(t, st);
  }
  const e = t.target;
  // idle animations
  if (t.mesh.crystal) { t.mesh.crystal.rotation.y += dt * 1.2; t.mesh.crystal.position.y = 1.35 + Math.sin(game.time * 2.4) * 0.07; }
  if (t.mesh.pennant) t.mesh.pennant.flag.rotation.y = Math.sin(game.time * 5 + t.x) * 0.3;
  if (!e) return;
  const want = Math.atan2(e.z - t.z, e.x - t.x);
  t.aim += angDiff(t.aim, want) * Math.min(1, dt * 9);
  t.mesh.head.rotation.y = -t.aim + Math.PI / 2; // model faces +z
  if (t.cd > 0) return;
  const aimed = Math.abs(angDiff(t.aim, want)) < 0.35;
  const my = t.y + (t.mesh.muzzleY || 1.5);
  const mF = t.mesh.muzzleF || 0.5;
  const mx = t.x + Math.cos(t.aim) * mF, mz = t.z + Math.sin(t.aim) * mF;
  if (t.type === 'archer') {
    if (!aimed) return;
    t.cd = st.rate;
    fireArrow(mx, my, mz, e, st.dmg);
    SFX.arrow();
  } else if (t.type === 'cannon') {
    if (!aimed) return;
    t.cd = st.rate;
    let tx = e.x, tz = e.z;
    if (e.state === 'walk') {
      const eta = hyp(e.x - t.x, e.z - t.z) / 11;
      const p = pathAt(e.pi, e.d + e.speed * e.slowF * eta, { si: e.si });
      tx = p.x - Math.sin(p.a) * e.lat; tz = p.z + Math.cos(p.a) * e.lat;
    }
    fireBall(mx, my, mz, tx, tz, st.dmg, st.splash);
    puff(mx, my + 0.3, mz, 0xffe27a, 0.4, 1, 0.12, 1, 0);
    puff(mx + Math.cos(t.aim) * 0.3, my + 0.3, mz + Math.sin(t.aim) * 0.3, 0xbbb0a4, 0.4, 1.5, 0.5, 0.6, 0.8);
    SFX.cannon();
    game.shake = Math.min(game.shake + 1.5, 8);
  } else if (t.type === 'frost') {
    t.cd = st.rate;
    fireShard(t.x, my, t.z, e, st.dmg, st.slow, st.slowT);
    SFX.frost();
  } else if (t.type === 'gunslinger') {
    if (!aimed) return;
    t.cd = st.rate;
    let cur = e;
    const hitList = [cur];
    let px = mx, py = my, pz = mz, dmg = st.dmg;
    for (let c = 0; c < st.chain; c++) {
      if (!cur) break;
      const ey = cur.y + 0.5 * cur.def.size;
      // jagged tracer
      const segs = 3;
      let lx = px, ly = py, lz = pz;
      for (let s2 = 1; s2 <= segs; s2++) {
        const tt = s2 / segs;
        const nx = lerp(px, cur.x, tt) + (s2 < segs ? rand(-0.3, 0.3) : 0);
        const ny = lerp(py, ey, tt) + (s2 < segs ? rand(-0.2, 0.2) : 0);
        const nz = lerp(pz, cur.z, tt) + (s2 < segs ? rand(-0.3, 0.3) : 0);
        beam(lx, ly, lz, nx, ny, nz, 0xfff3b8, 0.05, 0.13);
        lx = nx; ly = ny; lz = nz;
      }
      hitEnemy(cur, dmg, {});
      puff(cur.x, ey, cur.z, 0xfff3b8, 0.25, 0.7, 0.15, 0.95, 0);
      px = cur.x; py = ey; pz = cur.z;
      dmg = Math.max(2, Math.round(dmg * 0.72));
      let nxt = null, bd = 6;
      for (const o of game.enemies) {
        if (o.hp <= 0 || hitList.includes(o)) continue;
        const dd = hyp(o.x - cur.x, o.z - cur.z);
        if (dd < bd) { bd = dd; nxt = o; }
      }
      cur = nxt;
      if (cur) hitList.push(cur);
    }
    SFX.chain();
  } else { // longrifle
    if (!aimed) return;
    t.cd = st.rate;
    const ey = e.y + 0.5 * e.def.size;
    beam(mx, my, mz, e.x, ey, e.z, 0xffffff, 0.04, 0.12);
    puff(mx, my, mz, 0xffe27a, 0.3, 0.8, 0.1, 1, 0);
    hitEnemy(e, st.dmg, { pierce: true });
    spray(e.x, ey, e.z, 0xffd34d, 3, 3);
    SFX.rifle();
    game.shake = Math.min(game.shake + 0.8, 6);
  }
}

// ---- projectiles ----
const arrowGeoShaft = new THREE.CylinderGeometry(0.022, 0.022, 0.5, 4);
arrowGeoShaft.rotateX(Math.PI / 2);
const arrowGeoHead = new THREE.ConeGeometry(0.05, 0.14, 4);
arrowGeoHead.rotateX(Math.PI / 2);
arrowGeoHead.translate(0, 0, 0.3);
function fireArrow(x, y, z, target, dmg) {
  const m = new THREE.Group();
  m.add(new THREE.Mesh(arrowGeoShaft, M.woodDark));
  m.add(new THREE.Mesh(arrowGeoHead, M.iron));
  scene.add(m);
  game.shots.push({ kind: 'arrow', x, y, z, x0: x, y0: y, z0: z, target, t: 0,
    T: hyp(target.x - x, target.z - z) / 16 + 0.12, dmg, mesh: m });
}
const ballGeo = new THREE.SphereGeometry(0.17, 7, 6);
function fireBall(x, y, z, tx, tz, dmg, splash) {
  const m = new THREE.Mesh(ballGeo, M.iron);
  m.castShadow = true;
  scene.add(m);
  game.shots.push({ kind: 'ball', x0: x, y0: y, z0: z, tx, tz, t: 0,
    T: hyp(tx - x, tz - z) / 11 + 0.15, dmg, splash, mesh: m });
}
const shardGeo = new THREE.OctahedronGeometry(0.14, 0);
shardGeo.scale(1, 1.8, 1);
shardGeo.rotateX(Math.PI / 2);
function fireShard(x, y, z, target, dmg, slow, slowT) {
  const m = new THREE.Mesh(shardGeo, M.ice);
  scene.add(m);
  game.shots.push({ kind: 'shard', x, y, z, target, speed: 17, dmg, slow, slowT, mesh: m,
    tx: target.x, ty: target.y + 0.4, tz: target.z });
}
function updateShot(s, dt) {
  if (s.kind === 'arrow' || s.kind === 'ball') {
    s.t += dt;
    const k = clamp(s.t / s.T, 0, 1);
    let tx, ty, tz;
    if (s.kind === 'arrow') {
      const e = s.target;
      if (e && e.hp > 0) { s.tx = e.x; s.ty = e.y + 0.45 * e.def.size; s.tz = e.z; }
      tx = s.tx; ty = s.ty; tz = s.tz;
    } else { tx = s.tx; ty = 0.3; tz = s.tz; }
    const arc = (s.kind === 'arrow' ? 1.1 : 2.4) * Math.sin(Math.PI * k);
    const nx = lerp(s.x0, tx, k), ny = lerp(s.y0, ty, k) + arc, nz = lerp(s.z0, tz, k);
    s.mesh.lookAt(nx + (nx - s.mesh.position.x), ny + (ny - s.mesh.position.y), nz + (nz - s.mesh.position.z));
    s.mesh.position.set(nx, ny, nz);
    if (s.kind === 'ball') { s.mesh.rotation.x += dt * 9; }
    if (k >= 1) {
      if (s.kind === 'arrow') {
        if (s.target && s.target.hp > 0) hitEnemy(s.target, s.dmg, {});
      } else {
        explosionFx(tx, 0.1, tz, s.splash);
        SFX.cannon();
        for (const e of game.enemies) {
          if (e.hp <= 0) continue;
          const r = hyp(e.x - tx, e.z - tz);
          if (r <= s.splash) hitEnemy(e, Math.round(s.dmg * (r < s.splash * 0.45 ? 1 : 0.55)), { pierce: true });
        }
      }
      scene.remove(s.mesh);
      return true;
    }
    return false;
  }
  if (s.kind === 'shard') {
    const e = s.target;
    if (e && e.hp > 0) { s.tx = e.x; s.ty = e.y + 0.4 * e.def.size; s.tz = e.z; }
    const dx = s.tx - s.x, dy = s.ty - s.y, dz = s.tz - s.z;
    const dd = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const step = s.speed * dt;
    if (dd <= step + 0.25) {
      if (e && e.hp > 0) {
        hitEnemy(e, s.dmg, {});
        e.slowF = Math.min(e.slowF, s.slow);
        e.slowT = Math.max(e.slowT, s.slowT * (e.def.boss ? 0.45 : 1));
        puff(s.tx, s.ty, s.tz, 0xbfeaff, 0.3, 0.9, 0.3, 0.9, 0.5);
      }
      scene.remove(s.mesh);
      return true;
    }
    s.x += dx / dd * step; s.y += dy / dd * step; s.z += dz / dd * step;
    s.mesh.position.set(s.x, s.y, s.z);
    s.mesh.lookAt(s.tx, s.ty, s.tz);
    return false;
  }
  return true;
}

function gameOver() {
  if (game.state !== 'playing') return;
  game.state = 'over';
  game.overT = 0;
  SFX.over();
  const fy = groundH(FORT.x, FORT.z);
  explosionFx(FORT.x, fy + 1, FORT.z, 3);
  explosionFx(FORT.x - 1.4, fy + 2, FORT.z + 0.5, 2);
  explosionFx(FORT.x + 1.4, fy + 0.5, FORT.z - 0.5, 2);
  game.shake = 16;
  if (game.wave > game.best) {
    game.best = game.wave;
    try { localStorage.setItem('skytower_best', String(game.best)); } catch (e) {}
  }
}

// ---- master update ----
function update(dt) {
  game.time += dt;
  if (game.state !== 'playing' && game.state !== 'over') return;
  if (game.paused) return;
  if (game.state === 'over') game.overT += dt;

  if (game.state === 'playing') {
    if (game.waveActive) {
      game.spawnT += dt;
      while (game.spawnQueue.length && game.spawnQueue[0].t <= game.spawnT) {
        const s = game.spawnQueue.shift();
        spawnEnemy(s.type, s.lat, s.pi);
      }
      if (!game.spawnQueue.length && !game.enemies.length) {
        game.waveActive = false;
        game.nextWaveT = 10;
        const bonus = 18 + game.wave * 3;
        game.gold += bonus;
        SFX.win();
        game.floats.push({ sx: 0.5, sy: 0.4, txt: 'WAVE CLEAR  +' + bonus, col: '#ffd34d', t: 0, dur: 1.6, vy: 26, size: 26, coin: true });
      }
    } else {
      game.nextWaveT -= dt;
      if (game.nextWaveT <= 0) startWave();
    }
    for (const e of game.enemies) {
      updateEnemy(e, dt);
      if (e.def.healer && e.hp > 0) healPulse(e, dt);
    }
    game.enemies = game.enemies.filter(e => e.hp > 0);
    for (const t of game.towers) updateTower(t, dt);
  }
  game.shots = game.shots.filter(s => !updateShot(s, dt));
  for (const c of corpses) { c.t += dt; c.flashT = 0; }
  for (let i = corpses.length - 1; i >= 0; i--) if (corpses[i].t > 3) corpses.splice(i, 1);
  for (const f of game.floats) f.t += dt;
  game.floats = game.floats.filter(f => f.t < f.dur);

  if (FORT.hp / FORT.hpMax < 0.45 && Math.random() < 0.2) {
    const fy = groundH(FORT.x, FORT.z);
    puff(FORT.x + rand(-1.2, 1.2), fy + rand(1.5, 3.4), FORT.z + rand(-0.8, 0.8), 0x4a4540, 0.5, 1.6, rand(0.8, 1.3), 0.55, 1.4);
  }
  game.shake = Math.max(0, game.shake - dt * 22);
}

const _pv = new THREE.Vector3();
function project(x, y, z) {

  return { x: (_pv.x * 0.5 + 0.5) * CW, y: (-_pv.y * 0.5 + 0.5) * CH, vis: _pv.z < 1 };

function addBtn(x, y, w, h, id, data) { btns.push({ x, y, w, h, id, data }); }
function coinIcon(x, y, s) {
  g.fillStyle = '#b8842a'; g.beginPath(); g.arc(x, y, s, 0, TAU); g.fill();
  g.fillStyle = '#ffd34d'; g.beginPath(); g.arc(x, y, s * 0.8, 0, TAU); g.fill();

}
function towerIcon(kind, x, y, s) {
  g.save();
  g.translate(x, y);
  g.lineCap = 'round';
  if (kind === 'bow') {
    g.strokeStyle = '#c8945c'; g.lineWidth = s * 0.16;
    g.beginPath(); g.arc(0, 0, s, -Math.PI / 2.4, Math.PI / 2.4); g.stroke();
    g.strokeStyle = '#eee'; g.lineWidth = s * 0.07;
    const ax = s * Math.cos(Math.PI / 2.4), ay = s * Math.sin(Math.PI / 2.4);
    g.beginPath(); g.moveTo(ax, -ay); g.lineTo(ax, ay); g.stroke();
    g.strokeStyle = '#9adcf7'; g.lineWidth = s * 0.12;
    g.beginPath(); g.moveTo(ax * 0.9, 0); g.lineTo(-s * 1.1, 0); g.stroke();
    g.fillStyle = '#9adcf7';
    g.beginPath(); g.moveTo(-s * 1.35, 0); g.lineTo(-s * 0.95, -s * 0.22); g.lineTo(-s * 0.95, s * 0.22); g.closePath(); g.fill();
  } else if (kind === 'bomb') {
    g.fillStyle = '#33343a'; g.beginPath(); g.arc(0, s * 0.15, s * 0.85, 0, TAU); g.fill();
    g.strokeStyle = '#33343a'; g.lineWidth = s * 0.18;
    g.beginPath(); g.moveTo(s * 0.3, -s * 0.5); g.quadraticCurveTo(s * 0.7, -s * 0.9, s * 0.5, -s * 1.2); g.stroke();
    g.fillStyle = '#ffb84d';
    g.beginPath(); g.arc(s * 0.5, -s * 1.25, s * 0.22, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.25)';
    g.beginPath(); g.arc(-s * 0.3, -s * 0.1, s * 0.3, 0, TAU); g.fill();
  } else if (kind === 'snow') {
    g.strokeStyle = '#9adcf7'; g.lineWidth = s * 0.16;
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI / 3;
      g.beginPath();
      g.moveTo(-Math.cos(a) * s, -Math.sin(a) * s);
      g.lineTo(Math.cos(a) * s, Math.sin(a) * s);
      g.stroke();
      for (const e2 of [-0.55, 0.55]) {
        for (const sgn of [1, -1]) {
          g.beginPath();
          g.moveTo(Math.cos(a) * s * e2, Math.sin(a) * s * e2);
          g.lineTo(Math.cos(a + sgn * 0.5) * s * (Math.abs(e2) + 0.3) * Math.sign(e2), Math.sin(a + sgn * 0.5) * s * (Math.abs(e2) + 0.3) * Math.sign(e2));
          g.stroke();
        }
      }
    }
  } else if (kind === 'chain') {
    g.strokeStyle = '#ffd34d'; g.lineWidth = s * 0.18;
    g.beginPath();
    g.moveTo(-s, s * 0.7);
    g.lineTo(-s * 0.3, -s * 0.2); g.lineTo(s * 0.15, s * 0.25); g.lineTo(s * 0.9, -s * 0.8);
    g.stroke();
    g.fillStyle = '#fff';
    for (const [px, py] of [[-s, s * 0.7], [s * 0.15, s * 0.25], [s * 0.9, -s * 0.8]]) {
      g.beginPath(); g.arc(px, py, s * 0.16, 0, TAU); g.fill();
    }
  } else { // scope
    g.strokeStyle = '#eee'; g.lineWidth = s * 0.14;
    g.beginPath(); g.arc(0, 0, s * 0.8, 0, TAU); g.stroke();
    g.beginPath(); g.moveTo(0, -s * 1.15); g.lineTo(0, -s * 0.45); g.stroke();
    g.beginPath(); g.moveTo(0, s * 1.15); g.lineTo(0, s * 0.45); g.stroke();
    g.beginPath(); g.moveTo(-s * 1.15, 0); g.lineTo(-s * 0.45, 0); g.stroke();
    g.beginPath(); g.moveTo(s * 1.15, 0); g.lineTo(s * 0.45, 0); g.stroke();
    g.fillStyle = '#ff6b5b';
    g.beginPath(); g.arc(0, 0, s * 0.18, 0, TAU); g.fill();
  }
  g.restore();
}

function onTap(cx, cy) {

    const b = btns[i];

      return;
    }

  // pad / tower picking via screen projection
  let bestPad = null, bestD = 44 * U;
  for (const p of game.pads) {
    const pr = project(p.x, p.y + 0.8, p.z);
    if (!pr.vis) continue;
    const d = hyp(pr.x - cx, pr.y - cy);
    if (d < bestD) { bestD = d; bestPad = p; }
  }
  if (bestPad) {
    if (bestPad.tower) {
      game.selTower = bestPad.tower; game.selPad = null;
      const st = towerStats(bestPad.tower);
      showRange(bestPad.x, bestPad.y, bestPad.z, st.range);
    } else {
      game.selPad = bestPad; game.selTower = null;
      hideRange();
    }

  }

function handleBtn(b) {

    case 'speed': game.speed = game.speed === 1 ? 2 : 1; break;
    case 'sound': SFX.on = !SFX.on; break;
    case 'cam': resetCamera(); break;
    case 'rush':
      if (!game.waveActive) {
        const bonus = Math.floor(Math.max(game.nextWaveT, 0)) * 2;
        if (game.wave > 0 && bonus > 0) {
          game.gold += bonus;
          game.floats.push({ sx: 0.5, sy: 0.25, txt: '+' + bonus, col: '#ffd34d', t: 0, dur: 0.9, vy: 36, size: 18 });

    case 'buy':
      if (game.selPad && buildTower(game.selPad, b.data)) {
        const t = game.selPad.tower;
        showRange(t.x, t.pad.y, t.z, towerStats(t).range);
        game.selTower = t;

  const tap = ptrs.size === 1 && gesture && (gesture.mode === 'pan' || gesture.mode === 'orbit') && !gesture.moved;
  ptrs.delete(ev.pointerId);
  if (ptrs.size === 0) gesture = null;
  else if (ptrs.size === 1) {
    const [a] = [...ptrs.values()];
    gesture = { mode: 'pan', sx: a.x, sy: a.y, moved: true, anchor: groundPoint(a.x, a.y) };
  }
  if (tap) onTap(ev.clientX, ev.clientY);
}
ui.addEventListener('pointerup', endPtr);
ui.addEventListener('pointercancel', ev => { ptrs.delete(ev.pointerId); if (!ptrs.size) gesture = null; });
ui.addEventListener('wheel', ev => {
  ev.preventDefault();
  camCtl.zoom = clamp(camCtl.zoom * (1 + ev.deltaY * 0.001), 0.4, 1.75);
}, { passive: false });
document.addEventListener('touchmove', ev => ev.preventDefault(), { passive: false });
document.addEventListener('contextmenu', ev => ev.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden && game.state === 'playing') game.paused = true;
});

// ---------- main loop ----------
updateWaveMarker();
const basePos = cam.position.clone();
let lastT = performance.now();
function frame(now) {
  let dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  const gdt = dt * (game.state === 'playing' ? game.speed : 1);
  update(gdt);
  updateEffects(gdt);
  // pad glow pulse
  for (const p of game.pads) {
    if (!p.glow) continue;
    const show = game.state === 'playing' && !p.tower && (!game.builtAny || game.selPad === p);
    p.glow.material.opacity = show ? 0.35 + 0.3 * Math.sin(game.time * 4 + p.x) : 0;
  }
  animFlag(game.time);
  const _mo = 0.6 + 0.3 * Math.sin(game.time * 3);
  for (const mm of markerMeshes) mm.material.opacity = _mo;
  writeSoldierInstances();
  // camera shake
  fitCamera();
  if (game.shake > 0.2) {
    cam.position.x += rand(-1, 1) * game.shake * 0.02;
    cam.position.y += rand(-1, 1) * game.shake * 0.015;
  }
  renderer.render(scene, cam);
  drawUI(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hooks (headless verification)
window.__sky = { game, FORT, PATHS, PATH_ENTRIES, NPATHS, startWave, spawnEnemy, buildTower, resetGame, TOWERS, ENEMIES, THREE, scene, cam,
  btnsRef: () => btns, project, camCtl, resetCamera };
</script>
