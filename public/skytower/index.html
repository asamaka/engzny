// ---------- tiny helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const hyp = (dx, dy) => Math.sqrt(dx * dx + dy * dy);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function rr(g, x, y, w, h, r) { // rounded-rect path
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

const view = { s: 1, ox: 0, oy: 0, cw: 0, ch: 0, dpr: 1, wt: 0, wb: H, wl: 0, wr: W };
function resize() {
  view.dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.cw = window.innerWidth; view.ch = window.innerHeight;
  canvas.width = Math.round(view.cw * view.dpr);
  canvas.height = Math.round(view.ch * view.dpr);
  canvas.style.width = view.cw + 'px'; canvas.style.height = view.ch + 'px';
  view.s = Math.min(view.cw / W, view.ch / H);
  view.ox = (view.cw - W * view.s) / 2;
  view.oy = (view.ch - H * view.s) / 2;
  // world coords of the actual screen edges (letterbox regions get sky + HUD pinning)
  view.wt = -view.oy / view.s; view.wb = (view.ch - view.oy) / view.s;
  view.wl = -view.ox / view.s; view.wr = (view.cw - view.ox) / view.s;
}
window.addEventListener('resize', resize);
resize();
const toWorld = (cx, cy) => ({ x: (cx - view.ox) / view.s, y: (cy - view.oy) / view.s });

// ---------- synthesized audio ----------
const SFX = {
  ctx: null, master: null, noiseBuf: null, on: true, last: {},
  init() {
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try {
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      const n = Math.floor(this.ctx.sampleRate * 0.5);
      this.noiseBuf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok(name, gap) {
    if (!this.on || !this.ctx) return false;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const now = performance.now();
    if (this.last[name] && now - this.last[name] < (gap || 35)) return false;
    this.last[name] = now;
    return true;
  },
  tone(type, f0, f1, dur, vol) {
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), gn = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn); gn.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  burst(dur, vol, freq) {
    const c = this.ctx, t = c.currentTime;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const gn = c.createGain();
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(gn); gn.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  },
  shot()    { if (this.ok('shot'))    this.tone('square', rand(620, 760), 170, 0.06, 0.06); },
  cannon()  { if (this.ok('cannon'))  { this.burst(0.35, 0.45, 320); this.tone('sine', 120, 38, 0.3, 0.4); } },
  zap()     { if (this.ok('zap'))     this.tone('sawtooth', 1500, 90, 0.13, 0.13); },
  frost()   { if (this.ok('frost'))   this.tone('sine', 1100, 1900, 0.1, 0.07); },
  sniper()  { if (this.ok('sniper'))  { this.burst(0.13, 0.3, 2200); this.tone('square', 320, 70, 0.12, 0.18); } },
  enemyShot(){ if (this.ok('eshot', 60)) this.tone('square', 380, 120, 0.06, 0.06); },
  coin()    { if (this.ok('coin', 50)) { this.tone('square', 880, 880, 0.05, 0.07); this.tone('square', 1320, 1320, 0.06, 0.06); } },
  build()   { if (this.ok('build'))   this.tone('triangle', 220, 520, 0.16, 0.25); },
  upgrade() { if (this.ok('up'))      { this.tone('triangle', 420, 940, 0.2, 0.22); this.tone('triangle', 640, 1280, 0.24, 0.15); } },
  sell()    { if (this.ok('sell'))    this.tone('triangle', 600, 200, 0.18, 0.2); },
  die()     { if (this.ok('die', 45)) this.tone('square', 210, 55, 0.14, 0.1); },
  baseHit() { if (this.ok('bhit', 90)) { this.burst(0.18, 0.35, 520); this.tone('sawtooth', 190, 60, 0.24, 0.28); } },
  horn()    { if (this.ok('horn'))    { this.tone('sawtooth', 170, 230, 0.5, 0.22); this.tone('sawtooth', 254, 345, 0.5, 0.12); } },
  boss()    { if (this.ok('boss'))    { this.tone('sawtooth', 90, 60, 0.9, 0.35); this.burst(0.6, 0.25, 200); } },
  over()    { if (this.ok('over'))    this.tone('sawtooth', 280, 45, 1.3, 0.35); },
  win()     { if (this.ok('win'))     { this.tone('triangle', 523, 523, 0.15, 0.2); this.tone('triangle', 659, 659, 0.18, 0.2); } },
};

// ---------- path ----------
const WAYPOINTS = [
  [60, 205], [560, 205], [560, 420], [150, 420], [150, 650],
  [560, 650], [560, 880], [200, 880], [200, 1055], [360, 1120]
];
function buildPath(pts, r) {
  const raw = [];
  raw.push({ x: pts[0][0], y: pts[0][1] });
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    let v1x = p1[0] - p0[0], v1y = p1[1] - p0[1];
    let v2x = p2[0] - p1[0], v2y = p2[1] - p1[1];
    const l1 = hyp(v1x, v1y), l2 = hyp(v2x, v2y);
    v1x /= l1; v1y /= l1; v2x /= l2; v2y /= l2;
    const rad = Math.min(r, l1 / 2.2, l2 / 2.2);
    const ax = p1[0] - v1x * rad, ay = p1[1] - v1y * rad;
    const bx = p1[0] + v2x * rad, by = p1[1] + v2y * rad;
    raw.push({ x: ax, y: ay });
    for (let t = 0.12; t < 1; t += 0.12) {
      const u = 1 - t;
      raw.push({
        x: u * u * ax + 2 * u * t * p1[0] + t * t * bx,
        y: u * u * ay + 2 * u * t * p1[1] + t * t * by
      });
    }
    raw.push({ x: bx, y: by });
  }
  raw.push({ x: pts[pts.length - 1][0], y: pts[pts.length - 1][1] });
  let len = 0;
  const out = [{ x: raw[0].x, y: raw[0].y, d: 0 }];
  for (let i = 1; i < raw.length; i++) {
    len += hyp(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y);
    out.push({ x: raw[i].x, y: raw[i].y, d: len });
  }
  return { pts: out, length: len };
}
const PATH = buildPath(WAYPOINTS, 52);
function pathAt(d, hint) {
  d = clamp(d, 0, PATH.length);
  const P = PATH.pts;
  let i = hint && hint.si ? hint.si : 0;
  if (i > P.length - 2) i = P.length - 2;
  while (i < P.length - 2 && P[i + 1].d < d) i++;
  while (i > 0 && P[i].d > d) i--;
  if (hint) hint.si = i;
  const a = P[i], b = P[i + 1];
  const t = (d - a.d) / Math.max(b.d - a.d, 1e-6);
  return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), a: Math.atan2(b.y - a.y, b.x - a.x) };
}
function distToPath(x, y) {
  let best = 1e9;
  const P = PATH.pts;
  for (let i = 0; i < P.length; i += 2) {
    const d = hyp(P[i].x - x, P[i].y - y);
    if (d < best) best = d;
  }
  return best;
}

function banner(txt, sub, color) { banners.push({ txt, sub, color: color || '#fff', t: 0, dur: 2.4 }); }

// ---------- wave generation ----------
function hpMul(n)   { return 1 + 0.20 * (n - 1) + 0.016 * (n - 1) * (n - 1); }
function spdMul(n)  { return Math.min(1 + 0.006 * (n - 1), 1.32); }
function goldMul(n) { return 1 + 0.03 * n; }
function genWave(n) {
  const q = [];
  let t = 0.5;
  const push = (type, gap) => { q.push({ t, type }); t += gap; };
  if (n % 8 === 0) { // boss wave
    const bosses = 1 + Math.floor(n / 24);
    for (let i = 0; i < 6 + Math.floor(n / 3); i++) push(i % 3 === 2 ? 'heavy' : 'rifle', 0.7);
    t += 1.6;
    for (let i = 0; i < bosses; i++) push('boss', 4);
    for (let i = 0; i < Math.floor(n / 4); i++) push('medic', 1.4);
    return q;
  }
  const unlocked = ['rifle'];
  if (n >= 3) unlocked.push('scout');
  if (n >= 5) unlocked.push('heavy');
  if (n >= 7) unlocked.push('medic');
  if (n >= 9) unlocked.push('commando');
  const costs = { rifle: 1, scout: 1.2, heavy: 4, medic: 3.5, commando: 4.5 };
  let budget = Math.round(8 + n * 3.1 + Math.pow(n, 1.22));
  let guard = 0;
  while (budget > 0.5 && guard++ < 60) {
    const weights = unlocked.map(u =>
      u === 'rifle' ? Math.max(2, 8 - n * 0.25) :
      u === 'scout' ? 4 : u === 'heavy' ? 3 : u === 'medic' ? 2 : 3);
    let r = Math.random() * weights.reduce((a, b) => a + b, 0), type = unlocked[0];
    for (let i = 0; i < unlocked.length; i++) { r -= weights[i]; if (r <= 0) { type = unlocked[i]; break; } }
    const groupN = (type === 'rifle' || type === 'scout') ? randi(3, 6) : randi(1, 2);
    for (let i = 0; i < groupN && budget > 0; i++) {
      push(type, type === 'scout' ? 0.45 : type === 'rifle' ? 0.6 : 1.3);
      budget -= costs[type];
    }
    t += 1.3;
  }
  return q;
}
function startWave() {
  game.wave++;
  game.spawnQueue = genWave(game.wave);
  game.spawnT = 0;
  game.waveActive = true;
  game.selPad = null;
  if (game.wave % 8 === 0) { banner('WAVE ' + game.wave, 'WARLORD INBOUND', '#ff6b5b'); SFX.boss(); }
  else { banner('WAVE ' + game.wave, null, '#ffd34d'); SFX.horn(); }
}

// ---------- enemies ----------
function spawnEnemy(type) {
  const def = ENEMIES[type];
  const m = hpMul(game.wave);
  const start = pathAt(0);
  game.enemies.push({
    type, def,
    hp: Math.round(def.hp * m), hpMax: Math.round(def.hp * m),
    speed: def.speed * spdMul(game.wave),
    gold: Math.round(def.gold * goldMul(game.wave)),
    d: 0, si: 0,
    x: start.x, y: start.y, angle: start.a,
    state: 'drop', dropY: -280, sway: rand(0, TAU),
    walk: rand(0, TAU), flashT: 0, slowT: 0, slowF: 1,
    shotT: rand(0.3, 1), healT: 1.2, slot: -1, muzzleT: 0
  });
}
function hitEnemy(e, dmg, opts) {
  opts = opts || {};
  if (e.hp <= 0) return;
  let final = dmg;
  if (!opts.pierce && e.def.armor) final = Math.max(1, dmg - e.def.armor);
  e.hp -= final;
  e.flashT = 0.08;
  if (game.floats.length < 50) {
    game.floats.push({ x: e.x + rand(-8, 8), y: e.y - 22 * e.def.size, txt: String(Math.round(final)),
      col: opts.pierce ? '#ffd34d' : '#fff', t: 0, dur: 0.7, vy: -55, size: 17 });
  }
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  game.kills++;
  game.gold += e.gold;
  SFX.die(); SFX.coin();
  if (e.slot >= 0) STAND_SLOTS[e.slot].used = false;
  game.floats.push({ x: e.x, y: e.y - 30, txt: '+' + e.gold, col: '#ffd34d', t: 0, dur: 1, vy: -45, size: 19, coin: true });
  if (game.corpses.length < 40) game.corpses.push({ x: e.x, y: e.y, angle: e.angle, def: e.def, t: 0 });
  for (let i = 0; i < 6; i++) {
    game.parts.push({ x: e.x, y: e.y, vx: rand(-70, 70), vy: rand(-90, -10), g: 220,
      t: 0, dur: rand(0.3, 0.6), size: rand(2, 4.5), col: pick(['#8a2e2e', '#6e2424', e.def.uniform]) });
  }
  if (e.def.boss) { game.shake = Math.min(game.shake + 12, 18); explosionFx(e.x, e.y, 70, false); }
}
function updateEnemy(e, dt) {
  e.flashT = Math.max(0, e.flashT - dt);
  e.muzzleT = Math.max(0, e.muzzleT - dt);
  if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowF = 1; }
  const spd = e.speed * e.slowF;
  if (e.state === 'drop') {
    e.sway += dt * 3;
    e.dropY += dt * 235;
    const p = pathAt(0);
    e.x = p.x + Math.sin(e.sway) * 9;
    e.y = p.y + Math.min(e.dropY, 0);
    e.angle = p.a;
    if (e.dropY >= 0) {
      e.state = 'walk';
      game.fx.push({ kind: 'chute', x: e.x, y: e.y - 38 * e.def.size, t: 0, dur: 1.1, def: e.def, size: e.def.size });
      for (let i = 0; i < 4; i++) game.parts.push({ x: e.x, y: e.y, vx: rand(-40, 40), vy: rand(-20, 0), g: 0,
        t: 0, dur: 0.4, size: rand(2, 4), col: '#cbb89a' });
    }
    return;
  }
  if (e.state === 'walk') {
    e.walk += dt * spd * 0.09;
    e.d += spd * dt;
    const p = pathAt(e.d, e);
    e.x = p.x; e.y = p.y;
    e.angle += angDiff(e.angle, p.a) * Math.min(1, dt * 10);
    if (e.d >= PATH.length - 8) {
      // arrived at the keep: take up a firing position
      let si = -1, best = 1e9;
      for (let i = 0; i < STAND_SLOTS.length; i++) {
        if (STAND_SLOTS[i].used) continue;
        const dd = hyp(STAND_SLOTS[i].x - e.x, STAND_SLOTS[i].y - e.y);
        if (dd < best) { best = dd; si = i; }
      }
      if (si >= 0) { STAND_SLOTS[si].used = true; e.slot = si; e.tx = STAND_SLOTS[si].x; e.ty = STAND_SLOTS[si].y; }
      else { e.tx = BASE.x + rand(-110, 110); e.ty = BASE.y - 30 + rand(-120, -40); }
      e.state = 'deploy';
    }

  }
  if (e.state === 'deploy') {

    const dx = e.tx - e.x, dy = e.ty - e.y, dd = hyp(dx, dy);
    e.angle += angDiff(e.angle, Math.atan2(dy, dx)) * Math.min(1, dt * 10);
    if (dd < 4) { e.state = 'attack'; }
    else { e.x += dx / dd * spd * dt; e.y += dy / dd * spd * dt; }
    return;
  }
  // attack: stand and fire on the keep
  e.angle += angDiff(e.angle, Math.atan2(BASE.y - e.y, BASE.x - e.x)) * Math.min(1, dt * 8);
  e.shotT -= dt;
  if (e.shotT <= 0) {
    e.shotT = e.def.atkRate * rand(0.85, 1.15);
    e.muzzleT = 0.07;
    BASE.hp -= e.def.dmg;
    SFX.enemyShot(); SFX.baseHit();
    game.shake = Math.min(game.shake + 2.5, 14);
    game.fx.push({ kind: 'tracer', x1: e.x, y1: e.y, x2: BASE.x + rand(-30, 30), y2: BASE.y - rand(10, 50), t: 0, dur: 0.1 });
    for (let i = 0; i < 3; i++) game.parts.push({ x: BASE.x + rand(-30, 30), y: BASE.y - rand(10, 50),
      vx: rand(-50, 50), vy: rand(-80, -20), g: 160, t: 0, dur: 0.35, size: rand(1.5, 3), col: '#ffb84d' });
    if (navigator.vibrate) try { navigator.vibrate(30); } catch (err) {}
    if (BASE.hp <= 0) {
      BASE.hp = 0;
      gameOver();
    }
  }
}
function healPulse(e, dt) {
  e.healT -= dt;

  e.healT = 1.5;
  let target = null, worst = 1;
  for (const o of game.enemies) {
    if (o === e || o.hp <= 0 || o.state === 'drop') continue;
    if (hyp(o.x - e.x, o.y - e.y) > 115) continue;
    const frac = o.hp / o.hpMax;
    if (frac < worst) { worst = frac; target = o; }
  }
  if (target && worst < 1) {
    const amt = Math.round(target.hpMax * 0.05) + 4;
    target.hp = Math.min(target.hpMax, target.hp + amt);
    game.fx.push({ kind: 'heal', x: target.x, y: target.y, t: 0, dur: 0.6 });
  }
}

function towerStats(t) { return t.def.lv[t.lvl - 1]; }

      vy: Math.sin(t.aim) * rand(20, 60) - 30, g: -40, t: 0, dur: rand(0.4, 0.8), size: rand(4, 8), col: 'rgba(180,180,180,0.5)', smoke: true });

      g: 200, t: 0, dur: 0.3, size: rand(1.5, 3), col: '#ffd34d' });

// ---------- projectiles ----------
function updateShot(s, dt) {
  if (s.kind === 'bullet' || s.kind === 'shard') {
    const e = s.target;
    if (e && e.hp > 0) { s.tx = e.x; s.ty = e.y; }
    if (s.tx === undefined) return true;
    const dx = s.tx - s.x, dy = s.ty - s.y, dd = hyp(dx, dy);
    const step = s.speed * dt;
    if (dd <= step + 6) {
      if (e && e.hp > 0) {
        hitEnemy(e, s.dmg, { pierce: s.pierce });
        if (s.kind === 'shard') {
          e.slowF = Math.min(e.slowF, s.slow);
          e.slowT = Math.max(e.slowT, s.slowT * (e.def.boss ? 0.45 : 1));
          for (let i = 0; i < 4; i++) game.parts.push({ x: e.x, y: e.y, vx: rand(-50, 50), vy: rand(-60, 0),
            g: 140, t: 0, dur: 0.4, size: rand(1.5, 3.5), col: '#bfeaff' });
        }
      }
      return true;
    }
    s.x += dx / dd * step; s.y += dy / dd * step;
    s.a = Math.atan2(dy, dx);
    return false;
  }
  if (s.kind === 'ball') {
    const dx = s.tx - s.x, dy = s.ty - s.y, dd = hyp(dx, dy);
    const step = s.speed * dt;
    s.spin += dt * 12;
    if (dd <= step + 4) {
      explosionFx(s.tx, s.ty, s.splash, true);
      for (const e of game.enemies) {
        if (e.hp <= 0 || e.state === 'drop') continue;
        const r = hyp(e.x - s.tx, e.y - s.ty);
        if (r <= s.splash) hitEnemy(e, Math.round(s.dmg * (r < s.splash * 0.45 ? 1 : 0.55)), { pierce: true });
      }
      return true;
    }
    s.x += dx / dd * step; s.y += dy / dd * step;
    return false;
  }
  return true;
}
function explosionFx(x, y, r, sound) {
  game.fx.push({ kind: 'ring', x, y, t: 0, dur: 0.35, r0: 8, r1: r * 1.25, col: '#ffb84d' });
  game.fx.push({ kind: 'flash', x, y, t: 0, dur: 0.12, r: r * 0.7 });
  for (let i = 0; i < 12; i++) game.parts.push({ x, y, vx: rand(-160, 160), vy: rand(-190, -20), g: 320,
    t: 0, dur: rand(0.3, 0.65), size: rand(2, 5), col: pick(['#ffb84d', '#ff8a3d', '#ffd34d']) });
  for (let i = 0; i < 7; i++) game.parts.push({ x: x + rand(-10, 10), y: y + rand(-10, 10),
    vx: rand(-30, 30), vy: rand(-70, -25), g: -50, t: 0, dur: rand(0.6, 1.1), size: rand(7, 14),
    col: 'rgba(90,80,75,0.45)', smoke: true });
  game.shake = Math.min(game.shake + 4, 14);
  if (sound) SFX.cannon();
}

// ---------- game over ----------
function gameOver() {
  if (game.state !== 'playing') return;
  game.state = 'over';
  game.overT = 0;
  SFX.over();
  explosionFx(BASE.x, BASE.y - 20, 90, false);
  explosionFx(BASE.x - 35, BASE.y - 50, 60, false);
  explosionFx(BASE.x + 35, BASE.y - 10, 60, false);
  game.shake = 18;
  if (game.wave > game.best) {
    game.best = game.wave;
    try { localStorage.setItem('skytower_best', String(game.best)); } catch (e) {}
  }
}

// ---------- update loop ----------
function update(dt) {
  game.time += dt;
  if (game.state !== 'playing' && game.state !== 'over') return;
  if (game.paused) return;

  if (game.state === 'over') {
    game.overT += dt;
  }

  // wave flow
  if (game.state === 'playing') {
    if (game.waveActive) {
      game.spawnT += dt;
      while (game.spawnQueue.length && game.spawnQueue[0].t <= game.spawnT) {
        spawnEnemy(game.spawnQueue.shift().type);
      }
      if (!game.spawnQueue.length && !game.enemies.length) {
        game.waveActive = false;
        game.nextWaveT = 10;
        const bonus = 18 + game.wave * 3;
        game.gold += bonus;
        SFX.win();
        game.floats.push({ x: W / 2, y: 480, txt: 'WAVE CLEAR  +' + bonus, col: '#ffd34d', t: 0, dur: 1.6, vy: -30, size: 30, coin: true });
      }
    } else {
      game.nextWaveT -= dt;
      if (game.nextWaveT <= 0) startWave();
    }
  }

  // enemies
  for (const e of game.enemies) {
    if (game.state === 'playing') {
      updateEnemy(e, dt);
      if (e.def.healer && e.hp > 0 && e.state !== 'drop') healPulse(e, dt);
    }
  }
  game.enemies = game.enemies.filter(e => e.hp > 0);

  // towers + shots (towers stop when game over)
  if (game.state === 'playing') for (const t of game.towers) updateTower(t, dt);
  game.shots = game.shots.filter(s => !updateShot(s, dt));

  // particles / fx / floats / corpses
  for (const p of game.parts) {
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt;
  }
  game.parts = game.parts.filter(p => p.t < p.dur);
  if (game.parts.length > 450) game.parts.splice(0, game.parts.length - 450);
  for (const f of game.fx) f.t += dt;
  game.fx = game.fx.filter(f => f.t < f.dur);
  for (const f of game.floats) { f.t += dt; f.y += f.vy * dt; }
  game.floats = game.floats.filter(f => f.t < f.dur);
  for (const c of game.corpses) c.t += dt;
  game.corpses = game.corpses.filter(c => c.t < 3.2);

  // base smoke when damaged
  if (BASE.hp / BASE.hpMax < 0.45 && Math.random() < 0.25) {
    game.parts.push({ x: BASE.x + rand(-35, 35), y: BASE.y - rand(20, 60), vx: rand(-12, 12), vy: rand(-55, -25),
      g: -20, t: 0, dur: rand(0.8, 1.4), size: rand(6, 12), col: 'rgba(60,55,52,0.5)', smoke: true });
  }
  game.shake = Math.max(0, game.shake - dt * 26);
}

// ---- pre-rendered island terrain ----
let terra = null;
function islandPts(rx, ry, cx, cy, wob) {
  const pts = [];
  const N = 44;
  for (let i = 0; i < N; i++) {
    const th = i / N * TAU;
    const c = Math.cos(th), s = Math.sin(th);
    const m = 1 + wob * (0.5 * Math.sin(3 * th + 1.7) + 0.35 * Math.sin(7 * th + 0.4));
    pts.push({
      x: cx + rx * Math.sign(c) * Math.sqrt(Math.abs(c)) * m,
      y: cy + ry * Math.sign(s) * Math.sqrt(Math.abs(s)) * m
    });
  }
  return pts;
}
function blobPath(ctx, pts) {
  ctx.beginPath();
  const n = pts.length;
  ctx.moveTo((pts[0].x + pts[n - 1].x) / 2, (pts[0].y + pts[n - 1].y) / 2);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
  }
  ctx.closePath();
}
function inIsland(x, y) {
  const nx = (x - 360) / 345, ny = (y - 680) / 545;
  return nx * nx * nx * nx + ny * ny * ny * ny < 0.92;
}
function buildTerrain() {
  terra = document.createElement('canvas');
  terra.width = W; terra.height = H;
  const c = terra.getContext('2d');
  c.clearRect(0, 0, W, H);

  const pts = islandPts(345, 545, 360, 680, 0.06);

  // cliff underside (rock)
  c.save();
  c.translate(0, 26);
  blobPath(c, pts);
  const rockGrad = c.createLinearGradient(0, 200, 0, 1280);
  rockGrad.addColorStop(0, '#7a5a40');
  rockGrad.addColorStop(0.75, '#5d4330');
  rockGrad.addColorStop(1, '#473325');
  c.fillStyle = rockGrad;
  c.fill();
  c.restore();
  // hanging rock teeth along the bottom edge
  c.fillStyle = '#52392a';
  for (let i = 0; i < 9; i++) {
    const x = 120 + i * 60 + rand(-14, 14);
    const y = 1195 + Math.sin(i * 1.8) * 18;
    c.beginPath();
    c.moveTo(x - rand(14, 22), y);
    c.lineTo(x, y + rand(22, 46));
    c.lineTo(x + rand(14, 22), y);
    c.closePath();
    c.fill();
  }

  // grass top
  blobPath(c, pts);
  const grad = c.createLinearGradient(0, 140, 0, 1230);
  grad.addColorStop(0, '#8ecf5a');
  grad.addColorStop(0.6, '#6fb84a');
  grad.addColorStop(1, '#5aa23e');
  c.fillStyle = grad;
  c.fill();
  c.strokeStyle = 'rgba(70,110,40,0.8)';
  c.lineWidth = 5;
  c.stroke();

  // grass speckles
  for (let i = 0; i < 520; i++) {
    const x = rand(20, 700), y = rand(150, 1210);
    if (!inIsland(x, y)) continue;
    c.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.07)' : 'rgba(30,80,20,0.10)';
    c.fillRect(x, y, rand(2, 4), rand(2, 3));
  }

  // dirt path
  c.lineCap = 'round'; c.lineJoin = 'round';
  const drawPathLine = (width, color) => {
    c.beginPath();
    c.moveTo(PATH.pts[0].x, PATH.pts[0].y);
    for (let i = 1; i < PATH.pts.length; i++) c.lineTo(PATH.pts[i].x, PATH.pts[i].y);
    c.lineWidth = width; c.strokeStyle = color; c.stroke();
  };
  drawPathLine(64, '#8d6b45');
  drawPathLine(54, '#c9a36b');
  drawPathLine(44, '#d8b07a');
  // pebbles + wear
  for (let i = 0; i < PATH.pts.length; i += 5) {
    const p = PATH.pts[i];
    c.fillStyle = 'rgba(141,107,69,0.5)';
    c.beginPath(); c.arc(p.x + rand(-16, 16), p.y + rand(-16, 16), rand(1.5, 3.5), 0, TAU); c.fill();
  }

  // landing zone marker at path start
  const st = PATH.pts[0];
  c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 4; c.setLineDash([10, 8]);
  c.beginPath(); c.arc(st.x, st.y, 36, 0, TAU); c.stroke();
  c.setLineDash([]);
  c.fillStyle = 'rgba(255,255,255,0.55)';
  c.font = 'bold 17px -apple-system,Segoe UI,Roboto,sans-serif';
  c.textAlign = 'center';
  c.fillText('DROP ZONE', st.x, st.y - 46);

  // build pads
  for (const p of game.pads) {
    c.fillStyle = 'rgba(0,0,0,0.18)';
    c.beginPath(); c.ellipse(p.x, p.y + 6, 36, 14, 0, 0, TAU); c.fill();
    c.fillStyle = '#8d99a6';
    c.beginPath(); c.arc(p.x, p.y, 34, 0, TAU); c.fill();
    c.fillStyle = '#aab5c2';
    c.beginPath(); c.arc(p.x, p.y - 2, 30, 0, TAU); c.fill();
    c.fillStyle = '#79858f';
    for (let i = 0; i < 4; i++) {
      const a = i * TAU / 4 + 0.6;
      c.beginPath(); c.arc(p.x + Math.cos(a) * 22, p.y - 2 + Math.sin(a) * 22, 3.2, 0, TAU); c.fill();
    }
  }

  // decorative props (kept off the path and pads)
  const propOK = (x, y) => {
    if (!inIsland(x, y) || distToPath(x, y) < 62) return false;
    for (const p of game.pads) if (hyp(p.x - x, p.y - y) < 70) return false;
    if (hyp(BASE.x - x, BASE.y - y) < 130) return false;
    return true;
  };
  let placed = 0, tries = 0;
  while (placed < 11 && tries++ < 400) {  // trees
    const x = rand(40, 680), y = rand(170, 1190);
    if (!propOK(x, y)) continue;
    placed++;
    c.fillStyle = 'rgba(0,0,0,0.16)';
    c.beginPath(); c.ellipse(x + 6, y + 8, 20, 8, 0, 0, TAU); c.fill();
    c.fillStyle = '#7a5230';
    c.fillRect(x - 3, y - 6, 6, 14);
    const g1 = '#4e8f3a', g2 = '#67ab4a';
    c.fillStyle = g1; c.beginPath(); c.arc(x - 8, y - 14, 13, 0, TAU); c.fill();
    c.fillStyle = g1; c.beginPath(); c.arc(x + 9, y - 12, 11, 0, TAU); c.fill();
    c.fillStyle = g2; c.beginPath(); c.arc(x, y - 22, 13, 0, TAU); c.fill();
  }
  placed = 0; tries = 0;
  while (placed < 8 && tries++ < 300) {  // rocks
    const x = rand(40, 680), y = rand(170, 1190);
    if (!propOK(x, y)) continue;
    placed++;
    const s = rand(7, 14);
    c.fillStyle = 'rgba(0,0,0,0.14)';
    c.beginPath(); c.ellipse(x + 3, y + s * 0.5, s * 1.2, s * 0.45, 0, 0, TAU); c.fill();
    c.fillStyle = '#9aa3ad';
    c.beginPath();
    c.moveTo(x - s, y + s * 0.4); c.lineTo(x - s * 0.5, y - s * 0.8); c.lineTo(x + s * 0.4, y - s);
    c.lineTo(x + s, y + s * 0.3); c.closePath(); c.fill();
    c.fillStyle = '#b9c2cb';
    c.beginPath(); c.moveTo(x - s * 0.5, y - s * 0.8); c.lineTo(x + s * 0.4, y - s); c.lineTo(x + s * 0.2, y - s * 0.2); c.closePath(); c.fill();
  }
  placed = 0; tries = 0;
  while (placed < 16 && tries++ < 300) {  // flowers
    const x = rand(40, 680), y = rand(170, 1190);
    if (!propOK(x, y)) continue;
    placed++;
    c.fillStyle = pick(['#ffd34d', '#ff8aa8', '#fff', '#ffa94d']);
    for (let i = 0; i < 4; i++) c.fillRect(x + rand(-10, 10), y + rand(-6, 6), 3, 3);
  }
}

// ---- soldier drawing ----
function drawSoldier(e) {
  const z = e.def.size;
  const d = e.def;
  g.save();
  g.translate(e.x, e.y);
  // shadow (skip while dropping)
  if (e.state !== 'drop') {
    g.fillStyle = 'rgba(0,0,0,0.22)';
    g.beginPath(); g.ellipse(0, 5 * z, 13 * z, 6 * z, 0, 0, TAU); g.fill();
  }
  g.rotate(e.angle + Math.PI / 2);
  const step = (e.state === 'attack') ? 0 : Math.sin(e.walk * 2);
  // boots
  g.fillStyle = '#2e2c28';
  rr(g, -9 * z, -5 * z + step * 7 * z, 6 * z, 10 * z, 3 * z); g.fill();
  rr(g, 3 * z, -5 * z - step * 7 * z, 6 * z, 10 * z, 3 * z); g.fill();
  // torso
  g.fillStyle = d.uniform;
  rr(g, -12 * z, -10 * z, 24 * z, 20 * z, 7 * z); g.fill();
  // backpack
  g.fillStyle = 'rgba(0,0,0,0.22)';
  rr(g, -7 * z, 2 * z, 14 * z, 8 * z, 3 * z); g.fill();
  // chest strap
  g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 2 * z;
  g.beginPath(); g.moveTo(-10 * z, -8 * z); g.lineTo(10 * z, -2 * z); g.stroke();
  // shoulders
  g.fillStyle = d.helmet;
  g.beginPath(); g.arc(-11 * z, -2 * z, 4.5 * z, 0, TAU); g.fill();
  g.beginPath(); g.arc(11 * z, -2 * z, 4.5 * z, 0, TAU); g.fill();
  // rifle (held across, pointing forward = -y)
  g.save();
  g.translate(4 * z, -8 * z);
  g.rotate(-0.18);
  g.fillStyle = '#33363b';
  rr(g, -2 * z, -17 * z, 4 * z, 24 * z, 1.5 * z); g.fill();
  g.fillStyle = '#22252a';
  rr(g, -1.4 * z, -17 * z, 2.8 * z, 7 * z, 1 * z); g.fill();
  if (e.muzzleT > 0) {
    g.fillStyle = '#ffe27a';
    g.beginPath();
    g.moveTo(0, -26 * z); g.lineTo(-4 * z, -17 * z); g.lineTo(4 * z, -17 * z);
    g.closePath(); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(0, -19 * z, 2.5 * z, 0, TAU); g.fill();
  }
  g.restore();
  // hands
  g.fillStyle = d.skin;
  g.beginPath(); g.arc(2 * z, -14 * z, 2.6 * z, 0, TAU); g.fill();
  g.beginPath(); g.arc(7 * z, -4 * z, 2.6 * z, 0, TAU); g.fill();
  // helmet
  g.fillStyle = d.helmet;
  g.beginPath(); g.arc(0, -1.5 * z, 8.6 * z, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 1.5 * z;
  g.beginPath(); g.arc(0, -1.5 * z, 8.6 * z, 0, TAU); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.22)';
  g.beginPath(); g.arc(-2.5 * z, -4 * z, 4.5 * z, Math.PI * 0.9, Math.PI * 1.9); g.fill();
  if (d.healer) {
    g.fillStyle = '#e84545';
    g.fillRect(-1.4 * z, -6 * z, 2.8 * z, 9 * z);
    g.fillRect(-4.5 * z, -3 * z, 9 * z, 2.8 * z);
  }
  if (d.boss) {
    g.fillStyle = '#ffd34d';
    for (let i = -1; i <= 1; i++) {
      g.beginPath();
      g.moveTo(i * 5.5 * z, -9.5 * z); g.lineTo(i * 5.5 * z - 2 * z, -5 * z); g.lineTo(i * 5.5 * z + 2 * z, -5 * z);
      g.closePath(); g.fill();
    }
  }
  // hit flash
  if (e.flashT > 0) {
    g.fillStyle = 'rgba(255,255,255,' + (e.flashT / 0.08 * 0.6) + ')';
    g.beginPath(); g.arc(0, -2 * z, 14 * z, 0, TAU); g.fill();
  }
  // frost tint
  if (e.slowT > 0) {
    g.fillStyle = 'rgba(130,210,255,0.32)';
    g.beginPath(); g.arc(0, -2 * z, 14 * z, 0, TAU); g.fill();
  }
  g.restore();
  // parachute (world space, above soldier)
  if (e.state === 'drop') {
    const sw = Math.sin(e.sway) * 0.12;
    g.save();
    g.translate(e.x, e.y - 30 * z);
    g.rotate(sw);
    g.strokeStyle = 'rgba(40,40,40,0.65)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-22 * z, -18 * z); g.lineTo(-8 * z, 26 * z);
    g.moveTo(22 * z, -18 * z); g.lineTo(8 * z, 26 * z);
    g.moveTo(0, -24 * z); g.lineTo(0, 24 * z);
    g.stroke();
    g.fillStyle = d.chute[0];
    g.beginPath(); g.arc(0, -16 * z, 26 * z, Math.PI, 0); g.closePath(); g.fill();
    g.fillStyle = d.chute[1];
    g.beginPath(); g.arc(0, -16 * z, 26 * z, Math.PI * 1.25, Math.PI * 1.55); g.lineTo(0, -16 * z); g.closePath(); g.fill();
    g.beginPath(); g.arc(0, -16 * z, 26 * z, Math.PI * 1.75, Math.PI * 1.98); g.lineTo(0, -16 * z); g.closePath(); g.fill();
    g.restore();
  }
  // hp bar
  if (e.hp < e.hpMax && e.state !== 'drop') {
    const w = (e.def.boss ? 52 : 30) * z, frac = e.hp / e.hpMax;
    g.fillStyle = 'rgba(0,0,0,0.5)';
    rr(g, e.x - w / 2 - 1, e.y - 22 * z - 4, w + 2, 6, 3); g.fill();
    g.fillStyle = frac > 0.5 ? '#6ee06e' : frac > 0.25 ? '#ffd34d' : '#ff6b5b';
    rr(g, e.x - w / 2, e.y - 22 * z - 3, Math.max(2, w * frac), 4, 2); g.fill();
  }
}
function drawCorpse(c) {

// ---- tower drawing ----
function drawTowerBody(t, x, y, type, lvl, aim, fireT, scale) {
  const z = scale || 1;
  g.save();
  g.translate(x, y);
  g.scale(z, z);
  // shadow + pedestal
  g.fillStyle = 'rgba(0,0,0,0.2)';
  g.beginPath(); g.ellipse(2, 10, 26, 10, 0, 0, TAU); g.fill();
  g.fillStyle = '#6e7a86';
  g.beginPath(); g.ellipse(0, 4, 24, 12, 0, 0, TAU); g.fill();
  g.fillStyle = '#8d99a6';
  g.beginPath(); g.ellipse(0, 0, 24, 12, 0, 0, TAU); g.fill();
  const recoil = fireT > 0 ? fireT * 40 : 0;

  if (type === 'gunner') {
    g.save();
    g.translate(0, -14);
    g.rotate(aim + Math.PI / 2);
    g.translate(0, recoil * 0.15);
    g.fillStyle = '#5b6670';
    rr(g, -13, -10, 26, 24, 6); g.fill();
    g.fillStyle = '#76828e';
    rr(g, -10, -7, 20, 16, 5); g.fill();
    const bar = lvl === 1 ? [0] : lvl === 2 ? [-5.5, 5.5] : [-7, 0, 7];
    g.fillStyle = '#33363b';
    for (const bx of bar) { rr(g, bx - 2.5, -30, 5, 22, 2); g.fill(); }
    if (fireT > 0) {
      g.fillStyle = '#ffe27a';
      for (const bx of bar) {
        g.beginPath();
        g.moveTo(bx, -40); g.lineTo(bx - 5, -29); g.lineTo(bx + 5, -29);
        g.closePath(); g.fill();
      }
    }
    g.restore();
  } else if (type === 'cannon') {
    g.save();
    g.translate(0, -16);
    g.rotate(aim + Math.PI / 2);
    g.translate(0, recoil * 0.22);
    g.fillStyle = '#33363b';
    rr(g, -7, -36 - (lvl - 1) * 3, 14 + (lvl - 1) * 2, 32 + (lvl - 1) * 3, 5); g.fill();
    g.fillStyle = '#22252a';
    rr(g, -8.5, -38 - (lvl - 1) * 3, 17 + (lvl - 1) * 2, 7, 3); g.fill();
    g.fillStyle = '#707d52';
    g.beginPath(); g.arc(0, 0, 15 + lvl, 0, TAU); g.fill();
    g.fillStyle = '#8a9b6e';
    g.beginPath(); g.arc(-3, -3, 10 + lvl, 0, TAU); g.fill();
    if (fireT > 0) {
      g.fillStyle = '#ffe27a';
      g.beginPath(); g.arc(0, -40 - (lvl - 1) * 3, 9, 0, TAU); g.fill();
    }
    g.restore();
  } else if (type === 'frost') {
    const pulse = 0.85 + 0.15 * Math.sin(game.time * 4);
    g.fillStyle = '#5d7d8d';
    g.beginPath(); g.ellipse(0, -8, 14, 9, 0, 0, TAU); g.fill();
    const glow = g.createRadialGradient(0, -26, 2, 0, -26, 30 * pulse);
    glow.addColorStop(0, 'rgba(190,240,255,0.85)');
    glow.addColorStop(1, 'rgba(120,200,255,0)');
    g.fillStyle = glow;
    g.beginPath(); g.arc(0, -26, 30 * pulse, 0, TAU); g.fill();
    for (let i = 0; i < lvl + 1; i++) {
      const a = game.time * 0.8 + i * TAU / (lvl + 1);
      const cx = Math.cos(a) * 9, cy = -26 + Math.sin(a) * 5;
      g.fillStyle = i === 0 ? '#dff4ff' : '#9adcf7';
      g.beginPath();
      g.moveTo(cx, cy - 14); g.lineTo(cx + 6, cy); g.lineTo(cx, cy + 12); g.lineTo(cx - 6, cy);
      g.closePath(); g.fill();
    }
  } else if (type === 'tesla') {
    g.fillStyle = '#8a6f3d';
    for (let i = 0; i < 3; i++) {
      const w = 17 - i * 4;
      g.beginPath(); g.ellipse(0, -8 - i * 9, w, 6, 0, 0, TAU); g.fill();
    }
    const charge = 1 - clamp(t ? t.cd / towerStats(t).rate : 0, 0, 1);
    const orbR = 7 + lvl + charge * 3;
    const glow = g.createRadialGradient(0, -36, 1, 0, -36, orbR * 2.6);
    glow.addColorStop(0, 'rgba(255,245,180,' + (0.4 + charge * 0.5) + ')');
    glow.addColorStop(1, 'rgba(255,220,90,0)');
    g.fillStyle = glow;
    g.beginPath(); g.arc(0, -36, orbR * 2.6, 0, TAU); g.fill();
    g.fillStyle = charge > 0.85 ? '#fff3c4' : '#e8c96a';
    g.beginPath(); g.arc(0, -36, orbR, 0, TAU); g.fill();
    if (charge > 0.9 && Math.random() < 0.3) {
      g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 1.5;
      g.beginPath();
      const a0 = rand(0, TAU);
      g.moveTo(Math.cos(a0) * orbR, -36 + Math.sin(a0) * orbR);
      g.lineTo(Math.cos(a0) * (orbR + 8) + rand(-4, 4), -36 + Math.sin(a0) * (orbR + 8) + rand(-4, 4));
      g.stroke();
    }
  } else if (type === 'sniper') {
    g.save();
    g.translate(0, -18);
    g.rotate(aim + Math.PI / 2);
    g.translate(0, recoil * 0.18);
    g.fillStyle = '#5a4a3a';
    rr(g, -10, -6, 20, 18, 5); g.fill();
    g.fillStyle = '#33363b';
    rr(g, -3, -46 - (lvl - 1) * 4, 6, 44 + (lvl - 1) * 4, 2); g.fill();
    g.fillStyle = '#22252a';
    rr(g, -5, -48 - (lvl - 1) * 4, 10, 6, 2); g.fill();
    g.fillStyle = '#7d8d9d';
    g.beginPath(); g.arc(0, -14, 5, 0, TAU); g.fill();
    g.fillStyle = '#bfe3ff';
    g.beginPath(); g.arc(0, -14, 2.5, 0, TAU); g.fill();
    if (fireT > 0) {
      g.fillStyle = '#ffe27a';
      g.beginPath();
      g.moveTo(0, -58 - (lvl - 1) * 4); g.lineTo(-6, -45 - (lvl - 1) * 4); g.lineTo(6, -45 - (lvl - 1) * 4);
      g.closePath(); g.fill();
    }
    g.restore();
  }
  g.restore();
}
function drawTower(t) {
  drawTowerBody(t, t.x, t.y, t.type, t.lvl, t.aim, t.fireT, 1 + t.pulse * 0.2);
  // level pips
  for (let i = 0; i < t.lvl; i++) {

    g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 1;

  }
  // sniper laser sight
  if (t.type === 'sniper' && t.target && t.target.hp > 0 && game.state === 'playing') {
    g.strokeStyle = 'rgba(255,60,60,0.22)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(t.x + Math.cos(t.aim) * 40, t.y - 18 + Math.sin(t.aim) * 40);
    g.lineTo(t.target.x, t.target.y);
    g.stroke();
  }
}

// ---- base fortress ----
function drawBase() {
  const x = BASE.x, y = BASE.y;
  const dmg = 1 - BASE.hp / BASE.hpMax;
  g.save();
  g.translate(x, y);
  g.fillStyle = 'rgba(0,0,0,0.22)';
  g.beginPath(); g.ellipse(4, 28, 66, 20, 0, 0, TAU); g.fill();
  // keep walls
  g.fillStyle = '#7d8a97';
  rr(g, -55, -52, 110, 80, 10); g.fill();
  g.fillStyle = '#93a1af';
  rr(g, -55, -52, 110, 26, 10); g.fill();
  // crenellations
  g.fillStyle = '#a8b5c2';
  for (let i = 0; i < 5; i++) rr(g, -52 + i * 23, -64, 15, 16, 3), g.fill();
  // stone joints
  g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 2;

  // gate (faces up-path)
  g.fillStyle = '#3d3630';
  g.beginPath();
  g.moveTo(-16, 28); g.lineTo(-16, -8); g.quadraticCurveTo(0, -24, 16, -8); g.lineTo(16, 28);
  g.closePath(); g.fill();
  g.strokeStyle = '#2a241f'; g.lineWidth = 2.5;
  for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * 8, 26); g.lineTo(i * 8, -12); g.stroke(); }
  // cracks when damaged
  if (dmg > 0.3) {
    g.strokeStyle = 'rgba(30,30,30,0.55)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-44, -48); g.lineTo(-34, -30); g.lineTo(-42, -14); g.stroke();
    if (dmg > 0.6) { g.beginPath(); g.moveTo(40, -50); g.lineTo(30, -28); g.lineTo(42, -8); g.lineTo(32, 12); g.stroke(); }
  }
  // flag
  const wavePh = game.time * 6;
  g.strokeStyle = '#5a4a3a'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(0, -64); g.lineTo(0, -108); g.stroke();
  g.fillStyle = '#e8554d';
  g.beginPath();
  g.moveTo(0, -106);
  for (let i = 0; i <= 8; i++) g.lineTo(i * 4.5, -106 + Math.sin(wavePh + i * 0.7) * 2.5);
  for (let i = 8; i >= 0; i--) g.lineTo(i * 4.5, -88 + Math.sin(wavePh + i * 0.7) * 2.5);
  g.closePath(); g.fill();
  g.restore();
  // HP bar
  const frac = BASE.hp / BASE.hpMax;
  g.fillStyle = 'rgba(0,0,0,0.5)';
  rr(g, x - 62, y - 132, 124, 13, 6); g.fill();
  g.fillStyle = frac > 0.5 ? '#6ee06e' : frac > 0.25 ? '#ffd34d' : '#ff6b5b';
  rr(g, x - 59, y - 129.5, Math.max(3, 118 * frac), 8, 4); g.fill();
}

// ---- fx drawing ----
function drawFx(f) {
  const k = f.t / f.dur;
  if (f.kind === 'ring') {
    g.strokeStyle = f.col;
    g.globalAlpha = 1 - k;
    g.lineWidth = 4 * (1 - k) + 1;
    g.beginPath(); g.arc(f.x, f.y, lerp(f.r0, f.r1, k), 0, TAU); g.stroke();
    g.globalAlpha = 1;
  } else if (f.kind === 'flash') {
    g.fillStyle = 'rgba(255,235,170,' + (0.8 * (1 - k)) + ')';
    g.beginPath(); g.arc(f.x, f.y, f.r * (0.6 + k * 0.5), 0, TAU); g.fill();
  } else if (f.kind === 'bolt') {
    g.globalAlpha = 1 - k * 0.7;
    for (const pass of [[7, 'rgba(255,230,120,0.35)'], [2.5, '#fff7d6']]) {
      g.strokeStyle = pass[1]; g.lineWidth = pass[0];
      g.lineJoin = 'round';
      g.beginPath();
      for (let i = 0; i < f.pts.length - 1; i++) {
        const a = f.pts[i], b = f.pts[i + 1];
        g.moveTo(a.x, a.y);
        const segs = 4;
        for (let sji = 1; sji <= segs; sji++) {
          const tt = sji / segs;
          const nx = lerp(a.x, b.x, tt) + (sji < segs ? rand(-9, 9) : 0);
          const ny = lerp(a.y, b.y, tt) + (sji < segs ? rand(-9, 9) : 0);
          g.lineTo(nx, ny);
        }
      }
      g.stroke();
    }
    g.globalAlpha = 1;
  } else if (f.kind === 'beam') {
    g.globalAlpha = 1 - k;
    g.strokeStyle = '#fff1b8'; g.lineWidth = 3.5;
    g.beginPath(); g.moveTo(f.x1, f.y1); g.lineTo(f.x2, f.y2); g.stroke();
    g.strokeStyle = 'rgba(255,200,90,0.4)'; g.lineWidth = 8;
    g.beginPath(); g.moveTo(f.x1, f.y1); g.lineTo(f.x2, f.y2); g.stroke();
    g.globalAlpha = 1;
  } else if (f.kind === 'tracer') {
    g.globalAlpha = 1 - k;
    g.strokeStyle = '#ffd9a0'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(f.x1, f.y1); g.lineTo(f.x2, f.y2); g.stroke();
    g.globalAlpha = 1;
  } else if (f.kind === 'heal') {
    g.globalAlpha = 1 - k;
    g.fillStyle = '#6ee06e';
    for (let i = 0; i < 3; i++) {
      const a = i * TAU / 3 + k * 3;
      const px = f.x + Math.cos(a) * 16, py = f.y + Math.sin(a) * 16 - k * 22;
      g.fillRect(px - 1.5, py - 5, 3, 10);
      g.fillRect(px - 5, py - 1.5, 10, 3);
    }
    g.globalAlpha = 1;
  } else if (f.kind === 'chute') {
    // released parachute floating away
    g.globalAlpha = 1 - k;
    g.save();
    g.translate(f.x, f.y - k * 70);
    g.rotate(Math.sin(k * 6) * 0.3);
    g.fillStyle = f.def.chute[0];
    g.beginPath(); g.arc(0, 0, 24 * f.size, Math.PI, 0); g.closePath(); g.fill();
    g.restore();
    g.globalAlpha = 1;
  }
}
function drawShot(s) {
  if (s.kind === 'bullet') {
    g.save();
    g.translate(s.x, s.y);
    g.rotate(s.a || 0);
    g.fillStyle = 'rgba(255,210,130,0.45)';
    rr(g, -14, -1.8, 14, 3.6, 1.8); g.fill();
    g.fillStyle = '#ffe9b0';
    g.beginPath(); g.arc(0, 0, 3, 0, TAU); g.fill();
    g.restore();
  } else if (s.kind === 'shard') {
    g.save();
    g.translate(s.x, s.y);
    g.rotate((s.a || 0) + Math.PI / 2);
    g.fillStyle = '#bfeaff';
    g.beginPath(); g.moveTo(0, -9); g.lineTo(5, 0); g.lineTo(0, 9); g.lineTo(-5, 0); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.7)';
    g.beginPath(); g.moveTo(0, -6); g.lineTo(2.5, 0); g.lineTo(0, 6); g.lineTo(-2.5, 0); g.closePath(); g.fill();
    g.restore();
  } else if (s.kind === 'ball') {
    g.fillStyle = 'rgba(0,0,0,0.18)';
    g.beginPath(); g.ellipse(s.x, s.y + 9, 7, 3.5, 0, 0, TAU); g.fill();
    g.save();
    g.translate(s.x, s.y);
    g.rotate(s.spin);
    g.fillStyle = '#33363b';
    g.beginPath(); g.arc(0, 0, 7.5, 0, TAU); g.fill();
    g.fillStyle = '#55585e';
    g.beginPath(); g.arc(-2, -2.5, 3, 0, TAU); g.fill();
    g.restore();
  }
}

// ---- master draw ----
function draw(dt) {
  btns = [];
  const shx = game.shake > 0.2 ? rand(-game.shake, game.shake) : 0;
  const shy = game.shake > 0.2 ? rand(-game.shake, game.shake) : 0;
  const islandBob = Math.sin(game.time * 0.6) * 3;
  g.setTransform(view.s * view.dpr, 0, 0, view.s * view.dpr,
    (view.ox + shx * view.s) * view.dpr, (view.oy + (shy + 0) * view.s) * view.dpr);

  drawSky();
  // background clouds + mini islands
  for (const cl of clouds) if (!cl.front) drawCloud(cl);
  for (const m of minis) drawMiniIsland(m, game.time);

  // island (with gentle bob)
  g.save();
  g.translate(0, islandBob);
  g.drawImage(terra, 0, 0);

  drawPadGlow();
  for (const c of game.corpses) drawCorpse(c);

  // y-sorted entities
  const drawables = [];
  for (const t of game.towers) drawables.push({ y: t.y, f: () => drawTower(t) });
  for (const e of game.enemies) drawables.push({ y: e.state === 'drop' ? e.y + 600 : e.y, f: () => drawSoldier(e) });
  drawables.push({ y: BASE.y, f: drawBase });
  drawables.sort((a, b) => a.y - b.y);
  for (const d of drawables) d.f();

  for (const s of game.shots) drawShot(s);
  for (const f of game.fx) drawFx(f);

  // particles
  for (const p of game.parts) {
    const k = p.t / p.dur;
    g.globalAlpha = 1 - k;
    g.fillStyle = p.col;
    g.beginPath();
    g.arc(p.x, p.y, p.smoke ? p.size * (1 + k) : p.size * (1 - k * 0.5), 0, TAU);
    g.fill();
  }
  g.globalAlpha = 1;

  // floating text
  for (const f of game.floats) {
    const k = f.t / f.dur;
    g.globalAlpha = k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
    g.font = '900 ' + f.size + 'px -apple-system,Segoe UI,Roboto,sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 3;
    g.strokeText(f.txt, f.x, f.y);
    g.fillStyle = f.col;
    g.fillText(f.txt, f.x, f.y);
  }
  g.globalAlpha = 1;
  g.restore(); // island bob

  // foreground clouds drift over everything
  for (const cl of clouds) if (cl.front) drawCloud(cl);

  // UI
  if (game.state === 'menu') {
    drawMenu();
  } else {
    drawHUD();
    if (game.state === 'playing' && !game.paused) {
      if (game.selPad && !game.selPad.tower) drawBuildSheet();
      else if (game.selTower) drawTowerSheet();
    }
    drawBanners(dt);
    if (game.paused && game.state === 'playing') drawPaused();
    if (game.state === 'over') drawGameOver();
  }
}

// ---------- input ----------
function onTap(cx, cy) {
  SFX.init();
  const w = toWorld(cx, cy);
  // UI buttons first (topmost = added last)
  for (let i = btns.length - 1; i >= 0; i--) {
    const b = btns[i];
    if (w.x >= b.x && w.x <= b.x + b.w && w.y >= b.y && w.y <= b.y + b.h) {
      handleBtn(b);
      return;
    }
  }
  if (game.state !== 'playing' || game.paused) return;
  // world taps: pads and towers
  for (const p of game.pads) {
    if (hyp(p.x - w.x, p.y - 2 - w.y) < 46) {
      if (p.tower) { game.selTower = p.tower; game.selPad = null; }
      else { game.selPad = p; game.selTower = null; }
      return;
    }
  }
  game.selPad = null;
  game.selTower = null;
}
function handleBtn(b) {
  switch (b.id) {
    case 'start': case 'retry': case 'restart':
      resetGame();
      game.state = 'playing';
      break;
    case 'pause':
      game.paused = !game.paused;
      break;
    case 'speed':
      game.speed = game.speed === 1 ? 2 : 1;
      break;
    case 'sound':
      SFX.on = !SFX.on;
      break;
    case 'rush': {
      if (!game.waveActive) {
        const bonus = Math.floor(Math.max(game.nextWaveT, 0)) * 2;
        if (game.wave > 0 && bonus > 0) {
          game.gold += bonus;
          game.floats.push({ x: W / 2, y: 320, txt: '+' + bonus, col: '#ffd34d', t: 0, dur: 0.9, vy: -40, size: 22 });
        }
        startWave();
      }
      break;
    }
    case 'buy':
      if (game.selPad && buildTower(game.selPad, b.data)) game.selPad = null;
      break;
    case 'upgrade':
      if (game.selTower) upgradeTower(game.selTower);
      break;
    case 'sell':
      if (game.selTower) sellTower(game.selTower);
      break;
  }
}
canvas.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  onTap(ev.clientX, ev.clientY);
}, { passive: false });
document.addEventListener('touchmove', ev => ev.preventDefault(), { passive: false });
document.addEventListener('contextmenu', ev => ev.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden && game.state === 'playing') game.paused = true;
});

// ---------- main loop ----------
buildTerrain();
let lastT = performance.now();
function frame(now) {
  let dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  updateClouds(dt);
  const gdt = dt * (game.state === 'playing' ? game.speed : 1);
  update(gdt);
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hooks (headless verification)
window.__sky = { game, BASE, PATH, startWave, spawnEnemy, buildTower, resetGame, TOWERS, ENEMIES };
</script>
